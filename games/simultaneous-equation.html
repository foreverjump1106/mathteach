<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    二元一次聯立方程式大挑戰｜生活有解．心中有數
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #3949ab;
      --primary-dark: #283593;
      --primary-light: #e8eaf6;
      --primary-border: #9fa8da;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #dc2626;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #e8eaf6,
          #fff8e8
        );
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .page-shell {

      width: min(100%, 1000px);

      margin: 0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #dfe3f5;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {
      padding: 22px;
    }

    /*
    ==================================================
    模式
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 220px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-tag {

      display: inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #7986cb
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          18px,
          2.5vw,
          23px
        );

      font-weight: 900;

      line-height: 1.7;
    }

    .question-content {

      min-height: 155px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 14px;

      overflow-x: auto;

      padding:
        14px 6px;

      color:
        #0f172a;

      font-size:
        clamp(
          24px,
          4.2vw,
          38px
        );

      font-weight: 900;

      line-height: 1.75;
    }

    .math {

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .math sup,
    .explanation sup,
    .review-question sup {

      position: relative;

      top: -.45em;

      margin-left: 1px;

      font-size: .62em;

      line-height: 1;

      vertical-align: baseline;
    }

    /*
    ==================================================
    聯立方程式
    ==================================================
    */

    .system-wrap {

      display: inline-grid;

      grid-template-columns:
        30px auto;

      align-items: center;

      gap: 6px;

      text-align: left;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .system-brace {

      display: flex;

      align-items: center;

      justify-content: center;

      height: 100%;

      color:
        var(--primary-dark);

      font-size: 70px;

      font-weight: 400;

      transform:
        scaleY(1.18);

      transform-origin:
        center;
    }

    .system-lines {

      display: grid;

      gap: 8px;

      white-space: nowrap;
    }

    .system-line {

      min-width: 210px;

      font-size:
        clamp(
          24px,
          4vw,
          34px
        );

      font-weight: 900;
    }

    /*
    ==================================================
    分數顯示
    ==================================================
    */

    .math-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.55em;

      margin:
        0 .08em;

      vertical-align: middle;

      line-height: 1.05;
    }

    .math-fraction-top {

      display: flex;

      justify-content: center;

      padding:
        0 .14em .08em;

      border-bottom:
        2px solid
        currentColor;
    }

    .math-fraction-bottom {

      display: flex;

      justify-content: center;

      padding:
        .08em .14em 0;
    }

    /*
    ==================================================
    答案區
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 14px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }

    /*
    ==================================================
    x、y 兩根式答案格
    ==================================================
    */

    .xy-answer-grid {

      width:
        min(
          100%,
          760px
        );

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 14px;

      margin:
        0 auto;
    }

    .xy-card {

      padding: 14px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 15px;

      background: white;
    }

    .xy-label {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .xy-input-row {

      display: flex;

      align-items: center;

      gap: 8px;
    }

    .xy-symbol {

      flex:
        0 0 auto;

      font-family:
        "Cambria Math",
        serif;

      font-size: 29px;

      font-weight: 900;
    }

    .math-answer-input {

      width: 100%;

      height: 58px;

      padding:
        8px 12px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background: white;

      color:
        #111827;

      font-size: 23px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .math-answer-input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(
          57,
          73,
          171,
          .12
        );
    }

    /*
    ==================================================
    單一答案
    ==================================================
    */

    .single-answer-shell {

      width:
        min(
          100%,
          450px
        );

      margin:
        0 auto;
    }

    /*
    ==================================================
    選擇題
    ==================================================
    */

    .choice-grid {

      width:
        min(
          100%,
          760px
        );

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        0 auto;
    }

    .choice-button {

      min-height: 64px;

      padding:
        12px 16px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 14px;

      background: white;

      color:
        #334155;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /*
    ==================================================
    預覽
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width: 760px;

      min-height: 62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    .preview-value {

      margin-left: 8px;

      color:
        var(--primary-dark);

      font-size: 23px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    /*
    ==================================================
    按鈕
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {
      color: var(--success);
    }

    .feedback.wrong {
      color: var(--danger);
    }

    .feedback.warning {
      color: var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border-radius: 14px;

      background:
        #eef2ff;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-question {

      margin-bottom: 18px;

      padding:
        15px 14px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;
    }

    .explanation-question-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .explanation-question-math {

      display: flex;

      justify-content: center;

      align-items: center;

      overflow-x: auto;

      padding:
        8px 4px;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        clamp(
          20px,
          3vw,
          28px
        );

      font-weight: 900;

      text-align: center;
    }

    .explanation-step {

      margin:
        12px 0;
    }

    .calculation-box {

      margin:
        10px 0;

      padding:
        12px 15px;

      overflow-x: auto;

      border:
        1px solid
        #c7d2fe;

      border-radius: 11px;

      background: white;

      color:
        #1e293b;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 18px;

      line-height: 1.9;
    }

    .equation-stack {

      display: inline-grid;

      gap: 5px;

      min-width: 250px;
    }

    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {
      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {

      margin-bottom: 10px;

      font-size: 31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }

    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }

    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }

    .review-question {

      margin:
        12px 0;

      overflow-x: auto;

      font-size: 21px;

      text-align: center;
    }

    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:
        760px
    ) {

      body {
        padding: 8px;
      }

      .screen {

        padding:
          18px 12px;
      }

      .mode-grid {
        grid-template-columns: 1fr;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {
        grid-column: 1 / -1;
      }

      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .xy-answer-grid {

        grid-template-columns:
          1fr;
      }

      .choice-grid {

        grid-template-columns:
          1fr;
      }

      .system-line {

        font-size: 23px;

        min-width: 180px;
      }

      .system-brace {

        font-size: 60px;
      }
    }

  </style>

</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">

      <h1 class="game-title">
        🧮 二元一次聯立方程式大挑戰
      </h1>

      <p class="game-subtitle">
        從二元一次式與方程式開始，逐步挑戰共同解、代入消去、加減消去與生活應用。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          二元一次式
        </span>

        <span class="concept-chip">
          二元一次方程式
        </span>

        <span class="concept-chip">
          聯立方程式
        </span>

        <span class="concept-chip">
          代入消去法
        </span>

        <span class="concept-chip">
          加減消去法
        </span>

        <span class="concept-chip">
          應用問題
        </span>

      </div>

    </header>

    <!--
    ==================================================
    模式首頁
    ==================================================
    -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-grid">

        <button
          class="mode-card"
          type="button"
          data-mode="foundation"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式一｜二元一次式與方程式基礎
          </h2>

          <p>
            練習二元一次式代入、化簡、列方程式，以及判斷一組數是否為方程式的解。
          </p>

          <div class="mode-example">
            例如：2x＋3y－5、3x＋2y＝12
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="concept"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式二｜聯立方程式與解的判別
          </h2>

          <p>
            認識聯立方程式，判斷同一組 x、y 是否能同時滿足兩個方程式。
          </p>

          <div class="mode-example">
            兩個方程式都成立，才是聯立方程式的解。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="substitution"
        >

          <span class="mode-tag">
            8 題
          </span>

          <h2>
            模式三｜代入消去法
          </h2>

          <p>
            練習直接代入，以及先移項整理成 x＝… 或 y＝… 後再代入。
          </p>

          <div class="mode-example">
            消去一個未知數 → 解一元一次方程式 → 回代。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="elimination"
        >

          <span class="mode-tag">
            8 題
          </span>

          <h2>
            模式四｜加減消去法
          </h2>

          <p>
            練習直接相加減、調整一式或兩式係數，再消去其中一個未知數。
          </p>

          <div class="mode-example">
            包含需先把分數或小數係數整理成整數的題目。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="mixed"
        >

          <span class="mode-tag">
            8 題
          </span>

          <h2>
            模式五｜聯立方程式綜合挑戰
          </h2>

          <p>
            不提示解法，自行判斷使用代入消去法或加減消去法。
          </p>

          <div class="mode-example">
            包含先化簡、移項、分數係數與進階綜合題。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="application"
        >

          <span class="mode-tag">

/*

亂數工具
==================================================
*/


function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value === 0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b
  ) {

    const temp =
      a % b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


/*
==================================================
分數
==================================================
*/


function F(
  numerator,
  denominator = 1
) {

  numerator =
    Number(
      numerator
    );


  denominator =
    Number(
      denominator
    );


  if (
    denominator === 0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator < 0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator === 0
  ) {

    return {

      n: 0,
      d: 1
    };
  }


  const divisor =
    gcd(
      numerator,
      denominator
    );


  return {

    n:
      numerator /
      divisor,

    d:
      denominator /
      divisor
  };
}


function addF(
  a,
  b
) {

  return F(

    a.n *
    b.d +

    b.n *
    a.d,

    a.d *
    b.d
  );
}


function subF(
  a,
  b
) {

  return F(

    a.n *
    b.d -

    b.n *
    a.d,

    a.d *
    b.d
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.n *
    b.n,

    a.d *
    b.d
  );
}


function divF(
  a,
  b
) {

  return F(

    a.n *
    b.d,

    a.d *
    b.n
  );
}


function sameF(
  a,
  b
) {

  const first =
    F(
      a.n,
      a.d
    );


  const second =
    F(
      b.n,
      b.d
    );


  return (
    first.n ===
      second.n &&
    first.d ===
      second.d
  );
}


function fractionHTML(
  value
) {

  const fraction =
    F(
      value.n,
      value.d
    );


  if (
    fraction.d ===
    1
  ) {

    return String(
      fraction.n
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =
    fraction.n < 0
      ? "−"
      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          fraction.n
        )}

      </span>

      <span class="math-fraction-bottom">

        ${fraction.d}

      </span>

    </span>
  `;
}


/*
==================================================
顯示係數
==================================================
*/


function signedTerm(
  coefficient,
  variable,
  first = false
) {

  if (
    coefficient === 0
  ) {

    return "";
  }


  const negative =
    coefficient < 0;


  const absolute =
    Math.abs(
      coefficient
    );


  let prefix =
    "";


  if (
    first
  ) {

    prefix =
      negative
        ? "−"
        : "";

  } else {

    prefix =
      negative
        ? " − "
        : " ＋ ";
  }


  const coefficientText =
    absolute === 1 &&
    variable

      ? ""

      : absolute;


  return (
    prefix +
    coefficientText +
    variable
  );
}


function linearExpressionHTML(
  a,
  b,
  c = 0
) {

  let result =
    "";


  let first =
    true;


  if (
    a !== 0
  ) {

    result +=
      signedTerm(
        a,
        "x",
        true
      );


    first =
      false;
  }


  if (
    b !== 0
  ) {

    result +=
      signedTerm(
        b,
        "y",
        first
      );


    first =
      false;
  }


  if (
    c !== 0 ||
    first
  ) {

    result +=
      signedTerm(
        c,
        "",
        first
      );
  }


  return result;
}


function equationHTML(
  a,
  b,
  c
) {

  return (
    `${linearExpressionHTML(
      a,
      b
    )} ＝ ${c}`
  );
}

}


/*

產生有唯一整數解的聯立方程式
==================================================
*/


function makeIntegerSystem(
  options = {}
) {

  const x =
    options.x ??
    nonZeroRand(
      -6,
      8
    );


  const y =
    options.y ??
    nonZeroRand(
      -6,
      8
    );


  let a1;
  let b1;
  let a2;
  let b2;


  do {

    a1 =
      nonZeroRand(
        -5,
        5
      );


    b1 =
      nonZeroRand(
        -5,
        5
      );


    a2 =
      nonZeroRand(
        -5,
        5
      );


    b2 =
      nonZeroRand(
        -5,
        5
      );

  } while (
    a1 *
    b2 ===
    a2 *
    b1
  );


  return {

    x,
    y,

    first: {

      a:
        a1,

      b:
        b1,

      c:
        a1 *
        x +
        b1 *
        y
    },

    second: {

      a:
        a2,

      b:
        b2,

      c:
        a2 *
        x +
        b2 *
        y
    }
  };
}


/*
==================================================
答案讀取
==================================================
*/


function parseFractionText(
  raw
) {

  const text =
    String(
      raw ??
      ""
    )
      .trim()
      .replace(
        /−/g,
        "-"
      )
      .replace(
        /\s+/g,
        ""
      );


  if (
    !text
  ) {

    return null;
  }


  if (
    /^[-+]?\d+$/
      .test(
        text
      )
  ) {

    return F(
      Number(
        text
      )
    );
  }


  if (
    /^[-+]?\d+\/[-+]?\d+$/
      .test(
        text
      )
  ) {

    const [
      numerator,
      denominator
    ] =
      text
        .split(
          "/"
        );


    if (
      Number(
        denominator
      ) ===
      0
    ) {

      return null;
    }


    return F(
      Number(
        numerator
      ),
      Number(
        denominator
      )
    );
  }


  if (
    /^[-+]?\d*\.\d+$/
      .test(
        text
      )
  ) {

    const number =
      Number(
        text
      );


    const string =
      text
        .replace(
          /^[-+]/,
          ""
        );


    const decimalPlaces =
      string.split(
        "."
      )[1]
        .length;


    const denominator =
      10 **
      decimalPlaces;


    return F(
      Math.round(
        number *
        denominator
      ),
      denominator
    );
  }


  return null;
}

function makeSubstitutionDirectQuestion() {

  const x =
    nonZeroRand(
      -5,
      7
    );


  const y =
    nonZeroRand(
      -5,
      7
    );


  const m =
    nonZeroRand(
      -3,
      3
    );


  const k =
    y -
    m *
    x;


  const a =
    nonZeroRand(
      -4,
      4
    );


  const b =
    nonZeroRand(
      -4,
      4
    );


  const c =
    a *
    x +
    b *
    y;


  return pairQuestion(

    "請利用代入消去法解聯立方程式",

    systemHTML(

      `y ＝ ${
        linearExpressionHTML(
          m,
          0,
          k
        )
      }`,

      equationHTML(
        a,
        b,
        c
      )
    ),

    x,

    y,

    [

      `第一式已經整理成 y＝…，可以直接代入第二式。`,

      `

      <div class="calculation-box">

        ${
          a
        }x

        ${
          b >= 0
            ? " ＋ "
            : " − "
        }

        ${
          Math.abs(
            b
          )
        }
        ${
          b < 0
            ? "×"
            : ""
        }
        (
          ${
            linearExpressionHTML(
              m,
              0,
              k
            )
          }
        )

        ＝ ${c}

      </div>
      `,

      `解這個一元一次方程式，可得：

      <div class="calculation-box">
        x＝${x}
      </div>`,

      `將 x＝${x} 代回第一式：

      <div class="calculation-box">
        y＝${m} × (${x})
        ${
          k >= 0
            ? " ＋ "
            : " − "
        }
        ${Math.abs(k)}
        ＝${y}
      </div>`,

      `所以：

      <div class="calculation-box">
        x＝${x}，y＝${y}
      </div>`
    ]
  );
}


function makeSubstitutionRearrangeQuestion() {

  const x =

function makeEliminationDirectQuestion() {

  const first = {

      y
  };


  const second = {

    b:

    c:
      a *
      x +
      b2 *
      y
  };


  return pairQuestion(

    "請利用加減消去法解聯立方程式",

    systemHTML(

      equationHTML(

        second.b,
        second.c
      )
    ),

    x,

    y,

    [

      `兩式的 x 項係數相同，可以直接用①式－②式消去 x。`,

      `

        ${
          equationHTML(
            first.a,
            first.b,
            first.c
          )
        }

        ${
          equationHTML(
            second.a,
            second.b,
            second.c
          )
        }

        <br>

        ─────────

        <br>

        ${
          first.b -
          second.b
        }y
        ＝
        ${
          first.c -
          second.c
        }

      </div>
      `,

      `可得：

      <div class="calculation-box">
        y＝${y}
      </div>`,

      `將 y＝${y} 代回其中一式，可得：

      <div class="calculation-box">
        x＝${x}
      </div>`,

      `所以解為 x＝${x}，y＝${y}。`
    ]
  );
}

/*
==================================================
讀取答案
==================================================
*/


function readAnswer(
  question
) {

  if (
    question.type ===
    "pair"
  ) {

    const x =
      parseFractionText(
        $("answer-x")
          ?.value
      );


    const y =
      parseFractionText(
        $("answer-y")
          ?.value
      );


    if (
      !x ||
      !y
    ) {

      return {

        valid: false,

        message:
          "請完整輸入 x、y 的值。"
      };
    }


    return {

      valid: true,

      value: {

        x,
        y
      },

      display:
        `x＝${fractionHTML(x)}，y＝${fractionHTML(y)}`
    };
  }


  if (
    question.type ===
    "number"
  ) {

    const value =
      parseFractionText(
        $("number-answer")
          ?.value
      );


    if (
      !value
    ) {

      return {

        valid: false,

        message:
          "請輸入完整答案。"
      };
    }


    return {

      valid: true,

      value,

      display:
        fractionHTML(
          value
        )
    };
  }


  if (
    selectedChoice ===
    null
  ) {

    return {

      valid: false,

      message:
        "請先選擇答案。"
    };
  }


  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid: true,

    value:
      selectedChoice,

    display:
      choice?.label ||
      selectedChoice
  };
}


/*
==================================================
判定
==================================================
*/


function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "pair"
  ) {

    return (

      sameF(
        question.answer.x,
        answer.value.x
      ) &&

      sameF(
        question.answer.y,
        answer.value.y
      )
    );
  }


  if (
    question.type ===
    "number"
  ) {

    return sameF(
      question.answer,
      answer.value
    );
  }


  return (
    question.answer ===
    answer.value
  );
}


/*
==================================================
正確答案
==================================================
*/


function correctAnswerHTML(
  question
) {

  if (
    question.type ===
    "pair"
  ) {

    return `

      x＝
      ${fractionHTML(
        question.answer.x
      )}，

      y＝
      ${fractionHTML(
        question.answer.y
      )}
    `;
  }


  if (
    question.type ===
    "number"
  ) {

    return (
      fractionHTML(
        question.answer
      ) +
      (
        question.unit
          ? ` ${question.unit}`
          : ""
      )
    );
  }


  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          question.answer
      );


  return (
    choice?.label ||
    question.answer
  );
}

/*

==================================================
*/


function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  document
    .querySelectorAll(
      "#answer-panel input, #answer-panel button, #answer-panel select"
    )
    .forEach(
      element => {

        element.disabled =
          true;
      }
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  const total =
    MODE_SETTINGS[
      mode
    ].total;


  $("next-button")
    .textContent =

      index ===
      total -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update = true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
音效
==================================================
*/


function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound?.[
      method
    ]?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
計算紙
==================================================
*/


function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
畫面切換
==================================================
*/


function showOnly(
  id
) {

  [

    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"

  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
開始遊戲
==================================================
*/


function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index = 0;

  correct = 0;

  wrong = 0;

  combo = 0;

  maxCombo = 0;

  records = [];

  answered = false;

  selectedChoice = null;

  scoreSaved = false;

  elapsed = 0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/


function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理二元一次聯立方程式。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意消去時的係數與正負號。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再加強代入消去與加減消去。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先熟悉二元一次方程式與共同解，再逐步練習兩種消去法。"
  };
}


/*
==================================================
結果
==================================================
*/


async function showResult() {

  stopTimer();


  const total =
    MODE_SETTINGS[
      mode
    ].total;


  const score =
    Math.round(
      correct /
      total *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/


async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "聯立方程式成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/


function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
事件
==================================================
*/


document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );
          }
        );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "start-screen"
      );
    }
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


/*
==================================================
Enter
==================================================
*/


document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );


/*
==================================================
初始化
==================================================
*/


window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(
  "start-screen"
);


</script>

</body>

</html>
