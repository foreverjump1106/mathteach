<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  畢氏定理大挑戰｜數學遊戲樂園
</title>

<link
  rel="stylesheet"
  href="../css/scratchpad.css"
>

<style>

* {
  box-sizing: border-box;
}

:root {
  --navy: #17324d;
  --navy-dark: #0f2438;

  --teal: #149b92;
  --teal-dark: #0b746e;
  --teal-light: #e7f8f6;

  --blue: #3182ce;
  --blue-dark: #1e5e9b;

  --orange: #f59e0b;
  --orange-dark: #c97900;

  --purple: #7c3aed;

  --text: #1f2937;
  --muted: #64748b;

  --success: #15803d;
  --danger: #c62828;
  --warning: #b45309;

  --border: #cfe2e3;
}

body {
  margin: 0;
  min-height: 100vh;

  padding: 16px;

  font-family:
    "Microsoft JhengHei",
    "Noto Sans TC",
    sans-serif;

  color: var(--text);

  background:
    linear-gradient(
      rgba(49,130,206,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(49,130,206,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      135deg,
      #edf8fa,
      #fffaf0
    );

  background-size:
    26px 26px,
    26px 26px,
    auto;
}

button,
input,
select {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

.page-shell {
  width: min(100%, 1040px);
  margin: 0 auto;
}

#commonHeaderMount {
  margin-bottom: 14px;
}

.game-shell {
  overflow: hidden;

  border:
    1px solid
    #d7e7e7;

  border-radius: 30px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 18px 45px
    rgba(15,36,56,.13);
}

/*
==================================================
Hero
==================================================
*/

.hero {
  position: relative;
  overflow: hidden;

  padding:
    28px 24px 26px;

  text-align: center;

  color: white;

  background:
    linear-gradient(
      135deg,
      #16324f 0%,
      #1b5067 58%,
      #168d86 100%
    );
}

.hero::before {
  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  top: -120px;
  right: -50px;

  border:
    2px solid
    rgba(255,255,255,.13);

  border-radius: 50%;
}

.hero-icon {
  position: relative;

  display: inline-flex;

  justify-content: center;
  align-items: center;

  width: 58px;
  height: 58px;

  margin-bottom: 8px;

  border:
    2px solid
    rgba(255,255,255,.48);

  border-radius: 18px;

  background:
    rgba(255,255,255,.12);

  font-size: 34px;
}

.game-title {
  position: relative;

  margin: 0;

  font-size:
    clamp(
      31px,
      5vw,
      44px
    );

  font-weight: 900;
}

.game-subtitle {
  position: relative;

  max-width: 760px;

  margin:
    10px auto 0;

  color:
    #d8f4f2;

  line-height: 1.8;
}

.concept-strip {
  position: relative;

  display: flex;

  justify-content: center;

  gap: 8px;

  margin-top: 16px;

  flex-wrap: wrap;
}

.concept-chip {
  padding:
    7px 12px;

  border:
    1px solid
    rgba(255,255,255,.42);

  border-radius:
    999px;

  background:
    rgba(255,255,255,.11);

  font-size: 13px;
  font-weight: 900;
}

.screen {
  padding: 24px;
}

/*
==================================================
MathML
==================================================
*/

math {
  font-family:
    "Cambria Math",
    "Times New Roman",
    serif;
}

.math-inline {
  display: inline-block;
  vertical-align: middle;
}

.math-large {
  font-size: 1.18em;
}

/*
==================================================
模式
==================================================
*/

.mode-intro {
  margin-bottom: 18px;
  text-align: center;
}

.mode-intro h2 {
  margin:
    0 0 6px;

  color: var(--navy);
}

.mode-intro p {
  margin: 0;

  color: var(--muted);

  line-height: 1.7;
}

.mode-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap: 17px;
}

.mode-card {
  position: relative;

  min-height: 245px;

  overflow: hidden;

  padding: 22px;

  border:
    2px solid
    #d5e7e6;

  border-radius: 22px;

  background: white;

  text-align: left;

  cursor: pointer;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.mode-card:hover {
  transform:
    translateY(-4px);

  border-color:
    var(--teal);

  box-shadow:
    0 12px 26px
    rgba(15,50,77,.12);
}

.mode-card::after {
  content: "";

  position: absolute;

  width: 90px;
  height: 90px;

  right: -28px;
  bottom: -28px;

  border-radius: 50%;

  background:
    var(--card-accent);
}

.mode-one {
  --card-accent:
    rgba(20,155,146,.12);
}

.mode-two {
  --card-accent:
    rgba(245,158,11,.13);
}

.mode-three {
  --card-accent:
    rgba(124,58,237,.11);
}

.mode-top {
  display: flex;

  align-items: center;

  gap: 11px;

  margin-bottom: 13px;
}

.mode-icon {
  width: 47px;
  height: 47px;

  display: flex;

  justify-content: center;
  align-items: center;

  flex: 0 0 auto;

  border-radius: 15px;

  background:
    var(--teal-light);

  font-size: 27px;
}

.mode-number {
  color:
    var(--teal-dark);

  font-size: 13px;
  font-weight: 900;
}

.mode-card h3 {
  margin:
    2px 0 0;

  color:
    var(--navy);

  font-size: 20px;
}

.mode-card p {
  margin: 0;

  color:
    var(--muted);

  line-height: 1.7;
}

.mode-example {
  margin-top: 12px;

  padding:
    10px 12px;

  border-radius: 12px;

  background:
    #f8fafc;

  color:
    #475569;

  font-size: 14px;
  font-weight: 800;

  line-height: 1.65;
}

/*
==================================================
狀態
==================================================
*/

.quiz-topbar {
  display: grid;

  grid-template-columns:
    1.35fr repeat(4,1fr);

  gap: 10px;

  margin-bottom: 12px;
}

.status-box {
  min-height: 68px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  padding: 9px;

  border:
    1px solid
    #dbe8eb;

  border-radius: 15px;

  background:
    #f4fafb;

  color:
    var(--navy);

  text-align: center;

  font-size: 13px;
  font-weight: 900;
}

.status-value {
  margin-top: 4px;

  color:
    var(--teal-dark);

  font-size: 18px;
}

.timer-box {
  background:
    #fff8ea;

  border-color:
    #fce4b5;

  color:
    #b45309;
}

.timer-box
.status-value {
  color:
    #c66c00;
}

/*
==================================================
計算紙
==================================================
*/

.scratchpad-row {
  display: flex;

  justify-content: center;
  align-items: center;

  min-height: 54px;

  margin:
    2px 0 12px;
}

#scratchpad-mobile-button {
  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;
}

#scratchpad-mobile-button
#scratchpadOpenButton,

#scratchpad-mobile-button
.scratchpad-open-button {
  position:
    static !important;

  inset:
    auto !important;

  left:
    auto !important;

  right:
    auto !important;

  top:
    auto !important;

  bottom:
    auto !important;

  transform:
    none !important;

  margin:
    0 !important;
}

/*
==================================================
進度
==================================================
*/

.progress-shell {
  height: 9px;

  margin-bottom: 18px;

  overflow: hidden;

  border-radius:
    999px;

  background:
    #e2e8f0;
}

.progress-bar {
  width: 0%;
  height: 100%;

  border-radius:
    999px;

  background:
    linear-gradient(
      90deg,
      var(--teal),
      #45c5bb
    );

  transition:
    width .2s ease;
}

/*
==================================================
題目
==================================================
*/

.question-stage {
  display: grid;

  grid-template-columns:
    minmax(280px,.9fr)
    minmax(320px,1.1fr);

  gap: 18px;
}

.diagram-card,
.question-card {
  min-height: 330px;

  border:
    2px solid
    #d7e7e8;

  border-radius: 22px;

  background: white;
}

.diagram-card {
  position: relative;

  display: flex;

  justify-content: center;
  align-items: center;

  padding: 18px;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #f7fcfc,
      #ffffff
    );
}

.diagram-card::before {
  content: "";

  position: absolute;

  inset: 0;

  opacity: .38;

  background:
    linear-gradient(
      #d8eeee 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      #d8eeee 1px,
      transparent 1px
    );

  background-size:
    22px 22px;
}

#diagram-content {
  position: relative;

  width: 100%;

  display: flex;

  justify-content: center;
  align-items: center;
}

.geometry-svg {
  width:
    min(
      100%,
      350px
    );

  height: auto;
}

.question-card {
  display: flex;

  flex-direction: column;

  justify-content: center;

  padding: 24px;

  text-align: center;
}

.question-type {
  display: inline-block;

  align-self: center;

  margin-bottom: 15px;

  padding:
    6px 11px;

  border-radius:
    999px;

  background:
    var(--teal-light);

  color:
    var(--teal-dark);

  font-size: 13px;
  font-weight: 900;
}

.question-label {
  color:
    var(--muted);

  font-size: 15px;
  font-weight: 800;

  line-height: 1.7;
}

.question-content {
  margin-top: 13px;

  color:
    var(--navy-dark);

  font-size:
    clamp(
      22px,
      4vw,
      33px
    );

  font-weight: 900;

  line-height: 1.7;
}

.formula-hint {
  margin-top: 18px;

  padding: 13px;

  border:
    1px dashed
    #a9ceca;

  border-radius: 14px;

  background:
    #f3fbfa;

  color:
    #466066;

  font-size: 15px;
  font-weight: 800;

  line-height: 1.7;
}

/*
==================================================
答案 Panel
==================================================
*/

.answer-panel {
  margin-top: 18px;

  padding: 20px;

  border:
    1px solid
    #dbe8eb;

  border-radius: 20px;

  background:
    #f8fbfc;
}

.answer-title {
  margin-bottom: 10px;

  color:
    var(--navy);

  text-align: center;

  font-weight: 900;
}

.answer-help {
  margin:
    0 0 13px;

  color:
    var(--muted);

  text-align: center;

  font-size: 14px;

  line-height: 1.65;
}

/*
==================================================
Number
==================================================
*/

.number-answer {
  display: flex;
  justify-content: center;
}

.number-answer input {
  width:
    min(
      260px,
      100%
    );

  padding: 13px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 13px;

  background: white;

  color:
    var(--navy);

  font-size: 24px;
  font-weight: 900;

  text-align: center;

  outline: none;
}

.number-answer input:focus {
  border-color:
    var(--teal);

  box-shadow:
    0 0 0 4px
    rgba(20,155,146,.12);
}

/*
==================================================
Fraction answer
==================================================
*/

.fraction-answer-wrap {
  display: flex;

  justify-content: center;

  align-items: center;
}

.fraction-answer {
  width: 125px;

  display: flex;

  flex-direction: column;
}

.fraction-answer input {
  width: 100%;

  padding:
    9px 7px;

  border:
    2px solid
    #b8d1d4;

  background: white;

  font-size: 21px;
  font-weight: 900;

  text-align: center;

  outline: none;
}

.fraction-answer
input:first-child {
  border-radius:
    11px 11px 0 0;

  border-bottom:
    2px solid
    #334155;
}

.fraction-answer
input:last-child {
  border-radius:
    0 0 11px 11px;

  border-top: 0;
}

/*
==================================================
根式分數
==================================================
*/

.radical-fraction-grid {
  display: grid;

  grid-template-columns:
    auto auto auto;

  justify-content: center;

  align-items: center;

  gap: 10px;
}

.rf-sign,
.rf-coefficient,
.rf-radicand,
.rf-denominator {
  min-height: 52px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 11px;

  background: white;

  font-size: 20px;
  font-weight: 900;

  text-align: center;

  outline: none;
}

.rf-sign {
  width: 75px;
}

.rf-coefficient {
  width: 100px;
}

.rf-radicand {
  width: 115px;
}

.rf-denominator {
  width: 120px;
}

.rf-root {
  display: flex;

  align-items: center;

  font-family:
    "Cambria Math",
    "Times New Roman",
    serif;

  font-size: 33px;
}

.rf-root-box {
  display: flex;

  flex-direction: column;

  align-items: center;
}

.rf-root-top {
  display: flex;

  align-items: center;

  gap: 6px;
}

.rf-divider {
  width: 100%;
  height: 2px;

  margin:
    6px 0;

  background:
    #334155;
}

.rf-denominator-wrap {
  display: flex;

  justify-content: center;
}

/*
==================================================
Choice
==================================================
*/

.choice-grid {
  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap: 10px;

  max-width: 680px;

  margin:
    0 auto;
}

.choice-button {
  min-height: 58px;

  padding: 12px;

  border:
    2px solid
    #b8d1d4;

  border-radius: 13px;

  background: white;

  color:
    var(--navy);

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;
}

.choice-button.selected {
  border-color:
    var(--teal);

  background:
    #e5f8f6;

  color:
    var(--teal-dark);
}

/*
==================================================
Preview
==================================================
*/

.answer-preview {
  max-width: 720px;

  min-height: 60px;

  display: flex;

  justify-content: center;
  align-items: center;

  margin:
    14px auto 0;

  padding: 12px;

  border:
    2px solid
    #bfe7e4;

  border-radius: 14px;

  background:
    #eaf9f7;

  color:
    #3c5660;

  text-align: center;

  font-size: 18px;
  font-weight: 900;
}

.answer-preview-value {
  display: inline-flex;

  align-items: center;

  margin-left: 8px;

  color:
    var(--teal-dark);

  font-size: 23px;
}

/*
==================================================
Buttons
==================================================
*/

.button-row {
  display: flex;

  justify-content: center;

  gap: 10px;

  margin-top: 17px;

  flex-wrap: wrap;
}

.game-button {
  min-width: 138px;

  padding:
    12px 19px;

  border: 0;

  border-radius: 13px;

  color: white;

  background:
    var(--navy);

  font-size: 16px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 5px 0
    var(--navy-dark);
}

.game-button.primary {
  background:
    var(--teal);

  box-shadow:
    0 5px 0
    var(--teal-dark);
}

.game-button.restart {
  background:
    var(--blue);

  box-shadow:
    0 5px 0
    var(--blue-dark);
}

.game-button.secondary {
  background:
    #64748b;

  box-shadow:
    0 5px 0
    #475569;
}

.game-button.orange {
  background:
    var(--orange);

  box-shadow:
    0 5px 0
    var(--orange-dark);
}

.game-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/*
==================================================
Feedback
==================================================
*/

.feedback {
  min-height: 46px;

  margin-top: 14px;

  text-align: center;

  font-size: 18px;
  font-weight: 900;

  line-height: 1.8;
}

.feedback.correct {
  color:
    var(--success);
}

.feedback.wrong {
  color:
    var(--danger);
}

.feedback.warning {
  color:
    var(--warning);
}

/*
==================================================
詳解
==================================================
*/

.explanation {
  margin-top: 13px;

  padding: 18px;

  border-radius: 16px;

  background:
    #edf8f8;

  color:
    #334155;

  line-height: 2;
}

.explanation-step {
  margin:
    9px 0;
}

/*
==================================================
Result
==================================================
*/

.result-panel {
  text-align: center;
}

.result-score {
  margin:
    16px 0;

  color:
    var(--orange);

  font-size: 56px;
  font-weight: 900;
}

.result-stars {
  margin-bottom: 8px;

  font-size: 31px;
}

.result-grid {
  display: grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap: 12px;

  margin:
    20px 0;
}

.result-stat {
  padding:
    16px 10px;

  border-radius: 16px;

  background:
    var(--teal-light);

  color:
    var(--navy);

  font-weight: 900;
}

.save-status {
  min-height: 28px;

  margin-top: 14px;

  font-weight: 900;
}

/*
==================================================
Review
==================================================
*/

.review-list {
  display: grid;

  gap: 14px;
}

.review-card {
  padding: 18px;

  border:
    1px solid
    #e2e8f0;

  border-radius: 16px;

  background: white;
}

.review-title {
  color:
    var(--danger);

  font-weight: 900;
}

.review-question {
  margin:
    12px 0;

  color:
    var(--navy);

  font-size: 21px;
  font-weight: 900;
}

.review-answer {
  color:
    #475569;

  line-height: 1.8;
}

/*
==================================================
Responsive
==================================================
*/

@media(
  max-width: 900px
) {

  .mode-grid {
    grid-template-columns:
      1fr;
  }

}

@media(
  max-width: 780px
) {

  body {
    padding: 8px;
  }

  .screen {
    padding:
      18px 12px;
  }

  .quiz-topbar {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .timer-box {
    grid-column:
      1 / -1;
  }

  .question-stage {
    grid-template-columns:
      1fr;
  }

  .diagram-card {
    min-height: 260px;
  }

  .question-card {
    min-height: 240px;
  }

  .choice-grid {
    grid-template-columns:
      1fr;
  }

  .result-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .radical-fraction-grid {
    grid-template-columns:
      1fr;

    justify-items: center;
  }

}

</style>

</head>


<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-shell">


    <!-- ==================================================
         Header
    ================================================== -->

    <header class="hero">

      <div class="hero-icon">
        📐
      </div>

      <h1 class="game-title">
        畢氏定理大挑戰
      </h1>

      <p class="game-subtitle">
        從基本邊長與直角判斷開始，再挑戰生活應用、斜邊上的高與坐標平面兩點距離。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          a²＋b²＝c²
        </span>

        <span class="concept-chip">
          求第三邊
        </span>

        <span class="concept-chip">
          斜邊上的高
        </span>

        <span class="concept-chip">
          生活應用
        </span>

        <span class="concept-chip">
          兩點間距離
        </span>

      </div>

    </header>


    <!-- ==================================================
         Start
    ================================================== -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-intro">

        <h2>
          選擇挑戰模式
        </h2>

        <p>
          三個模式依照翰林版八上 2-3 畢氏定理的例題與隨堂練習架構重新整理。
        </p>

      </div>


      <div class="mode-grid">


        <!-- MODE 1 -->

        <button
          class="mode-card mode-one"
          type="button"
          data-mode="basic"
        >

          <div class="mode-top">

            <div class="mode-icon">
              📐
            </div>

            <div>

              <div class="mode-number">
                MODE 01
              </div>

              <h3>
                畢氏定理基礎
              </h3>

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return a ||
    1;
}


function reduceFraction(
  numerator,
  denominator
) {

  if (
    denominator <
    0
  ) {

    numerator *=
      -1;


    denominator *=
      -1;
  }


  const d =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      d,

    denominator:
      denominator /
      d
  };
}

function mNumber(

) {

    </msqrt>
  `;
}


function mFraction(
  numerator,
  denominator
) {

  return `
    <mfrac>
      <mrow>
        ${numerator}
      </mrow>
      <mrow>
        ${denominator}
      </mrow>
    </mfrac>
  `;
}


function mathHTML(
  content,

    false
) {

  return `
    <math
      class="math-inline ${large ? "math-large" : ""}"
      xmlns="http://www.w3.org/1998/Math/MathML"
    >
      <mrow>
        ${content}
      </mrow>
    </math>
  `;
}


function squareHTML(
  n

    )
  );
}


function rootHTML(
  n

  );
}


function radicalHTML(
  coefficient,
  radicand
) {

  if (
    radicand ===
    1
  ) {

    return String(
      coefficient
    );
  }


  const sign =
    coefficient <
    0
      ? "−"
      : "";


  const abs =
    Math.abs(
      coefficient
    );


  const coefficientHTML =

    abs ===
    1

      ? ""

      : mNumber(
          abs
        );


  return mathHTML(

    `
      ${sign ? mOperator("−") : ""}
      ${coefficientHTML}
      ${mSqrt(
        mNumber(
          radicand
        )
      )}
    `
  );
}


function fractionHTML(
  numerator,
  denominator
) {

  return mathHTML(

    mFraction(
      mNumber(
        numerator
      ),
      mNumber(
        denominator
      )
    )
  );
}


function radicalFractionHTML(
  coefficient,
  radicand,
  denominator
) {

  const numeratorHTML = `

    ${
      coefficient ===
      1

        ? ""

        : mNumber(
            coefficient
          )
    }

    ${mSqrt(
      mNumber(
        radicand
      )
    )}
  `;


  return mathHTML(

    mFraction(
      numeratorHTML,
      mNumber(
        denominator
      )
    )
  );
}


/*
==================================================
根式化簡
==================================================
*/

function simplifyRoot(
  n
) {

  const exact =
    Math.sqrt(
      n
    );


  if (
    Number.isInteger(
      exact
    )
  ) {

    return {

      type:
        "number",

      value:
        exact
    };
  }


  let outside =
    1;


  let inside =
    n;


  for (
    let i =
      Math.floor(
        Math.sqrt(
          n
        )
      );

    i >=
    2;

    i--
  ) {

    const square =
      i *
      i;


    if (
      n %
      square ===
      0
    ) {

      outside =
        i;


      inside =
        n /
        square;


      break;
    }
  }


  return {

    type:
      "radical",

    coefficient:
      outside,

    radicand:
      inside
  };
}

  return makeQuestion({

    typeLabel:

    label:
      "已知直角三角形的兩股長，求斜邊長",

    html:

    answer:

    radicand:
      result.radicand,

    explanation:

        `由畢氏定理知：
         ${mathHTML(
           `
             ${mSup(mIdentifier("c"),2)}
             ${mOperator("=")}
             ${mSup(mNumber(a),2)}
             ${mOperator("+")}

           `

            ${mOperator("+")}
            ${mNumber(b * b)}

               `
                 ${mIdentifier("c")}
                 ${mOperator("=")}

               `
             )}
             ＝
             ${radicalHTML(
               result.coefficient,
               result.radicand
             )}。`
      ]
  });
}


function makeLegQuestion() {

  const triple =
    pick(
      [

        [3,4,5],
        [5,12,13],
        [6,8,10],
        [7,24,25],
        [8,15,17],
        [9,12,15],
        [9,40,41],
        [12,16,20]
      ]
    );


  const swap =
    Math.random() <
    .5;


  const knownLeg =
    swap
      ? triple[0]
      : triple[1];


  const unknownLeg =
    swap
      ? triple[1]
      : triple[0];


  const c =
    triple[2];


  const makeRadical =
    Math.random() <
    .35;


  if (
    makeRadical
  ) {

    let known =
      rand(
        2,
        8
      );


    let hyp =
      rand(
        known + 2,
        known + 8
      );


    let difference =
      hyp * hyp -
      known * known;


    let result =
      simplifyRoot(
        difference
      );


    while (
      result.type ===
      "number"
    ) {

      known =
        rand(
          2,
          8
        );


      hyp =
        rand(
          known + 2,
          known + 8
        );


      difference =
        hyp * hyp -
        known * known;


      result =
        simplifyRoot(
          difference
        );
    }


    return makeQuestion({

      typeLabel:
        "股長的計算",

      label:
        "已知一股與斜邊，求另一股",

      html:
        `斜邊長 ${hyp}，其中一股長 ${known}，求另一股 x。`,

      hint:
        "💡 另一股平方＝斜邊平方－已知股平方",

      diagram:
        legTriangleSVG(
          known,
          hyp,
          "x"
        ),

      answerType:
        "radical",

      coefficient:
        result.coefficient,

      radicand:
        result.radicand,

      explanation:
        [

          `由畢氏定理知：
           ${mathHTML(
             `
               ${mSup(mIdentifier("x"),2)}
               ${mOperator("+")}
               ${mSup(mNumber(known),2)}
               ${mOperator("=")}
               ${mSup(mNumber(hyp),2)}
             `
           )}。`,

          `移項得：
           ${mathHTML(
             `
               ${mSup(mIdentifier("x"),2)}
               ${mOperator("=")}
               ${mSup(mNumber(hyp),2)}
               ${mOperator("−")}
               ${mSup(mNumber(known),2)}
             `
           )}。`,

          `${mathHTML(
            `
              ${mSup(mIdentifier("x"),2)}
              ${mOperator("=")}
              ${mNumber(hyp * hyp)}
              ${mOperator("−")}
              ${mNumber(known * known)}
              ${mOperator("=")}
              ${mNumber(difference)}
            `
          )}。`,

          `因為 x＞0，
           所以
           ${mathHTML(
             `
               ${mIdentifier("x")}
               ${mOperator("=")}
               ${mSqrt(mNumber(difference))}
             `
           )}
           ＝
           ${radicalHTML(
             result.coefficient,
             result.radicand
           )}。`
        ]
    });
  }


  return makeQuestion({

    typeLabel:
      "股長的計算",

    label:
      "已知一股與斜邊，求另一股",

    html:
      `斜邊長 ${c}，其中一股長 ${knownLeg}，求另一股 x。`,

    hint:
      "💡 另一股平方＝斜邊平方－已知股平方",

    diagram:
      legTriangleSVG(
        knownLeg,
        c,
        "x"
      ),

    answerType:
      "number",

    answer:
      unknownLeg,

    explanation:
      [

        `由畢氏定理知：
         ${mathHTML(
           `
             ${mSup(mIdentifier("x"),2)}
             ${mOperator("+")}
             ${mSup(mNumber(knownLeg),2)}
             ${mOperator("=")}
             ${mSup(mNumber(c),2)}
           `
         )}。`,

        `所以
         ${mathHTML(
           `
             ${mSup(mIdentifier("x"),2)}
             ${mOperator("=")}
             ${mNumber(c * c)}
             ${mOperator("−")}
             ${mNumber(knownLeg * knownLeg)}
             ${mOperator("=")}
             ${mNumber(unknownLeg * unknownLeg)}
           `
         )}。`,

        `因為 x＞0，所以 x＝${unknownLeg}。`
      ]
  });
}

function makeRadicalAltitudeQuestion() {

  /*
  模仿課本自評：
  兩股可能含根號，先求斜邊，再求高
  */

  const radical =
    pick(
      [
        2,
        3,
        5,
        6,
        7,
        11
      ]
    );


  const integerLeg =
    rand(
      3,
      7
    );


  /*
  令另一股 = √r
  斜邊平方 = integer² + r
  只挑成完全平方
  */

  let c;


  let r =
    radical;


  let found =
    false;


  for (
    let candidate =
      integerLeg + 1;

    candidate <=
      integerLeg + 8;

    candidate++
  ) {

    const diff =
      candidate *
      candidate -
      integerLeg *
      integerLeg;


    if (
      diff >
      1 &&
      [
        2,
        3,
        5,
        6,
        7,
        8,
        10,
        11,
        12,
        13,
        14,
        15
      ]
        .includes(
          diff
        )
    ) {

      c =
        candidate;


      r =
        diff;


      found =
        true;


      break;
    }
  }


  if (
    !found
  ) {

    /*
    使用課本型 5 與 √11 → 斜邊 6
    */

    c =
      6;


    r =
      11;
  }


  const coefficient =
    integerLeg;


  const denominator =
    c;


  const common =
    gcd(
      coefficient,
      denominator
    );


  const finalCoefficient =
    coefficient /
    common;


  const finalDenominator =
    denominator /
    common;


  return makeQuestion({

    typeLabel:
      "斜邊上的高｜根式",

    label:
      "兩股含根式，先求斜邊再求斜邊上的高",

    html:
      `兩股長為 ${integerLeg} 與 ${rootHTML(r)}，求斜邊上的高 h。`,

    hint:
      "💡 先求斜邊，再使用 h＝兩股乘積÷斜邊",

    diagram:
      altitudeSVG(
        integerLeg,
        "√" + r,
        "c"
      ),

    answerType:
      "radicalFraction",

    coefficient:
      finalCoefficient,

    radicand:
      r,

    denominator:
      finalDenominator,

    explanation:
      [

        `先設斜邊長為 c。`,

        `由畢氏定理：
         ${mathHTML(
           `
             ${mSup(mIdentifier("c"),2)}
             ${mOperator("=")}
             ${mSup(mNumber(integerLeg),2)}
             ${mOperator("+")}
             ${mSup(
               mSqrt(mNumber(r)),
               2
             )}
           `
         )}。`,

        `${mathHTML(
          `
            ${mSup(mIdentifier("c"),2)}
            ${mOperator("=")}
            ${mNumber(integerLeg * integerLeg)}
            ${mOperator("+")}
            ${mNumber(r)}
            ${mOperator("=")}
            ${mNumber(c * c)}
          `
        )}，
        所以 c＝${c}。`,

        `再利用斜邊上的高：
         ${mathHTML(
           `
             ${mIdentifier("h")}
             ${mOperator("=")}
             ${mFraction(
               `
                 ${mNumber(integerLeg)}
                 ${mOperator("×")}
                 ${mSqrt(mNumber(r))}
               `,
               mNumber(c)
             )}
           `
         )}。`,

        `約分後：
         h＝${radicalFractionHTML(
           finalCoefficient,
           r,
           finalDenominator
         )}。`
      ]
  });
}

function makeAxisDistanceQuestion() {

  const horizontal =
    Math.random() <
    .5;


  if (
    horizontal
  ) {

    const y =
      rand(
        -5,
        5
      );


    const x1 =
      rand(
        -8,
        1
      );


    const x2 =
      rand(
        x1 + 2,
        8
      );


    const answer =
      Math.abs(
        x2 -
        x1
      );


    return makeQuestion({

      typeLabel:
        "水平線上兩點距離",

      label:
        "利用數線上兩點距離計算",

      html:
        `A(${x1}, ${y})、B(${x2}, ${y})，求 AB。`,

      hint:
        "💡 y 坐標相同，只需比較 x 坐標的差",

      diagram:
        coordinateSVG(
          x1,
          y,
          x2,
          y
        ),

      answerType:
        "number",

      answer,

      explanation:
        [

          `A、B 兩點的 y 坐標相同，因此 AB 是水平距離。`,

          `AB＝|${x2}－(${x1})|。`,

          `AB＝${answer}。`
        ]
    });
  }


  const x =
    rand(
      -5,
      5
    );


  const y1 =
    rand(
      -8,
      1
    );


  const y2 =
    rand(
      y1 + 2,
      8
    );


  const answer =
    Math.abs(
      y2 -
      y1
    );


  return makeQuestion({

    typeLabel:
      "鉛直線上兩點距離",

    label:
      "利用數線上兩點距離計算",

    html:
      `A(${x}, ${y1})、B(${x}, ${y2})，求 AB。`,

    hint:
      "💡 x 坐標相同，只需比較 y 坐標的差",

    diagram:
      coordinateSVG(
        x,
        y1,
        x,
        y2
      ),

    answerType:
      "number",

    answer,

    explanation:
      [

        `A、B 兩點的 x 坐標相同，因此 AB 是鉛直距離。`,

        `AB＝|${y2}－(${y1})|。`,

        `AB＝${answer}。`
      ]
  });
}


function makeGeneralDistanceQuestion() {

  const x1 =
    rand(
      -6,
      4
    );


  const y1 =
    rand(
      -6,
      4
    );


  let x2;
  let y2;


  do {

    x2 =
      rand(
        -6,
        6
      );


    y2 =
      rand(
        -6,
        6
      );

  } while (
    x2 ===
      x1 ||
    y2 ===
      y1
  );


  const dx =
    x2 -
    x1;


  const dy =
    y2 -
    y1;


  const sum =
    dx * dx +
    dy * dy;


  const result =
    simplifyRoot(
      sum
    );


  return makeQuestion({

    typeLabel:
      "平面上兩點的距離",

    label:
      "使用兩點距離公式",

    html:
      `A(${x1}, ${y1})、B(${x2}, ${y2})，求 AB。`,

    hint:
      "💡 AB＝√[(x₂－x₁)²＋(y₂－y₁)²]",

    diagram:
      coordinateSVG(
        x1,
        y1,
        x2,
        y2
      ),

    answerType:
      result.type,

    answer:
      result.value,

    coefficient:
      result.coefficient,

    radicand:
      result.radicand,

    explanation:
      [

        `使用兩點距離公式：
         ${mathHTML(
           `
             ${mIdentifier("AB")}
             ${mOperator("=")}
             ${mSqrt(
               `
                 ${mSup(
                   `
                     <mrow>
                       ${mNumber(x2)}
                       ${mOperator("−")}
                       <mo>(</mo>
                       ${mNumber(x1)}
                       <mo>)</mo>
                     </mrow>
                   `,
                   2
                 )}
                 ${mOperator("+")}
                 ${mSup(
                   `
                     <mrow>
                       ${mNumber(y2)}
                       ${mOperator("−")}
                       <mo>(</mo>
                       ${mNumber(y1)}
                       <mo>)</mo>
                     </mrow>
                   `,
                   2
                 )}
               `
             )}
           `
         )}。`,

        `x 坐標差＝${dx}，y 坐標差＝${dy}。`,

        `${mathHTML(
          `
            ${mIdentifier("AB")}
            ${mOperator("=")}
            ${mSqrt(
              `
                ${mNumber(dx * dx)}
                ${mOperator("+")}
                ${mNumber(dy * dy)}
              `
            )}
            ${mOperator("=")}
            ${mSqrt(mNumber(sum))}
          `
        )}。`,

        result.type ===
        "number"

          ? `所以 AB＝${result.value}。`

          : `化為最簡根式：
             AB＝${radicalHTML(
               result.coefficient,
               result.radicand
             )}。`
      ]
  });
}


function makeThreePointDistanceQuestion() {

  const xGap =
    rand(
      3,
      8
    );


  const yGap =
    rand(
      3,
      8
    );


  const sum =
    xGap * xGap +
    yGap * yGap;


  const result =
    simplifyRoot(
      sum
    );


  return makeQuestion({

    typeLabel:
      "三點距離應用",

    label:
      "先求水平、鉛直距離，再使用畢氏定理",

    html:
      `已知 AB＝${xGap}、BC＝${yGap}，且 ∠B＝90°，求 AC。`,

    hint:
      "💡 先把水平距離與鉛直距離視為兩股",

    diagram:
      threePointSVG(
        xGap,
        yGap
      ),

    answerType:
      result.type,

    answer:
      result.value,

    coefficient:
      result.coefficient,

    radicand:
      result.radicand,

    explanation:
      [

        `因為 ∠B＝90°，所以 △ABC 是直角三角形。`,

        `由畢氏定理：
         ${mathHTML(
           `
             ${mSup(mIdentifier("AC"),2)}
             ${mOperator("=")}
             ${mSup(mNumber(xGap),2)}
             ${mOperator("+")}
             ${mSup(mNumber(yGap),2)}
           `
         )}。`,

        `${mathHTML(
          `
            ${mSup(mIdentifier("AC"),2)}
            ${mOperator("=")}
            ${mNumber(sum)}
          `
        )}。`,

        result.type ===
        "number"

          ? `因為 AC＞0，所以 AC＝${result.value}。`

          : `因為 AC＞0，所以
             AC＝${radicalHTML(
               result.coefficient,
               result.radicand
             )}。`
      ]
  });
}

/*

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    finalElapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  finalElapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        const elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

/*
==================================================
Preview helpers
==================================================
*/

function setPreview(
  html
) {

  const preview =
    $("answer-preview");


  if (
    preview
  ) {

    preview.innerHTML =
      html;
  }
}


function updateNumberPreview() {

  const raw =
    $("number-answer")
      ?.value
      .trim() ||
    "";


  setPreview(

    raw

      ? `目前答案：
         <span class="answer-preview-value">
           ${raw}
         </span>`

      : "目前尚未完成答案。"
  );
}


function updateFractionPreview() {

  const numerator =
    $("fraction-numerator")
      ?.value
      .trim() ||
    "";


  const denominator =
    $("fraction-denominator")
      ?.value
      .trim() ||
    "";


  if (
    !numerator ||
    !denominator
  ) {

    setPreview(
      "目前尚未完成答案。"
    );


    return;
  }


  setPreview(
    `
      目前答案：

      <span class="answer-preview-value">

        ${fractionHTML(
          numerator,
          denominator
        )}

      </span>
    `
  );
}


function updateRadicalFractionPreview() {

  const sign =
    $("rf-sign")
      ?.value ||
    "+";


  const coefficient =
    $("rf-coefficient")
      ?.value
      .trim() ||
    "";


  const radicand =
    $("rf-radicand")
      ?.value
      .trim() ||
    "";


  const denominator =
    $("rf-denominator")
      ?.value
      .trim() ||
    "";


  if (
    !coefficient ||
    !radicand ||
    !denominator
  ) {

    setPreview(
      "目前尚未完成答案。"
    );


    return;
  }


  let c =
    Number(
      coefficient
    );


  if (
    sign ===
    "-"
  ) {

    c *=
      -1;
  }


  setPreview(
    `
      目前答案：

      <span class="answer-preview-value">

        ${radicalFractionHTML(
          c,
          Number(
            radicand
          ),
          Number(
            denominator
          )
        )}

      </span>
    `
  );
}


/*
==================================================
Answer rendering
==================================================
*/

function renderAnswer(
  question
) {

  radicalInput =
    null;


  selectedChoice =
    null;


  const panel =
    $("answer-panel");


  /*
  整數
  */

  if (
    question.answerType ===
    "number"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫答案

      </div>

      <div class="number-answer">

        <input
          id="number-answer"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="輸入答案"
        >

      </div>

      <div
        id="answer-preview"
        class="answer-preview"
      >

        目前尚未完成答案。

      </div>
    `;


    $("number-answer")
      .addEventListener(
        "input",
        updateNumberPreview
      );


    setTimeout(
      () =>
        $("number-answer")
          ?.focus(),
      0
    );


    return;
  }


  /*
  根式
  */

  if (
    question.answerType ===
    "radical"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫最簡根式

      </div>

      <p class="answer-help">

        根號外係數為 1 時可以保留 1。<br>

        根號內若仍可化簡，
        系統只會提醒，不會替你自動化簡。

      </p>

      <div
        id="radical-answer-mount"
      ></div>
    `;


    radicalInput =
      new window.RadicalInput(
        {

          mountId:
            "radical-answer-mount",

          requireSimplifiedRadical:
            true,

          theme: {

            primary:
              "#149b92",

            light:
              "#eaf9f7",

            border:
              "#9fd9d5"
          }
        }
      );


    setTimeout(
      () =>
        radicalInput
          ?.focus(),
      0
    );


    return;
  }


  /*
  一般分數
  */

  if (
    question.answerType ===
    "fraction"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫最簡分數

      </div>

      <p class="answer-help">

        請自行約分成最簡分數後再提交。

      </p>

      <div class="fraction-answer-wrap">

        <div class="fraction-answer">

          <input
            id="fraction-numerator"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="分子"
          >

          <input
            id="fraction-denominator"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="分母"
          >

        </div>

      </div>

      <div
        id="answer-preview"
        class="answer-preview"
      >

        目前尚未完成答案。

      </div>
    `;


    [
      "fraction-numerator",
      "fraction-denominator"
    ]
      .forEach(
        id => {

          $(id)
            .addEventListener(
              "input",
              updateFractionPreview
            );
        }
      );


    setTimeout(
      () =>
        $("fraction-numerator")
          ?.focus(),
      0
    );


    return;
  }


  /*
  根式分數
  例如 5√11 / 6
  */

  if (
    question.answerType ===
    "radicalFraction"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫最簡根式分數

      </div>

      <p class="answer-help">

        分子填「根號外係數 × 根式」，分母填在下方。<br>

        根號外係數是 1 時可填 1。

      </p>

      <div class="radical-fraction-grid">

        <select
          id="rf-sign"
          class="rf-sign"
        >

          <option value="+">
            ＋
          </option>

          <option value="-">
            －
          </option>

        </select>


        <input
          id="rf-coefficient"
          class="rf-coefficient"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="係數"
        >


        <div class="rf-root-box">

          <div class="rf-root-top">

            <span class="rf-root">
              √
            </span>

            <input
              id="rf-radicand"
              class="rf-radicand"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="根號內"
            >

          </div>

          <div class="rf-divider"></div>

          <div class="rf-denominator-wrap">

            <input
              id="rf-denominator"
              class="rf-denominator"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="分母"
            >

          </div>

        </div>

      </div>


      <div
        id="answer-preview"
        class="answer-preview"
      >

        目前尚未完成答案。

      </div>
    `;


    [
      "rf-sign",
      "rf-coefficient",
      "rf-radicand",
      "rf-denominator"
    ]
      .forEach(
        id => {

          $(id)
            .addEventListener(
              "input",
              updateRadicalFractionPreview
            );


          $(id)
            .addEventListener(
              "change",
              updateRadicalFractionPreview
            );
        }
      );


    setTimeout(
      () =>
        $("rf-coefficient")
          ?.focus(),
      0
    );


    return;
  }


  /*
  Choice
  */

  panel.innerHTML = `

    <div class="answer-title">

      請選擇正確答案

    </div>

    <div class="choice-grid">

      ${
        question
          .choices
          .map(
            choice => `

              <button
                type="button"
                class="choice-button"
                data-choice="${choice.value}"
              >

                ${choice.text}

              </button>
            `
          )
          .join("")
      }

    </div>

    <div
      id="answer-preview"
      class="answer-preview"
    >

      尚未選擇答案。

    </div>
  `;


  panel
    .querySelectorAll(
      ".choice-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectedChoice =
              button.dataset.choice;


            panel
              .querySelectorAll(
                ".choice-button"
              )
              .forEach(
                item => {

                  item
                    .classList
                    .remove(
                      "selected"
                    );
                }
              );


            button
              .classList
              .add(
                "selected"
              );


            setPreview(
              `
                目前選擇：

                <span class="answer-preview-value">

                  ${button.textContent.trim()}

                </span>
              `
            );
          }
        );
      }
    );
}

/*
==================================================
Read answer
==================================================
*/

function readAnswer(
  question
) {

  /*
  number
  */

  if (
    question.answerType ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整的整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  radical
  */

  if (
    question.answerType ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請完成最簡根式答案。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  /*
  fraction
  */

  if (
    question.answerType ===
    "fraction"
  ) {

    const numeratorRaw =
      $("fraction-numerator")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("fraction-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          numeratorRaw
        ) ||
      !/^-?\d+$/
        .test(
          denominatorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請完整填寫分子與分母。"
      };
    }


    const numerator =
      Number(
        numeratorRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    const reduced =
      reduceFraction(
        numerator,
        denominator
      );


    if (
      reduced.numerator !==
        numerator ||
      reduced.denominator !==
        denominator
    ) {

      return {

        valid:
          false,

        message:
          "這個分數還可以約分，請自行化成最簡分數後再提交。"
      };
    }


    return {

      valid:
        true,

      value: {

        numerator,
        denominator
      },

      display:
        `${numerator}/${denominator}`
    };
  }


  /*
  radical fraction
  */

  if (
    question.answerType ===
    "radicalFraction"
  ) {

    const sign =
      $("rf-sign")
        ?.value ||
      "+";


    const coefficientRaw =
      $("rf-coefficient")
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $("rf-radicand")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("rf-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/
        .test(
          coefficientRaw
        ) ||
      !/^\d+$/
        .test(
          radicandRaw
        ) ||
      !/^\d+$/
        .test(
          denominatorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請完整填寫根號外係數、根號內與分母。"
      };
    }


    let coefficient =
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      coefficient ===
      0 ||
      radicand <=
      0
    ) {

      return {

        valid:
          false,

        message:
          "請檢查根式答案。"
      };
    }


    const simplified =
      simplifyRoot(
        radicand
      );


    if (
      simplified.type ===
      "number"
    ) {

      return {

        valid:
          false,

        message:
          "根號內是完全平方數，答案還可以繼續化簡。"
      };
    }


    if (
      simplified.coefficient !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號內還可以化簡，請自行化成最簡根式。"
      };
    }


    const d =
      gcd(
        coefficient,
        denominator
      );


    if (
      d !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號外係數與分母還可以約分，請先化成最簡形式。"
      };
    }


    if (
      sign ===
      "-"
    ) {

      coefficient *=
        -1;
    }


    return {

      valid:
        true,

      value: {

        coefficient,
        radicand,
        denominator
      },

      display:
        `${coefficient}√${radicand}/${denominator}`
    };
  }


  /*
  choice
  */

  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}


/*
==================================================
Check
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.answerType ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.answerType ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  if (
    question.answerType ===
    "fraction"
  ) {

    return (

      answer.value.numerator ===
        question.numerator &&

      answer.value.denominator ===
        question.denominator
    );
  }


  if (
    question.answerType ===
    "radicalFraction"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand &&

      answer.value.denominator ===
        question.denominator
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
Correct answer
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.answerType ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.answerType ===
    "radical"
  ) {

    return radicalHTML(
      question.coefficient,
      question.radicand
    );
  }


  if (
    question.answerType ===
    "fraction"
  ) {

    return fractionHTML(
      question.numerator,
      question.denominator
    );
  }


  if (
    question.answerType ===
    "radicalFraction"
  ) {

    return radicalFractionHTML(
      question.coefficient,
      question.radicand,
      question.denominator
    );
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          question.answer
      );


  return (
    choice?.text ||
    question.answer
  );
}


/*
==================================================
Explanation
==================================================
*/

function explanationHTML(
  question
) {

  return question
    .explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>
            步驟 ${i + 1}｜
          </strong>

          ${step}

        </div>
      `
    )
    .join("");
}


/*
==================================================
Submit
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
        questions.length -
        1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
Next
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
Start
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  /*
  每次都重新產生題庫
  */

  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  selectedChoice =
    null;


  radicalInput =
    null;


  scoreSaved =
    false;


  finalElapsed =
    0;


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
Rating
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經能熟練運用畢氏定理解決各類問題。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再留意斜邊判斷與根式化簡即可。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，建議再加強生活應用與坐標距離。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從模式一開始，熟悉斜邊與兩股的關係。"
  };
}


/*
==================================================
Result
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  playGameSound(
    "playComplete"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        finalElapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            finalElapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "畢氏定理成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
Review
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  const list =
    $("review-list");


  if (
    wrongRecords.length ===
    0
  ) {

    list.innerHTML = `

      <div class="review-card">

        全部答對，沒有需要回顧的錯題！

      </div>
    `;

  } else {

    list.innerHTML =
      wrongRecords
        .map(
          record => `

            <article class="review-card">

              <div class="review-title">

                第 ${record.number} 題 ❌

              </div>

              <div class="review-question">

                ${record.question.html}

              </div>

              <div class="review-answer">

                你的答案：

                <strong>
                  ${record.userAnswer}
                </strong>

                <br>

                正確答案：

                <strong>
                  ${
                    correctAnswerText(
                      record.question
                    )
                  }
                </strong>

              </div>

              <div class="explanation">

                ${
                  explanationHTML(
                    record.question
                  )
                }

              </div>

            </article>
          `
        )
        .join("");
  }


  showOnly(
    "review-screen"
  );
}


/*
==================================================
Events
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          startGame(
            button.dataset.mode
          );
        }
      );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
Init
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showOnly(
  "start-screen"
);

</script>

</body>

</html>
