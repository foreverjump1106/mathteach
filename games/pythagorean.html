<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    畢氏定理大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --navy: #17324d;
      --navy-dark: #0f2438;

      --teal: #149b92;
      --teal-dark: #0b746e;

      --sky: #dff6f4;
      --sky-light: #f3fbfa;

      --orange: #f59e0b;
      --orange-dark: #c97900;

      --blue: #3182ce;
      --blue-dark: #1e5e9b;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #c62828;
      --warning: #b45309;

      --line: #cbd5e1;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:

        linear-gradient(
          rgba(49, 130, 206, .045) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(49, 130, 206, .045) 1px,
          transparent 1px
        ),

        linear-gradient(
          135deg,
          #edf8fa,
          #fffaf0
        );

      background-size:
        26px 26px,
        26px 26px,
        auto;
    }

    button,
    input,
    select {

      font-family: inherit;
    }

    .hidden {

      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          1040px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom: 14px;
    }

    /*
    ==================================================
    主框架
    ==================================================
    */

    .game-shell {

      overflow: hidden;

      border:
        1px solid
        #d7e7e7;

      border-radius: 30px;

      background:
        rgba(
          255,
          255,
          255,
          .97
        );

      box-shadow:
        0 18px 45px
        rgba(
          15,
          36,
          56,
          .13
        );
    }

    /*
    ==================================================
    HERO
    ==================================================
    */

    .hero {

      position: relative;

      overflow: hidden;

      padding:
        28px 24px 27px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #16324f 0%,
          #1b5067 56%,
          #168d86 100%
        );

      color: white;
    }

    .hero::before {

      content: "";

      position: absolute;

      width: 230px;
      height: 230px;

      top: -120px;
      right: -55px;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .14
        );

      border-radius: 50%;
    }

    .hero::after {

      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      left: -50px;
      bottom: -80px;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .12
        );

      transform:
        rotate(
          35deg
        );
    }

    .hero-icon {

      position: relative;

      display:
        inline-flex;

      justify-content: center;

      align-items: center;

      width: 58px;
      height: 58px;

      margin-bottom: 9px;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .5
        );

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          .12
        );

      font-size: 34px;
    }

    .game-title {

      position: relative;

      margin: 0;

      font-size:
        clamp(
          31px,
          5vw,
          44px
        );

      font-weight: 900;
    }

    .game-subtitle {

      position: relative;

      margin:
        11px auto 0;

      max-width: 730px;

      color:
        #d8f4f2;

      line-height: 1.8;
    }

    .concept-strip {

      position: relative;

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 17px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 12px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .42
        );

      border-radius:
        999px;

      background:
        rgba(
          255,
          255,
          255,
          .11
        );

      font-size: 13px;

      font-weight: 900;
    }

    .screen {

      padding: 25px;
    }

    /*
    ==================================================
    模式
    ==================================================
    */

    .mode-intro {

      margin-bottom: 18px;

      text-align: center;
    }

    .mode-intro h2 {

      margin:
        0 0 6px;

      color:
        var(--navy);
    }

    .mode-intro p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 17px;
    }

    .mode-card {

      position: relative;

      min-height: 220px;

      overflow: hidden;

      padding: 22px;

      border:
        2px solid
        #d5e7e6;

      border-radius: 22px;

      background: white;

      text-align: left;

      cursor: pointer;

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-4px);

      border-color:
        var(--teal);

      box-shadow:
        0 12px 26px
        rgba(
          15,
          50,
          77,
          .12
        );
    }

    .mode-card::after {

      content: "";

      position: absolute;

      width: 88px;
      height: 88px;

      right: -25px;
      bottom: -25px;

      border-radius: 50%;

      background:
        var(--card-accent);
    }

    .mode-one {

      --card-accent:
        rgba(20,155,146,.11);
    }

    .mode-two {

      --card-accent:
        rgba(49,130,206,.11);
    }

    .mode-three {

      --card-accent:
        rgba(245,158,11,.13);
    }

    .mode-four {

      --card-accent:
        rgba(124,58,237,.10);
    }

    .mode-top {

      display: flex;

      align-items: center;

      gap: 11px;

      margin-bottom: 12px;
    }

    .mode-icon {

      width: 47px;
      height: 47px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex: 0 0 auto;

      border-radius: 15px;

      background:
        var(--sky);

      font-size: 27px;
    }

    .mode-number {

      color:
        var(--teal-dark);

      font-size: 13px;

      font-weight: 900;
    }

    .mode-card h3 {

      margin:
        2px 0 0;

      color:
        var(--navy);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 12px;

      padding:
        10px 12px;

      border-radius: 12px;

      background:
        #f8fafc;

      color:
        #475569;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        1.3fr repeat(
          4,
          1fr
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 68px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 9px;

      border:
        1px solid
        #dbe8eb;

      border-radius: 15px;

      background:
        #f4fafb;

      color:
        var(--navy);

      text-align: center;

      font-size: 13px;

      font-weight: 900;
    }

    .status-value {

      margin-top: 4px;

      color:
        var(--teal-dark);

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff8ea;

      border-color:
        #fce4b5;

      color:
        #b45309;
    }

    .timer-box
    .status-value {

      color:
        #c66c00;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 54px;

      margin:
        2px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      align-items: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      left:
        auto !important;

      right:
        auto !important;

      top:
        auto !important;

      bottom:
        auto !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 9px;

      margin-bottom: 18px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      border-radius:
        999px;

      background:
        linear-gradient(
          90deg,
          var(--teal),
          #45c5bb
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目舞台
    ==================================================
    */

    .question-stage {

      display: grid;

      grid-template-columns:
        minmax(
          270px,
          .95fr
        )
        minmax(
          300px,
          1.05fr
        );

      gap: 18px;
    }

    .diagram-card,
    .question-card {

      min-height: 315px;

      border:
        2px solid
        #d7e7e8;

      border-radius: 22px;

      background: white;
    }

    .diagram-card {

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 18px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #f7fcfc,
          #ffffff
        );
    }

    .diagram-card::before {

      content: "";

      position: absolute;

      inset: 0;

      opacity: .38;

      background:

        linear-gradient(
          #d8eeee 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          #d8eeee 1px,
          transparent 1px
        );

      background-size:
        22px 22px;
    }

    #diagram-content {

      position: relative;

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .geometry-svg {

      width:
        min(
          100%,
          340px
        );

      height: auto;
    }

    .question-card {

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 24px;

      text-align: center;
    }

    .question-type {

      display:
        inline-block;

      align-self: center;

      margin-bottom: 15px;

      padding:
        6px 11px;

      border-radius:
        999px;

      background:
        var(--sky);

      color:
        var(--teal-dark);

      font-size: 13px;

      font-weight: 900;
    }

    .question-label {

      color:
        var(--muted);

      font-size: 15px;

      font-weight: 800;

      line-height: 1.7;
    }

    .question-content {

      margin-top: 13px;

      color:
        var(--navy-dark);

      font-size:
        clamp(
          24px,
          4vw,
          34px
        );

      font-weight: 900;

      line-height: 1.6;
    }

    .formula-hint {

      margin-top: 18px;

      padding: 13px;

      border:
        1px dashed
        #a9ceca;

      border-radius: 14px;

      background:
        #f3fbfa;

      color:
        #466066;

      font-size: 15px;

      font-weight: 800;
    }

    /*
    ==================================================
    答案
    ==================================================
    */

    .answer-panel {

      margin-top: 18px;

      padding: 20px;

      border:
        1px solid
        #dbe8eb;

      border-radius: 20px;

      background:
        #f8fbfc;
    }

    .answer-title {

      margin-bottom: 11px;

      color:
        var(--navy);

      text-align: center;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 13px;

      color:
        var(--muted);

      text-align: center;

      font-size: 14px;

      line-height: 1.6;
    }

    .number-answer {

      display: flex;

      justify-content: center;
    }

    .number-answer input {

      width:
        min(
          260px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #b8d1d4;

      border-radius: 13px;

      background: white;

      color:
        var(--navy);

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .number-answer input:focus {

      border-color:
        var(--teal);

      box-shadow:
        0 0 0 4px
        rgba(
          20,
          155,
          146,
          .12
        );
    }

    /*
    ==================================================
    選擇題
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      max-width: 680px;

      margin:
        0 auto;
    }

    .choice-button {

      min-height: 58px;

      padding: 12px;

      border:
        2px solid
        #b8d1d4;

      border-radius: 13px;

      background: white;

      color:
        var(--navy);

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--teal);

      background:
        #e5f8f6;

      color:
        var(--teal-dark);
    }

    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      max-width: 720px;

      min-height: 58px;

      display: flex;

      justify-content: center;

      align-items: center;

      margin:
        14px auto 0;

      padding: 12px;

      border:
        2px solid
        #bfe7e4;

      border-radius: 14px;

      background:
        #eaf9f7;

      color:
        #3c5660;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    /*
    ==================================================
    按鈕
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 17px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 138px;

      padding:
        12px 19px;

      border: 0;

      border-radius: 13px;

      color: white;

      background:
        var(--navy);

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--navy-dark);
    }

    .game-button.primary {

      background:
        var(--teal);

      box-shadow:
        0 5px 0
        var(--teal-dark);
    }

    .game-button.restart {

      background:
        var(--blue);

      box-shadow:
        0 5px 0
        var(--blue-dark);
    }

    .game-button.secondary {

      background:
        #64748b;

      box-shadow:
        0 5px 0
        #475569;
    }

    .game-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    /*
    ==================================================
    回饋
    ==================================================
    */

    .feedback {

      min-height: 45px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    .feedback.correct {

      color:
        var(--success);
    }

    .feedback.wrong {

      color:
        var(--danger);
    }

    .feedback.warning {

      color:
        var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 13px;

      padding: 18px;

      border-radius: 16px;

      background:
        #edf8f8;

      color:
        #334155;

      line-height: 1.9;
    }

    .explanation-step {

      margin:
        8px 0;
    }

    /*
    ==================================================
    Root display
    ==================================================
    */

    .simple-radical {

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      white-space: nowrap;
    }

    /*
    ==================================================
    RWD
    ==================================================
    */

    @media(
      max-width:
        780px
    ) {

      body {

        padding: 8px;
      }

      .screen {

        padding:
          18px 12px;
      }

      .mode-grid {

        grid-template-columns:
          1fr;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {

        grid-column:
          1 / -1;
      }

      .question-stage {

        grid-template-columns:
          1fr;
      }

      .diagram-card {

        min-height: 260px;
      }

      .question-card {

        min-height: 235px;
      }

      .choice-grid {

        grid-template-columns:
          1fr;
      }

    }

  </style>

</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-shell">

    <header class="hero">

      <div class="hero-icon">
        📐
      </div>

      <h1 class="game-title">
        畢氏定理大挑戰
      </h1>

      <p class="game-subtitle">
        從直角三角形開始，練習第三邊、根式邊長、生活應用與兩點間距離。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          a²＋b²＝c²
        </span>

        <span class="concept-chip">
          直角三角形
        </span>

        <span class="concept-chip">
          最簡根式
        </span>

        <span class="concept-chip">
          圖形應用
        </span>

        <span class="concept-chip">
          座標距離
        </span>

      </div>

    </header>


    <!-- ==================================================
         模式
    ================================================== -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-intro">

        <h2>
          選擇挑戰模式
        </h2>

        <p>
          每次進入模式都會重新產生該模式的題目。
        </p>

      </div>


      <div class="mode-grid">


        <button
          class="mode-card mode-one"
          type="button"
          data-mode="basic"
        >

          <div class="mode-top">

            <div class="mode-icon">
              📐
            </div>

            <div>

              <div class="mode-number">
                MODE 01
              </div>

              <h3>
                畢氏定理基礎挑戰
              </h3>

            </div>

          </div>

          <p>
            求直角三角形的第三邊，並判斷三個邊長是否能構成直角三角形。
          </p>

          <div class="mode-example">
            整數與最簡根式答案都可能出現。
          </div>

        </button>


        <button
          class="mode-card mode-two"
          type="button"
          data-mode="radical"
        >

          <div class="mode-top">

            <div class="mode-icon">
              🌱
            </div>

            <div>

              <div class="mode-number">
                MODE 02
              </div>

              <h3>
                根式邊長挑戰
              </h3>

            </div>

          </div>

          <p>
            著重畢氏定理計算後，將平方根化成最簡根式。
          </p>

          <div class="mode-example">
            例如：√117＝3√13。
          </div>

        </button>


        <button
          class="mode-card mode-three"
          type="button"
          data-mode="application"
        >

          <div class="mode-top">

            <div class="mode-icon">
              🏠
            </div>

            <div>

              <div class="mode-number">
                MODE 03
              </div>

              <h3>
                生活中的畢氏定理
              </h3>

            </div>

          </div>

          <p>
            長方形對角線、梯子靠牆、旗杆與幾何應用。
          </p>

          <div class="mode-example">
            從情境中找出直角三角形。
          </div>

        </button>


        <button
          class="mode-card mode-four"
          type="button"
          data-mode="distance"
        >

          <div class="mode-top">

            <div class="mode-icon">
              📍
            </div>

            <div>

              <div class="mode-number">
                MODE 04
              </div>

              <h3>
                座標距離挑戰
              </h3>

            </div>

          </div>

          <p>
            利用坐標差建立直角三角形，計算兩點間的距離。
          </p>

          <div class="mode-example">
            答案也可能是最簡根式。
          </div>

        </button>

      </div>

    </section>


    <!-- ==================================================
         Quiz
    ================================================== -->

    <section
      id="quiz-screen"
      class="screen hidden"
    >

      <div class="quiz-topbar">

        <div class="status-box">

          模式

          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          進度

          <span
            id="question-number"
            class="status-value"
          >
            1 / 10
          </span>

        </div>


        <div class="status-box">

          答對

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


/*
==================================================
根式化簡
==================================================
*/

function simplifyRoot(
  n
) {

  const exact =
    Math.sqrt(
      n
    );


  if (
    Number.isInteger(
      exact
    )
  ) {

    return {

      type:
        "number",

      value:
        exact
    };
  }


  let outside =
    1;


  let inside =
    n;


  for (
    let i =
      Math.floor(
        Math.sqrt(
          n
        )
      );

    i >=
    2;

    i--
  ) {

    if (
      n %
      (
        i *
        i
      ) ===
      0
    ) {

      outside =
        i;


      inside =
        n /
        (
          i *
          i
        );


      break;
    }
  }


  return {

    type:
      "radical",

    coefficient:
      outside,

    radicand:
      inside
  };
}


function answerText(
  question
) {

  if (
    question.answerType ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.answerType ===
    "radical"
  ) {

    const c =
      question.coefficient;


    const r =
      question.radicand;


    return `${c === 1 ? "" : c}√${r}`;
  }


  return question.answer ===
    "yes"
      ? "是"
      : "不是";
}

function makeSideQuestion(
  forceRadical =
    false
) {

  let a;
  let b;
  let result;


  do {

    a =
      rand(
        3,
        12
      );


    b =
      rand(
        3,
        12
      );


    result =
      simplifyRoot(
        a * a +
        b * b
      );

  } while (
    forceRadical &&
    result.type !==
      "radical"
  );


  return {

    kind:
      "side",

    diagram:
      triangleSVG(
        a,
        b,
        "c"
      ),

    typeLabel:
      "求第三邊",

    label:
      "已知下圖是一個直角三角形",

    html:
      `兩股長為 ${a}、${b}，求斜邊 c。`,

    hint:
      "💡 使用 a²＋b²＝c²",

    answerType:
      result.type,

    answer:
      result.value,

    coefficient:
      result.coefficient,

    radicand:
      result.radicand,

    explanation:
      [

        `因為 c 是斜邊，所以使用 a²＋b²＝c²。`,

        `${a}²＋${b}²＝c²。`,

        `${a * a}＋${b * b}＝c²。`,

        `c²＝${a * a + b * b}。`,

        result.type ===
        "number"

          ? `所以 c＝${result.value}。`

          : `所以 c＝√${
              a * a +
              b * b
            }＝${
              result.coefficient ===
              1
                ? ""
                : result.coefficient
            }√${result.radicand}。`
      ]
  };
}

/*

function createQuestions(
  selectedMode
) {

  const result =
    [];


  if (
    selectedMode ===
    "basic"
  ) {

    for (
      let i = 0;
      i < 6;
      i++
    ) {

      result.push(
        makeSideQuestion(
          false
        )
      );
    }


    for (
      let i = 0;
      i < 4;
      i++
    ) {

      result.push(
        makeJudgeQuestion()
      );
    }


    return shuffle(
      result
    );
  }


  if (
    selectedMode ===
    "radical"
  ) {

    for (
      let i = 0;
      i < 10;
      i++
    ) {

      result.push(
        makeSideQuestion(
          true
        )
      );
    }


    return shuffle(
      result
    );
  }


  if (
    selectedMode ===
    "application"
  ) {

    for (
      let i = 0;
      i < 5;
      i++
    ) {

      result.push(
        makeRectangleQuestion()
      );
    }


    for (
      let i = 0;
      i < 5;
      i++
    ) {

      result.push(
        makeLadderQuestion()
      );
    }


    return shuffle(
      result
    );
  }


  for (
    let i = 0;
    i < 10;
    i++
  ) {

    result.push(
      makeDistanceQuestion()
    );
  }


  return shuffle(
    result
  );
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer() {

  if (
    timerId
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }
}


function startTimer() {

  stopTimer();


  startTime =
    Date.now();


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        const seconds =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              seconds
            );

      },
      500
    );
}

    null;


  const panel =
    $("answer-panel");


  /*
  整數
  */

  if (
    question.answerType ===
    "number"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫答案

      </div>

      <div class="number-answer">

        <input
          id="number-answer"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="輸入整數答案"
        >

      </div>

      <div
        id="answer-preview"
        class="answer-preview"
      >

        目前尚未完成答案。

      </div>
    `;


    const input =
      $("number-answer");


    input
      .addEventListener(
        "input",
        () => {

          const value =
            input
              .value
              .trim();


          $("answer-preview")
            .textContent =

              value

                ? `目前答案：${value}`

                : "目前尚未完成答案。";
        }
      );


    setTimeout(
      () =>
        input.focus(),
      0
    );


    return;
  }


  /*
  根式
  */

  if (
    question.answerType ===
    "radical"
  ) {

    panel.innerHTML = `

      <div class="answer-title">

        請填寫最簡根式

      </div>

      <p class="answer-help">

        根號外係數為 1 時可以保留 1。<br>

        若根號內還可以化簡，
        系統只會提醒，不會自動替你化簡。

      </p>

      <div
        id="radical-answer-mount"
      ></div>
    `;


    if (
      window.RadicalInput
    ) {

      radicalInput =
        new window.RadicalInput(
          {

            mountId:
              "radical-answer-mount",

            requireSimplifiedRadical:
              true,

            theme: {

              primary:
                "#149b92",

              light:
                "#eaf9f7",

              border:
                "#9fd9d5"
            }
          }
        );


      setTimeout(
        () =>
          radicalInput
            ?.focus(),
        0
      );

    } else {

      panel.innerHTML += `

        <div class="feedback warning">

          radical-input.js 尚未載入。

        </div>
      `;
    }


    return;
  }


  /*
  選擇題
  */

  panel.innerHTML = `

    <div class="answer-title">

      請選擇正確答案

    </div>

    <div class="choice-grid">

      ${
        question.choices
          .map(
            choice => `

              <button
                type="button"
                class="choice-button"
                data-choice="${choice.value}"
              >

                ${choice.text}

              </button>
            `
          )
          .join("")
      }

    </div>

    <div
      id="answer-preview"
      class="answer-preview"
    >

      尚未選擇答案。

    </div>
  `;


  panel
    .querySelectorAll(
      ".choice-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            selectedChoice =
              button.dataset.choice;


            panel
              .querySelectorAll(
                ".choice-button"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "selected"
                  )
              );


            button
              .classList
              .add(
                "selected"
              );


            $("answer-preview")
              .textContent =
                `目前選擇：${
                  button.textContent.trim()
                }`;
          }
        );
      }
    );
}


/*
==================================================
顯示題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  radicalInput =
    null;


  selectedChoice =
    null;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${questions.length}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        questions.length *
        100
      }%`;


  $("diagram-content")
    .innerHTML =
      question.diagram;


  $("question-type")
    .textContent =
      question.typeLabel;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .textContent =
      question.html;


  $("formula-hint")
    .textContent =
      question.hint;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderAnswer(
    question
  );


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  if (
    question.answerType ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整的整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        )
    };
  }


  if (
    question.answerType ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請完成最簡根式答案。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value
    };
  }


  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇答案。"
    };
  }


  return {

    valid:
      true,

    value:
      selectedChoice
  };
}


/*
==================================================
判定
==================================================
*/

function isCorrectAnswer(
  question,
  answer
) {

  if (
    question.answerType ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.answerType ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
詳解
==================================================
*/

function explanationHTML(
  question
) {

  return question
    .explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>

            步驟 ${i + 1}｜

          </strong>

          ${step}

        </div>
      `
    )
    .join("");
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    isCorrectAnswer(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    try {

      (
        window.GameSound ||
        window.MathGameSound
      )
        ?.playCorrect
        ?.();

    } catch (
      error
    ) {}

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .textContent =
        `❌ 答案不正確。正確答案：${
          answerText(
            question
          )
        }`;


    try {

      (
        window.GameSound ||
        window.MathGameSound
      )
        ?.playWrong
        ?.();

    } catch (
      error
    ) {}
  }


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
        questions.length -
        1

        ? "重新選擇模式（Enter）"

        : "下一題（Enter）";
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  if (
    index >=
    questions.length -
    1
  ) {

    showStartScreen();


    return;
  }


  index++;


  displayQuestion();
}


/*
==================================================
開始新模式
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  /*
  ★ 關鍵修正：
  每次點選模式都重新建立題庫
  */

  questions =
    createQuestions(
      mode
    );


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  answered =
    false;


  selectedChoice =
    null;


  radicalInput =
    null;


  showQuizScreen();


  displayQuestion();


  startTimer();


  try {

    (
      window.GameSound ||
      window.MathGameSound
    )
      ?.playStart
      ?.();

  } catch (
    error
  ) {}
}


/*
==================================================
事件
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          startGame(
            button.dataset.mode
          );
        }
      );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("mode-button")
  .addEventListener(
    "click",
    showStartScreen
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
初始化計算紙
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    window
      .hideGameScratchpadButton
      ?.();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showStartScreen();

</script>

</body>

</html>
