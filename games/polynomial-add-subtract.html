<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    多項式加減大挑戰｜數學遊戲樂園
  </title>


  <!-- 共用 CSS -->

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=4"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary:
        #00897b;

      --primary-dark:
        #00695c;

      --primary-light:
        #e0f2f1;

      --primary-border:
        #80cbc4;

      --text:
        #1f2937;

      --muted:
        #64748b;

      --success:
        #15803d;

      --danger:
        #b91c1c;

      --warning:
        #b45309;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e8f7f5,
          #fff8e8
        );
    }


    button,
    input {

      font-family:
        inherit;
    }


    .hidden {

      display:
        none !important;
    }


    .page-shell {

      width:
        min(
          100%,
          960px
        );

      margin:
        0 auto;
    }


    #commonHeaderMount {

      margin-bottom:
        14px;
    }


    .game-card {

      overflow:
        hidden;

      border:
        1px solid
        #d8eeeb;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }


    /*
    ==================================================
    標題
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align:
        center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );
    }


    .game-title {

      margin:
        0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height:
        1.7;
    }


    .concept-strip {

      display:
        flex;

      justify-content:
        center;

      gap:
        8px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }


    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        14px;

      font-weight:
        900;
    }


    .screen {

      padding:
        22px;
    }


    /*
    ==================================================
    模式
    ==================================================
    */

    .mode-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap:
        16px;
    }


    .mode-card {

      min-height:
        190px;

      padding:
        21px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(
          -3px
        );

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom:
        10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        12px;

      font-weight:
        900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size:
        21px;
    }


    .mode-card p {

      margin:
        0;

      color:
        var(--muted);

      line-height:
        1.7;
    }


    .mode-example {

      margin-top:
        10px;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        900;

      line-height:
        1.6;
    }


    /*
    ==================================================
    遊戲狀態
    ==================================================
    */

    .quiz-topbar {

      display:
        grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;

      margin-bottom:
        12px;
    }


    .status-box {

      min-height:
        64px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      padding:
        8px;

      border-radius:
        14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }


    .status-value {

      margin-top:
        3px;

      font-size:
        18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display:
        flex;

      justify-content:
        center;

      min-height:
        46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display:
        flex;

      justify-content:
        center;

      width:
        100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      top:
        auto !important;

      right:
        auto !important;

      bottom:
        auto !important;

      left:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;

      z-index:
        auto !important;
    }


    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height:
        10px;

      margin-bottom:
        16px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width:
        0%;

      height:
        100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #4db6ac
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        white;

      text-align:
        center;
    }


    .question-label {

      margin-bottom:
        10px;

      color:
        var(--muted);

      font-weight:
        900;
    }


    .question-content {

      min-height:
        120px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      overflow-x:
        auto;

      color:
        #0f172a;

      font-size:
        clamp(
          23px,
          5vw,
          39px
        );

      font-weight:
        900;

      line-height:
        1.9;
    }


    .question-content sup,
    .explanation sup,
    .review-question sup,
    .review-answer sup {

      position:
        relative;

      top:
        -.55em;

      font-size:
        .55em;

      vertical-align:
        baseline;
    }


    /*
    ==================================================
    題目分數
    ==================================================
    */

    .math-fraction,
    .expression-input__inline-fraction {

      display:
        inline-flex;

      flex-direction:
        column;

      align-items:
        center;

      justify-content:
        center;

      margin:
        0 4px;

      vertical-align:
        middle;

      line-height:
        1.1;
    }


    .expression-input__inline-fraction
    > span:first-child {

      padding:
        0 4px 2px;

      border-bottom:
        2px solid
        currentColor;
    }


    .expression-input__inline-fraction
    > span:last-child {

      padding-top:
        2px;
    }


    /*
    ==================================================
    答案
    ==================================================
    */

    .answer-panel {

      margin-top:
        16px;

      padding:
        18px;

      border-radius:
        18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom:
        10px;

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align:
        center;

      font-size:
        14px;

      font-weight:
        800;

      line-height:
        1.6;
    }


    .polynomial-answer-shell {

      width:
        min(
          100%,
          820px
        );

      margin:
        0 auto;
    }


    /*
    ==================================================
    選擇題
    ==================================================
    */

    .choice-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;
    }


    .choice-button {

      min-height:
        66px;

      padding:
        11px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        13px;

      background:
        white;

      color:
        #263238;

      font-size:
        16px;

      font-weight:
        900;

      line-height:
        1.65;

      cursor:
        pointer;
    }


    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }


    /*
    ==================================================
    按鈕
    ==================================================
    */

    .button-row {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }


    .game-button {

      min-width:
        132px;

      padding:
        12px 20px;

      border:
        none;

      border-radius:
        12px;

      background:
        var(--primary);

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        #7e57c2;

      box-shadow:
        0 5px 0
        #5e35b1;
    }


    .game-button:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;
    }


    /*
    ==================================================
    回饋
    ==================================================
    */

    .feedback {

      min-height:
        48px;

      margin-top:
        14px;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;

      line-height:
        1.65;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top:
        12px;

      padding:
        16px;

      border-radius:
        14px;

      background:
        #eaf7f5;

      color:
        #334155;

      line-height:
        1.95;
    }


    .explanation-step {

      margin:
        7px 0;
    }


    /*
    ==================================================
    結果
    ==================================================
    */

    .result-panel {

      text-align:
        center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size:
        56px;

      font-weight:
        900;
    }


    .result-stars {

      margin-bottom:
        10px;

      font-size:
        31px;
    }


    .result-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap:
        12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding:
        16px 10px;

      border-radius:
        16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight:
        900;
    }


    .save-status {

      min-height:
        28px;

      margin:
        14px 0 0;

      font-weight:
        900;
    }


    /*
    ==================================================
    錯題
    ==================================================
    */

    .review-list {

      display:
        grid;

      gap:
        14px;
    }


    .review-card {

      padding:
        18px;

      border:
        1px solid
        #e2e8f0;

      border-radius:
        16px;

      background:
        white;
    }


    .review-title {

      color:
        var(--danger);

      font-weight:
        900;
    }


    .review-question {

      margin:
        8px 0;

      font-size:
        20px;

      font-weight:
        900;

      line-height:
        1.8;
    }


    .review-answer {

      color:
        #475569;

      line-height:
        1.9;
    }


    /*
    ==================================================
    手機
    ==================================================
    */

    @media (
      max-width:
        760px
    ) {

      body {

        padding:
          8px;
      }


      .screen {

        padding:
          18px 12px;
      }


      .mode-grid {

        grid-template-columns:
          1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .timer-box {

        grid-column:
          1 /
          -1;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .choice-grid {

        grid-template-columns:
          1fr;
      }
    }

  </style>

</head>


<body>


  <div class="page-shell">


    <div id="commonHeaderMount"></div>


    <main class="game-card">


      <!--
      ==================================================
      標題
      ==================================================
      -->

      <header class="game-header">

        <h1 class="game-title">
          ➕ 多項式加減大挑戰
        </h1>

        <p class="game-subtitle">
          從同類項開始，逐步挑戰多項式加減、去括號、綜合計算與分數係數。
        </p>

        <div class="concept-strip">

          <span class="concept-chip">
            同類項
          </span>

          <span class="concept-chip">
            多項式加法
          </span>

          <span class="concept-chip">
            多項式減法
          </span>

          <span class="concept-chip">
            去括號
          </span>

          <span class="concept-chip">
            分數係數
          </span>

        </div>

      </header>


      <!--
      ==================================================
      模式
      ==================================================
      -->

      <section
        id="start-screen"
        class="screen"
      >

        <div class="mode-grid">


          <button
            type="button"
            class="mode-card"
            data-mode="likeTerms"
          >

            <span class="mode-tag">
              基礎
            </span>

            <h2>
              模式一｜同類項加減
            </h2>

            <p>
              辨認同類項，再合併相同次方的係數。
            </p>

            <div class="mode-example">
              例如：3x²＋5x－x²＋2x
            </div>

          </button>


          <button
            type="button"
            class="mode-card"
            data-mode="addSubtract"
          >

            <span class="mode-tag">
              標準
            </span>

            <h2>
              模式二｜多項式加減法
            </h2>

            <p>
              多項式加法與減法混合，練習去括號、變號與缺項。
            </p>

            <div class="mode-example">
              括號前是減號時，每一項都要變號。
            </div>

          </button>


          <button
            type="button"
            class="mode-card"
            data-mode="mixed"
          >

            <span class="mode-tag">
              綜合
            </span>

            <h2>
              模式三｜多項式綜合挑戰
            </h2>

            <p>
              同類項、兩個或三個多項式、亂序與判讀題全部混合。
            </p>

            <div class="mode-example">
              需要自己判斷正確的處理方式。
            </div>

          </button>


          <button
            type="button"
            class="mode-card"
            data-mode="advanced"
          >

            <span class="mode-tag">
              進階
            </span>

            <h2>
              模式四｜進階綜合挑戰
            </h2>

            <p>
              加入三次項、多個括號、前置負號與真正的分數係數。
            </p>

            <div class="mode-example">
              分數係數從題目到答案都使用最簡分數。
            </div>

          </button>


        </div>

      </section>


      <!--
      ==================================================
      遊戲
      ==================================================
      -->

      <section
        id="quiz-screen"
        class="screen hidden"
      >


        <div class="quiz-topbar">


          <div class="status-box">

            模式

            <span
              id="mode-name"
              class="status-value"
            >
              —
            </span>

          </div>


          <div class="status-box">

            進度

            <span
              id="question-number"
              class="status-value"
            >
              1 / 10
            </span>

          </div>


          <div class="status-box">

            答對

            <span
              id="correct-count"
              class="status-value"
            >
              0
            </span>

          </div>


          <div class="status-box">

            最高連擊

            <span
              id="combo-count"
              class="status-value"
            >
              0
            </span>

          </div>


          <!-- 新增即時計時 -->

          <div class="status-box timer-box">

            測驗時間

            <span
              id="timer-display"
              class="status-value"
            >
              00:00
            </span>

          </div>


        </div>


        <!-- 計算紙 -->

        <div class="scratchpad-row">

          <div
            id="scratchpad-mobile-button"
          ></div>

        </div>


        <div class="progress-shell">

          <div
            id="progress-bar"
            class="progress-bar"
          ></div>

        </div>


        <div class="question-card">

          <div
            id="question-label"
            class="question-label"
          ></div>

          <div
            id="question-content"
            class="question-content"
          ></div>

        </div>


        <div
          id="answer-panel"
          class="answer-panel"
        ></div>


        <div class="button-row">

          <button
            id="submit-button"
            class="game-button"
            type="button"
          >
            提交答案（Enter）
          </button>


          <button
            id="next-button"
            class="game-button hidden"
            type="button"
          >
            下一題（Enter）
          </button>


          <!-- 新增：模式不變重新測驗 -->

          <button
            id="restart-button"
            class="game-button restart"
            type="button"
          >
            🔄 重新測驗
          </button>


          <button
            id="mode-button"
            class="game-button secondary"
            type="button"
          >
            選擇模式
          </button>

        </div>


        <div
          id="feedback"
          class="feedback"
        ></div>


        <div
          id="explanation"
          class="explanation hidden"
        ></div>

      </section>


      <!--
      ==================================================
      結果
      ==================================================
      -->

      <section
        id="result-screen"
        class="screen hidden result-panel"
      >

        <h2>
          🎉 挑戰完成
        </h2>


        <div
          id="final-score"
          class="result-score"
        >
          0 分
        </div>


        <div
          id="final-stars"
          class="result-stars"
        >
          ★★★☆☆
        </div>


        <p id="final-comment"></p>


        <div class="result-grid">

          <div class="result-stat">

            答對
            <br>

            <span id="final-correct">
              0
            </span>

            題

          </div>


          <div class="result-stat">

            答錯
            <br>

            <span id="final-wrong">
              0
            </span>

            題

          </div>


          <div class="result-stat">

            最高連擊
            <br>

            <span id="final-combo">
              0
            </span>

          </div>


          <div class="result-stat">

            測驗時間
            <br>

            <span id="final-time">
              00:00
            </span>

          </div>

        </div>


        <div
          id="save-status"
          class="save-status"
        ></div>


        <div class="button-row">

          <button
            id="again-button"
            class="game-button restart"
            type="button"
          >
            🔄 重新測驗
          </button>


          <button
            id="review-button"
            class="game-button orange"
            type="button"
          >
            錯題回顧
          </button>


          <button
            id="result-mode-button"
            class="game-button secondary"
            type="button"
          >
            選擇模式
          </button>

        </div>

      </section>


      <!--
      ==================================================
      錯題回顧
      ==================================================

    /*

    function rand(
      min,
      max
    ) {

      return (
        Math.floor(
          Math.random() *
          (
            max -
            min +
            1
          )
        ) +
        min
      );
    }


    function nonZeroRand(
      min,
      max
    ) {

      let value =
        0;


      while (
        value ===
        0
      ) {

        value =
          rand(
            min,
            max
          );
      }


      return value;
    }


    function pick(
      array
    ) {

      return array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];
    }


    function shuffle(
      array
    ) {

      const result =
        [
          ...array
        ];


      for (
        let i =
          result.length -
          1;

        i >
        0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i +
              1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];
      }


      return result;
    }

          2,
          "0"

        `${String(
          remain
        ).padStart(

          "0"

    /*
    ==================================================
    共用 ExpressionInput Utils
    ==================================================
    */

    const U =
      () =>
        window.ExpressionInputUtils;


    function F(
      numerator,
      denominator =
        1
    ) {

      return U()
        .normalizeFraction(
          numerator,
          denominator
        );
    }


    /*
    ==================================================
    分數
    ==================================================
    */

    function randomFraction() {

      const denominators =
        [
          2,
          3,
          4,
          5,
          6
        ];


      while (
        true
      ) {

        const denominator =
          pick(
            denominators
          );


        let numerator =
          rand(
            1,
            denominator -
            1
          );


        if (
          U().gcd(
            numerator,
            denominator
          ) !==
          1
        ) {

          continue;
        }


        if (
          Math.random() <
          .5
        ) {

          numerator =
            -numerator;
        }


        return F(
          numerator,
          denominator
        );
      }
    }


    /*
    ==================================================
    多項式工具
    ==================================================
    */

    function normalize(
      terms
    ) {

      return U()
        .normalizePolynomialTermsAsFractions(
          terms
        );
    }


    function add(
      first,
      second
    ) {

      return normalize(
        [
          ...first,
          ...second
        ]
      );
    }


    function scale(
      terms,
      multiplier
    ) {

      return normalize(
        terms.map(
          (term) => ({

            exponent:
              term.exponent,

            coefficient:
              U().multiplyFraction(
                U().coefficientToFraction(
                  term.coefficient
                ),
                multiplier
              )
          })
        )
      );
    }


    function subtract(
      first,
      second
    ) {

      return add(
        first,
        scale(
          second,
          -1
        )
      );
    }


    function combine(
      items
    ) {

      let result =
        [];


      items.forEach(
        (item) => {

          result =
            add(
              result,
              scale(
                item.terms,
                item.sign
              )
            );
        }
      );


      return result;
    }


    /*
    ==================================================
    整數多項式產生
    ==================================================
    */

    function randomIntegerPolynomial(
      options =
        {}
    ) {

      const maxDegree =
        options.maxDegree ??
        2;


      const minTerms =
        options.minTerms ??
        2;


      const maxTerms =
        Math.min(
          options.maxTerms ??
            (
              maxDegree +
              1
            ),
          maxDegree +
            1
        );


      const min =
        options.min ??
        -8;


      const max =
        options.max ??
        8;


      const count =
        rand(
          minTerms,
          maxTerms
        );


      const powers =
        shuffle(
          Array.from(
            {
              length:
                maxDegree +
                1
            },
            (
              _,
              exponent
            ) =>
              exponent
          )
        )
          .slice(
            0,
            count
          );


      return normalize(
        powers.map(
          (exponent) => ({

            exponent,

            coefficient:
              nonZeroRand(
                min,
                max
              )
          })
        )
      );
    }


    /*
    ==================================================
    分數多項式
    ==================================================
    */

    function randomFractionPolynomial() {

      const powers =
        shuffle(
          [
            2,
            1,
            0
          ]
        )
          .slice(
            0,
            rand(
              2,
              3
            )
          );


      return normalize(
        powers.map(
          (exponent) => ({

            exponent,

            coefficient:
              randomFraction()
          })
        )
      );
    }


    /*
    ==================================================
    顯示
    ==================================================
    */

    function polynomialHTML(
      terms
    ) {

      return U()
        .polynomialTermsToHtml(
          terms,
          "x",
          {
            omitCoefficientOne:
              true
          }
        );
    }


    function bracket(
      terms
    ) {

      return (
        `(${polynomialHTML(
          terms
        )})`
      );
    }


    /*
    ==================================================
    題目物件
    ==================================================
    */

    function polynomialQuestion(
      html,
      answer,
      explanation,
      label,
      fraction =
        false
    ) {

      return {

        type:
          "polynomial",

        html,

        answer:
          normalize(
            answer
          ),

        explanation,

        label,

        fraction
      };
    }


    function choiceQuestion(
      html,
      choices,
      answer,
      explanation,
      label
    ) {

      return {

        type:
          "choice",

        html,

        choices,

        answer,

        explanation,

        label
      };
    }


    /*
    ==================================================
    模式一｜同類項
    ==================================================
    */

    function makeLikeQuestion() {

      while (
        true
      ) {

        const raw =
          [];


        const powers =
          shuffle(
            [
              2,
              1,
              0
            ]
          )
            .slice(
              0,
              rand(
                1,
                3
              )
            );


        powers.forEach(
          (exponent) => {

            raw.push(
              {

                exponent,

                coefficient:
                  nonZeroRand(
                    -8,
                    8
                  )
              },

              {

                exponent,

                coefficient:
                  nonZeroRand(
                    -8,
                    8
                  )
              }
            );
          }
        );


        const answer =
          normalize(
            raw
          );


        if (
          !answer.length
        ) {

          continue;
        }


        return polynomialQuestion(

          polynomialHTML(
            raw
          ),

          answer,

          [

            "先找出字母與次方相同的同類項。",

            "同類項的字母與次方保持不變，只計算係數。",

            `整理後：
             ${polynomialHTML(
               answer
             )}`
          ],

          "請合併同類項"
        );
      }
    }


    function makeMode1() {

      return Array.from(
        {
          length:
            TOTAL_QUESTIONS
        },
        () =>
          makeLikeQuestion()
      );
    }


    /*
    ==================================================
    模式二｜多項式加減
    ==================================================
    */

    function makeTwoPolynomial(
      operation,
      missing =
        false
    ) {

      while (
        true
      ) {

        const first =
          randomIntegerPolynomial(
            {
              maxDegree:
                2,

              minTerms:
                missing
                  ? 2
                  : 3,

              maxTerms:
                3
            }
          );


        const second =
          randomIntegerPolynomial(
            {
              maxDegree:
                2,

              minTerms:
                missing
                  ? 1
                  : 3,

              maxTerms:
                missing
                  ? 2
                  : 3
            }
          );


        const answer =
          operation ===
          "add"
            ? add(
                first,
                second
              )
            : subtract(
                first,
                second
              );


        if (
          !answer.length
        ) {

          continue;
        }


        return polynomialQuestion(

          `${bracket(first)}
           ${
             operation ===
             "add"
               ? "＋"
               : "－"
           }
           ${bracket(second)}`,

          answer,

          operation ===
          "add"
            ? [

                "括號前是加號，因此去括號後每一項的符號不變。",

                "再將同類項的係數相加。",

                `答案：
                 ${polynomialHTML(
                   answer
                 )}`
              ]

            : [

                "第二個括號前是減號，因此第二個括號內每一項都要變號。",

                "去括號後，再將同類項的係數相加減。",

                `答案：
                 ${polynomialHTML(
                   answer
                 )}`
              ],

          operation ===
          "add"
            ? "請計算多項式的和"
            : "請計算多項式的差"
        );
      }
    }


    function makeMode2() {

      const schedule =
        shuffle(
          [
            "add",
            "add",
            "add",
            "add",

            "subtract",
            "subtract",
            "subtract",
            "subtract",

            "missingAdd",

            "missingSubtract"
          ]
        );


      return schedule.map(
        (type) => {

          if (
            type ===
            "add"
          ) {

            return makeTwoPolynomial(
              "add"
            );
          }


          if (
            type ===
            "subtract"
          ) {

            return makeTwoPolynomial(
              "subtract"
            );
          }


          if (
            type ===
            "missingAdd"
          ) {

            return makeTwoPolynomial(
              "add",
              true
            );
          }


          return makeTwoPolynomial(
            "subtract",
            true
          );
        }
      );
    }


    /*
    ==================================================
    模式三｜三個多項式
    ==================================================
    */

    function makeTriple() {

      while (
        true
      ) {

        const first =
          randomIntegerPolynomial();


        const second =
          randomIntegerPolynomial();


        const third =
          randomIntegerPolynomial();


        const sign2 =
          pick(
            [
              1,
              -1
            ]
          );


        const sign3 =
          pick(
            [
              1,
              -1
            ]
          );


        const answer =
          combine(
            [
              {

                sign:
                  1,

                terms:
                  first
              },

              {

                sign:
                  sign2,

                terms:
                  second
              },

              {

                sign:
                  sign3,

                terms:
                  third
              }
            ]
          );


        if (
          !answer.length
        ) {

          continue;
        }


        return polynomialQuestion(

          `${bracket(first)}
           ${
             sign2 ===
             1
               ? "＋"
               : "－"
           }
           ${bracket(second)}
           ${
             sign3 ===
             1
               ? "＋"
               : "－"
           }
           ${bracket(third)}`,

          answer,

          [

            "依序處理每一個括號前的正負號。",

            "再按照 x²、x、常數項分類。",

            `最後：
             ${polynomialHTML(
               answer
             )}`
          ],

          "請完成三個多項式的綜合加減"
        );
      }
    }


    /*
    ==================================================
    判讀題
    ==================================================
    */

    function makeChoice() {

      while (
        true
      ) {

        const first =
          randomIntegerPolynomial(
            {
              maxDegree:
                2,

              minTerms:
                3,

              maxTerms:
                3
            }
          );


        const second =
          randomIntegerPolynomial(
            {
              maxDegree:
                2,

              minTerms:
                3,

              maxTerms:
                3
            }
          );


        const correctAnswer =
          subtract(
            first,
            second
          );


        const wrong1 =
          add(
            first,
            second
          );


        /*
        常見錯誤：
        只改第一項。
        */

        const secondWrong2 =
          second.map(
            (
              term,
              index
            ) => ({

              exponent:
                term.exponent,

              coefficient:
                index ===
                  0
                  ? U().multiplyFraction(
                      term.coefficient,
                      -1
                    )
                  : term.coefficient
            })
          );


        const wrong2 =
          add(
            first,
            secondWrong2
          );


        /*
        常見錯誤：
        只改最後一項。
        */

        const secondWrong3 =
          second.map(
            (
              term,
              index
            ) => ({

              exponent:
                term.exponent,

              coefficient:
                index ===
                  second.length -
                  1
                  ? U().multiplyFraction(
                      term.coefficient,
                      -1
                    )
                  : term.coefficient
            })
          );


        const wrong3 =
          add(
            first,
            secondWrong3
          );


        const texts =
          [
            polynomialHTML(
              correctAnswer
            ),

            polynomialHTML(
              wrong1
            ),

            polynomialHTML(
              wrong2
            ),

            polynomialHTML(
              wrong3
            )
          ];


        if (
          new Set(
            texts
          ).size !==
          4
        ) {

          continue;
        }


        return choiceQuestion(

          `${bracket(first)}
           －
           ${bracket(second)}
           ＝？`,

          shuffle(
            [
              {
                value:
                  "correct",

                text:
                  texts[0]
              },

              {
                value:
                  "wrong1",

                text:
                  texts[1]
              },

              {
                value:
                  "wrong2",

                text:
                  texts[2]
              },

              {
                value:
                  "wrong3",

                text:
                  texts[3]
              }
            ]
          ),

          "correct",

          [

            "第二個括號前是減號，所以括號內的每一項都必須變號。",

            `正確答案：
             ${texts[0]}`
          ],

          "請選出正確的計算結果"
        );
      }
    }


    /*
    ==================================================
    模式三
    ==================================================
    */

    function makeMode3() {

      return shuffle(
        [
          makeLikeQuestion(),

          makeLikeQuestion(),

          makeTwoPolynomial(
            "add"
          ),

          makeTwoPolynomial(
            "add"
          ),

          makeTwoPolynomial(
            "subtract"
          ),

          makeTwoPolynomial(
            "subtract"
          ),

          makeTriple(),

          makeTriple(),

          makeTriple(),

          makeChoice()
        ]
      );
    }

        const third =

    /*

    function makeLeadingNegative() {

        const third =
          randomIntegerPolynomial(
            {
              maxDegree:
                3,

              minTerms:

                4
            }
          );


        const answer =
          combine(
            [
              {
                sign:
                  -1,

                terms:
                  first
              },

              {
                sign:
                  1,

                terms:
                  second
              },

              {
                sign:
                  -1,

                terms:
                  third
              }
            ]
          );


        if (
          !answer.length
        ) {

          continue;
        }


        return polynomialQuestion(

          `－${bracket(first)}
           ＋
           ${bracket(second)}
           －
           ${bracket(third)}`,

          answer,

          [

            "第一個括號前有負號，所以第一個括號內每一項全部變號。",

            "第三個括號前也是減號，所以第三個括號內每一項也全部變號。",

            `最後：
             ${polynomialHTML(
               answer
             )}`
          ],

          "請正確處理括號前的負號"
        );
      }
    }


    /*
    ==================================================
    模式四｜真正分數係數
    ==================================================
    */

    function makeFractionQuestion() {

      while (
        true
      ) {

        const first =
          randomFractionPolynomial();


        const second =
          randomFractionPolynomial();


        const operation =
          pick(
            [
              "add",
              "subtract"
            ]
          );


        const answer =
          operation ===
          "add"
            ? add(
                first,
                second
              )
            : subtract(
                first,
                second
              );


        if (
          !answer.length
        ) {

          continue;
        }


        /*
        確保最後至少有一項是真分數。
        */

        const hasFraction =
          answer.some(
            (term) =>
              term.coefficient.denominator !==
              1
          );


        if (
          !hasFraction
        ) {

          continue;
        }


        return polynomialQuestion(

          `${bracket(first)}
           ${
             operation ===
             "add"
               ? "＋"
               : "－"
           }
           ${bracket(second)}`,

          answer,

          [

            "先按照 x²、x、常數項找出同類項。",

            operation ===
            "subtract"
              ? "第二個括號前是減號，因此第二個多項式各項先全部變號。"
              : "括號前是加號，因此第二個多項式各項符號不變。",

            "分數係數先通分，再進行加減。",

            `最後化成最簡分數：
             ${polynomialHTML(
               answer
             )}`
          ],

          "請計算，分數係數最後要化成最簡分數",

          true
        );
      }
    }


    /*
    ==================================================
    模式四｜四個多項式
    ==================================================
    */

    function makeFour() {

      while (
        true
      ) {

        const items =
          [];


        for (
          let i =
            0;

          i <
          4;

          i++
        ) {

          items.push(
            {

              sign:
                i ===
                0
                  ? 1
                  : pick(
                      [
                        1,
                        -1
                      ]
                    ),

              terms:
                randomIntegerPolynomial(
                  {
                    maxDegree:
                      3,

                    minTerms:
                      2,

                    maxTerms:
                      3,

                    min:
                      -5,

                    max:
                      5
                  }
                )
            }
          );
        }


        const answer =
          combine(
            items
          );


        if (
          !answer.length
        ) {

          continue;
        }


        const html =
          items
            .map(
              (
                item,
                itemIndex
              ) => {

                if (
                  itemIndex ===
                  0
                ) {

                  return bracket(
                    item.terms
                  );
                }


                return (
                  `${
                    item.sign ===
                    1
                      ? "＋"
                      : "－"
                  }${bracket(
                    item.terms
                  )}`
                );
              }
            )
            .join(
              ""
            );


        return polynomialQuestion(

          html,

          answer,

          [

            "依序處理四個多項式前面的符號。",

            "再按照次方分類並合併同類項。",

            `最後：
             ${polynomialHTML(
               answer
             )}`
          ],

          "請完成四個多項式的綜合加減"
        );
      }
    }


    /*
    ==================================================
    模式四
    ==================================================
    */

    function makeMode4() {

      return shuffle(
        [

          makeAdvancedInteger(),

          makeAdvancedInteger(),

          makeLeadingNegative(),

          makeLeadingNegative(),

          makeFractionQuestion(),

          makeFractionQuestion(),

          makeFractionQuestion(),

          makeFour(),

          makeFour(),

          makeChoice()
        ]
      );
    }


    /*
    ==================================================
    建立題目
    ==================================================
    */

    function createQuestions() {

      if (
        mode ===
        "likeTerms"
      ) {

        return makeMode1();
      }


      if (
        mode ===
        "addSubtract"
      ) {

        return makeMode2();
      }


      if (
        mode ===
        "mixed"
      ) {

        return makeMode3();
      }


      return makeMode4();
    }

    /*
    ==================================================
    讀取答案
    ==================================================
    */

    function readAnswer(
      question
    ) {

      if (
        question.type ===
        "polynomial"
      ) {

        if (
          !answerInput
        ) {

          return {

            valid:
              false,

            message:
              "多項式輸入器尚未準備完成。"
          };
        }


        const result =
          answerInput.validate();


        if (
          !result.valid
        ) {

          return {

            valid:
              false,

            message:
              "請將多項式答案輸入完整。"
          };
        }


        return {

          valid:
            true,

          value:
            result.value.fractionTerms,

          display:
            result.value.html
        };
      }


      if (
        !selectedChoice
      ) {

        return {

          valid:
            false,

          message:
            "請先選擇一個答案。"
        };
      }


      const choice =
        question.choices.find(
          (item) =>
            item.value ===
            selectedChoice
        );


      return {

        valid:
          true,

        value:
          selectedChoice,

        display:
          choice?.text ||
          selectedChoice
      };
    }


    /*
    ==================================================
    判定
    ==================================================
    */

    function checkCorrect(
      question,
      answer
    ) {

      if (
        question.type ===
        "polynomial"
      ) {

        return U()
          .arePolynomialsEqual(
            answer.value,
            question.answer
          );
      }


      return (
        answer.value ===
        question.answer
      );
    }


    function correctAnswerText(
      question
    ) {

      if (
        question.type ===
        "polynomial"
      ) {

        return polynomialHTML(
          question.answer
        );
      }


      return (
        question.choices.find(
          (item) =>
            item.value ===
            question.answer
        )?.text ||
        question.answer
      );
    }


    /*
    ==================================================
    解析
    ==================================================
    */

    function explanationHTML(
      question
    ) {

      return question.explanation
        .map(
          (
            step,
            stepIndex
          ) => `

            <div class="explanation-step">

              <strong>

                步驟 ${
                  stepIndex +
                  1
                }｜

              </strong>

              ${step}

            </div>
          `
        )
        .join(
          ""
        );
    }


    /*
    ==================================================
    提交答案
    ==================================================
    */

    function submitAnswer() {

      if (
        answered
      ) {

        return;
      }


      const question =
        questions[
          index
        ];


      const answer =
        readAnswer(
          question
        );


      if (
        !answer.valid
      ) {

        $("feedback")
          .className =
            "feedback warning";


        $("feedback")
          .textContent =
            answer.message;


        return;
      }


      answered =
        true;


      answerInput
        ?.setDisabled(
          true
        );


      const isCorrect =
        checkCorrect(
          question,
          answer
        );


      if (
        isCorrect
      ) {

        correct++;


        combo++;


        maxCombo =
          Math.max(
            maxCombo,
            combo
          );


        $("feedback")
          .className =
            "feedback correct";


        $("feedback")
          .textContent =
            "✨ 回答正確！";


        playGameSound(
          "playCorrect"
        );

      } else {

        wrong++;


        combo =
          0;


        $("feedback")
          .className =
            "feedback wrong";


        $("feedback")
          .innerHTML =
            `❌ 答案不正確。正確答案：<strong>${
              correctAnswerText(
                question
              )
            }</strong>`;


        playGameSound(
          "playWrong"
        );
      }


      $("correct-count")
        .textContent =
          correct;


      $("combo-count")
        .textContent =
          maxCombo;


      $("explanation")
        .innerHTML =
          explanationHTML(
            question
          );


      $("explanation")
        .classList
        .remove(
          "hidden"
        );


      records.push(
        {

          number:
            index +
            1,

          question,

          userAnswer:
            answer.display,

          correct:
            isCorrect
        }
      );


      $("submit-button")
        .classList
        .add(
          "hidden"
        );


      $("next-button")
        .classList
        .remove(
          "hidden"
        );


      $("next-button")
        .textContent =
          index ===
            TOTAL_QUESTIONS -
            1
            ? "查看測驗結果（Enter）"
            : "下一題（Enter）";


      $("next-button")
        .focus();
    }

    /*
    ==================================================
    Firebase
    ==================================================
    */

    async function saveCurrentScore(
      score
    ) {

      if (
        scoreSaved
      ) {

        return;
      }


      scoreSaved =
        true;


      const status =
        $("save-status");


      status.textContent =
        "☁️ 正在儲存本次成績……";


      status.style.color =
        "#1d4ed8";


      try {

        const result =
          await saveGameScore(
            {

              game:
                GAME_ID,

              mode,

              score,

              correctCount:
                correct,

              wrongCount:
                wrong,

              maxCombo,

              /*
              同分時使用這個時間排序。
              單位：秒。
              */

              playTime:
                finalElapsed
            }
          );


        if (
          result.success
        ) {

          status.textContent =
            `✅ 本次成績已儲存（用時 ${formatTime(
              finalElapsed
            )}）。`;


          status.style.color =
            "#15803d";


          return;
        }


        if (
          result.reason ===
          "not-logged-in"
        ) {

          status.textContent =
            "ℹ️ 尚未登入，因此本次成績沒有儲存。";


          status.style.color =
            "#b45309";


          return;
        }


        status.textContent =
          "⚠️ 成績暫時無法儲存。";


        status.style.color =
          "#b91c1c";

      } catch (
        error
      ) {

        console.error(
          "多項式加減成績儲存失敗：",
          error
        );


        status.textContent =
          "⚠️ 成績暫時無法儲存。";


        status.style.color =
          "#b91c1c";
      }
    }

    $("restart-button")
      .addEventListener(
        "click",
        () => {

          startGame(
            mode
          );
        }
      );


    /*
    ==================================================
    模式
    ==================================================
    */

    $("mode-button")
      .addEventListener(
        "click",
        returnToModes
      );


    $("result-mode-button")
      .addEventListener(
        "click",
        returnToModes
      );


    /*
    ==================================================
    結果：重新測驗
    ==================================================
    */

    $("again-button")
      .addEventListener(
        "click",
        () => {

          startGame(
            mode
          );
        }
      );


    /*
    ==================================================
    錯題
    ==================================================
    */

    $("review-button")
      .addEventListener(
        "click",
        showReview
      );


    $("review-again-button")
      .addEventListener(
        "click",
        () => {

          startGame(
            mode
          );
        }
      );


    $("review-result-button")
      .addEventListener(
        "click",
        () => {

          showOnly(
            "result-screen"
          );
        }
      );


    /*
    ==================================================
    Enter
    ==================================================
    */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key !==
          "Enter"
        ) {

          return;
        }


        if (
          $("quiz-screen")
            .classList
            .contains(
              "hidden"
            )
        ) {

          return;
        }


        /*
        若焦點在 ExpressionInput 內部按鈕，
        不搶元件自己的 Enter。
        */

        if (
          event.target
            ?.tagName ===
            "BUTTON" &&
          event.target
            ?.closest(
              ".expression-input"
            )
        ) {

          return;
        }


        event.preventDefault();


        if (
          answered
        ) {

          nextQuestion();

        } else {

          submitAnswer();
        }
      }
    );


    /*
    ==================================================
    頁面離開時停止計時器
    ==================================================
    */

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          timerId !==
          null
        ) {

          clearInterval(
            timerId
          );
        }
      }
    );


    /*
    ==================================================
    初始
    ==================================================
    */

    showOnly(
      "start-screen"
    );


    $("timer-display")
      .textContent =
        "00:00";


  </script>


</body>

</html>
