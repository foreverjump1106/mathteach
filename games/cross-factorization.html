<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    十字交乘因式分解大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=5"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #ec407a;
      --primary-dark: #ad1457;
      --primary-light: #fce4ec;
      --primary-border: #f48fb1;

      --cross-blue: #0288d1;
      --cross-blue-light: #e1f5fe;

      --formula: #7b1fa2;
      --formula-light: #f3e5f5;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #fce4ec,
          #fff8e8
        );
    }

    button,
    input,
    select {

      font-family: inherit;
    }

    .hidden {

      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #f4d9e3;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {

      padding: 22px;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 255px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-card.mode-two {

      border-color:
        #81d4fa;

      background:
        linear-gradient(
          180deg,
          #e1f5fe,
          white
        );
    }

    .mode-card.mode-three {

      border-color:
        #ce93d8;

      background:
        linear-gradient(
          180deg,
          #f3e5f5,
          white
        );
    }

    .mode-tag {

      display: inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 20px;

      line-height: 1.45;
    }

    .mode-two h2 {

      color:
        #0277bd;
    }

    .mode-three h2 {

      color:
        #6a1b9a;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 12px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.7;
    }

    /*
    ==================================================
    狀態
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #f06292
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-weight: 900;
    }

    .question-content {

      min-height: 150px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      padding:
        16px 6px;

      color:
        #0f172a;

      font-size:
        clamp(
          26px,
          4.7vw,
          42px
        );

      font-weight: 900;

      line-height: 1.8;

      -webkit-overflow-scrolling:
        touch;
    }

    .math-expression {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: nowrap;

      gap: .07em;

      min-width:
        max-content;

      white-space:
        nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    .question-content sup,
    .explanation sup,
    .review-question sup,
    .preview-value sup,
    .correct-answer sup,
    .cross-board sup,
    .formula-box sup {

      position: relative;

      top: -.46em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    /*
    ==================================================
    分數顯示
    ==================================================
    */

    .math-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.5em;

      margin:
        0 .10em;

      vertical-align: middle;

      line-height: 1.05;
    }

    .math-fraction-top {

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        0 .14em .08em;

      border-bottom:
        2px solid
        currentColor;
    }

    .math-fraction-bottom {

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        .08em .14em 0;
    }

    /*
    ==================================================
    答案區
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 14px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.7;
    }

    /*
    ==================================================
    兩個因式答案
    ==================================================
    */

    .factor-answer-shell {

      width:
        min(
          100%,
          900px
        );

      margin:
        0 auto;

      padding: 16px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          #fff3f7,
          white
        );
    }

    .factor-answer-grid {

      display: grid;

      grid-template-columns:
        minmax(
          0,
          1fr
        )
        42px
        minmax(
          0,
          1fr
        );

      gap: 10px;

      align-items: center;
    }

    .factor-box {

      min-width: 0;

      padding:
        12px 10px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 15px;

      background: white;
    }

    .factor-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      text-align: center;

      font-size: 16px;

      font-weight: 900;
    }

    .factor-times {

      color:
        #334155;

      text-align: center;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 900;
    }

    .polynomial-answer-shell {

      width: 100%;

      margin:
        0 auto;
    }

    /*
    ==================================================
    ExpressionInput 分數格
    ==================================================
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient {

      position:
        relative !important;

      display:
        grid !important;

      grid-template-columns:
        minmax(
          110px,
          150px
        ) !important;

      grid-template-rows:
        1fr 1fr !important;

      gap:
        0 !important;

      width:
        min(
          150px,
          100%
        ) !important;

      min-height:
        106px !important;

      margin:
        0 !important;

      overflow:
        hidden !important;

      border:
        2px solid
        var(--primary-border) !important;

      border-radius:
        12px !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-slash {

      display:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field {

      display:
        flex !important;

      flex-direction:
        column !important;

      align-items:
        center !important;

      justify-content:
        center !important;

      width:
        100% !important;

      height:
        52px !important;

      gap:
        0 !important;

      margin:
        0 !important;

      padding:
        4px 8px !important;

      border:
        0 !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field input {

      width:
        100% !important;

      min-width:
        0 !important;

      height:
        42px !important;

      padding:
        3px !important;

      border:
        0 !important;

      border-radius:
        0 !important;

      outline:
        none !important;

      background:
        transparent !important;

      text-align:
        center !important;

      font-size:
        21px !important;

      font-weight:
        900 !important;

      box-shadow:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-coefficient::after {

      content: "";

      position: absolute;

      left: 12px;

      right: 12px;

      top: 50%;

      z-index: 10;

      border-top:
        2px solid
        #334155;

      pointer-events: none;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__field-label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    small {

      display:
        none !important;
    }

    /*
    ==================================================
    預覽
    ==================================================
    */

    .answer-preview {

      margin:
        16px auto 0;

      padding: 13px;

      max-width: 780px;

      min-height: 62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .preview-value {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      margin-left: 8px;

      color:
        var(--primary-dark);

      font-size: 27px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .game-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {

      color:
        var(--success);
    }

    .feedback.wrong {

      color:
        var(--danger);
    }

    .feedback.warning {

      color:
        var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border-radius: 14px;

      background:
        #fdf0f5;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-question {

      margin-bottom: 18px;

      padding:
        15px 14px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;
    }

    .explanation-question-title {

      margin-bottom: 9px;

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .explanation-question-math {

      overflow-x: auto;

      padding:
        8px 4px;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        clamp(
          21px,
          3.2vw,
          29px
        );

      font-weight: 900;

      text-align: center;
    }

    .explanation-step {

      margin:
        11px 0;
    }

    .calculation-box {

      margin:
        12px 0;

      padding:
        13px 15px;

      overflow-x: auto;

      border:
        1px solid
        var(--primary-border);

      border-radius: 12px;

      background: white;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        1.08em;

      line-height: 2;
    }

    .formula-box {

      width:
        min(
          100%,
          520px
        );

      margin:
        12px auto;

      padding:
        12px 15px;

      border:
        2px solid
        #ce93d8;

      border-radius: 12px;

      background:
        var(--formula-light);

      color:
        #6a1b9a;

      text-align: center;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 20px;

      font-weight: 900;

      line-height: 1.8;
    }

    /*
    ==================================================
    十字交乘圖
    ==================================================
    */

    .cross-board {

      width:
        min(
          100%,
          500px
        );

      margin:
        14px auto;

      padding:
        16px 18px;

      border:
        2px solid
        #81d4fa;

      border-radius: 14px;

      background:
        var(--cross-blue-light);

      color:
        #334155;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .cross-title {

      margin-bottom: 12px;

      color:
        #0277bd;

      text-align: center;

      font-family:
        "Microsoft JhengHei",
        sans-serif;

      font-weight: 900;
    }

    .cross-grid {

      display: grid;

      grid-template-columns:
        minmax(
          80px,
          1fr
        )
        58px
        minmax(
          80px,
          1fr
        );

      grid-template-rows:
        auto
        auto;

      gap:
        8px 4px;

      align-items: center;

      justify-items: center;

      font-size: 23px;

      font-weight: 900;
    }

    .cross-x {

      grid-row:
        1 / 3;

      grid-column: 2;

      font-size: 52px;

      font-weight: 400;

      line-height: 1;
    }

    .cross-result {

      margin-top: 12px;

      padding-top: 10px;

      border-top:
        2px solid #475569;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {

      margin-bottom: 10px;

      font-size: 31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }

    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }

    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }

    .review-question {

      margin:
        12px 0;

      overflow-x: auto;

      font-size: 22px;

      text-align: center;
    }

    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:
        820px
    ) {

      .mode-grid {

        grid-template-columns:
          1fr;
      }

    }

    @media(
      max-width:
        760px
    ) {

      body {

        padding: 8px;
      }

      .screen {

        padding:
          18px 12px;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {

        grid-column:
          1 / -1;
      }

      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .answer-panel {

        padding:
          14px 8px;
      }

      .factor-answer-grid {

        grid-template-columns:
          1fr;
      }

      .factor-times {

        font-size: 28px;
      }

      .question-content {

        font-size:
          clamp(
            23px,
            6vw,
            34px
          );
      }

    }

  </style>

</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">

      <h1 class="game-title">
        ❌ 十字交乘因式分解大挑戰
      </h1>

      <p class="game-subtitle">

/*
==================================================
工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


function gcdArray(
  values
) {

  const usable =
    values
      .map(
        value =>
          Math.abs(
            Number(
              value
            )
          )
      )
      .filter(
        value =>
          value !==
          0
      );


  if (
    !usable.length
  ) {

    return 1;
  }


  return usable.reduce(
    (
      result,
      value
    ) =>
      gcd(
        result,
        value
      )
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator ===
    0
  ) {

    return {

      numerator: 0,

      denominator: 1
    };
  }


  const divisor =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      divisor,

    denominator:
      denominator /
      divisor
  };
}


function addF(
  first,
  second
) {

  return F(

    first.numerator *
    second.denominator +

    second.numerator *
    first.denominator,

    first.denominator *
    second.denominator
  );
}


function mulF(
  first,
  second
) {

  return F(

    first.numerator *
    second.numerator,

    first.denominator *
    second.denominator
  );
}


function sameF(
  first,
  second
) {

  const a =
    F(
      first.numerator,
      first.denominator
    );


  const b =
    F(
      second.numerator,
      second.denominator
    );


  return (

    a.numerator ===
      b.numerator &&

    a.denominator ===
      b.denominator
  );
}


function isZeroF(
  value
) {

  return (
    value.numerator ===
    0
  );
}


/*
==================================================
數學顯示
==================================================
*/

function fractionHTML(
  fraction
) {

  const value =
    F(
      fraction.numerator,
      fraction.denominator
    );


  if (
    value.denominator ===
    1
  ) {

    return String(
      value.numerator
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    value.numerator <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">
        ${Math.abs(value.numerator)}
      </span>

      <span class="math-fraction-bottom">
        ${value.denominator}
      </span>

    </span>
  `;
}


function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }


  if (
    exponent ===
    1
  ) {

    return base;
  }


  return `
    ${base}<sup>${exponent}</sup>
  `;
}


function monomialHTML(
  coefficient,
  exponent
) {

  const value =
    F(
      coefficient.numerator,
      coefficient.denominator
    );


  if (
    isZeroF(
      value
    )
  ) {

    return "0";
  }


  const negative =
    value.numerator <
    0;


  const absolute =
    F(
      Math.abs(
        value.numerator
      ),
      value.denominator
    );


  let coefficientHTML =
    "";


  if (
    exponent ===
    0
  ) {

    coefficientHTML =
      fractionHTML(
        absolute
      );

  } else if (
    !(
      absolute.numerator ===
      1 &&
      absolute.denominator ===
      1
    )
  ) {

    coefficientHTML =
      fractionHTML(
        absolute
      );
  }


  return `

    ${
      negative

        ? "−"

        : ""
    }

    ${coefficientHTML}

    ${
      exponent ===
      0

        ? ""

        : powerHTML(
            "x",
            exponent
          )
    }
  `;
}


/*
==================================================
多項式
==================================================
*/

function normalizePolynomial(
  terms
) {

  const map =
    new Map();


  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );


    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );


    const old =
      map.get(
        exponent
      ) ||
      F(
        0
      );


    map.set(

      exponent,

      addF(
        old,
        coefficient
      )
    );
  }


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        first,
        second
      ) =>
        second.exponent -
        first.exponent
    );
}


function polynomialHTML(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  if (
    !normalized.length
  ) {

    return "0";
  }


  let html =
    "";


  normalized.forEach(
    (
      term,
      i
    ) => {

      const coefficient =
        F(
          term.coefficient.numerator,
          term.coefficient.denominator
        );


      const negative =
        coefficient.numerator <
        0;


      const absolute =
        F(
          Math.abs(
            coefficient.numerator
          ),
          coefficient.denominator
        );


      if (
        i ===
        0
      ) {

        html +=
          monomialHTML(
            coefficient,
            term.exponent
          );

      } else {

        html +=

          negative

            ? "－"

            : "＋";


        html +=
          monomialHTML(
            absolute,
            term.exponent
          );
      }
    }
  );


  return html;
}


function bracketPolynomial(
  polynomial
) {

  return `(${polynomialHTML(polynomial)})`;
}


function degreeOf(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  return normalized.length

    ? normalized[0].exponent

    : -Infinity;
}


function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  if (
    a.length !==
    b.length
  ) {

    return false;
  }


  return a.every(
    (
      term,
      i
    ) => (

      term.exponent ===
        b[i].exponent &&

      sameF(
        term.coefficient,
        b[i].coefficient
      )
    )
  );
}


function multiplyTwoPolynomials(
  first,
  second
) {

  const terms =
    [];


  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      terms.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  return normalizePolynomial(
    terms
  );
}


function scalePolynomial(
  polynomial,
  factor
) {

  return normalizePolynomial(

    polynomial.map(
      term => ({

        exponent:
          term.exponent,

        coefficient:
          mulF(
            term.coefficient,
            factor
          )
      }))
  );
}


function binomial(
  xCoefficient,
  constant
) {

  return normalizePolynomial(
    [

      {

        exponent: 1,

        coefficient:
          xCoefficient
          ?.numerator !==
          undefined

            ? xCoefficient

            : F(
                xCoefficient
              )
      },

      {

        exponent: 0,

        coefficient:
          constant
          ?.numerator !==
          undefined

            ? constant

            : F(
                constant
              )
      }
    ]
  );
}


function polynomialCoefficientGCD(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  if (
    normalized.some(
      term =>
        term.coefficient.denominator !==
        1
    )
  ) {

    return null;
  }


  return gcdArray(

    normalized.map(
      term =>
        term.coefficient.numerator
    )
  );
}


/*
==================================================
因式顯示
==================================================
*/

function factorProductHTML(
  first,
  second
) {

  return `

    ${bracketPolynomial(first)}

    ${bracketPolynomial(second)}
  `;
}


function factorWithCommonHTML(
  common,
  first,
  second
) {

  const commonHTML =

    common.denominator ===
    1

      ? String(
          common.numerator
        )
          .replace(
            "-",

          )

      : fractionHTML(

        );


  return `

    ${commonHTML}

    ${bracketPolynomial(first)}

    ${bracketPolynomial(second)}
  `;
}


/*
==================================================
十字交乘圖
==================================================
*/

function crossBoardHTML(
  leftTop,
  leftBottom,
  rightTop,
  rightBottom
) {

  const cross1 =
    mulF(
      leftTop.coefficient,
      rightBottom.coefficient
    );


  const cross1Exponent =
    leftTop.exponent +
    rightBottom.exponent;


  const cross2 =
    mulF(
      leftBottom.coefficient,
      rightTop.coefficient
    );


  const cross2Exponent =
    leftBottom.exponent +
    rightTop.exponent;


  const crossSum =
    addF(
      cross1,
      cross2
    );


  return `

    <div class="cross-board">

      <div class="cross-title">
        十字交乘
      </div>

      <div class="cross-grid">

        <div>
          ${monomialHTML(
            leftTop.coefficient,
            leftTop.exponent
          )}
        </div>

        <div class="cross-x">
          ×
        </div>

        <div>
          ${monomialHTML(
            rightTop.coefficient,
            rightTop.exponent
          )}
        </div>

        <div>
          ${monomialHTML(
            leftBottom.coefficient,
            leftBottom.exponent
          )}
        </div>

        <div>
          ${monomialHTML(
            rightBottom.coefficient,
            rightBottom.exponent
          )}
        </div>

      </div>

      <div class="cross-result">

        ${
          monomialHTML(
            cross1,
            cross1Exponent
          )
        }

        ${
          cross2.numerator <
          0

            ? "－"

            : "＋"
        }

        ${
          monomialHTML(
            F(
              Math.abs(
                cross2.numerator
              ),
              cross2.denominator
            ),
            cross2Exponent
          )
        }

        ＝

        ${monomialHTML(
          crossSum,
          1
        )}

      </div>

    </div>
  `;
}


function crossBoardFromFactors(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  const leftTop =
    a.find(
      term =>
        term.exponent ===
        1
    );


  const rightTop =
    a.find(
      term =>
        term.exponent ===
        0
    );


  const leftBottom =
    b.find(
      term =>
        term.exponent ===
        1
    );


  const rightBottom =
    b.find(
      term =>
        term.exponent ===
        0
    );


  return crossBoardHTML(

    leftTop,

    leftBottom,

    rightTop,

    rightBottom
  );
}


/*
==================================================

function factorQuestion(
  original,
  factor1,
  factor2,
  explanation,
  label,
  options =

  return {

    original:
      normalizePolynomial(

    factor1:
      normalizePolynomial(
        factor1
      ),

    factor2:
      normalizePolynomial(
        factor2
      ),

    explanation,

    label,

    subtype:
      options.subtype ||
      "",

    answerHTML:
      options.answerHTML ||
      factorProductHTML(
        factor1,
        factor2
      )
  };
}


/*
==================================================
模式一
二次項係數為 1
==================================================
*/

function makeMonicQuestion(
  type =
    "mixed"
) {

  let p;
  let q;


  if (
    type ===
    "positive-positive"
  ) {

    p =
      rand(
        1,
        9
      );


    q =
      rand(
        1,
        9
      );

  } else if (
    type ===
    "negative-negative"
  ) {

    p =
      -rand(
        1,
        9
      );


    q =
      -rand(
        1,
        9
      );

  } else if (
    type ===
    "opposite"
  ) {

    p =
      rand(
        1,
        10
      );


    q =
      -rand(
        1,
        10
      );


    if (
      p ===
      Math.abs(
        q
      )
    ) {

      q =
        -(Math.abs(q) + 1);
    }

  } else {

    return makeMonicQuestion(
      pick(
        [
          "positive-positive",
          "negative-negative",
          "opposite"
        ]
      )
    );
  }


  const first =
    binomial(
      1,
      p
    );


  const second =
    binomial(
      1,
      q
    );


  const original =
    multiplyTwoPolynomials(
      first,
      second
    );


  const middle =
    p +
    q;


  const constant =
    p *
    q;


  const signDescription =

    constant >
    0

      ? (
          middle >
          0

            ? "常數項為正，而且一次項係數為正，因此兩數取同號的正數。"

            : "常數項為正，而且一次項係數為負，因此兩數取同號的負數。"
        )

      : "常數項為負，因此兩個數必須異號。";


  return factorQuestion(

    original,

    first,

    second,

    [

      `本題二次項係數為 1，所以設：

      <div class="calculation-box">

        x<sup>2</sup>
        ＋
        ${
          middle === 1

            ? ""

            : middle === -1

              ? "−"

              : `${middle}`
        }x
        ${
          constant >= 0

            ? `＋${constant}`

            : `－${Math.abs(constant)}`
        }

        ＝

        (x＋p)(x＋q)

      </div>`,

      `${signDescription}`,

      `尋找兩個整數 p、q，使：

      <div class="calculation-box">

        p × q ＝ ${constant}
        <br>
        p ＋ q ＝ ${middle}

      </div>`,

      `符合條件的是
      p＝${p}、q＝${q}。`,

      `${crossBoardFromFactors(
        first,
        second
      )}`,

      `因此：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${factorProductHTML(
          first,
          second
        )}

      </div>`
    ],

    "請利用十字交乘法因式分解",

    {

      subtype:
        "monic"
    }
  );
}

/*
==================================================
模式二
二次項係數不為 1
==================================================
*/

function randomPrimitiveFactor() {

  for (
    let attempt =
      0;

    attempt <
    300;

    attempt++
  ) {

    const a =
      rand(
        1,
        5
      );


    const b =
      nonZeroRand(
        -8,
        8
      );


    if (
      gcd(
        a,
        Math.abs(
          b
        )
      ) !==
      1
    ) {

      continue;
    }


    return binomial(
      a,
      b
    );
  }


  return binomial(
    1,
    1
  );
}


function makeNonMonicQuestion(
  negativeLeading =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    500;

    attempt++
  ) {

    let first =
      randomPrimitiveFactor();


    let second =
      randomPrimitiveFactor();


    const leadProduct =
      first[0].coefficient.numerator *
      second[0].coefficient.numerator;


    if (
      leadProduct ===
      1
    ) {

      continue;
    }


    let original =
      multiplyTwoPolynomials(
        first,
        second
      );


    if (
      polynomialCoefficientGCD(
        original
      ) !==
      1
    ) {

      continue;
    }


    if (
      negativeLeading
    ) {

      first =
        scalePolynomial(
          first,
          F(
            -1
          )
        );


      original =
        multiplyTwoPolynomials(
          first,
          second
        );
    }


    const middle =
      original.find(
        term =>
          term.exponent ===
          1
      );


    if (
      !middle
    ) {

      continue;
    }


    const explanation =

      negativeLeading

        ? [

            `本題二次項係數為負，可以先提出負號，也可以直接進行十字交乘。`,

            `這裡直接利用兩個一次因式進行十字交乘。`,

            `${crossBoardFromFactors(
              first,
              second
            )}`,

            `交叉相乘後的一次項，正好等於原式的一次項，因此此組分解正確。`,

            `所以：

            <div class="calculation-box">

              ${polynomialHTML(
                original
              )}

              ＝

              ${factorProductHTML(
                first,
                second
              )}

            </div>`
          ]

        : [

            `先將二次項係數與常數項分解，再進行十字交乘。`,

            `檢查兩個交叉乘積的和，是否等於原式的一次項。`,

            `${crossBoardFromFactors(
              first,
              second
            )}`,

            `交叉相乘的一次項與題目相符，因此這一組正確。`,

            `所以：

            <div class="calculation-box">

              ${polynomialHTML(
                original
              )}

              ＝

              ${factorProductHTML(
                first,
                second
              )}

            </div>`
          ];


    return factorQuestion(

      original,

      first,

      second,

      explanation,

      "請利用十字交乘法因式分解",

      {

        subtype:
          negativeLeading

            ? "negative-leading"

            : "nonmonic"
      }
    );
  }


  return factorQuestion(

    [
      {
        exponent: 2,
        coefficient: F(3)
      },
      {
        exponent: 1,
        coefficient: F(-11)
      },
      {
        exponent: 0,
        coefficient: F(10)
      }
    ],

    binomial(
      1,
      -2
    ),

    binomial(
      3,
      -5
    ),

    [],

    "請利用十字交乘法因式分解"
  );
}

/*
==================================================
模式三 A
先提公因式再十字交乘
==================================================
*/

function makeCommonFactorCrossQuestion() {

  for (
    let attempt =
      0;

    attempt <
    400;

    attempt++
  ) {

    const common =
      rand(
        2,
        5
      );


    const first =
      randomPrimitiveFactor();


    const second =
      randomPrimitiveFactor();


    const primitive =
      multiplyTwoPolynomials(
        first,
        second
      );


    if (
      degreeOf(
        primitive
      ) !==
      2
    ) {

      continue;
    }


    if (
      polynomialCoefficientGCD(
        primitive
      ) !==
      1
    ) {

      continue;
    }


    const original =
      scalePolynomial(
        primitive,
        F(
          common
        )
      );


    /*
    為配合兩個答案格：
    將公因數乘入第一個一次因式，
    但詳解仍採課本標準寫法。
    */

    const acceptedFirst =
      scalePolynomial(
        first,
        F(
          common
        )
      );


    return factorQuestion(

      original,

      acceptedFirst,

      second,

      [

        `先檢查三項係數，可以先提出公因數 ${common}。`,

        `

        <div class="calculation-box">

          ${polynomialHTML(
            original
          )}

          ＝

          ${common}
          (
          ${polynomialHTML(
            primitive
          )}
          )

        </div>`,

        `再對括號內的二次三項式進行十字交乘。`,

        `${crossBoardFromFactors(
          first,
          second
        )}`,

        `所以：

        <div class="calculation-box">

          ${polynomialHTML(
            original
          )}

          ＝

          ${factorWithCommonHTML(
            F(common),
            first,
            second
          )}

        </div>`,

        `課本通常會把公因數寫在最前面。作答區只有兩個因式框，因此也可以把公因數乘入其中一個一次因式；系統會依乘積判斷等價答案。`
      ],

      "請先提公因式，再利用十字交乘法因式分解",

      {

        subtype:
          "common-factor",

        answerHTML:
          factorWithCommonHTML(
            F(common),
            first,
            second
          )
      }
    );
  }


  throw new Error(
    "無法建立先提公因式題"
  );
}


/*
==================================================
模式三 B
乘法公式 / 十字交乘
==================================================
*/

function makePerfectSquareQuestion(
  negativeMiddle =
    false
) {

  const a =
    rand(
      1,
      6
    );


  const b =
    rand(
      1,
      9
    );


  const signedB =

    negativeMiddle

      ? -b

      : b;


  const factor =
    binomial(
      a,
      signedB
    );


  const original =
    multiplyTwoPolynomials(
      factor,
      factor
    );


  return factorQuestion(

    original,

    factor,

    factor,

    [

      `這一題既可以用十字交乘法，也可以利用乘法公式。`,

      `利用十字交乘法：

      ${crossBoardFromFactors(
        factor,
        factor
      )}`,

      `兩個一次因式完全相同，因此可寫成平方。`,

      `

      <div class="formula-box">

        a<sup>2</sup>
        ${
          negativeMiddle

            ? "－"

            : "＋"
        }
        2ab
        ＋b<sup>2</sup>

        ＝

        (a
        ${
          negativeMiddle

            ? "－"

            : "＋"
        }
        b)<sup>2</sup>

      </div>`,

      `所以：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${bracketPolynomial(
          factor
        )}
        ${bracketPolynomial(
          factor
        )}

        ＝

        ${bracketPolynomial(
          factor
        )}<sup>2</sup>

      </div>`
    ],

    "請利用十字交乘法或乘法公式因式分解",

    {

      subtype:
        "perfect-square",

      answerHTML:
        `${bracketPolynomial(factor)}<sup>2</sup>`
    }
  );
}


/*
==================================================
模式三 C
分數型十字交乘
==================================================
*/

function makeFractionCrossQuestion() {

  const templates =
    [

      {
        firstA: F(1, 2),
        firstB: F(2),
        secondA: F(1),
        secondB: F(3)
      },

      {
        firstA: F(2, 3),
        firstB: F(-1),
        secondA: F(1),
        secondB: F(4)
      },

      {
        firstA: F(3, 4),
        firstB: F(2),
        secondA: F(1),
        secondB: F(-5)
      },

      {
        firstA: F(1, 3),
        firstB: F(-2),
        secondA: F(2),
        secondB: F(3)
      }
    ];


  const data =
    pick(
      templates
    );


  const first =
    binomial(
      data.firstA,
      data.firstB
    );


  const second =
    binomial(
      data.secondA,
      data.secondB
    );


  const original =
    multiplyTwoPolynomials(
      first,
      second
    );


  return factorQuestion(

    original,

    first,

    second,

    [

      `這是延伸的分數係數十字交乘題，方法和整數係數完全相同。`,

      `先分解二次項與常數項，再檢查交叉相乘的一次項。`,

      `${crossBoardFromFactors(
        first,
        second
      )}`,

      `分數運算時，係數必須保持最簡分數。`,

      `因此：

      <div class="calculation-box">

        ${polynomialHTML(
          original
        )}

        ＝

        ${factorProductHTML(
          first,
          second
        )}

      </div>`
    ],

    "請利用十字交乘法因式分解；分數請化成最簡分數",

    {

      subtype:
        "fraction"
    }
  );
}

/*
==================================================
移除分數小標籤
==================================================
*/

function cleanFractionFieldLabels(
  mount
) {

  if (
    !mount
  ) {

    return;
  }


  const clean =
    () => {

      mount
        .querySelectorAll(
          ".expression-input__fraction-field"
        )
        .forEach(
          field => {

            [
              ...field.children
            ]
              .forEach(
                child => {

                  if (
                    child.tagName ===
                    "INPUT"
                  ) {

                    return;
                  }


                  const text =
                    child.textContent
                      ?.trim();


                  if (
                    text ===
                    "分子" ||

                    text ===
                    "分母"
                  ) {

                    child.remove();
                  }
                }
              );
          }
        );
    };


  clean();


  const observer =
    new MutationObserver(
      clean
    );


  observer.observe(
    mount,
    {

      childList: true,

      subtree: true
    }
  );


  setTimeout(
    () => {

      observer.disconnect();

    },
    20000
  );
}


/*
==================================================
讀取 ExpressionInput
==================================================
*/

function parseExpressionInput(
  input
) {

  if (
    !input
  ) {

    return {

      valid: false,

      message:
        "答案輸入器尚未準備完成。"
    };
  }


  const result =
    input.validate();


  if (
    !result.valid
  ) {

    return {

      valid: false,

      message:
        result.message ||
        "請將因式輸入完整。"
    };
  }


  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(

              term.coefficient.numerator,

              term.coefficient.denominator
            )
        })
      );


  return {

    valid: true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}

function updateFactorPreview() {

  const preview =
    $("factor-preview");


  if (
    !preview
  ) {

    return;
  }


  let first =
    null;


  let second =
    null;


  try {

    const result =
      parseExpressionInput(
        factorInput1
      );


    if (
      result.valid
    ) {

      first =
        result;
    }

  } catch (
    error
  ) {

    first =
      null;
  }


  try {

    const result =
      parseExpressionInput(
        factorInput2
      );


    if (
      result.valid
    ) {

      second =
        result;
    }

  } catch (
    error
  ) {

    second =
      null;
  }


  if (
    !first &&
    !second
  ) {

    preview.innerHTML =
      "目前尚未完成答案。";


    return;

  preview.innerHTML = `

            )

              second.value
            )

          : "（尚未完成）"
      }

}

/*
==================================================
答案判定

不限定：
1. 因式順序
2. 負號放哪一個因式
3. 公因數乘入哪個一次因式
4. 分數係數等價寫法

但要求兩個答案都必須是一次或常數因式，
避免用「原二次式 × 1」作答。
==================================================
*/

function isUnitConstantPolynomial(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  if (
    normalized.length !==
    1
  ) {

    return false;
  }


  const term =
    normalized[0];


  if (
    term.exponent !==
    0
  ) {

    return false;
  }


  const value =
    F(
      term.coefficient.numerator,
      term.coefficient.denominator
    );


  return (
    Math.abs(
      value.numerator
    ) ===
      value.denominator
  );
}


function checkCorrect(
  question,
  answer
) {

  const first =
    normalizePolynomial(
      answer.value.factor1
    );


  const second =
    normalizePolynomial(
      answer.value.factor2
    );


  /*
  不允許把整個原式直接放入一格
  */

  if (
    degreeOf(
      first
    ) >
    1 ||

    degreeOf(
      second
    ) >
    1
  ) {

    return false;
  }


  /*
  不允許 ×1 或 ×(-1)
  */

  if (
    isUnitConstantPolynomial(
      first
    ) ||

    isUnitConstantPolynomial(
      second
    )
  ) {

    return false;
  }


  const product =
    multiplyTwoPolynomials(
      first,
      second
    );


  return samePolynomial(
    product,
    question.original
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerHTML(
  question
) {

  return question.answerHTML;
}


/*
==================================================
詳解
==================================================
*/

function explanationHTML(
  question
) {

  const questionBlock = `

    <div class="explanation-question">

      <div class="explanation-question-title">
        題目｜
      </div>

      <div class="explanation-question-math">

        ${question.html}

      </div>

    </div>
  `;


  const steps =
    question.explanation
      .map(
        (
          step,
          i
        ) => `

          <div class="explanation-step">

            <strong>
              步驟 ${i + 1}｜
            </strong>

            ${step}

          </div>
        `
      )
      .join("");


  return (
    questionBlock +
    steps
  );
}


/*
==================================================
顯示題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${TOTAL_QUESTIONS}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        TOTAL_QUESTIONS *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderFactorAnswer(
    question
  );


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readFactorAnswer();


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  factorInput1
    ?.setDisabled
    ?.(
      true
    );


  factorInput2
    ?.setDisabled
    ?.(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
時間
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
音效
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound?.[
      method
    ]?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
計算紙
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
畫面切換
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  factorInput1 =
    null;


  factorInput2 =
    null;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練利用十字交乘法完成因式分解。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意正負號、交叉相乘與公因式。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再多練習二次項係數不為 1 的題型。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從平方項係數為 1 開始，熟悉後再進入一般十字交乘。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "十字交乘成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
事件
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );
          }
        );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "start-screen"
      );
    }
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


/*
==================================================
Enter
==================================================
*/

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );


/*
==================================================
初始化
==================================================
*/

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(
  "start-screen"
);

</script>
