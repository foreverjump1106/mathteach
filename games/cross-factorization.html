<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    十字交乘因式分解大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #d81b60;
      --primary-dark: #ad1457;
      --primary-light: #fce4ec;
      --primary-border: #f48fb1;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #fff1f5,
          #fff9e8
        );
    }

    button,
    input,
    select {

      font-family:
        inherit;
    }

    .hidden {

      display:
        none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom:
        14px;
    }

    .game-card {

      overflow:
        hidden;

      border:
        1px solid
        #f5d7e2;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align:
        center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          41px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height:
        1.7;
    }

    .concept-strip {

      display:
        flex;

      justify-content:
        center;

      gap:
        8px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }

    .concept-chip {

      padding:
        7px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        14px;

      font-weight:
        900;
    }

    .screen {

      padding:
        22px;
    }

    /*
    ==================================================
    Mode
    ==================================================
    */

    .mode-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap:
        16px;
    }

    .mode-card {

      min-height:
        245px;

      padding:
        21px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-tag {

      display:
        inline-block;

      margin-bottom:
        10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        12px;

      font-weight:
        900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size:
        20px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height:
        1.7;
    }

    .mode-example {

      margin-top:
        12px;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        900;

      line-height:
        1.7;
    }

    /*
    ==================================================
    狀態
    ==================================================
    */

    .quiz-topbar {

      display:
        grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;

      margin-bottom:
        12px;
    }

    .status-box {

      min-height:
        68px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      padding:
        8px;

      border-radius:
        14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }

    .status-value {

      margin-top:
        3px;

      font-size:
        18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display:
        flex;

      justify-content:
        center;

      min-height:
        46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display:
        flex;

      justify-content:
        center;

      width:
        100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height:
        10px;

      margin-bottom:
        16px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width:
        0%;

      height:
        100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ec407a
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        24px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        white;

      text-align:
        center;
    }

    .question-label {

      margin-bottom:
        14px;

      color:
        var(--muted);

      font-weight:
        900;
    }

    .question-content {

      min-height:
        160px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      overflow-x:
        auto;

      padding:
        12px 4px;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          30px,
          5vw,
          46px
        );

      font-weight:
        900;

      line-height:
        1.8;
    }

    .math-expression {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      white-space:
        nowrap;
    }

    .math-expression sup,
    .factor-preview sup,
    .explanation sup,
    .review-question sup,
    .correct-answer sup {

      position:
        relative;

      top:
        -.45em;

      margin-left:
        1px;

      font-size:
        .60em;

      line-height:
        1;

      vertical-align:
        baseline;
    }

    /*
    ==================================================
    作答區
    ==================================================
    */

    .answer-panel {

      margin-top:
        16px;

      padding:
        20px;

      border-radius:
        18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom:
        8px;

      color:
        var(--primary-dark);

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;
    }

    .answer-help {

      margin:
        0 0 16px;

      color:
        var(--muted);

      text-align:
        center;

      font-size:
        14px;

      font-weight:
        800;

      line-height:
        1.7;
    }

    /*
    ==================================================
    ★ 新答案架構
    公因數 × 因式一 × 因式二
    ==================================================
    */

    .factor-answer-main {

      width:
        min(
          100%,
          900px
        );

      margin:
        0 auto;

      display:
        grid;

      grid-template-columns:
        170px
        34px
        minmax(
          0,
          1fr
        )
        34px
        minmax(
          0,
          1fr
        );

      gap:
        10px;

      align-items:
        stretch;
    }

    .factor-box {

      padding:
        15px 12px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        16px;

      background:
        linear-gradient(
          180deg,
          #fff7fa,
          white
        );
    }

    .factor-box-title {

      margin-bottom:
        12px;

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }

    .multiply-mark {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      color:
        var(--primary-dark);

      font-family:
        "Cambria Math",
        serif;

      font-size:
        28px;

      font-weight:
        900;
    }

    /*
    ==================================================
    整體公因數
    ==================================================
    */

    .outer-factor-editor {

      display:
        flex;

      flex-direction:
        column;

      align-items:
        stretch;

      gap:
        8px;
    }

    .outer-sign-row {

      display:
        grid;

      grid-template-columns:
        54px
        1fr;

      gap:
        7px;
    }

    .outer-factor-editor select,
    .factor-linear-editor select {

      height:
        50px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        10px;

      background:
        white;

      color:
        #111827;

      font-size:
        20px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }

    .outer-int-input {

      width:
        100%;

      height:
        50px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        10px;

      background:
        white;

      font-size:
        21px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }

    /*
    ==================================================
    分數輸入
    ==================================================
    */

    .fraction-input {

      position:
        relative;

      overflow:
        hidden;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        11px;

      background:
        white;
    }

    .fraction-input::after {

      content:
        "";

      position:
        absolute;

      left:
        10px;

      right:
        10px;

      top:
        50%;

      border-top:
        2px solid
        #334155;

      pointer-events:
        none;
    }

    .fraction-input input {

      display:
        block;

      width:
        100%;

      height:
        44px;

      padding:
        4px 8px;

      border:
        0;

      background:
        transparent;

      font-size:
        19px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }

    /*
    ==================================================
    一次因式 ax+b
    ==================================================
    */

    .factor-linear-editor {

      display:
        grid;

      grid-template-columns:
        52px
        1fr
        28px
        52px
        1fr;

      gap:
        6px;

      align-items:
        center;
    }

    .linear-coefficient {

      width:
        100%;

      height:
        50px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        10px;

      background:
        white;

      font-size:
        20px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }

    .linear-x {

      text-align:
        center;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        29px;

      font-weight:
        900;
    }

    /*
    ==================================================
    分數模式切換
    ==================================================
    */

    .fraction-toggle {

      margin-top:
        9px;

      width:
        100%;

      min-height:
        38px;

      border:
        1.5px solid
        var(--primary-border);

      border-radius:
        9px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        13px;

      font-weight:
        900;

      cursor:
        pointer;
    }

    /*
    ==================================================
    預覽
    ==================================================
    */

    .answer-preview {

      margin:
        16px auto 0;

      padding:
        14px;

      max-width:
        820px;

      min-height:
        64px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      flex-wrap:
        wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        14px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align:
        center;

      font-size:
        19px;

      font-weight:
        900;
    }

    .factor-preview {

      display:
        inline-flex;

      align-items:
        center;

      flex-wrap:
        wrap;

      margin-left:
        8px;

      color:
        var(--primary);

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        28px;

      font-weight:
        900;
    }

    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }

    .game-button {

      min-width:
        132px;

      padding:
        12px 20px;

      border:
        none;

      border-radius:
        12px;

      background:
        var(--primary);

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .game-button:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height:
        48px;

      margin-top:
        14px;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;

      line-height:
        1.7;
    }

    .feedback.correct {
      color:
        var(--success);
    }

    .feedback.wrong {
      color:
        var(--danger);
    }

    .feedback.warning {
      color:
        var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top:
        12px;

      padding:
        18px;

      border-radius:
        14px;

      background:
        #fff0f5;

      color:
        #334155;

      line-height:
        1.95;
    }

    .explanation-question {

      margin-bottom:
        16px;

      padding:
        15px;

      border:
        2px solid
        #f8bbd0;

      border-radius:
        13px;

      background:
        white;
    }

    .explanation-question-title {

      margin-bottom:
        9px;

      color:
        var(--primary-dark);

      font-weight:
        900;
    }

    .explanation-question-math {

      overflow-x:
        auto;

      color:
        #0f172a;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size:
        26px;

      font-weight:
        900;

      text-align:
        center;
    }

    .explanation-step {

      margin:
        11px 0;
    }

    .cross-box {

      width:
        min(
          100%,
          650px
        );

      margin:
        14px auto;

      padding:
        15px;

      border:
        1px solid
        #f8bbd0;

      border-radius:
        13px;

      background:
        white;

      text-align:
        center;
    }

    .cross-row {

      display:
        grid;

      grid-template-columns:
        1fr
        50px
        1fr;

      gap:
        8px;

      align-items:
        center;

      margin:
        7px 0;

      font-family:
        "Cambria Math",
        serif;

      font-size:
        20px;

      font-weight:
        900;
    }

    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align:
        center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size:
        56px;

      font-weight:
        900;
    }

    .result-stars {

      margin-bottom:
        10px;

      font-size:
        31px;
    }

    .result-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap:
        12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius:
        16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight:
        900;
    }

    .save-status {

      min-height:
        28px;

      margin-top:
        14px;

      font-weight:
        900;
    }

    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display:
        grid;

      gap:
        14px;
    }

    .review-card {

      padding:
        18px;

      border:
        1px solid
        #e2e8f0;

      border-radius:
        16px;

      background:
        white;
    }

    .review-title {

      color:
        var(--danger);

      font-weight:
        900;
    }

    .review-question {

      margin:
        12px 0;

      overflow-x:
        auto;

      font-family:
        "Cambria Math",
        serif;

      font-size:
        23px;

      font-weight:
        900;

      text-align:
        center;
    }

    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:
        800px
    ) {

      body {
        padding: 8px;
      }

      .screen {

        padding:
          18px 10px;
      }

      .mode-grid {

        grid-template-columns:
          1fr;
      }

      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

      .timer-box {

        grid-column:
          1 / -1;
      }

      .factor-answer-main {

        grid-template-columns:
          1fr;
      }

      .multiply-mark {

        min-height:
          28px;

        font-size:
          25px;
      }

      .factor-linear-editor {

        grid-template-columns:
          50px
          minmax(
            65px,
            1fr
          )
          26px
          50px
          minmax(
            65px,
            1fr
          );
      }

      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

    }

  </style>

</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">

      <h1 class="game-title">
        ❌ 十字交乘因式分解大挑戰
      </h1>

      <p class="game-subtitle">
        從二次項係數為 1 開始，逐步挑戰一般十字交乘、先提公因式與乘法公式。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          x²＋bx＋c
        </span>

        <span class="concept-chip">
          ax²＋bx＋c
        </span>

        <span class="concept-chip">
          十字交乘
        </span>

        <span class="concept-chip">
          先提公因式
        </span>

        <span class="concept-chip">
          乘法公式
        </span>

        <span class="concept-chip">
          分數係數
        </span>

      </div>

    </header>

    <!-- 模式首頁 -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-grid">

        <button
          class="mode-card"
          type="button"
          data-mode="leadingOne"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式一｜平方項係數為 1
          </h2>

          <p>
            練習 x²＋bx＋c 型二次三項式的十字交乘因式分解。
          </p>

          <div class="mode-example">
            例如：x²＋7x＋12＝(x＋3)(x＋4)
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="general"
        >

/*
==================================================
基本工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  numerator =
    Number(
      numerator
    );


  denominator =
    Number(
      denominator
    );


  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator ===
    0
  ) {

    return {

      n: 0,

      d: 1
    };
  }


  const divisor =
    gcd(
      numerator,
      denominator
    );


  return {

    n:
      numerator /
      divisor,

    d:
      denominator /
      divisor
  };
}


function addF(
  a,
  b
) {

  return F(

    a.n *
    b.d +

    b.n *
    a.d,

    a.d *
    b.d
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.n *
    b.n,

    a.d *
    b.d
  );
}


function sameF(
  a,
  b
) {

  const x =
    F(
      a.n,
      a.d
    );


  const y =
    F(
      b.n,
      b.d
    );


  return (

    x.n ===
      y.n &&

    x.d ===
      y.d
  );
}


/*
==================================================
數學顯示
==================================================
*/

function fractionHTML(
  value
) {

  const f =
    F(
      value.n,
      value.d
    );


  if (
    f.d ===
    1
  ) {

    return String(
      f.n
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    f.n <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span
      style="
        display:inline-flex;
        flex-direction:column;
        vertical-align:middle;
        text-align:center;
        line-height:1.05;
        margin:0 .08em;
      "
    >

      <span
        style="
          padding:0 .15em .06em;
          border-bottom:2px solid currentColor;
        "
      >
        ${Math.abs(f.n)}
      </span>

      <span
        style="
          padding:.06em .15em 0;
        "
      >
        ${f.d}
      </span>

    </span>
  `;
}


function polynomialHTML(
  a,
  b,
  c
) {

  const terms =
    [];


  function pushTerm(
    coefficient,
    exponent
  ) {

    if (
      coefficient ===
      0
    ) {

      return;
    }


    terms.push(
      {

        coefficient,

        exponent
      }
    );
  }


  pushTerm(
    a,
    2
  );


  pushTerm(
    b,
    1
  );


  pushTerm(
    c,
    0
  );


  if (
    !terms.length
  ) {

    return "0";
  }


  let html =
    "";


  terms.forEach(
    (
      term,
      i
    ) => {

      const negative =
        term.coefficient <
        0;


      const absolute =
        Math.abs(
          term.coefficient
        );


      if (
        i ===
        0
      ) {

        if (
          negative
        ) {

          html +=
            "−";
        }

      } else {

        html +=

          negative

            ? " − "

            : " ＋ ";
      }


      if (
        term.exponent ===
        0
      ) {

        html +=
          absolute;


        return;
      }


      if (
        absolute !==
        1
      ) {

        html +=
          absolute;
      }


      html +=
        "x";


      if (
        term.exponent >
        1
      ) {

        html +=
          `<sup>${term.exponent}</sup>`;
      }
    }
  );


  return html;
}


function rationalPolynomialHTML(
  a,
  b,
  c
) {

  const list =
    [

      {
        coefficient: a,
        exponent: 2
      },

      {
        coefficient: b,
        exponent: 1
      },

      {
        coefficient: c,
        exponent: 0
      }
    ]
      .filter(
        term =>
          term.coefficient.n !==
          0
      );


  if (
    !list.length
  ) {

    return "0";
  }


  let html =
    "";


  list.forEach(
    (
      term,
      i
    ) => {

      const negative =
        term.coefficient.n <
        0;


      const absolute =
        F(
          Math.abs(
            term.coefficient.n
          ),
          term.coefficient.d
        );


      if (
        i ===
        0
      ) {

        if (
          negative
        ) {

          html +=
            "−";
        }

      } else {

        html +=

          negative

            ? " − "

            : " ＋ ";
      }


      if (
        term.exponent ===
        0
      ) {

        html +=
          fractionHTML(
            absolute
          );


        return;
      }


      const isOne =

        absolute.n ===
        1 &&

        absolute.d ===
        1;


      if (
        !isOne
      ) {

        html +=
          fractionHTML(
            absolute
          );
      }


      html +=
        "x";


      if (
        term.exponent ===
        2
      ) {

        html +=
          "<sup>2</sup>";
      }
    }
  );


  return html;
}


function linearFactorHTML(
  a,
  b
) {

  a =
    F(
      a.n,
      a.d
    );


  b =
    F(
      b.n,
      b.d
    );


  let html =
    "(";


  if (
    a.n ===
    -a.d
  ) {

    html +=
      "−x";

  } else if (
    a.n ===
    a.d
  ) {

    html +=
      "x";

  } else {

    html +=
      `${fractionHTML(a)}x`;
  }


  if (
    b.n >
    0
  ) {

    html +=
      `＋${fractionHTML(b)}`;

  } else if (
    b.n <
    0
  ) {

    html +=
      `－${fractionHTML(
        F(
          Math.abs(
            b.n
          ),
          b.d
        )
      )}`;
  }


  html +=
    ")";


  return html;
}


function factorizedHTML(
  outer,
  factor1,
  factor2
) {

  const k =
    F(
      outer.n,
      outer.d
    );


  let outerHTML =
    "";


  if (
    k.n ===
    k.d
  ) {

    outerHTML =
      "";

  } else if (
    k.n ===
    -k.d
  ) {

    outerHTML =
      "−";

  } else {

    outerHTML =
      fractionHTML(
        k
      );
  }


  return `

    ${outerHTML}

    ${linearFactorHTML(
      factor1.a,
      factor1.b
    )}

    ${linearFactorHTML(
      factor2.a,
      factor2.b
    )}
  `;
}


/*
==================================================
乘回去
k(ax+b)(cx+d)
==================================================
*/

function multiplyFactorAnswer(
  outer,
  factor1,
  factor2
) {

  const ac =
    mulF(
      factor1.a,
      factor2.a
    );


  const ad =
    mulF(
      factor1.a,
      factor2.b
    );


  const bc =
    mulF(
      factor1.b,
      factor2.a
    );


  const bd =
    mulF(
      factor1.b,
      factor2.b
    );


  return {

    a:
      mulF(
        outer,
        ac
      ),

    b:
      mulF(

        outer,

        addF(
          ad,
          bc
        )
      ),

    c:
      mulF(
        outer,
        bd
      )
  };
}


/*
==================================================
題目物件
==================================================
*/

function createQuestion(
  a,
  b,
  c,
  standardOuter,
  factor1,
  factor2,
  label,
  explanation,
  subtype
) {

  return {

    a:

      ),

        )}

      </span>
    `,

    standardOuter:
      F(
        standardOuter
      ),

    factor1,

    factor2,

    label,

  };
}


function createRationalQuestion(
  a,
  b,
  c,
  standardOuter,
  factor1,
  factor2,
  label,

  subtype
) {

  return {

        )}

    `,

}


/*
==================================================
模式一
x²＋bx＋c
==================================================
*/

function makeLeadingOneQuestion() {

  let p;
  let q;


  do {

    p =
      nonZeroRand(
        -9,
        9
      );


    q =
      nonZeroRand(
        -9,
        9
      );

  } while (

    p ===
    -q ||

    Math.abs(
      p
    ) ===
    Math.abs(
      q
    ) &&
    Math.random() <
    .5
  );


  const b =
    p +
    q;


  const c =
    p *
    q;


  return createQuestion(

    1,
    b,
    c,

    1,

    {

      a:
        F(
          1
        ),

      b:
        F(
          p
        )
    },

    {

      a:
        F(
          1
        ),

      b:
        F(
          q
        )
    },

    "請利用十字交乘法因式分解",

    [

      `二次項係數為 1，因此先找兩個數，使乘積等於 ${c}。`,

      `同時這兩個數的和要等於一次項係數 ${b}。`,

      `可取 ${p} 與 ${q}，因為 ${p}×${q}＝${c}，且 ${p}＋${q}＝${b}。`,

      `所以可分解為
      ${factorizedHTML(
        F(1),
        {
          a: F(1),
          b: F(p)
        },
        {
          a: F(1),
          b: F(q)
        }
      )}。`
    ],

    "leadingOne"
  );
}


function makeMode1() {

  return shuffle(
    Array.from(
      {
        length:
          TOTAL_QUESTIONS
      },
      () =>
        makeLeadingOneQuestion()
    )
  );
}


/*
==================================================
模式二
ax²＋bx＋c
==================================================
*/

function makeGeneralQuestion() {

  let a1;
  let a2;
  let b1;
  let b2;


  do {

    a1 =
      rand(
        1,
        6
      );


    a2 =
      rand(
        1,
        5
      );


    b1 =
      nonZeroRand(
        -9,
        9
      );


    b2 =
      nonZeroRand(
        -9,
        9
      );

  } while (

    a1 *
    a2 ===
    1 ||

    gcd(
      Math.abs(
        a1
      ),
      Math.abs(
        b1
      )
    ) >
    1 ||

    gcd(
      Math.abs(
        a2
      ),
      Math.abs(
        b2
      )
    ) >
    1
  );


  const A =
    a1 *
    a2;


  const B =
    a1 *
    b2 +
    a2 *
    b1;


  const C =
    b1 *
    b2;


  return createQuestion(

    A,
    B,
    C,

    1,

    {

      a:
        F(
          a1
        ),

      b:
        F(
          b1
        )
    },

    {

      a:
        F(
          a2
        ),

      b:
        F(
          b2
        )
    },

    "請利用十字交乘法因式分解",

    [

      `先將 ${A}x² 的係數分解成 ${a1}×${a2}。`,

      `再將常數項 ${C} 分成 ${b1}×${b2}。`,

      `交叉相乘：
      ${a1}×${b2}＝${a1 * b2}，
      ${a2}×${b1}＝${a2 * b1}。`,

      `兩個交叉乘積相加：
      ${a1 * b2}＋${a2 * b1}＝${B}，
      正好等於一次項係數。`,

      `所以
      ${factorizedHTML(
        F(1),
        {
          a: F(a1),
          b: F(b1)
        },
        {
          a: F(a2),
          b: F(b2)
        }
      )}。`
    ],

    "general"
  );
}


function makeMode2() {

  return shuffle(
    Array.from(
      {
        length:
          TOTAL_QUESTIONS
      },
      () =>
        makeGeneralQuestion()
    )
  );
}


/*
==================================================
模式三 A
先提公因式
==================================================
*/

function makeCommonFactorQuestion() {

  const common =
    pick(
      [
        -5,
        -4,
        -3,
        -2,
        2,
        3,
        4,
        5
      ]
    );


  let a1;
  let a2;
  let b1;
  let b2;


  do {

    a1 =
      rand(
        1,
        4
      );


    a2 =
      rand(
        1,
        4
      );


    b1 =
      nonZeroRand(
        -6,
        6
      );


    b2 =
      nonZeroRand(
        -6,
        6
      );

  } while (

    gcd(
      Math.abs(
        a1
      ),
      Math.abs(
        b1
      )
    ) >
    1 ||

    gcd(
      Math.abs(
        a2
      ),
      Math.abs(
        b2
      )
    ) >
    1
  );


  const insideA =
    a1 *
    a2;


  const insideB =
    a1 *
    b2 +
    a2 *
    b1;


  const insideC =
    b1 *
    b2;


  const A =
    common *
    insideA;


  const B =
    common *
    insideB;


  const C =
    common *
    insideC;


  return createQuestion(

    A,
    B,

/*
==================================================
模式三 B
乘法公式
==================================================
*/

function makeSquareFormulaQuestion() {

  const a =
    rand(
      1,
      4
    );


  const b =
    nonZeroRand(
      -8,
      8
    );


  const A =
    a *
    a;


  const B =
    2 *
    a *
    b;


  const C =
    b *
    b;


  return createQuestion(

    A,
    B,
    C,

    1,

    {

      a:
        F(
          a
        ),

      b:
        F(
          b
        )
    },

    {

      a:
        F(
          a
        ),

      b:
        F(
          b
        )
    },

    "請判斷是否可利用完全平方公式因式分解",

    [

      `首項
      ${A}x²＝(${a}x)²。`,

      `末項
      ${C}＝(${Math.abs(b)})²。`,

      `中間項為
      2×${a}x×(${b})
      ＝${B}x。`,

      `因此符合完全平方公式。`,

      `答案＝
      ${factorizedHTML(
        F(1),
        {
          a: F(a),
          b: F(b)
        },
        {
          a: F(a),
          b: F(b)
        }
      )}。`
    ],

    "squareFormula"
  );
}


function makeDifferenceSquaresQuestion() {

  const a =
    rand(
      1,
      5
    );


  const b =
    rand(
      1,
      9
    );


  const A =
    a *
    a;


  const C =
    -b *
    b;


  return createQuestion(

    A,
    0,
    C,

    1,

    {

      a:
        F(
          a
        ),

      b:
        F(
          b
        )
    },

    {

      a:
        F(
          a
        ),

      b:
        F(
          -b
        )
    },

    "請利用平方差公式因式分解",

    [

      `${A}x²＝(${a}x)²。`,

      `${b * b}＝${b}²。`,

      `所以原式為
      (${a}x)²－${b}²。`,

      `利用
      a²－b²＝(a＋b)(a－b)。`,

      `答案＝
      ${factorizedHTML(
        F(1),
        {
          a: F(a),
          b: F(b)
        },
        {
          a: F(a),
          b: F(-b)
        }
      )}。`
    ],

    "differenceSquares"
  );
}


/*
==================================================
模式三 C
分數型
==================================================
*/

function makeFractionQuestion() {

  const denominator =
    pick(
      [
        2,
        3,
        4
      ]
    );


  let a1;
  let a2;
  let b1;
  let b2;


  do {

    a1 =
      rand(
        1,
        4
      );


    a2 =
      rand(
        1,
        4
      );


    b1 =
      nonZeroRand(
        -5,
        5
      );


    b2 =
      nonZeroRand(
        -5,
        5
      );

  } while (

    gcd(
      a1,
      Math.abs(
        b1
      )
    ) >
    1 ||

    gcd(
      a2,
      Math.abs(
        b2
      )
    ) >
    1
  );


  const outer =
    F(
      1,
      denominator
    );


  const factor1 = {

    a:
      F(
        a1
      ),

    b:
      F(
        b1
      )
  };


  const factor2 = {

    a:
      F(
        a2
      ),

    b:
      F(
        b2
      )
  };


  const expanded =
    multiplyFactorAnswer(
      outer,
      factor1,
      factor2
    );


  return createRationalQuestion(

    expanded.a,
    expanded.b,
    expanded.c,

    outer,

    factor1,
    factor2,

    "請完成分數型態的因式分解",

    [

      `本題可以先把整體分數係數提出。`,

      `提出
      ${fractionHTML(
        outer
      )}
      後，再觀察括號內的二次三項式。`,

      `利用十字交乘可得到兩個一次因式。`,

      `一種標準寫法為：
      ${factorizedHTML(
        outer,
        factor1,
        factor2
      )}。`,

      `只要你的三個因式乘回去等於原題，也會判定正確。`
    ],

    "fraction"
  );
}


function makeMode3() {

  return shuffle(
    [

      makeCommonFactorQuestion(),
      makeCommonFactorQuestion(),
      makeCommonFactorQuestion(),
      makeCommonFactorQuestion(),

      makeSquareFormulaQuestion(),
      makeSquareFormulaQuestion(),

      makeDifferenceSquaresQuestion(),
      makeDifferenceSquaresQuestion(),

      makeFractionQuestion(),
      makeFractionQuestion()
    ]
  );
}

}

const rationalModes =
  new Map();


const linearModes =
  new Map();


function setRationalMode(
  prefix,
  modeName
) {

  rationalModes.set(
    prefix,
    modeName
  );


  $(`${prefix}-integer-wrap`)
    ?.classList
    .toggle(
      "hidden",
      modeName !==
      "integer"
    );


  $(`${prefix}-fraction-wrap`)
    ?.classList
    .toggle(
      "hidden",
      modeName !==
      "fraction"
    );
}


function setLinearMode(
  prefix,
  modeName
) {

  linearModes.set(
    prefix,
    modeName
  );


  const main =
    $(`${prefix}-a`)
      ?.closest(
        ".factor-linear-editor"
      );


  main
    ?.classList
    .toggle(
      "hidden",
      modeName !==
      "integer"
    );


  $(`${prefix}-fraction-editor`)
    ?.classList
    .toggle(
      "hidden",
      modeName !==
      "fraction"
    );
}


/*
==================================================
讀取有理數
==================================================
*/

function parseUnsignedInteger(
  value
) {

  const raw =
    String(
      value ??
      ""
    )
      .trim();


  if (
    !/^\d+$/
      .test(
        raw
      )
  ) {

    return null;
  }


  return Number(
    raw
  );
}


function readOuterFactor() {

  const modeName =
    rationalModes.get(
      "outer"
    ) ||
    "integer";


  const sign =
    Number(
      $("outer-sign")
        ?.value ??
      1
    );


  if (
    modeName ===
    "integer"
  ) {

    const value =
      parseUnsignedInteger(
        $("outer-int")
          ?.value
      );


    if (
      value ===
      null
    ) {

      return {

        valid:
          false,

        message:
          "請完成整體公因數。"
      };
    }


    if (
      value ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "整體公因數不可為 0。"
      };
    }


    return {

      valid:
        true,

      value:
        F(
          sign *
          value
        )
    };
  }


  const numerator =
    parseUnsignedInteger(
      $("outer-num")
        ?.value
    );


  const denominator =
    parseUnsignedInteger(
      $("outer-den")
        ?.value
    );


  if (
    numerator ===
    null ||

    denominator ===
    null
  ) {

    return {

      valid:
        false,

      message:
        "請完成整體公因數的分子與分母。"
    };
  }


  if (
    denominator ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "整體公因數的分母不可為 0。"
    };
  }


  if (
    numerator ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "整體公因數不可為 0。"
    };
  }


  if (
    gcd(
      numerator,
      denominator
    ) !==
    1
  ) {

    return {

      valid:
        false,

      message:
        "整體公因數的分數還不是最簡分數。"
    };
  }


  return {

    valid:
      true,

    value:
      F(
        sign *
        numerator,
        denominator
      )
  };
}


/*
==================================================
讀取一次因式
==================================================
*/

function readLinearFactor(
  prefix
) {

  const modeName =
    linearModes.get(
      prefix
    ) ||
    "integer";


  const aSign =
    Number(
      $(`${prefix}-a-sign`)
        ?.value ??
      1
    );


  const bSign =
    Number(
      $(`${prefix}-b-sign`)
        ?.value ??
      1
    );


  if (
    modeName ===
    "integer"
  ) {

    const a =
      parseUnsignedInteger(
        $(`${prefix}-a`)
          ?.value
      );


    const b =
      parseUnsignedInteger(
        $(`${prefix}-b`)
          ?.value
      );


    if (
      a ===
      null ||

      b ===
      null
    ) {

      return {

        valid:
          false,

        message:
          "請把兩個一次因式的係數與常數填寫完整。"
      };
    }


    if (
      a ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "一次因式的 x 係數不可為 0。"
      };
    }


    return {

      valid:
        true,

      value: {

        a:
          F(
            aSign *
            a
          ),

        b:
          F(
            bSign *
            b
          )
      }
    };
  }


  const aNum =
    parseUnsignedInteger(
      $(`${prefix}-a-num`)
        ?.value
    );


  const aDen =
    parseUnsignedInteger(
      $(`${prefix}-a-den`)
        ?.value
    );


  const bNum =
    parseUnsignedInteger(
      $(`${prefix}-b-num`)
        ?.value
    );


  const bDen =
    parseUnsignedInteger(
      $(`${prefix}-b-den`)
        ?.value
    );


  if (
    aNum ===
    null ||

    aDen ===
    null ||

    bNum ===
    null ||

    bDen ===
    null
  ) {

    return {

      valid:
        false,

      message:
        "請完成因式中的分數係數。"
    };
  }


  if (
    aDen ===
    0 ||

    bDen ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "因式中的分母不可為 0。"
    };
  }


  if (
    aNum ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "一次因式的 x 係數不可為 0。"
    };
  }


  if (
    gcd(
      aNum,
      aDen
    ) !==
    1 ||

    (
      bNum !==
      0 &&

      gcd(
        bNum,
        bDen
      ) !==
      1
    )
  ) {

    return {

      valid:
        false,

      message:
        "因式中的分數請先化成最簡分數。"
    };
  }


  return {

    valid:
      true,

    value: {

      a:
        F(
          aSign *
          aNum,
          aDen
        ),

      b:
        F(
          bSign *
          bNum,
          bDen
        )
    }
  };
}


/*
==================================================
作答
==================================================
*/

function readAnswer() {

  const outer =
    readOuterFactor();


  if (
    !outer.valid
  ) {

    return outer;
  }


  const first =
    readLinearFactor(
      "factor1"
    );


  if (
    !first.valid
  ) {

    return first;
  }


  const second =
    readLinearFactor(
      "factor2"
    );


  if (
    !second.valid
  ) {

    return second;
  }


  const expanded =
    multiplyFactorAnswer(
      outer.value,
      first.value,
      second.value
    );


  return {

    valid:
      true,

    value: {

      outer:
        outer.value,

      factor1:
        first.value,

      factor2:
        second.value,

      expanded
    },

    display:
      factorizedHTML(
        outer.value,
        first.value,
        second.value
      )
  };
}

function updateAnswerPreview() {

    return;

  preview.innerHTML = `

}

          margin-top:10px;
          color:#64748b;
          font-size:13px;
          font-family:'Microsoft JhengHei',sans-serif;
        "
      >

        因式前後順序可交換；
        正負號或公因數放在其他因式中，只要乘回原式相同，也屬於正確答案。

      </div>

    </div>
  `;
}


/*
==================================================
顯示題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${questions.length}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        questions.length *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .className =
      "feedback";


  $("feedback")
    .textContent =
      "";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderAnswer();


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer();


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  $("answer-panel")
    .querySelectorAll(
      "input, select, button"
    )
    .forEach(
      element => {

        element.disabled =
          true;
      }
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！等價的因式分解也成功判定。";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。參考答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
Timer
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2,"0")}:` +

    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
Sound
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound?.[
      method
    ]?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
Scratchpad
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
Screens
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
Start
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
Rating
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練利用十字交乘法進行因式分解。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意符號與交叉乘積即可。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本方法已掌握，建議再練習平方項係數不為 1 的題目。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從平方項係數為 1 的模式開始，再逐步挑戰其他題型。"
  };
}


/*
==================================================
Result
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "十字交乘成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
Review
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    參考答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
Events
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          startGame(
            button.dataset.mode
          );
        }
      );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


/*
==================================================
Enter
==================================================
*/

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
Init
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showOnly(
  "start-screen"
);

</script>
