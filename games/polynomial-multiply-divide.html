<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    多項式乘除大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=5"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e8
        );
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #eadcf0;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {
      padding: 22px;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 215px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ab47bc
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-weight: 900;
    }

    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      padding:
        14px 6px;

      color:
        #0f172a;

      font-size:
        clamp(
          25px,
          4.5vw,
          42px
        );

      font-weight: 900;

      line-height: 1.75;

      -webkit-overflow-scrolling: touch;
    }

    .math-expression {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: nowrap;

      gap: .10em;

      min-width:
        max-content;

      white-space:
        nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    .math-expression.math-wrap {

      width: 100%;

      min-width: 0;

      max-width:
        900px;

      flex-wrap: wrap;

      white-space: normal;

      column-gap:
        .22em;

      row-gap:
        .32em;

      line-height:
        1.75;
    }

    .question-segment {

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;
    }

    .question-break {

      flex-basis:
        100%;

      width: 0;

      height: 0;
    }

    .math-expression sup,
    .explanation sup,
    .review-question sup,
    .preview-value sup,
    .correct-answer sup,
    .long-division sup {

      position: relative;

      top:
        -.46em;

      margin-left: 1px;

      font-size:
        .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    .negative-monomial {

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;
    }

    .implicit-multiply {

      display:
        inline-flex;

      align-items: center;

      gap: .05em;

      white-space: nowrap;
    }

    .dot-multiply {

      display:
        inline-block;

      padding:
        0 .10em;

      color:
        #111827;

      font-weight: 900;
    }

    /*
    ==================================================
    Math fraction
    ==================================================
    */

    .math-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.5em;

      margin:
        0 .10em;

      vertical-align: middle;

      line-height: 1.05;
    }

    .math-fraction-top {

      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding:
        0 .14em .08em;

      border-bottom:
        2px solid
        currentColor;

      text-align: center;
    }

    .math-fraction-bottom {

      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding:
        .08em .14em 0;

      text-align: center;
    }

    /*
    ==================================================
    Answer panel
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }

    /*
    ==================================================
    Monomial answer
    ==================================================
    */

    .monomial-editor {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .mono-sign-wrap,
    .mono-coefficient-wrap {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;
    }

    .mono-label {

      color:
        #64748b;

      font-size: 13px;

      font-weight: 900;
    }

    .mono-sign-wrap select,
    .integer-coefficient-input {

      height: 58px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background:
        white;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .mono-sign-wrap select {
      width: 78px;
    }

    .integer-coefficient-input {
      width: 110px;
    }

    /*
    ==================================================
    手製分數係數
    ==================================================
    */

    .fraction-coefficient-input {

      position: relative;

      width: 125px;

      overflow: hidden;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background:
        white;
    }

    .fraction-coefficient-input input {

      display: block;

      width: 100%;

      height: 50px;

      padding:
        4px 8px;

      border: 0;

      border-radius: 0;

      background:
        transparent;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .fraction-coefficient-input
    input:first-of-type {

      border-bottom:
        2px solid
        #334155;
    }

    .fraction-coefficient-input
    input::placeholder {

      color:
        #94a3b8;

      opacity: 1;
    }

    /*
    ==================================================
    x 與次方格

    ★ 次方格加寬
    ==================================================
    */

    .monomial-x-power {

      position: relative;

      display:
        inline-flex;

      align-items:
        flex-end;

      min-width:
        128px;

      height:
        82px;

      padding:
        0 66px 8px 0;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .monomial-x {

      font-size:
        42px;

      font-weight: 900;

      line-height: 1;
    }

    .exponent-input {

      position: absolute;

      top: 0;

      right: 0;

      width: 68px;

      height: 46px;

      padding:
        3px 5px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 9px;

      background:
        white;

      font-size: 20px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .exponent-caption {

      position: absolute;

      top:
        -21px;

      right: 0;

      width: 68px;

      color:
        #64748b;

      font-size: 11px;

      font-weight: 900;

      text-align: center;
    }

    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width:
        760px;

      min-height:
        62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .preview-value {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 27px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    ==================================================
    ExpressionInput
    ==================================================
    */

    .polynomial-answer-shell {

      width:
        min(
          100%,
          840px
        );

      margin:
        0 auto;
    }

    /*
    分數係數
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient {

      position:
        relative !important;

      display:
        grid !important;

      grid-template-columns:
        minmax(
          110px,
          150px
        ) !important;

      grid-template-rows:
        1fr 1fr !important;

      gap:
        0 !important;

      width:
        min(
          150px,
          100%
        ) !important;

      min-height:
        106px !important;

      margin:
        0 !important;

      overflow:
        hidden !important;

      border:
        2px solid
        var(--primary-border) !important;

      border-radius:
        12px !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-slash {

      display:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field {

      display:
        flex !important;

      flex-direction:
        column !important;

      align-items:
        center !important;

      justify-content:
        center !important;

      width:
        100% !important;

      height:
        52px !important;

      gap:
        0 !important;

      margin:
        0 !important;

      padding:
        4px 8px !important;

      border:
        0 !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field input {

      width:
        100% !important;

      min-width:
        0 !important;

      height:
        42px !important;

      padding:
        3px !important;

      border:
        0 !important;

      border-radius:
        0 !important;

      outline:
        none !important;

      background:
        transparent !important;

      text-align:
        center !important;

      font-size:
        21px !important;

      font-weight:
        900 !important;

      box-shadow:
        none !important;
    }

    /*
    ★ 分子 / 分母中間橫線
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient::after {

      content: "";

      position: absolute;

      left: 12px;

      right: 12px;

      top: 50%;

      z-index: 10;

      border-top:
        2px solid
        #334155;

      pointer-events: none;
    }

    /*
    ★ 修正圖三：
    元件本身另外出現的小字「分母」隱藏。
    輸入框內的大字 placeholder 仍保留。
    */

    .polynomial-answer-shell
    .expression-input__fraction-field label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    .expression-input__field-label,

    .polynomial-answer-shell
    .expression-input__fraction-field
    small {

      display:
        none !important;
    }

    /*
    ==================================================
    商式＋餘式
    ==================================================
    */

    .division-combined-shell {

      width:
        min(
          100%,
          850px
        );

      margin:
        0 auto;

      padding: 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          #fbf3fd,
          white
        );
    }

    .division-answer-grid {

      display: grid;

      grid-template-columns:
        minmax(
          0,
          1fr
        )
        170px;

      gap: 14px;

      align-items: stretch;
    }

    .division-section-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      font-weight: 900;

      text-align: center;
    }

    .remainder-box {

      display: flex;

      flex-direction: column;

      justify-content:
        flex-start;

      padding: 12px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 14px;

      background:
        white;
    }

    .remainder-box label {

      display: block;

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-size: 18px;

      font-weight: 900;

      text-align: center;
    }

    .remainder-box input {

      width: 100%;

      height: 58px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background:
        white;

      font-size: 23px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .division-preview {
      margin-top: 16px;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {
      color: var(--success);
    }

    .feedback.wrong {
      color: var(--danger);
    }

    .feedback.warning {
      color: var(--warning);
    }

    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border-radius: 14px;

      background:
        #f5ecf8;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-step {

      margin:
        11px 0;
    }

    /*
    ==================================================
    ★ 多項式直式除法
    ==================================================
    */

    .long-division {

      width:
        min(
          100%,
          760px
        );

      margin:
        18px auto;

      padding:
        18px;

      overflow-x:
        auto;

      border:
        2px solid
        #d8b4e2;

      border-radius:
        15px;

      background:
        white;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;

      font-size:
        clamp(
          17px,
          3vw,
          23px
        );
    }

    .long-division-title {

      margin-bottom: 16px;

      color:
        var(--primary-dark);

      font-family:
        "Microsoft JhengHei",
        sans-serif;

      font-size: 16px;

      font-weight: 900;

      text-align: center;
    }

    .long-division-head {

      display: grid;

      grid-template-columns:
        auto
        minmax(
          260px,
          1fr
        );

      align-items: end;

      width:
        max-content;

      min-width: 100%;

      margin-bottom: 8px;
    }

    .long-division-blank {

      min-width: 130px;
    }

    .long-division-quotient {

      padding:
        3px 10px 6px;

      border-bottom:
        2px solid
        #334155;

      text-align: center;

      font-weight: 900;
    }

    .long-division-main {

      display: grid;

      grid-template-columns:
        auto
        minmax(
          260px,
          1fr
        );

      align-items: start;

      width:
        max-content;

      min-width: 100%;
    }

    .long-division-divisor {

      min-width: 130px;

      padding:
        6px 12px 0 0;

      border-right:
        2px solid
        #334155;

      text-align: right;

      white-space: nowrap;
    }

    .long-division-work {

      padding-left: 12px;
    }

    .long-step {

      margin-bottom: 18px;
    }

    .long-step-current {

      padding:
        4px 8px;

      font-weight: 900;
    }

    .long-step-product {

      padding:
        5px 8px;

      border-bottom:
        2px solid
        #334155;
    }

    .long-step-product::before {

      content: "－ ";

  10;


const MODE_NAMES = {

  monomial:
    "單項式乘除",

  multiply:
    "多項式乘法",

  divide:
    "多項式除法",

  mixed:
    "乘除綜合挑戰"
};

  id =>
    document.getElementById(
      id
    );


let mode =
  "monomial";


let questions =
  [];


let index =
  0;


let correct =
  0;


let wrong =
  0;


let combo =
  0;


let maxCombo =
  0;


let records =
  [];


let answered =
  false;


let answerInput =
  null;


let divisionQuotientInput =
  null;


let startTime =
  0;


let elapsed =
  0;


let timerId =
  null;

  false;


/*
==================================================
工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


function gcdArray(
  values
) {

  const numbers =
    values
      .map(
        value =>
          Math.abs(
            Number(
              value
            )
          )
      )
      .filter(
        value =>
          value !==
          0
      );


  if (
    !numbers.length
  ) {

    return 1;
  }


  return numbers.reduce(
    (
      result,
      value
    ) =>
      gcd(
        result,
        value
      )
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  if (
    numerator ===
    0
  ) {

    return {

      numerator:
        0,

      denominator:
        1
    };
  }


  const divisor =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      divisor,

    denominator:
      denominator /
      divisor
  };
}


function addF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator +

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function subF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator -

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.numerator *
    b.numerator,

    a.denominator *
    b.denominator
  );
}


function divF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator,

    a.denominator *
    b.numerator
  );
}


function sameF(
  a,
  b
) {

  const first =
    F(
      a.numerator,
      a.denominator
    );


  const second =
    F(
      b.numerator,
      b.denominator
    );


  return (

    first.numerator ===
      second.numerator &&

    first.denominator ===
      second.denominator
  );
}


function isZeroF(
  value
) {

  return (
    value.numerator ===
    0
  );
}


/*
==================================================
數學顯示
==================================================
*/

function fractionHTML(
  fraction
) {

  const value =
    F(
      fraction.numerator,
      fraction.denominator
    );


  if (
    value.denominator ===
    1
  ) {

    return String(
      value.numerator
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    value.numerator <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          value.numerator
        )}

      </span>

      <span class="math-fraction-bottom">

        ${value.denominator}

      </span>

    </span>
  `;
}


function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }


  if (
    exponent ===
    1
  ) {

    return String(
      base
    );
  }


  return `
    ${base}<sup>${exponent}</sup>
  `;
}


/*
==================================================
單項式
==================================================
*/

function monomialCoreHTML(
  coefficient,
  exponent
) {

  const value =
    F(
      coefficient.numerator,
      coefficient.denominator
    );


  if (
    isZeroF(
      value
    )
  ) {

    return "0";
  }


  const negative =
    value.numerator <
    0;


  const absolute =
    F(
      Math.abs(
        value.numerator
      ),
      value.denominator
    );


  let coefficientText =
    "";


  if (
    exponent ===
    0
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );

  } else if (
    !(
      absolute.numerator ===
      1 &&
      absolute.denominator ===
      1
    )
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );
  }


  return `

    ${
      negative

        ? "−"

        : ""
    }

    ${coefficientText}

    ${
      exponent ===
      0

        ? ""

        : powerHTML(
            "x",
            exponent
          )
    }
  `;
}


function monomialHTML(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  const core =
    monomialCoreHTML(
      coefficient,
      exponent
    );


  const negative =

    F(
      coefficient.numerator,
      coefficient.denominator
    )
      .numerator <
    0;


  if (
    wrapNegative &&
    negative
  ) {

    return `(${core})`;
  }


  return core;
}


function monomialFromInteger(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  return monomialHTML(

    F(
      coefficient
    ),

    exponent,

    wrapNegative
  );
}


/*
==================================================
多項式
==================================================
*/

function normalizePolynomial(
  terms
) {

  const map =
    new Map();


  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );


    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );


    const current =
      map.get(
        exponent
      ) ||
      F(
        0
      );


    map.set(

      exponent,

      addF(
        current,
        coefficient
      )
    );
  }


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        b.exponent -
        a.exponent
    );
}


function polynomialHTML(
  terms
) {

  const polynomial =
    normalizePolynomial(
      terms
    );


  if (
    !polynomial.length
  ) {

    return "0";
  }


  let result =
    "";


  polynomial.forEach(
    (
      term,
      i
    ) => {

      const coefficient =
        F(
          term.coefficient.numerator,
          term.coefficient.denominator
        );


      const negative =
        coefficient.numerator <
        0;


      const absolute =
        F(
          Math.abs(
            coefficient.numerator
          ),
          coefficient.denominator
        );


      if (
        i ===
        0
      ) {

        result +=
          monomialHTML(
            coefficient,
            term.exponent
          );

      } else {

        result +=

          negative

            ? "－"

            : "＋";


        result +=
          monomialHTML(
            absolute,
            term.exponent
          );
      }
    }
  );


  return result;
}


function bracketPolynomial(
  polynomial
) {

  return `(${polynomialHTML(polynomial)})`;
}


function polynomialCoefficientGCD(
  polynomial
) {

  const coefficients =
    normalizePolynomial(
      polynomial
    )
      .map(
        term => {

          if (
            term.coefficient.denominator !==
            1
          ) {

            return null;
          }


          return term.coefficient.numerator;
        }
      );


  if (
    coefficients.some(
      value =>
        value ===
        null
    )
  ) {

    return null;
  }


  return gcdArray(
    coefficients
  );
}


function isPrimitiveIntegerPolynomial(
  polynomial
) {

  return (
    polynomialCoefficientGCD(
      polynomial
    ) ===
    1
  );
}


function leadingTerm(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  return (
    normalized[
      0
    ] ||
    null
  );
}


function degreeOf(
  polynomial
) {

  const leading =
    leadingTerm(
      polynomial
    );


  return (
    leading

      ? leading.exponent

      : -Infinity
  );
}


function addPolynomials(
  first,
  second
) {

  return normalizePolynomial(
    [
      ...first,
      ...second
    ]
  );
}


function subtractPolynomials(
  first,
  second
) {

  return normalizePolynomial(
    [

      ...first,

      ...second.map(
        term => ({

          exponent:
            term.exponent,

          coefficient:
            F(
              -term.coefficient.numerator,
              term.coefficient.denominator
            )
        })
      )
    ]
  );
}


function multiplyTwoPolynomials(
  first,
  second
) {

  const terms =
    [];


  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      terms.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  return normalizePolynomial(
    terms
  );
}


function multiplyPolynomialByMonomial(
  polynomial,
  coefficient,
  exponent
) {

  return normalizePolynomial(

    polynomial.map(
      term => ({

        exponent:
          term.exponent +
          exponent,

        coefficient:
          mulF(
            term.coefficient,
            coefficient
          )
      })
    )
  );
}


function addConstantToPolynomial(
  polynomial,
  constant
) {

  return addPolynomials(

    polynomial,

    [

      {

        exponent:
          0,

        coefficient:
          F(
            constant
          )
      }
    ]
  );
}


/*
==================================================
完整多項式直式除法演算法
==================================================
*/

function polynomialLongDivision(
  dividend,
  divisor
) {

  let current =
    normalizePolynomial(
      dividend
    );


  const divisorNormalized =
    normalizePolynomial(
      divisor
    );


  const quotient =
    [];


  const steps =
    [];


  const divisorLead =
    leadingTerm(
      divisorNormalized
    );


  if (
    !divisorLead
  ) {

    throw new Error(
      "除式不可為 0"
    );
  }


  let guard =
    0;


  while (
    current.length &&
    degreeOf(
      current
    ) >=
    degreeOf(
      divisorNormalized
    ) &&
    guard <
    30
  ) {

    guard++;


    const currentLead =
      leadingTerm(
        current
      );


    const quotientTerm =
      {

        exponent:
          currentLead.exponent -
          divisorLead.exponent,

        coefficient:
          divF(
            currentLead.coefficient,
            divisorLead.coefficient
          )
      };


    quotient.push(
      quotientTerm
    );


    const product =
      multiplyPolynomialByMonomial(

        divisorNormalized,

        quotientTerm.coefficient,

        quotientTerm.exponent
      );


    const remainder =
      subtractPolynomials(
        current,
        product
      );


    steps.push(
      {

        current:
          normalizePolynomial(
            current
          ),

        quotientTerm,

        product,

        remainder:
          normalizePolynomial(
            remainder
          )
      }
    );


    current =
      remainder;
  }


  return {

    quotient:
      normalizePolynomial(
        quotient
      ),

    remainder:
      normalizePolynomial(
        current
      ),

    steps
  };
}

function rawProductTermsHTML(

  second

  for (
    const a of
    first
  ) {

    for (
      const b of
      second

      rawTerms.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  if (
    !rawTerms.length
  ) {

    return "0";
  }


  let html =
    "";


  rawTerms.forEach(
    (
      term,
      i
    ) => {

      const negative =
        term.coefficient.numerator <
        0;


      const absolute =
        F(
          Math.abs(
            term.coefficient.numerator
          ),
          term.coefficient.denominator
        );


      if (
        i ===
        0
      ) {

        html +=
          monomialHTML(
            term.coefficient,
            term.exponent
          );

      } else {

        html +=

          negative

            ? "－"

            : "＋";


        html +=
          monomialHTML(
            absolute,
            term.exponent
          );
      }
    }
  );


  return html;
}


/*

==================================================

function randomPolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  const exponents =
    shuffle(

      Array.from(
        {

          length:
            maxDegree -
            minDegree +
            1
        },

        (
          _,
          i
        ) =>
          minDegree +
          i
      )
    );


  const count =
    Math.min(

      rand(
        minTerms,
        maxTerms
      ),

      exponents.length
    );


  return normalizePolynomial(

    exponents
      .slice(
        0,
        count
      )
      .map(
        exponent => ({

          exponent,

          coefficient:
            F(
              nonZeroRand(
                coefficientMin,
                coefficientMax
              )
            )
        })
      )
  );
}


function randomPrimitivePolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  for (
    let attempt =
      0;

    attempt <
    500;

    attempt++
  ) {

    const polynomial =
      randomPolynomial(
        minDegree,
        maxDegree,
        minTerms,
        maxTerms,
        coefficientMin,
        coefficientMax
      );


    if (
      isPrimitiveIntegerPolynomial(
        polynomial
      )
    ) {

      return polynomial;
    }
  }


  return [

    {

      exponent:
        Math.max(
          1,
          maxDegree
        ),

      coefficient:
        F(
          1
        )
    },

    {

      exponent:
        0,

      coefficient:
        F(
          1
        )
    }
  ];
}

function makeMonomialDivide(
  forceFraction =

) {

  const divisorCoefficient =
    pick(
      [
        2,
        3,

        5,
        6,
        8,
        9
      ]
    ) *
    (
      Math.random() <
      .35

  let numeratorCoefficient;


  if (
    forceFraction

    do {

      numeratorCoefficient =
        nonZeroRand(
          -12,

    } while (
      gcd(
        Math.abs(
          numeratorCoefficient

        Math.abs(
          divisorCoefficient

  } else {

    numeratorCoefficient =
      divisorCoefficient *

  return monomialQuestion(

    `

        divisorCoefficient,

function generateExactDivision() {

  for (
    let attempt =
      0;

    attempt <
    700;

    attempt++
  ) {

    const divisor =
      randomPrimitivePolynomial(
        0,
        1,
        2,

      );


    const quotient =
      randomPrimitivePolynomial(

        -5,
        5
      );


    const dividend =
      multiplyTwoPolynomials(
        divisor,
        quotient
      );


    if (
      dividend.length !==
      3
    ) {

      continue;
    }


    if (
      !isPrimitiveIntegerPolynomial(
        dividend
      )
    ) {

      continue;
    }


    return {

      dividend,

      divisor,

      quotient
    };
  }


  const divisor =
    [

      {
        exponent: 1,
        coefficient: F(1)
      },

      {
        exponent: 0,
        coefficient: F(1)
      }
    ];


  const quotient =

      {
        exponent: 1,
        coefficient: F(2)
      },

      {
        exponent: 0,
        coefficient: F(1)
      }
    ];


  return {

    divisor,

    quotient,

    dividend:
      multiplyTwoPolynomials(
        divisor,
        quotient
      )
  };
}

function makeDivisionWithRemainder(
  missingTerm =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    800;

    attempt++
  ) {

    const divisorConstant =
      nonZeroRand(
        -6,
        6
      );


    const divisor =
      [

        {
          exponent: 1,
          coefficient: F(1)
        },

        {
          exponent: 0,
          coefficient: F(divisorConstant)
        }
      ];


    const quotientLeading =
      nonZeroRand(
        -5,
        5
      );


    const quotientConstant =

      missingTerm

        ? -quotientLeading *
          divisorConstant

        : nonZeroRand(
            -7,
            7
          );


    const quotient =
      normalizePolynomial(
        [

          {
            exponent: 1,
            coefficient: F(quotientLeading)
          },

          {
            exponent: 0,
            coefficient: F(quotientConstant)
          }
        ]
      );


    const remainder =
      nonZeroRand(
        -10,
        10
      );


    const dividend =
      addConstantToPolynomial(

        multiplyTwoPolynomials(
          divisor,
          quotient
        ),

        remainder
      );


    if (
      !isPrimitiveIntegerPolynomial(
        dividend
      )
    ) {

      continue;
    }


    return divisionQuestion(

      `
        ${bracketPolynomial(
          dividend
        )}

        ÷

        ${bracketPolynomial(
          divisor
        )}
      `,

      dividend,

      divisor,

      quotient,

      remainder,

      [

        `先把被除式與除式依降冪排列。`,

        missingTerm

          ? `被除式缺少 x 項，做直式時要把缺少的位置補成 0x。`

          : `由最高次項開始做多項式直式除法。`,

        `每一次都按照：

/*
==================================================
把分數欄位多餘小標籤刪掉
==================================================
*/

function cleanFractionFieldLabels(
  mount
) {

  if (
    !mount
  ) {

    return;
  }


  const clean =
    () => {

      mount
        .querySelectorAll(
          ".expression-input__fraction-field"
        )
        .forEach(
          field => {

            [
              ...field.children
            ]
              .forEach(
                child => {

                  if (
                    child.tagName ===
                    "INPUT"
                  ) {

                    return;
                  }


                  const text =
                    child.textContent
                      ?.trim();


                  if (
                    text ===
                    "分子" ||

                    text ===
                    "分母"
                  ) {

                    child.remove();
                  }
                }
              );
          }
        );
    };


  clean();


  const observer =
    new MutationObserver(
      clean
    );


  observer.observe(
    mount,
    {

      childList:
        true,

      subtree:
        true
    }
  );


  setTimeout(
    () => {

      observer.disconnect();

    },
    20000
  );
}

/*
==================================================
Parse ExpressionInput
==================================================
*/

function parseExpressionInput(
  input
) {

  if (
    !input
  ) {

    return {

      valid:
        false,

      message:
        "多項式輸入器尚未準備完成。"
    };
  }


  const result =
    input.validate();


  if (
    !result.valid
  ) {

    return {

      valid:
        false,

      message:
        result.message ||
        "請將多項式答案輸入完整。"
    };
  }


  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(

              term.coefficient.numerator,

              term.coefficient.denominator
            )
        })
      );


  return {

    valid:
      true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}

/*
==================================================
Read monomial
==================================================
*/

function readMonomialAnswer() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );


  const exponentRaw =
    $("mono-exp")
      ?.value
      .trim() ??
    "";


  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入完整次方。"
    };
  }


  let coefficient;


  if (
    $("mono-int")
  ) {

    const raw =
      $("mono-int")
        .value
        .trim();


    if (
      !/^\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入整數係數。"
      };
    }


    coefficient =
      F(
        sign *
        Number(
          raw
        )
      );

  } else {

    const numeratorRaw =
      $("mono-num")
        ?.value
        .trim() ??
      "";


    const denominatorRaw =
      $("mono-den")
        ?.value
        .trim() ??
      "";


    if (
      !/^\d+$/
        .test(
          numeratorRaw
        ) ||

      !/^\d+$/
        .test(
          denominatorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請填寫完整的分子與分母。"
      };
    }


    const numerator =
      Number(
        numeratorRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不可為 0。"
      };
    }


    if (
      gcd(
        numerator,
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "係數還不是最簡分數，請先約分。"
      };
    }


    coefficient =
      F(
        sign *
        numerator,
        denominator
      );
  }


  const exponent =
    Number(
      exponentRaw
    );


  return {

    valid:
      true,

    value: {

      coefficient,

      exponent
    },

    display:
      monomialHTML(
        coefficient,
        exponent
      )
  };
}

          )
      },

/*
==================================================
判定
==================================================
*/

function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  if (
    a.length !==
    b.length
  ) {

    return false;
  }


  return a.every(
    (
      term,
      i
    ) => {

      return (

        term.exponent ===
          b[
            i
          ].exponent &&

        sameF(
          term.coefficient,
          b[
            i
          ].coefficient
        )
      );
    }
  );
}


function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "monomial"
  ) {

    return (

      sameF(
        answer.value.coefficient,
        question.coefficient
      ) &&

      answer.value.exponent ===
        question.exponent
    );
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return samePolynomial(
      answer.value,
      question.answer
    );
  }


  if (
    question.type ===
    "division"
  ) {

    return (

      samePolynomial(
        answer.value.quotient,
        question.quotient
      ) &&

      answer.value.remainder ===
        question.remainder
    );
  }


  return false;
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerHTML(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return monomialHTML(
      question.coefficient,
      question.exponent
    );
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return polynomialHTML(
      question.answer
    );
  }


  if (
    question.type ===
    "division"
  ) {

    return `

      商式＝
      ${polynomialHTML(
        question.quotient
      )}，

      餘式＝
      ${question.remainder}
    `;
  }


  return "";
}


/*
==================================================
詳解
==================================================
*/

function explanationHTML(
  question,
  showWrongDetail =
    false
) {

  const basic =
    question.explanation
      .map(
        (
          step,
          i
        ) => `

          <div class="explanation-step">

            <strong>

              步驟 ${i + 1}｜

            </strong>

            ${step}

          </div>
        `
      )
      .join("");


  const detail =

    showWrongDetail &&
    question.wrongDetail

      ? `

          <div class="explanation-step">

            <strong>
              完整偵錯過程｜
            </strong>

          </div>

          ${question.wrongDetail}
        `

      : "";


  return (
    basic +
    detail
  );
}


/*
==================================================
題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${TOTAL_QUESTIONS}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        TOTAL_QUESTIONS *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderAnswer(
    question
  );


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
Submit
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  answerInput
    ?.setDisabled
    ?.(
      true
    );


  divisionQuotientInput
    ?.setDisabled
    ?.(
      true
    );


  if (
    $("remainder-answer")
  ) {

    $("remainder-answer")
      .disabled =
        true;
  }


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  /*
  ★ 答錯才加入完整偵錯細節
  */

  $("explanation")
    .innerHTML =
      explanationHTML(
        question,
        !isCorrect
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
Next
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
時間
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
Sound
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound
      ?.[
        method
      ]
      ?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
Scratchpad
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
畫面
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
Start
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  answerInput =
    null;


  divisionQuotientInput =
    null;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
Rating
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理多項式的乘法與除法。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意乘法公式與多項式直式除法。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再加強分配律與多項式除法。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從單項式乘除開始，再逐步挑戰多項式乘除。"
  };
}


/*
==================================================
Result
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "多項式乘除成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
Review
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question,
                      true
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
Events
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );
          }
        );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "start-screen"
      );
    }
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );


window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(
  "start-screen"
);

</script>

</body>

</html>
