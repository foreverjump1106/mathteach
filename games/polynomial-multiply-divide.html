<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多項式乘除大挑戰｜數學遊戲樂園</title>

  <link rel="stylesheet" href="../css/scratchpad.css">
  <link rel="stylesheet" href="../css/expression-input.css?v=5">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e8
        );
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    .page-shell {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    .game-card {
      overflow: hidden;

      border: 1px solid #eadcf0;
      border-top: 8px solid var(--primary);

      border-radius: 26px;

      background: #fff;

      box-shadow:
        0 14px 34px
        rgba(15, 23, 42, .13);
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {
      padding: 24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #fff
        );
    }

    .game-title {
      margin: 0;

      color: var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {
      margin: 10px 0 0;

      color: var(--muted);

      line-height: 1.7;
    }

    .concept-strip {
      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {
      padding: 7px 11px;

      border: 1px solid var(--primary-border);

      border-radius: 999px;

      background: #fff;

      color: var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {
      padding: 22px;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 16px;
    }

    .mode-card {
      min-height: 205px;

      padding: 21px;

      border: 2px solid var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #fff
        );

      text-align: left;

      cursor: pointer;

      transition: .15s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(15, 23, 42, .11);
    }

    .mode-tag {
      display: inline-block;

      margin-bottom: 10px;

      padding: 4px 9px;

      border-radius: 999px;

      background: #fff;

      color: var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {
      margin: 0 0 9px;

      color: var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {
      margin: 0;

      color: var(--muted);

      line-height: 1.7;
    }

    .mode-example {
      margin-top: 10px;

      color: #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {
      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(0, 1fr)
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {
      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background: var(--primary-light);

      color: var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {
      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {
      background: #fff7ed;

      color: #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {
      display: flex;

      justify-content: center;

      min-height: 46px;

      margin: 4px 0 12px;
    }

    #scratchpad-mobile-button {
      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {
      position: static !important;

      inset: auto !important;

      transform: none !important;

      margin: 0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {
      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius: 999px;

      background: #e2e8f0;
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ab47bc
        );

      transition: width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {
      padding: 22px 18px;

      border: 2px solid var(--primary-border);

      border-radius: 20px;

      background: #fff;

      text-align: center;
    }

    .question-label {
      margin-bottom: 10px;

      color: var(--muted);

      font-weight: 900;
    }

    .question-content {
      min-height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      padding: 10px 4px;

      color: #0f172a;

      font-size:
        clamp(
          26px,
          5vw,
          42px
        );

      font-weight: 900;

      line-height: 1.75;

      -webkit-overflow-scrolling: touch;
    }

    .math-expression {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: nowrap;

      gap: .10em;

      min-width: max-content;

      white-space: nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    .math-expression sup,
    .explanation sup,
    .review-question sup,
    .preview-value sup {
      position: relative;

      top: -.48em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }

    .negative-monomial {
      display: inline-flex;

      align-items: center;

      white-space: nowrap;
    }

    .implicit-multiply {
      display: inline-flex;

      align-items: center;

      gap: .05em;

      white-space: nowrap;
    }

    /*
    ==================================================
    分數顯示
    ==================================================
    */

    .math-fraction {
      display: inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.5em;

      margin: 0 .10em;

      vertical-align: middle;

      line-height: 1.05;
    }

    .math-fraction-top {
      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding: 0 .14em .08em;

      border-bottom: 2px solid currentColor;

      text-align: center;
    }

    .math-fraction-bottom {
      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding: .08em .14em 0;

      text-align: center;
    }

    /*
    ==================================================
    作答區
    ==================================================
    */

    .answer-panel {
      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background: #f8fafc;
    }

    .answer-title {
      margin-bottom: 10px;

      color: var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .answer-help {
      margin: 0 0 12px;

      color: #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }

    /*
    ==================================================
    單項式答案格
    ==================================================
    */

    .monomial-editor {
      display: flex;

      justify-content: center;

      align-items: flex-end;

      gap: 10px;

      flex-wrap: wrap;
    }

    .mono-field {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;
    }

    .mono-field label {
      color: #64748b;

      font-size: 13px;

      font-weight: 900;
    }

    .mono-field input,
    .mono-field select {
      height: 54px;

      border: 2px solid #cbd5e1;

      border-radius: 11px;

      background: #fff;

      font-size: 22px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .mono-field input {
      width: 95px;
    }

    .mono-field select {
      width: 78px;
    }

    .mono-x {
      padding-bottom: 10px;

      font-size: 30px;

      font-weight: 900;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .fraction-coefficient-input {
      width: 112px;

      overflow: hidden;

      border: 2px solid #cbd5e1;

      border-radius: 11px;

      background: #fff;
    }

    .fraction-coefficient-input
    .frac-caption {
      display: flex;

      justify-content: space-around;

      padding: 5px 5px 0;

      color: #64748b;

      font-size: 11px;

      font-weight: 900;
    }

    .fraction-coefficient-input input {
      width: 100%;

      height: 45px;

      border: 0;

      border-radius: 0;

      background: transparent;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .fraction-coefficient-input
    input:first-of-type {
      border-bottom: 2px solid #334155;
    }

    /*
    ==================================================
    系統判讀
    ==================================================
    */

    .answer-preview {
      margin: 14px auto 0;

      padding: 13px;

      max-width: 760px;

      min-height: 62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border: 2px solid var(--primary-border);

      border-radius: 13px;

      background: var(--primary-light);

      color: #334155;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .preview-value {
      display: inline-flex;

      align-items: center;

      margin-left: 8px;

      color: var(--primary);

      font-size: 28px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    ==================================================
    多項式答案
    ==================================================
    */

    .polynomial-answer-shell {
      width: min(100%, 840px);

      margin: 0 auto;
    }

    /*
    ExpressionInput 分數係數
    改成上下分子 / 分母
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient {
      display: grid !important;

      grid-template-columns:
        minmax(105px, 145px) !important;

      grid-template-rows:
        auto auto !important;

      gap: 0 !important;

      width:
        min(
          145px,
          100%
        ) !important;

      margin: 0 !important;

      overflow: hidden;

      border:
        2px solid
        var(--primary-border);

      border-radius: 12px;

      background: #fff;
    }

    .polynomial-answer-shell
    .expression-input__fraction-slash {
      display: none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field {
      display: flex !important;

      flex-direction: column !important;

      align-items: center !important;

      justify-content: center !important;

      gap: 3px !important;

      width: 100% !important;

      margin: 0 !important;

      padding: 6px 8px !important;

      background: #fff;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field:first-child {
      border-bottom:
        2px solid
        #334155;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field input {
      width: 100% !important;

      min-width: 0 !important;

      height: 38px !important;

      padding: 4px !important;

      border: 0 !important;

      border-radius: 0 !important;

      outline: none !important;

      background: transparent !important;

      text-align: center !important;

      font-size: 20px !important;

      font-weight: 900 !important;

      box-shadow: none !important;
    }

    /*
    ==================================================
    選擇題
    ==================================================
    */

    .choice-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 10px;
    }

    .choice-button {
      min-height: 62px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: #fff;

      color: #263238;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {
      border-color: var(--primary);

      background: var(--primary-light);

      color: var(--primary-dark);
    }

    /*
    ==================================================
    按鈕
    ==================================================
    */

    .button-row {
      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {
      min-width: 132px;

      padding: 12px 20px;

      border: none;

      border-radius: 12px;

      background: var(--primary);

      color: #fff;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {
      background: #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {
      background: #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {
      background: var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .game-button:disabled {
      opacity: .55;

      cursor: not-allowed;
    }

    /*
    ==================================================
    回饋與詳解
    ==================================================
    */

    .feedback {
      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {
      color: var(--success);
    }

    .feedback.wrong {
      color: var(--danger);
    }

    .feedback.warning {
      color: var(--warning);
    }

    .explanation {
      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background: #f5ecf8;

      color: #334155;

      line-height: 1.95;
    }

    .explanation-step {
      margin: 8px 0;
    }

    /*
    ==================================================
    結果
    ==================================================
    */

    .result-panel {
      text-align: center;
    }

    .result-score {
      margin: 16px 0;

      color: #f57c00;

      font-size: 56px;

      font-weight: 900;
    }

    .result-stars {
      margin-bottom: 10px;

      font-size: 31px;
    }

    .result-grid {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap: 12px;

      margin: 20px 0;
    }

    .result-stat {
      padding: 16px 10px;

      border-radius: 16px;

      background: var(--primary-light);

      color: var(--primary-dark);

      font-weight: 900;
    }

    .save-status {
      min-height: 28px;

      margin: 14px 0 0;

      font-weight: 900;
    }

    /*
    ==================================================
    錯題
    ==================================================
    */

    .review-list {
      display: grid;

      gap: 14px;
    }

    .review-card {
      padding: 18px;

      border: 1px solid #e2e8f0;

      border-radius: 16px;

      background: #fff;
    }

    .review-title {
      color: var(--danger);

      font-weight: 900;
    }

    .review-question {
      margin: 12px 0;

      overflow-x: auto;

      font-size: 22px;

      text-align: center;
    }

    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(max-width: 760px) {

      body {
        padding: 8px;
      }

      .screen {
        padding: 18px 12px;
      }

      .mode-grid {
        grid-template-columns: 1fr;
      }

      .quiz-topbar {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .timer-box {
        grid-column: 1 / -1;
      }

      .choice-grid {
        grid-template-columns: 1fr;
      }

      .result-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .answer-panel {
        padding: 14px 8px;
      }
    }

  </style>
</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">

      <h1 class="game-title">
        ✖️ 多項式乘除大挑戰
      </h1>

      <p class="game-subtitle">
        從單項式乘除開始，逐步挑戰分配律、多項式乘法、多項式除法與綜合題。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          係數相乘除
        </span>

        <span class="concept-chip">
          指數加減
        </span>

        <span class="concept-chip">
          分配律
        </span>

        <span class="concept-chip">
          多項式乘法
        </span>

        <span class="concept-chip">
          多項式除法
        </span>

        <span class="concept-chip">
          最簡分數
        </span>

      </div>

    </header>

    <!--
    ==================================================
    模式首頁
    ==================================================
    -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-grid">

        <button
          class="mode-card"
          type="button"
          data-mode="monomial"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式一｜單項式乘除
          </h2>

          <p>
            練習單項式的乘法與除法。係數可能為負數；除法答案也可能出現分數係數。
          </p>

          <div class="mode-example">
            例如：（－3x²）× 4x、－12x⁵ ÷ 18x³
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="multiply"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式二｜多項式乘法
          </h2>

          <p>
            練習單項式乘多項式，以及兩個多項式相乘。括號相鄰即代表相乘。
          </p>

          <div class="mode-example">
            例如：2x²(3x²＋6x－7)、(x＋3)(x－5)
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="divide"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式三｜多項式除法
          </h2>

          <p>
            被除式與除式的題目係數均為整數；商的係數可能是整數，也可能是最簡分數。
          </p>

          <div class="mode-example">
            包含多項式除以單項式，以及三項式除以二項式。
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="mixed"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式四｜乘除綜合挑戰
          </h2>

          <p>
            綜合單項式乘除、多項式乘法與除法；提高「三項式 ÷ 二項式」的比例。
          </p>

          <div class="mode-example">
            多項式除法題為本模式主要題型之一。
          </div>

        </button>

      </div>

    </section>

    <!--
    ==================================================
    測驗畫面
    ==================================================
    -->

    <section
      id="quiz-screen"
      class="screen hidden"
    >

      <div class="quiz-topbar">

        <div class="status-box">

          模式

          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>

        </div>

        <div class="status-box">

          進度

          <span
            id="question-number"
            class="status-value"
          >
            1 / 10
          </span>

        </div>

        <div class="status-box">

          答對

          <span
            id="correct-count"
            class="status-value"
          >
            0
          </span>

        </div>

        <div class="status-box">

          最高連擊

          <span
            id="combo-count"
            class="status-value"
          >
            0
          </span>

        </div>

        <div class="status-box timer-box">

          測驗時間

          <span
            id="timer-display"
            class="status-value"
          >
            00:00
          </span>

        </div>

      </div>

      <div class="scratchpad-row">

        <div id="scratchpad-mobile-button"></div>

      </div>

      <div class="progress-shell">

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>

      <div class="question-card">

        <div
          id="question-label"
          class="question-label"
        ></div>

        <div
          id="question-content"
          class="question-content"
        ></div>

      </div>

/*
==================================================
基本工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length - 1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const t =
      a %
      b;


    a =
      b;


    b =
      t;
  }


  return (
    a ||
    1
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  const g =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      g,

    denominator:
      denominator /
      g
  };
}


function addF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator +

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function subF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator -

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.numerator *
    b.numerator,

    a.denominator *
    b.denominator
  );
}


function divF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator,

    a.denominator *
    b.numerator
  );
}


function negF(
  a
) {

  return F(
    -a.numerator,
    a.denominator
  );
}


function isZeroF(
  a
) {

  return (
    a.numerator ===
    0
  );
}


function sameF(
  a,
  b
) {

  const x =
    F(
      a.numerator,
      a.denominator
    );


  const y =
    F(
      b.numerator,
      b.denominator
    );


  return (

    x.numerator ===
      y.numerator &&

    x.denominator ===
      y.denominator
  );
}


/*
==================================================
分數顯示
==================================================
*/

function fractionHTML(
  fraction
) {

  const f =
    F(
      fraction.numerator,
      fraction.denominator
    );


  if (
    f.denominator ===
    1
  ) {

    return String(
      f.numerator
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    f.numerator <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          f.numerator
        )}

      </span>

      <span class="math-fraction-bottom">

        ${f.denominator}

      </span>

    </span>
  `;
}


/*
==================================================
次方
==================================================
*/

function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }


  /*
  一次方不顯示 1
  x¹ → x
  */

  if (
    exponent ===
    1
  ) {

    return String(
      base
    );
  }


  return `

    ${base}<sup>${exponent}</sup>
  `;
}


/*
==================================================
單項式顯示
==================================================
*/

function monomialCoreHTML(
  coefficient,
  exponent
) {

  const c =
    F(
      coefficient.numerator,
      coefficient.denominator
    );


  if (
    isZeroF(
      c
    )
  ) {

    return "0";
  }


  const negative =
    c.numerator <
    0;


  const abs =
    F(
      Math.abs(
        c.numerator
      ),
      c.denominator
    );


  let coefficientText =
    "";


  /*
  常數項必須顯示係數
  */

  if (
    exponent ===
    0
  ) {

    coefficientText =
      fractionHTML(
        abs
      );

  } else if (
    !(
      abs.numerator ===
      1 &&
      abs.denominator ===
      1
    )
  ) {

    /*
    1x、1x² 不寫 1
    */

    coefficientText =
      fractionHTML(
        abs
      );
  }


  const variableText =

    exponent ===
    0

      ? ""

      : powerHTML(
          "x",
          exponent
        );


  return `

    ${
      negative

        ? "−"

        : ""
    }

    ${coefficientText}

    ${variableText}
  `;
}


/*
負單項式如果單獨拿來當乘法因數或除式，
加上括號。

例如：
(-3x²) × 4x
12x³ ÷ (-2x)
*/

function monomialHTML(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  const core =
    monomialCoreHTML(
      coefficient,
      exponent
    );


  const negative =

    F(
      coefficient.numerator,
      coefficient.denominator
    )
      .numerator <
    0;


  if (
    wrapNegative &&
    negative
  ) {

    return `

      <span class="negative-monomial">

        (${core})

      </span>
    `;
  }


  return core;
}


function monomialFromInteger(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  return monomialHTML(

    F(
      coefficient
    ),

    exponent,

    wrapNegative
  );
}


/*
==================================================
多項式
==================================================
*/

function normalizePolynomial(
  terms
) {

  const map =
    new Map();


  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );


    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );


    const current =
      map.get(
        exponent
      ) ||
      F(
        0
      );


    map.set(

      exponent,

      addF(
        current,
        coefficient
      )
    );
  }


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        b.exponent -
        a.exponent
    );
}


function polynomialHTML(
  terms
) {

  const normalized =
    normalizePolynomial(
      terms
    );


  if (
    !normalized.length
  ) {

    return "0";
  }


  let result =
    "";


  normalized
    .forEach(
      (
        term,
        i
      ) => {

        const c =
          F(
            term.coefficient.numerator,
            term.coefficient.denominator
          );


        const negative =
          c.numerator <
          0;


        const abs =
          F(
            Math.abs(
              c.numerator
            ),
            c.denominator
          );


        if (
          i ===
          0
        ) {

          result +=
            monomialHTML(
              c,
              term.exponent,
              false
            );

        } else {

          result +=

            negative

              ? "－"

              : "＋";


          result +=
            monomialHTML(
              abs,
              term.exponent,
              false
            );
        }
      }
    );


  return result;
}


function bracketPolynomial(
  terms
) {

  return `

    (
      ${polynomialHTML(
        terms
      )}
    )
  `;
}


/*
==================================================
多項式乘法
==================================================
*/

function multiplyTwoPolynomials(
  first,
  second
) {

  const result =
    [];


  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      result.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  return normalizePolynomial(
    result
  );
}


function multiplyPolynomialByMonomial(
  poly,
  coefficient,
  exponent
) {

  return normalizePolynomial(

    poly.map(
      term => ({

        exponent:
          term.exponent +
          exponent,

        coefficient:
          mulF(
            term.coefficient,
            coefficient
          )
      })
    )
  );
}


/*
==================================================
隨機多項式
==================================================
*/

function randomPolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  const available =
    shuffle(

      Array.from(
        {

          length:
            maxDegree -
            minDegree +
            1
        },

        (
          _,
          i
        ) =>
          minDegree +
          i
      )
    );


  const termCount =
    Math.min(

      rand(
        minTerms,
        maxTerms
      ),

      available.length
    );


  const exponents =
    available.slice(
      0,
      termCount
    );


  return normalizePolynomial(

    exponents.map(
      exponent => ({

        exponent,

        coefficient:
          F(
            nonZeroRand(
              coefficientMin,
              coefficientMax
            )
          )
      })
    )
  );
}


/*
==================================================
題目物件
==================================================
*/

function monomialQuestion(
  html,
  coefficient,
  exponent,
  explanation,
  label,
  allowFraction =
    true
) {

  return {

    type:

  };
}


function polynomialQuestion(
  html,
  answer,
  explanation,
  label,
  allowFractionCoefficients =
    false
) {

  return {

    type:
      "polynomial",

    html:
      `<span class="math-expression">${html}</span>`,

    answer:
      normalizePolynomial(
        answer
      ),

    explanation,

    label,

    allowFractionCoefficients
  };
}


function choiceQuestion(
  html,
  choices,
  answer,
  explanation,
  label
) {

  return {

    type:
      "choice",

    html:
      `<span class="math-expression">${html}</span>`,

  };
}


/*
==================================================
模式一
單項式乘除
==================================================
*/

function makeMonomialMultiply() {

  const a =
    nonZeroRand(
      -9,
      9
    );


  const b =
    nonZeroRand(
      -9,
      9
    );


  const expA =
    rand(
      1,
      4
    );


  const expB =
    rand(
      1,
      4
    );


  const answerCoefficient =
    F(
      a *
      b
    );


  const answerExponent =
    expA +
    expB;


  const html = `

    ${monomialFromInteger(
      a,
      expA,
      true
    )}

    ×

    ${monomialFromInteger(
      b,
      expB,
      true
    )}
  `;


  return monomialQuestion(

    html,

    answerCoefficient,

    answerExponent,

    [

      `係數相乘：
      ${a} × ${b}
      ＝
      ${a * b}。`,

      `同底數相乘，指數相加：
      ${expA}＋${expB}
      ＝
      ${answerExponent}。`,

      `所以答案＝
      ${monomialHTML(
        answerCoefficient,
        answerExponent
      )}。`
    ],

    "請計算單項式的乘積",

    false
  );
}


function makeMonomialDivide(
  forceFraction =
    false
) {

  const denominatorCoefficient =
    pick(
      [
        2,
        3,
        4,
        5,
        6,
        8,
        9
      ]
    );


  const divisorSign =

    Math.random() <
    .35

      ? -1

      : 1;


  const divisorCoefficient =
    denominatorCoefficient *
    divisorSign;


  let numeratorCoefficient;


  if (
    forceFraction
  ) {

    do {

      numeratorCoefficient =
        nonZeroRand(
          -12,
          12
        );

    } while (

      numeratorCoefficient %
        denominatorCoefficient ===
        0 ||

      Math.abs(
        numeratorCoefficient
      ) ===
        denominatorCoefficient
    );

  } else {

    numeratorCoefficient =

      divisorCoefficient *

      nonZeroRand(
        -5,
        5
      );
  }


  const divisorExponent =
    rand(
      1,
      3
    );


  const quotientExponent =
    rand(
      1,
      4
    );


  const numeratorExponent =
    divisorExponent +
    quotientExponent;


  const answerCoefficient =
    F(
      numeratorCoefficient,
      divisorCoefficient
    );


  const html = `

    ${monomialFromInteger(
      numeratorCoefficient,
      numeratorExponent,
      true
    )}

    ÷

    ${monomialFromInteger(
      divisorCoefficient,
      divisorExponent,
      true
    )}
  `;


  return monomialQuestion(

    html,

    answerCoefficient,

    quotientExponent,

    [

      `係數相除：
      ${numeratorCoefficient}
      ÷
      ${divisorCoefficient}
      ＝
      ${fractionHTML(
        answerCoefficient
      )}。`,

      `同底數相除，指數相減：
      ${numeratorExponent}
      －
      ${divisorExponent}
      ＝
      ${quotientExponent}。`,

      `所以答案＝
      ${monomialHTML(
        answerCoefficient,
        quotientExponent
      )}。`
    ],

    "請計算單項式的商；分數係數請化成最簡分數",

    true
  );
}


function makeMode1() {

  return shuffle(
    [

      makeMonomialMultiply(),

      makeMonomialMultiply(),

      makeMonomialMultiply(),

      makeMonomialMultiply(),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        true
      ),

      makeMonomialDivide(
        true
      ),

      makeMonomialDivide(
        true
      )
    ]
  );
}


/*
==================================================
模式二
多項式乘法
==================================================
*/

function makeMonomialTimesPolynomial() {

  const coefficient =
    nonZeroRand(
      -5,
      5
    );


  const exponent =
    rand(
      1,
      2
    );


  const polynomial =
    randomPolynomial(
      0,
      2,
      2,
      3,
      -7,
      7
    );


  const answer =
    multiplyPolynomialByMonomial(

      polynomial,

      F(
        coefficient
      ),

      exponent
    );


  /*
  單項式直接接括號，
  不顯示 ×

  2x²(3x²+6x-7)
  */

  const html = `

    <span class="implicit-multiply">

      ${monomialFromInteger(
        coefficient,
        exponent,
        true
      )}

      ${bracketPolynomial(
        polynomial
      )}

    </span>
  `;


  return polynomialQuestion(

    html,

    answer,

    [

      `單項式與括號相鄰即表示相乘，不必另外寫乘號。`,

      `利用分配律，單項式要乘上括號內每一項。`,

      `係數相乘；x 的次方依同底數相乘規則相加。`,

      `整理後答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "請展開並整理多項式"
  );
}


function makeBinomialProduct() {

  const a =
    nonZeroRand(
      -6,
      6
    );


  const b =
    nonZeroRand(
      -6,
      6
    );


  const first =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            a
          )
      }
    ];


  const second =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            b
          )
      }
    ];


  const answer =
    multiplyTwoPolynomials(
      first,
      second
    );


  /*
  兩個括號直接相鄰，
  不寫 ×
  */

  const html = `

    <span class="implicit-multiply">

      ${bracketPolynomial(
        first
      )}

      ${bracketPolynomial(
        second
      )}

    </span>
  `;


  return polynomialQuestion(

    html,

    answer,

    [

/*
==================================================
多項式除法工具
==================================================
*/

/*
被除式及除式題目係數必須是整數
*/

function allIntegerCoefficients(
  poly
) {

  return poly.every(
    term =>
      term.coefficient.denominator ===
      1
  );
}


function quotientHasFraction(
  poly
) {

  return poly.some(
    term =>
      term.coefficient.denominator !==
      1
  );
}


function makeIntegerQuotient(
  maxDegree =
    2,
  minTerms =
    1,
  maxTerms =
    2
) {

  return randomPolynomial(
    0,
    maxDegree,
    minTerms,
    maxTerms,
    -5,
    5
  );
}


function makeFractionQuotient(
  maxDegree =
    2,
  minTerms =
    1,
  maxTerms =
    2
) {

  const exponents =
    shuffle(

      Array.from(
        {

          length:
            maxDegree +
            1
        },

        (
          _,
          i
        ) =>
          i
      )
    )
      .slice(

        0,

        rand(
          minTerms,
          Math.min(
            maxTerms,
            maxDegree +
            1
          )
        )
      );


  const terms =
    exponents.map(
      (
        exponent,
        i
      ) => {

        /*
        至少第一項製造分數係數
        */

        if (
          i ===
          0
        ) {

          const d =
            pick(
              [
                2,
                3,
                4
              ]
            );


          const n =
            nonZeroRand(
              -5,
              5
            );


          return {

            exponent,

            coefficient:
              F(
                n,
                d
              )
          };
        }


        return {

          exponent,

          coefficient:
            F(
              nonZeroRand(
                -4,
                4
              )
            )
        };
      }
    );


  return normalizePolynomial(
    terms
  );
}


/*
製造具有公因數的整數係數除式，
方便讓商可以出現分數，
但被除式仍維持整數係數。
*/

function makeDivisorWithCommonFactor(
  termCount =
    2
) {

  const factor =
    pick(
      [
        2,
        3,
        4,
        6
      ]
    );


  const maxDegree =

    termCount ===
    2

      ? 1

      : 2;


  const base =
    randomPolynomial(
      0,
      maxDegree,
      termCount,
      termCount,
      -3,
      3
    );


  return normalizePolynomial(

    base.map(
      term => ({

        exponent:
          term.exponent,

        coefficient:
          mulF(
            term.coefficient,
            F(
              factor
            )
          )
      })
    )
  );
}


/*
先建立：

除式 × 商 = 被除式

這樣可以確保題目真的整除。

同時可讓：
題目係數 = 整數
答案商 = 可能有分數
*/

function generateExactPolynomialDivision(
  options =
    {}
) {

  const divisorTerms =

    options.divisorTerms ??
    2;


  const quotientTerms =

    options.quotientTerms ??
    2;


  const forceFraction =
    Boolean(
      options.forceFraction
    );


  const quotientMaxDegree =

    options.quotientMaxDegree ??
    1;


  for (
    let attempt =
      0;

    attempt <
    800;

    attempt++
  ) {

    let divisor;

    let quotient;


    if (
      forceFraction
    ) {

      divisor =
        makeDivisorWithCommonFactor(
          divisorTerms
        );


      quotient =
        makeFractionQuotient(

          quotientMaxDegree,

          quotientTerms,

          quotientTerms
        );

    } else {

      divisor =
        randomPolynomial(

          0,

          divisorTerms ===
          1

            ? 2

            : divisorTerms -
              1,

          divisorTerms,

          divisorTerms,

          -6,

          6
        );


      quotient =
        makeIntegerQuotient(

          quotientMaxDegree,

          quotientTerms,

          quotientTerms
        );
    }


    const dividend =
      multiplyTwoPolynomials(
        divisor,
        quotient
      );


    /*
    題目係數一定整數
    */

    if (
      !allIntegerCoefficients(
        divisor
      )
    ) {

      continue;
    }


    if (
      !allIntegerCoefficients(
        dividend
      )
    ) {

      continue;
    }


    if (
      forceFraction &&
      !quotientHasFraction(
        quotient
      )
    ) {

      continue;
    }


    return {

      dividend,

      divisor,

      quotient
    };
  }


  /*
  後備題
  */

  if (
    forceFraction
  ) {

    const divisor =
      [

        {

          exponent:
            1,

          coefficient:
            F(
              2
            )
        },

        {

          exponent:
            0,

          coefficient:
            F(
              4
            )
        }
      ];


    const quotient =
      [

        {

          exponent:
            1,

          coefficient:
            F(
              1,
              2
            )
        },

        {

          exponent:
            0,

          coefficient:
            F(
              1
            )
        }
      ];


    return {

      divisor,

      quotient,

      dividend:
        multiplyTwoPolynomials(
          divisor,
          quotient
        )
    };
  }


  const divisor =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            2
          )
      }
    ];


  const quotient =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            2
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            3
          )
      }
    ];


  return {

    divisor,

    quotient,

    dividend:
      multiplyTwoPolynomials(
        divisor,
        quotient
      )
  };
}


/*
==================================================
多項式 ÷ 單項式
==================================================
*/

function makePolynomialDivideByMonomial(
  forceFraction =
    false
) {

  const divisorCoefficient =

    pick(
      [
        2,
        3,
        4,
        5,
        6
      ]
    ) *

    (
      Math.random() <
      .25

        ? -1

        : 1
    );


  const divisorExponent =
    rand(
      0,
      1
    );


  let quotient;


  if (
    forceFraction
  ) {

    quotient =
      [

        {

          exponent:
            rand(
              1,
              2
            ),

          coefficient:
            F(

              nonZeroRand(
                -7,
                7
              ),

              Math.abs(
                divisorCoefficient
              )
            )
        },

        {

          exponent:
            0,

          coefficient:
            F(

              nonZeroRand(
                -7,
                7
              ),

              Math.abs(
                divisorCoefficient
              )
            )
        }
      ];

  } else {

    quotient =
      randomPolynomial(
        0,
        2,
        2,
        3,
        -5,
        5
      );
  }


  quotient =
    normalizePolynomial(
      quotient
    );


  const divisor =
    [

      {

        exponent:
          divisorExponent,

        coefficient:
          F(
            divisorCoefficient
          )
      }
    ];


  const dividend =
    multiplyTwoPolynomials(
      divisor,
      quotient
    );


  /*
  如果被除式因為商分數造成非整數，
  重新產生。
  */

  if (
    !allIntegerCoefficients(
      dividend
    )
  ) {

    return makePolynomialDivideByMonomial(
      false
    );
  }


  return polynomialQuestion(

    `

      ${bracketPolynomial(
        dividend
      )}

      ÷

      ${monomialFromInteger(
        divisorCoefficient,
        divisorExponent,
        true
      )}
    `,

    quotient,

    [

      `多項式除以單項式時，被除式的每一項都要分別除以除式。`,

      `係數做除法；同底數相除時指數相減。`,

      `若商的係數是分數，要自行約成最簡分數。`,

      `答案＝
      ${polynomialHTML(
        quotient
      )}。`
    ],

    "請計算多項式的商；分數係數請化成最簡分數",

    true
  );
}


/*
==================================================
三項式 ÷ 二項式
==================================================
*/

function makeThreeTermDivideByBinomial(
  forceFraction =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    500;

    attempt++
  ) {

    const data =
      generateExactPolynomialDivision(
        {

          divisorTerms:
            2,

          quotientTerms:
            2,

          quotientMaxDegree:
            1,

          forceFraction
        }
      );


    /*
    必須真的：
    被除式三項
    除式兩項
    */

    if (
      data.dividend.length !==
      3
    ) {

      continue;
    }


    if (
      data.divisor.length !==
      2
    ) {

      continue;
    }


    return polynomialQuestion(

      `

        ${bracketPolynomial(
          data.dividend
        )}

        ÷

        ${bracketPolynomial(
          data.divisor
        )}
      `,

      data.quotient,

      [

        `先依被除式的最高次項與除式的最高次項，決定商的第一項。`,

        `把商的該項乘回整個除式，再由被除式相減。`,

        `繼續以剩下多項式的最高次項進行相除，直到完成。`,

        forceFraction

          ? `本題商可能含分數係數；分數必須約成最簡分數。`

          : `整理商並依次方由大到小排列。`,

        `答案＝
        ${polynomialHTML(
          data.quotient
        )}。`
      ],

      "請計算多項式的商；答案請依降冪排列",

      true
    );
  }


  return makePolynomialDivideByMonomial(
    forceFraction
  );
}


/*
==================================================
一般多項式除法
==================================================
*/

function makeGeneralPolynomialDivision(
  forceFraction =
    false
) {

  const data =
    generateExactPolynomialDivision(
      {

        divisorTerms:
          2,

        quotientTerms:
          pick(
            [
              1,
              2
            ]
          ),

        quotientMaxDegree:
          2,

        forceFraction
      }
    );


  return polynomialQuestion(

    `

      ${bracketPolynomial(
        data.dividend
      )}

      ÷

      ${bracketPolynomial(
        data.divisor
      )}
    `,

    data.quotient,

    [

      `先比較被除式與除式的最高次項。`,

      `最高次項相除可得到商的下一項。`,

      `用這一項乘回除式，再相減；重複進行直到沒有可再除的項。`,

      forceFraction

        ? `商中的分數係數必須自行約成最簡分數。`

        : `最後把商依降冪排列。`,

      `答案＝
      ${polynomialHTML(
        data.quotient
      )}。`
    ],

    "請計算多項式的商",

    true
  );
}


/*
==================================================
除法指數選擇題
==================================================
*/

function makeDivisionChoice() {

  const numeratorExponent =
    rand(
      3,
      7
    );


  const divisorExponent =
    rand(
      1,
      numeratorExponent -
      1
    );


  const answerExponent =
    numeratorExponent -
    divisorExponent;


  const displayPower =
    exp =>

      exp ===
      1

        ? "x"

        : `x<sup>${exp}</sup>`;


  return choiceQuestion(

    `

      ${displayPower(
        numeratorExponent
      )}

      ÷

      ${displayPower(
        divisorExponent
      )}
    `,

    shuffle(
      [

        {

          value:
            "correct",

          text:
            displayPower(
              answerExponent
            )
        },

        {

          value:
            "add",

          text:
            displayPower(
              numeratorExponent +
              divisorExponent
            )
        },

        {

          value:
            "same",

          text:
            displayPower(
              numeratorExponent
            )
        },

        {

          value:
            "multiply",

          text:
            displayPower(
              numeratorExponent *
              divisorExponent
            )
        }
      ]
    ),

    "correct",

    [

      `同底數相除，底數不變，指數相減。`,

      `${numeratorExponent}
      －
      ${divisorExponent}
      ＝
      ${answerExponent}。`,

      `所以答案為
      ${displayPower(
        answerExponent
      )}。`
    ],

    "請選出正確答案"
  );
}

/*
==================================================
單項式系統預覽
==================================================
*/

function monomialPreviewHTML() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );


  const numeratorRaw =

    $("mono-num")
      ?.value
      .trim() ??
    "";


  const denominatorRaw =

    $("mono-den")
      ?.value
      .trim() ??
    "1";


  const exponentRaw =

    $("mono-exp")
      ?.value
      .trim() ??
    "";


  if (
    !/^\d+$/
      .test(
        numeratorRaw
      ) ||

    !/^\d+$/
      .test(
        denominatorRaw
      ) ||

    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return "";
  }


  const denominator =
    Number(
      denominatorRaw
    );


  if (
    denominator ===
    0
  ) {

    return "";
  }


  const numerator =

    Number(
      numeratorRaw
    ) *

    sign;


  const exponent =
    Number(
      exponentRaw
    );


  if (
    numerator ===
    0
  ) {

    return "0";
  }


  return monomialHTML(

    F(
      numerator,
      denominator
    ),

    exponent
  );
}

  const value =

      ? `

/*
==================================================
作答 UI
==================================================
*/

function renderAnswer(

    null;

    null;

    question.type ===

  }


  if (

  ) {

      question
    );


    return;
  }


  renderChoiceAnswer(
    question
  );
}


/*
==================================================
讀取單項式答案
==================================================
*/

function readMonomialAnswer() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );


  const numeratorRaw =

    $("mono-num")
      ?.value
      .trim() ??
    "";


  const denominatorRaw =

    $("mono-den")
      ?.value
      .trim() ??
    "";


  const exponentRaw =

    $("mono-exp")
      ?.value
      .trim() ??
    "";


  if (
    !/^\d+$/
      .test(
        numeratorRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入係數分子。"
    };
  }


  if (
    !/^\d+$/
      .test(
        denominatorRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入係數分母。"
    };
  }


  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入完整次方。"
    };
  }


  const numerator =
    Number(
      numeratorRaw
    );


  const denominator =
    Number(
      denominatorRaw
    );


  if (
    denominator ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "分母不可為 0。"
    };
  }


  if (
    numerator ===
    0
  ) {

    return {

      valid:
        false,

      message:
        "本題答案不是 0，請重新檢查係數。"
    };
  }


  /*
  不替學生自動約分
  */

  if (
    gcd(
      numerator,
      denominator
    ) !==
    1
  ) {

    return {

      valid:
        false,

      message:
        "係數分數還不是最簡分數，請自行約分後再提交。"
    };
  }


  const coefficient =
    F(

      sign *
      numerator,

      denominator
    );


  const exponent =
    Number(
      exponentRaw
    );


  return {

    valid:
      true,

    value:
      {

        coefficient,

        exponent
      },

    display:
      monomialHTML(
        coefficient,
        exponent
      )
  };
}


/*
==================================================
讀取多項式答案
==================================================
*/

function readPolynomialAnswer() {

  if (
    !answerInput
  ) {

    return {

      valid:
        false,

      message:
        "多項式輸入器尚未準備完成。"
    };
  }


  const result =
    answerInput
      .validate();


  if (
    !result.valid
  ) {

    return {

      valid:
        false,

      message:
        result.message ||
        "請將多項式答案輸入完整。"
    };
  }


  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(

              term.coefficient.numerator,

              term.coefficient.denominator
            )
        })
      );


  return {

    valid:
      true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}


/*
==================================================
讀取選擇題
==================================================
*/

function readChoiceAnswer(
  question
) {

  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}


function readAnswer(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return readMonomialAnswer();
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return readPolynomialAnswer();
  }


  return readChoiceAnswer(
    question
  );
}


/*
==================================================
多項式判定
==================================================
*/

function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  if (
    a.length !==
    b.length
  ) {

    return false;
  }


  return a.every(
    (
      term,
      i
    ) => {

      const other =
        b[
          i
        ];


      return (

        term.exponent ===
          other.exponent &&

        sameF(
          term.coefficient,
          other.coefficient
        )
      );
    }
  );
}


/*
==================================================
答案判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "monomial"
  ) {

    return (

      sameF(
        answer.value.coefficient,
        question.coefficient
      ) &&

      answer.value.exponent ===
        question.exponent
    );
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return samePolynomial(

      answer.value,

      question.answer
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerHTML(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return monomialHTML(

      question.coefficient,

      question.exponent
    );
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return polynomialHTML(
      question.answer
    );
  }


  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          question.answer
      );


  return (
    choice?.text ||
    question.answer
  );
}


/*
==================================================
詳解
==================================================
*/

function explanationHTML(
  question
) {

  return question.explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>

            步驟 ${i + 1}｜

          </strong>

          ${step}

        </div>
      `
    )
    .join("");
}


/*
==================================================
顯示題目
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${TOTAL_QUESTIONS}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        TOTAL_QUESTIONS *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList

      "hidden"
    );


  $("submit-button")
    .classList
    .remove(

    );


  $("next-button")

    .add(

    );


  renderAnswer(

/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  answerInput
    ?.setDisabled
    ?.(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
時間
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
音效
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound
      ?.[
        method
      ]
      ?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
計算紙
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
畫面切換
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(

            "hidden",

            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
開始遊戲
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  selectedChoice =
    null;


  answerInput =
    null;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理多項式的乘法與除法。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意指數規則、分數係數與多項式除法。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再加強分配律與多項式除法。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從單項式乘除重新練習，再逐步挑戰多項式乘除。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(

      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "多項式乘除成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

事件
==================================================
*/

document

  );

      startGame(

    }
  );

      showOnly(

      );

    showReview

  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


/*
==================================================
Enter
==================================================
*/

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList

            "hidden"

      ) {

        answered

初始化
==================================================
*/

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(

);
