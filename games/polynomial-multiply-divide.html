<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多項式乘除大挑戰｜數學遊戲樂園</title>

<link rel="stylesheet" href="../css/scratchpad.css">
<link rel="stylesheet" href="../css/expression-input.css?v=5">

<style>
* {
  box-sizing: border-box;
}

:root {
  --primary: #7b1fa2;
  --primary-dark: #4a148c;
  --primary-light: #f3e5f5;
  --primary-border: #ce93d8;
  --text: #1f2937;
  --muted: #64748b;
  --success: #15803d;
  --danger: #b91c1c;
  --warning: #b45309;
  --restart: #00897b;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 16px;
  font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, #f3e5f5, #fff8e8);
}

button,
input,
select {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

.page-shell {
  width: min(100%, 980px);
  margin: 0 auto;
}

#commonHeaderMount {
  margin-bottom: 14px;
}

.game-card {
  overflow: hidden;
  border: 1px solid #eadcf0;
  border-top: 8px solid var(--primary);
  border-radius: 26px;
  background: #fff;
  box-shadow: 0 14px 34px rgba(15, 23, 42, .13);
}

.game-header {
  padding: 24px 20px 18px;
  text-align: center;
  background: linear-gradient(180deg, var(--primary-light), #fff);
}

.game-title {
  margin: 0;
  color: var(--primary-dark);
  font-size: clamp(28px, 5vw, 40px);
}

.game-subtitle {
  margin: 10px 0 0;
  color: var(--muted);
  line-height: 1.7;
}

.concept-strip {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.concept-chip {
  padding: 7px 11px;
  border: 1px solid var(--primary-border);
  border-radius: 999px;
  background: #fff;
  color: var(--primary-dark);
  font-size: 14px;
  font-weight: 900;
}

.screen {
  padding: 22px;
}

/* =========================
   模式首頁
========================= */

.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.mode-card {
  min-height: 215px;
  padding: 21px;
  border: 2px solid var(--primary-border);
  border-radius: 20px;
  background: linear-gradient(180deg, var(--primary-light), #fff);
  text-align: left;
  cursor: pointer;
  transition: .15s ease;
}

.mode-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(15, 23, 42, .11);
}

.mode-tag {
  display: inline-block;
  margin-bottom: 10px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #fff;
  color: var(--primary-dark);
  font-size: 12px;
  font-weight: 900;
}

.mode-card h2 {
  margin: 0 0 9px;
  color: var(--primary-dark);
  font-size: 21px;
}

.mode-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
}

.mode-example {
  margin-top: 10px;
  color: #475569;
  font-size: 14px;
  font-weight: 900;
  line-height: 1.65;
}

/* =========================
   狀態列
========================= */

.quiz-topbar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.status-box {
  min-height: 66px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 8px;
  border-radius: 14px;
  background: var(--primary-light);
  color: var(--primary-dark);
  text-align: center;
  font-weight: 900;
}

.status-value {
  margin-top: 3px;
  font-size: 18px;
}

.timer-box {
  background: #fff7ed;
  color: #c2410c;
}

/* =========================
   計算紙
========================= */

.scratchpad-row {
  display: flex;
  justify-content: center;
  min-height: 46px;
  margin: 4px 0 12px;
}

#scratchpad-mobile-button {
  display: flex;
  justify-content: center;
  width: 100%;
}

#scratchpad-mobile-button #scratchpadOpenButton,
#scratchpad-mobile-button .scratchpad-open-button {
  position: static !important;
  inset: auto !important;
  transform: none !important;
  margin: 0 !important;
}

/* =========================
   進度
========================= */

.progress-shell {
  height: 10px;
  margin-bottom: 16px;
  overflow: hidden;
  border-radius: 999px;
  background: #e2e8f0;
}

.progress-bar {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #ab47bc);
  transition: width .2s ease;
}

/* =========================
   題目
========================= */

.question-card {
  padding: 22px 18px;
  border: 2px solid var(--primary-border);
  border-radius: 20px;
  background: #fff;
  text-align: center;
}

.question-label {
  margin-bottom: 10px;
  color: var(--muted);
  font-weight: 900;
}

.question-content {
  min-height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: auto;
  padding: 10px 4px;
  color: #0f172a;
  font-size: clamp(26px, 5vw, 42px);
  font-weight: 900;
  line-height: 1.75;
  -webkit-overflow-scrolling: touch;
}

.math-expression {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: .10em;
  min-width: max-content;
  white-space: nowrap;
  font-family:
    "Cambria Math",
    "Times New Roman",
    "Microsoft JhengHei",
    serif;
}

.math-expression sup,
.explanation sup,
.review-question sup,
.preview-value sup,
.correct-answer sup {
  position: relative;
  top: -.48em;
  margin-left: 1px;
  font-size: .60em;
  line-height: 1;
  vertical-align: baseline;
}

.negative-monomial,
.implicit-multiply {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
}

.implicit-multiply {
  gap: .05em;
}

.dot-multiply {
  display: inline-block;
  padding: 0 .12em;
  font-weight: 900;
  color: #111827;
}

/* =========================
   數學分數
========================= */

.math-fraction {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  min-width: 1.5em;
  margin: 0 .10em;
  vertical-align: middle;
  line-height: 1.05;
}

.math-fraction-top {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 100%;
  padding: 0 .14em .08em;
  border-bottom: 2px solid currentColor;
  text-align: center;
}

.math-fraction-bottom {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 100%;
  padding: .08em .14em 0;
  text-align: center;
}

/* =========================
   作答區
========================= */

.answer-panel {
  margin-top: 16px;
  padding: 18px;
  border-radius: 18px;
  background: #f8fafc;
}

.answer-title {
  margin-bottom: 10px;
  color: var(--primary-dark);
  text-align: center;
  font-weight: 900;
}

.answer-help {
  margin: 0 0 12px;
  color: #64748b;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.65;
}

/* =========================
   單項式答案
========================= */

.monomial-editor {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.mono-sign-wrap,
.mono-coefficient-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.mono-label {
  color: #64748b;
  font-size: 13px;
  font-weight: 900;
}

.mono-sign-wrap select,
.integer-coefficient-input {
  height: 58px;
  border: 2px solid #cbd5e1;
  border-radius: 11px;
  background: #fff;
  font-size: 24px;
  font-weight: 900;
  text-align: center;
  outline: none;
}

.mono-sign-wrap select {
  width: 78px;
}

.integer-coefficient-input {
  width: 105px;
}

.fraction-coefficient-input {
  width: 118px;
  overflow: hidden;
  border: 2px solid #cbd5e1;
  border-radius: 11px;
  background: #fff;
}

.fraction-coefficient-input input {
  width: 100%;
  height: 46px;
  border: 0;
  background: transparent;
  font-size: 21px;
  font-weight: 900;
  text-align: center;
  outline: none;
}

.fraction-coefficient-input input:first-child {
  border-bottom: 2px solid #334155;
}

.fraction-mini-labels {
  display: grid;
  grid-template-columns: 1fr;
  padding: 4px 6px 0;
  color: #64748b;
  font-size: 11px;
  font-weight: 900;
  text-align: center;
}

/*
x 與右上方次方答案格
*/
.monomial-x-power {
  position: relative;
  display: inline-flex;
  align-items: flex-end;
  min-width: 105px;
  height: 78px;
  padding: 0 48px 8px 0;
  font-family:
    "Cambria Math",
    "Times New Roman",
    serif;
}

.monomial-x {
  font-size: 42px;
  font-weight: 900;
  line-height: 1;
}

.exponent-input {
  position: absolute;
  top: 0;
  right: 0;
  width: 50px;
  height: 43px;
  border: 2px solid #cbd5e1;
  border-radius: 9px;
  background: #fff;
  font-size: 20px;
  font-weight: 900;
  text-align: center;
  outline: none;
}

.exponent-caption {
  position: absolute;
  top: -20px;
  right: 0;
  color: #64748b;
  font-size: 11px;
  font-weight: 900;
}

/* =========================
   系統判讀
========================= */

.answer-preview {
  margin: 14px auto 0;
  padding: 13px;
  max-width: 760px;
  min-height: 62px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  border: 2px solid var(--primary-border);
  border-radius: 13px;
  background: var(--primary-light);
  color: #334155;
  text-align: center;
  font-size: 19px;
  font-weight: 900;
}

.preview-value {
  display: inline-flex;
  align-items: center;
  margin-left: 8px;
  color: var(--primary);
  font-size: 28px;
  font-family:
    "Cambria Math",
    "Times New Roman",
    "Microsoft JhengHei",
    serif;
}

/* =========================
   ExpressionInput
   分數改成上下形式
========================= */

.polynomial-answer-shell {
  width: min(100%, 840px);
  margin: 0 auto;
}

.polynomial-answer-shell
.expression-input__fraction-coefficient {
  display: grid !important;
  grid-template-columns: minmax(105px, 145px) !important;
  grid-template-rows: auto auto !important;
  gap: 0 !important;
  width: min(145px, 100%) !important;
  margin: 0 !important;
  overflow: hidden;
  border: 2px solid var(--primary-border);
  border-radius: 12px;
  background: #fff;
}

.polynomial-answer-shell
.expression-input__fraction-slash {
  display: none !important;
}

.polynomial-answer-shell
.expression-input__fraction-field {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 3px !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 6px 8px !important;
  background: #fff;
}

.polynomial-answer-shell
.expression-input__fraction-field:first-child {
  border-bottom: 2px solid #334155;
}

.polynomial-answer-shell
.expression-input__fraction-field input {
  width: 100% !important;
  min-width: 0 !important;
  height: 38px !important;
  padding: 4px !important;
  border: 0 !important;
  border-radius: 0 !important;
  outline: none !important;
  background: transparent !important;
  text-align: center !important;
  font-size: 20px !important;
  font-weight: 900 !important;
  box-shadow: none !important;
}

/* =========================
   商式 + 餘式
========================= */

.division-answer-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px;
  gap: 14px;
  align-items: start;
}

.remainder-box {
  padding: 12px;
  border: 2px solid var(--primary-border);
  border-radius: 14px;
  background: #fff;
}

.remainder-box label {
  display: block;
  margin-bottom: 8px;
  color: var(--primary-dark);
  font-weight: 900;
  text-align: center;
}

.remainder-box input {
  width: 100%;
  height: 54px;
  border: 2px solid #cbd5e1;
  border-radius: 11px;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  outline: none;
}

/* =========================
   選擇題
========================= */

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.choice-button {
  min-height: 62px;
  padding: 11px;
  border: 2px solid var(--primary-border);
  border-radius: 13px;
  background: #fff;
  color: #263238;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

.choice-button.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  color: var(--primary-dark);
}

/* =========================
   按鈕
========================= */

.button-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.game-button {
  min-width: 132px;
  padding: 12px 20px;
  border: 0;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--primary-dark);
}

.game-button.secondary {
  background: #607d8b;
  box-shadow: 0 5px 0 #455a64;
}

.game-button.orange {
  background: #f57c00;
  box-shadow: 0 5px 0 #d86600;
}

.game-button.restart {
  background: var(--restart);
  box-shadow: 0 5px 0 #00695c;
}

.game-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

/* =========================
   回饋與詳解
========================= */

.feedback {
  min-height: 48px;
  margin-top: 14px;
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  line-height: 1.7;
}

.feedback.correct {
  color: var(--success);
}

.feedback.wrong {
  color: var(--danger);
}

.feedback.warning {
  color: var(--warning);
}

.explanation {
  margin-top: 12px;
  padding: 16px;
  border-radius: 14px;
  background: #f5ecf8;
  color: #334155;
  line-height: 1.95;
}

.explanation-step {
  margin: 8px 0;
}

/* =========================
   結果
========================= */

.result-panel {
  text-align: center;
}

.result-score {
  margin: 16px 0;
  color: #f57c00;
  font-size: 56px;
  font-weight: 900;
}

.result-stars {
  margin-bottom: 10px;
  font-size: 31px;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.result-stat {
  padding: 16px 10px;
  border-radius: 16px;
  background: var(--primary-light);
  color: var(--primary-dark);
  font-weight: 900;
}

.save-status {
  min-height: 28px;
  margin: 14px 0 0;
  font-weight: 900;
}

/* =========================
   錯題
========================= */

.review-list {
  display: grid;
  gap: 14px;
}

.review-card {
  padding: 18px;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  background: #fff;
}

.review-title {
  color: var(--danger);
  font-weight: 900;
}

.review-question {
  margin: 12px 0;
  overflow-x: auto;
  font-size: 22px;
  text-align: center;
}

/* =========================
   手機
========================= */

@media(max-width: 760px) {

  body {
    padding: 8px;
  }

  .screen {
    padding: 18px 12px;
  }

  .mode-grid {
    grid-template-columns: 1fr;
  }

  .quiz-topbar {
    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );
  }

  .timer-box {
    grid-column: 1 / -1;
  }

  .choice-grid {
    grid-template-columns: 1fr;
  }

  .result-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );
  }

  .answer-panel {
    padding: 14px 8px;
  }

  .division-answer-grid {
    grid-template-columns: 1fr;
  }

  .question-content {
    justify-content: flex-start;
  }
}
</style>
</head>

<body>

<div class="page-shell">

  <div id="commonHeaderMount"></div>

  <main class="game-card">

    <header class="game-header">

      <h1 class="game-title">
        ✖️➗ 多項式乘除大挑戰
      </h1>

      <p class="game-subtitle">
        依課本順序練習單項式乘除、分配律與乘法公式、多項式乘法及多項式除法。
      </p>

      <div class="concept-strip">

        <span class="concept-chip">
          單項式乘除
        </span>

        <span class="concept-chip">
          分配律
        </span>

        <span class="concept-chip">
          乘法公式
        </span>

        <span class="concept-chip">
          多項式乘法
        </span>

        <span class="concept-chip">
          多項式除法
        </span>

        <span class="concept-chip">
          商式與餘式
        </span>

      </div>

    </header>

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-grid">

        <button
          class="mode-card"
          type="button"
          data-mode="monomial"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式一｜單項式乘除
          </h2>

          <p>
            係數做乘除，同底數冪次做指數加減；負單項式作因數時用括號呈現。
          </p>

          <div class="mode-example">
            例如：（－3x²）‧4x、－12x⁵÷18x³
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="multiply"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式二｜多項式乘法
          </h2>

          <p>
            分配律、一次式乘一次式、二次式乘一次式，以及乘法公式型題目。
          </p>

          <div class="mode-example">
            例如：(2x－3)(5x＋4)、(x＋3)²、(2x＋5)(2x－5)
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="divide"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式三｜多項式除法
          </h2>

          <p>
            降冪排列、缺項補 0、求商式與餘式，以及「被除式＝除式×商式＋餘式」。
          </p>

          <div class="mode-example">
            含課本型三項式÷二項式與分數係數商
          </div>

        </button>

        <button
          class="mode-card"
          type="button"
          data-mode="mixed"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式四｜乘除綜合挑戰
          </h2>

          <p>
            整合前三模式，保留乘法公式與多項式除法，並加入一至兩題進階題。
          </p>

          <div class="mode-example">
            適合完成 1-3 後的綜合複習
          </div>

        </button>

      </div>

    </section>

    <section
      id="quiz-screen"
      class="screen hidden"
    >

      <div class="quiz-topbar">

        <div class="status-box">
          模式
          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>
        </div>

        <div class="status-box">
          進度
          <span
            id="question-number"
            class="status-value"
          >
            1 / 10
          </span>
        </div>

        <div class="status-box">
          答對
          <span
            id="correct-count"
            class="status-value"
          >
            0
          </span>
        </div>

        <div class="status-box">
          最高連擊
          <span
            id="combo-count"
            class="status-value"
          >
            0
          </span>
        </div>

        <div class="status-box timer-box">
          測驗時間
          <span
            id="timer-display"
            class="status-value"
          >
            00:00
          </span>
        </div>

      </div>

      <div class="scratchpad-row">
        <div id="scratchpad-mobile-button"></div>
      </div>

      <div class="progress-shell">
        <div
          id="progress-bar"
          class="progress-bar"
        ></div>
      </div>

      <div class="question-card">

        <div
          id="question-label"
          class="question-label"
        ></div>

        <div
          id="question-content"
          class="question-content"
        ></div>

      </div>

      <div
        id="answer-panel"
        class="answer-panel"
      ></div>

      <div class="button-row">

/* =========================
   基本工具
========================= */

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}

function nonZeroRand(
  min,
  max
) {

  let value =
    0;

  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }

  return value;
}

function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}

function shuffle(
  array
) {

  const result =
    [...array];

  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }

  return result;
}

function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );

  b =
    Math.abs(
      b
    );

  while (
    b
  ) {

    const temp =
      a %
      b;

    a =
      b;

    b =
      temp;
  }

  return (
    a ||
    1
  );
}

/* =========================
   分數
========================= */

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為0"
    );
  }

  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;

    denominator =
      -denominator;
  }

  const g =
    gcd(
      numerator,
      denominator
    );

  return {

    numerator:
      numerator /
      g,

    denominator:
      denominator /
      g
  };
}

function addF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator +

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}

function mulF(
  a,
  b
) {

  return F(

    a.numerator *
    b.numerator,

    a.denominator *
    b.denominator
  );
}

function sameF(
  a,
  b
) {

  const first =
    F(
      a.numerator,
      a.denominator
    );

  const second =
    F(
      b.numerator,
      b.denominator
    );

  return (
    first.numerator ===
      second.numerator &&

    first.denominator ===
      second.denominator
  );
}

function isZeroF(
  value
) {

  return (
    value.numerator ===
    0
  );
}

/* =========================
   數學顯示
========================= */

function fractionHTML(
  fraction
) {

  const f =
    F(
      fraction.numerator,
      fraction.denominator
    );

  if (
    f.denominator ===
    1
  ) {

    return String(
      f.numerator
    )
      .replace(
        "-",
        "−"
      );
  }

  const sign =
    f.numerator <
    0

      ? "−"

      : "";

  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          f.numerator
        )}

      </span>

      <span class="math-fraction-bottom">

        ${f.denominator}

      </span>

    </span>
  `;
}

function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }

  /*
  一次方省略
  x¹ → x
  */

  if (
    exponent ===
    1
  ) {

    return String(
      base
    );
  }

  return `
    ${base}<sup>${exponent}</sup>
  `;
}

/* =========================
   單項式顯示
========================= */

function monomialCoreHTML(
  coefficient,
  exponent
) {

  const c =
    F(
      coefficient.numerator,
      coefficient.denominator
    );

  if (
    isZeroF(
      c
    )
  ) {

    return "0";
  }

  const negative =
    c.numerator <
    0;

  const absolute =
    F(
      Math.abs(
        c.numerator
      ),
      c.denominator
    );

  let coefficientText =
    "";

  if (
    exponent ===
    0
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );

  } else if (
    !(
      absolute.numerator ===
      1 &&

      absolute.denominator ===
      1
    )
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );
  }

  return `

    ${
      negative
        ? "−"
        : ""
    }

    ${coefficientText}

    ${
      exponent ===
      0

        ? ""

        : powerHTML(
            "x",
            exponent
          )
    }
  `;
}

function monomialHTML(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  const core =
    monomialCoreHTML(
      coefficient,
      exponent
    );

  const negative =
    F(
      coefficient.numerator,
      coefficient.denominator
    )
      .numerator <
    0;

  if (
    wrapNegative &&
    negative
  ) {

    return `

      <span class="negative-monomial">

        (${core})

      </span>
    `;
  }

  return core;
}

function monomialFromInteger(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  return monomialHTML(

    F(
      coefficient
    ),

    exponent,

    wrapNegative
  );
}

/* =========================
   多項式工具
========================= */

function normalizePolynomial(
  terms
) {

  const map =
    new Map();

  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );

    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );

    const current =
      map.get(
        exponent
      ) ||
      F(
        0
      );

    map.set(

      exponent,

      addF(
        current,
        coefficient
      )
    );
  }

  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        b.exponent -
        a.exponent
    );
}

function polynomialHTML(
  terms
) {

  const polynomial =
    normalizePolynomial(
      terms
    );

  if (
    !polynomial.length
  ) {

    return "0";
  }

  let result =
    "";

  polynomial
    .forEach(
      (
        term,
        i
      ) => {

        const coefficient =
          F(
            term.coefficient.numerator,
            term.coefficient.denominator
          );

        const negative =
          coefficient.numerator <
          0;

        const absolute =
          F(
            Math.abs(
              coefficient.numerator
            ),
            coefficient.denominator
          );

        if (
          i ===
          0
        ) {

          result +=
            monomialHTML(
              coefficient,
              term.exponent
            );

        } else {

          result +=
            negative

              ? "－"

              : "＋";

          result +=
            monomialHTML(
              absolute,
              term.exponent
            );
        }
      }
    );

  return result;
}

function bracketPolynomial(
  terms
) {

  return `
    (
      ${polynomialHTML(
        terms
      )}
    )
  `;
}

function multiplyTwoPolynomials(
  first,
  second
) {

  const result =
    [];

  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      result.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }

  return normalizePolynomial(
    result
  );
}

function multiplyPolynomialByMonomial(
  polynomial,
  coefficient,
  exponent
) {

  return normalizePolynomial(

    polynomial.map(
      term => ({

        exponent:
          term.exponent +
          exponent,

        coefficient:
          mulF(
            term.coefficient,
            coefficient
          )
      })
    )
  );
}

function addConstantToPolynomial(
  polynomial,
  constant
) {

  return normalizePolynomial(
    [

      ...polynomial,

      {
        exponent:
          0,

        coefficient:
          F(
            constant
          )
      }
    ]
  );
}

function randomPolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  const exponents =
    shuffle(

      Array.from(
        {
          length:
            maxDegree -
            minDegree +
            1
        },

        (
          _,
          i
        ) =>
          minDegree +
          i
      )
    )
      .slice(
        0,
        Math.min(

          rand(
            minTerms,
            maxTerms
          ),

          maxDegree -
          minDegree +
          1
        )
      );

  return normalizePolynomial(

    exponents.map(
      exponent => ({

        exponent,

        coefficient:
          F(
            nonZeroRand(
              coefficientMin,
              coefficientMax
            )
          )
      })
    )
  );
}

/* =========================
   題目物件
========================= */

function monomialQuestion(
  html,
  coefficient,
  exponent,

  label
) {

  return {

}

function polynomialQuestion(

function divisionQuestion(

function choiceQuestion(

}

/* ==================================================
   模式一：單項式乘除
================================================== */

function makeMonomialMultiply() {

  const a =
    nonZeroRand(
      -9,
      9
    );

  const b =
    nonZeroRand(
      -9,
      9
    );

  const exponentA =
    rand(
      1,
      4
    );

  const exponentB =
    rand(
      1,
      4
    );

  const answerCoefficient =
    F(
      a *
      b
    );

  const answerExponent =
    exponentA +
    exponentB;

  /*
  課本型：
  單項式乘法使用黑色 ‧
  負單項式作因數時加括號
  */

  return monomialQuestion(

    `

      ${monomialFromInteger(
        a,
        exponentA,
        true
      )}

      <span class="dot-multiply">
        ‧
      </span>

      ${monomialFromInteger(
        b,
        exponentB,
        true
      )}
    `,

    answerCoefficient,

    answerExponent,

    [

      `先算係數：
      ${a} × ${b}
      ＝
      ${a * b}。`,

      `同底數相乘，底數不變，指數相加：
      ${exponentA}＋${exponentB}
      ＝
      ${answerExponent}。`,

      `所以答案＝
      ${monomialHTML(
        answerCoefficient,
        answerExponent
      )}。`
    ],

    "請計算單項式的乘積"
  );
}

function makeMonomialDivide(
  forceFraction =
    false
) {

  const divisorCoefficient =
    pick(
      [
        2,
        3,
        4,
        5,
        6,
        8,
        9
      ]
    ) *
    (
      Math.random() <
      .35

        ? -1

        : 1
    );

  let numeratorCoefficient;

  if (
    forceFraction
  ) {

    do {

      numeratorCoefficient =
        nonZeroRand(
          -12,
          12
        );

    } while (

      numeratorCoefficient %
        Math.abs(
          divisorCoefficient
        ) ===
        0 ||

      Math.abs(
        numeratorCoefficient
      ) ===
        Math.abs(
          divisorCoefficient
        )
    );

  } else {

    numeratorCoefficient =
      divisorCoefficient *
      nonZeroRand(
        -5,
        5
      );
  }

  const divisorExponent =
    rand(
      1,
      3
    );

  const answerExponent =
    rand(
      1,
      4
    );

  const numeratorExponent =
    divisorExponent +
    answerExponent;

  const answerCoefficient =
    F(
      numeratorCoefficient,
      divisorCoefficient
    );

  return monomialQuestion(

    `

      ${monomialFromInteger(
        numeratorCoefficient,
        numeratorExponent,
        true
      )}

      ÷

      ${monomialFromInteger(
        divisorCoefficient,
        divisorExponent,
        true
      )}
    `,

    answerCoefficient,

    answerExponent,

    [

      `先算係數：
      ${numeratorCoefficient}
      ÷
      ${divisorCoefficient}
      ＝
      ${fractionHTML(
        answerCoefficient
      )}。`,

      `同底數相除，底數不變，指數相減：
      ${numeratorExponent}
      －
      ${divisorExponent}
      ＝
      ${answerExponent}。`,

      `所以答案＝
      ${monomialHTML(
        answerCoefficient,
        answerExponent
      )}。`
    ],

    "請計算單項式的商；分數係數請化成最簡分數"
  );
}

function makeMode1() {

  return shuffle(
    [

      makeMonomialMultiply(),
      makeMonomialMultiply(),
      makeMonomialMultiply(),
      makeMonomialMultiply(),
      makeMonomialMultiply(),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        false
      ),

      makeMonomialDivide(
        true
      ),

      makeMonomialDivide(
        true
      )
    ]
  );
}

/* ==================================================
   模式二：多項式乘法
================================================== */

function makeMonomialTimesPolynomial() {

  const coefficient =
    nonZeroRand(
      -5,
      5
    );

  const exponent =
    rand(
      1,
      2
    );

  const polynomial =
    randomPolynomial(
      0,
      2,
      2,
      3,
      -7,
      7
    );

  const answer =
    multiplyPolynomialByMonomial(

      polynomial,

      F(
        coefficient
      ),

      exponent
    );

  return polynomialQuestion(

    `

      <span class="implicit-multiply">

        ${monomialFromInteger(
          coefficient,
          exponent,
          true
        )}

        ${bracketPolynomial(
          polynomial
        )}

      </span>
    `,

    answer,

    [

      `單項式與括號相鄰，表示兩者相乘。`,

      `利用分配律，單項式必須乘括號內的每一項。`,

      `係數相乘，同底數的 x 指數相加。`,

      `整理後答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "請利用分配律展開並整理"
  );
}

function makeBinomialProduct() {

  const a =
    nonZeroRand(
      -6,
      6
    );

  const b =
    nonZeroRand(
      -6,
      6
    );

  const first =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            a
          )
      }
    ];

  const second =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            b
          )
      }
    ];

  const answer =
    multiplyTwoPolynomials(
      first,
      second
    );

  return polynomialQuestion(

    `

      <span class="implicit-multiply">

        ${bracketPolynomial(
          first
        )}

        ${bracketPolynomial(
          second
        )}

      </span>
    `,

    answer,

    [

      `兩個括號相鄰即表示相乘，不需要另外寫乘號。`,

      `第一個括號的每一項，都要乘第二個括號的每一項。`,

      `乘開後將同類項合併。`,

      `整理後答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "請展開並整理多項式"
  );
}

function makeQuadraticTimesLinear() {

  const first =
    randomPolynomial(
      0,
      2,
      2,
      3,
      -5,
      5
    );

  const second =
    randomPolynomial(
      0,
      1,
      2,
      2,
      -4,
      4
    );

  const answer =
    multiplyTwoPolynomials(
      first,
      second
    );

  return polynomialQuestion(

    `

      <span class="implicit-multiply">

        ${bracketPolynomial(
          first
        )}

        ${bracketPolynomial(
          second
        )}

      </span>
    `,

    answer,

    [

      `先觀察兩個多項式是否已依降冪排列。`,

      `用一次式的每一項，分別乘二次式的每一項。`,

      `將乘積中的同類項合併。`,

      `整理後答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "請利用分配律展開並整理"
  );
}

/*
完全平方：
(A+B)²
(A-B)²
*/

function makeSquareFormula(
  kind
) {

  const a =
    pick(
      [
        1,
        2,
        3
      ]
    );

  const b =
    rand(
      1,
      7
    );

  const sign =
    kind ===
    "minus"

      ? -1

      : 1;

  const polynomial =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            a
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            sign *
            b
          )
      }
    ];

  const answer =
    multiplyTwoPolynomials(
      polynomial,
      polynomial
    );

  const formula =
    kind ===
    "minus"

      ? "(A－B)²＝A²－2AB＋B²"

      : "(A＋B)²＝A²＋2AB＋B²";

  return polynomialQuestion(

    `

      ${bracketPolynomial(
        polynomial
      )}

      <sup>2</sup>
    `,

    answer,

    [

      `先辨認完全平方公式：
      ${formula}。`,

      `本題
      A＝
      ${monomialFromInteger(
        a,
        1
      )}，
      B＝${b}。`,

      `代入公式並整理。`,

      `答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "請利用乘法公式展開"
  );
}

/* ==================================================
   模式三：多項式除法
================================================== */

function allIntegerCoefficients(
  polynomial
) {

  return polynomial.every(
    term =>
      term.coefficient.denominator ===
      1
  );
}

function quotientHasFraction(
  polynomial
) {

  return polynomial.some(
    term =>
      term.coefficient.denominator !==
      1
  );
}

function makeFractionQuotient() {

  const denominator =
    pick(
      [
        2,
        3,
        4
      ]
    );

  const numerator =
    nonZeroRand(
      -5,
      5
    );

  return normalizePolynomial(
    [

      {
        exponent:
          1,

        coefficient:
          F(
            numerator,
            denominator
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            nonZeroRand(
              -4,
              4
            )
          )
      }
    ]
  );
}

function makeDivisorWithCommonFactor() {

  const factor =
    pick(
      [
        2,
        3,
        4,
        6
      ]
    );

  const base =
    randomPolynomial(
      0,
      1,
      2,
      2,
      -3,
      3
    );

  return normalizePolynomial(

    base.map(
      term => ({

        exponent:
          term.exponent,

        coefficient:
          mulF(
            term.coefficient,
            F(
              factor
            )
          )
      })
    )
  );
}

/*
先用：
除式 × 商式 ＝ 被除式

保證題目可以整除。
*/

function generateExactDivision(
  forceFraction =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    800;

    attempt++
  ) {

    const divisor =
      forceFraction

        ? makeDivisorWithCommonFactor()

        : randomPolynomial(
            0,
            1,
            2,
            2,
            -6,
            6
          );

    const quotient =
      forceFraction

        ? makeFractionQuotient()

        : randomPolynomial(
            0,
            1,
            2,
            2,
            -5,
            5
          );

    const dividend =
      multiplyTwoPolynomials(
        divisor,
        quotient
      );

    if (
      allIntegerCoefficients(
        divisor
      ) &&

      allIntegerCoefficients(
        dividend
      ) &&

      (
        !forceFraction ||

        quotientHasFraction(
          quotient
        )
      )
    ) {

      return {

        dividend,

        divisor,

        quotient
      };
    }
  }

  const divisor =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            2
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            4
          )
      }
    ];

  const quotient =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            1,
            2
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            1
          )
      }
    ];

  return {

    divisor,

    quotient,

    dividend:
      multiplyTwoPolynomials(
        divisor,
        quotient
      )
  };
}

/*
多項式 ÷ 單項式
*/

function makePolynomialDivideByMonomial(
  forceFraction =
    false
) {

  const divisorCoefficient =
    pick(
      [
        2,
        3,
        4,
        5,
        6
      ]
    ) *
    (
      Math.random() <
      .25

        ? -1

        : 1
    );

  const divisorExponent =
    rand(
      0,
      1
    );

  let quotient;

  if (
    forceFraction
  ) {

    quotient =
      normalizePolynomial(
        [

          {
            exponent:
              rand(
                1,
                2
              ),

            coefficient:
              F(
                nonZeroRand(
                  -7,
                  7
                ),

                Math.abs(
                  divisorCoefficient
                )
              )
          },

          {
            exponent:
              0,

            coefficient:
              F(
                nonZeroRand(
                  -7,
                  7
                ),

                Math.abs(
                  divisorCoefficient
                )
              )
          }
        ]
      );

  } else {

    quotient =
      randomPolynomial(
        0,
        2,
        2,
        3,
        -5,
        5
      );
  }

  const divisor =
    [

      {
        exponent:
          divisorExponent,

        coefficient:
          F(
            divisorCoefficient
          )
      }
    ];

  const dividend =
    multiplyTwoPolynomials(
      divisor,
      quotient
    );

  if (
    !allIntegerCoefficients(
      dividend
    )
  ) {

    return makePolynomialDivideByMonomial(
      false
    );
  }

  return polynomialQuestion(

    `

      ${bracketPolynomial(
        dividend
      )}

      ÷

      ${monomialFromInteger(
        divisorCoefficient,
        divisorExponent,
        true
      )}
    `,

    quotient,

    [

      `被除式的每一項，都要分別除以單項式。`,

      `係數做除法；同底數相除時，指數相減。`,

      `如果商的係數為分數，必須化成最簡分數。`,

      `答案＝
      ${polynomialHTML(
        quotient
      )}。`
    ],

    "請計算多項式的商"
  );
}

/*
三項式 ÷ 二項式
可整除
*/

function makeExactBinomialDivision(
  forceFraction =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    500;

    attempt++
  ) {

    const data =
      generateExactDivision(
        forceFraction
      );

    if (
      data.dividend.length ===
        3 &&

      data.divisor.length ===
        2
    ) {

      return polynomialQuestion(

        `

          ${bracketPolynomial(
            data.dividend
          )}

          ÷

          ${bracketPolynomial(
            data.divisor
          )}
        `,

        data.quotient,

        [

          `先把被除式與除式依降冪排列。`,

          `用被除式最高次項除以除式最高次項，得到商的第一項。`,

          `把商的第一項乘回整個除式，再相減。`,

          `重複同樣步驟，直到除盡。`,

          `所以商式＝
          ${polynomialHTML(
            data.quotient
          )}。`
        ],

        "請計算多項式的商；分數係數請化成最簡分數"
      );
    }
  }

  return makePolynomialDivideByMonomial(
    forceFraction
  );
}

/*
求商式與餘式
其中 missingTerm = true 時製造缺項
*/

function makeDivisionWithRemainder(
  missingTerm =
    false
) {

  const constantOfDivisor =
    nonZeroRand(
      -5,
      5
    );

  const quotientLeading =
    nonZeroRand(
      -4,
      4
    );

  const quotientConstant =
    missingTerm

      ? -quotientLeading *
        constantOfDivisor

      : nonZeroRand(
          -6,
          6
        );

  const remainder =
    nonZeroRand(
      -12,
      12
    );

  const divisor =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            constantOfDivisor
          )
      }
    ];

  const quotient =
    [

      {
        exponent:
          1,

        coefficient:
          F(
            quotientLeading
          )
      },

      {
        exponent:
          0,

        coefficient:
          F(
            quotientConstant
          )
      }
    ];

  const dividend =
    addConstantToPolynomial(

      multiplyTwoPolynomials(
        divisor,
        quotient
      ),

      remainder
    );

  return divisionQuestion(

    `

      ${bracketPolynomial(
        dividend
      )}

      ÷

      ${bracketPolynomial(
        divisor
      )}
    `,

    quotient,

    remainder,

    [

      `先把被除式、除式依降冪排列
      ${
        missingTerm

          ? "；本題中間缺少 x 項，做直式時要補上 0x"

          : ""
      }。`,

      `用被除式最高次項除以除式最高次項，得到商的第一項。`,

      `把這一項乘回除式，再由被除式相減。`,

      `繼續以上步驟，直到餘式次數低於除式。`,

      `最後得到：
      商式＝
      ${polynomialHTML(
        quotient
      )}，
      餘式＝
      ${remainder}。`
    ],

    "請填寫商式與餘式"
  );
}

/*
被除式＝除式×商式＋餘式
*/

function makeFindDividendQuestion() {

  const constantOfDivisor =

    );

    );

          )
      },

        exponent:

          F(

          )
      }
    ];

  const dividend =
    addConstantToPolynomial(

      multiplyTwoPolynomials(

    );

    `

      除式＝
      ${bracketPolynomial(
        divisor
      )}，

      商式＝
      ${bracketPolynomial(

      餘式＝${remainder}，

      ${bracketPolynomial(

      )}
      ${bracketPolynomial(

      `再加上餘式

    ],

}

function makeMode3() {

  return shuffle(

/* =========================
   單項式預覽
========================= */

function monomialPreviewHTML() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );

  const exponentRaw =
    $("mono-exp")
      ?.value
      .trim() ??
    "";

  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return "";
  }

  const exponent =
    Number(
      exponentRaw
    );

  let coefficient;

  /*
  整數答案：
  只顯示一個整數格
  */
  if (
    $("mono-int")
  ) {

    const raw =
      $("mono-int")
        .value
        .trim();

    if (
      !/^\d+$/
        .test(
          raw
        )
    ) {

      return "";
    }

    coefficient =
      F(
        sign *
        Number(
          raw
        )
      );

  } else {

    /*
    分數答案：
    才出現分子 / 分母
    */

    const numerator =
      $("mono-num")
        ?.value
        .trim() ??
      "";

    const denominator =
      $("mono-den")
        ?.value
        .trim() ??
      "";

    if (
      !/^\d+$/
        .test(
          numerator
        ) ||

      !/^\d+$/
        .test(
          denominator
        ) ||

      Number(
        denominator
      ) ===
        0
    ) {

      return "";
    }

    coefficient =
      F(
        sign *
        Number(
          numerator
        ),

        Number(
          denominator
        )
      );
  }

  return monomialHTML(
    coefficient,
    exponent
  );
}

function updateMonomialPreview() {

  const preview =
    $("answer-preview");

  if (
    !preview
  ) {

    return;
  }

  const value =
    monomialPreviewHTML();

  preview.innerHTML =
    value

      ? `

          目前答案：

          <span class="preview-value">

            ${value}

          </span>
        `

      : "目前尚未完成答案。";
}

/* =========================
   讀取單項式答案
========================= */

function readMonomialAnswer() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );

  const exponentRaw =
    $("mono-exp")
      ?.value
      .trim() ??
    "";

  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入完整次方。"
    };
  }

  let coefficient;

  if (
    $("mono-int")
  ) {

    const raw =
      $("mono-int")
        .value
        .trim();

    if (
      !/^\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入整數係數。"
      };
    }

    coefficient =
      F(
        sign *
        Number(
          raw
        )
      );

  } else {

    const numerator =
      $("mono-num")
        ?.value
        .trim() ??
      "";

    const denominator =
      $("mono-den")
        ?.value
        .trim() ??
      "";

    if (
      !/^\d+$/
        .test(
          numerator
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入分子。"
      };
    }

    if (
      !/^\d+$/
        .test(
          denominator
        ) ||

      Number(
        denominator
      ) ===
        0
    ) {

      return {

        valid:
          false,

        message:
          "請輸入正確分母。"
      };
    }

    if (
      gcd(
        Number(
          numerator
        ),

        Number(
          denominator
        )
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "係數分數還不是最簡分數，請先約分。"
      };
    }

    coefficient =
      F(
        sign *
        Number(
          numerator
        ),

        Number(
          denominator
        )
      );
  }

  const exponent =
    Number(
      exponentRaw
    );

  return {

    valid:
      true,

    value: {

      coefficient,

      exponent
    },

    display:
      monomialHTML(
        coefficient,
        exponent
      )
  };
}

/* =========================
   讀取 ExpressionInput
========================= */

function parseExpressionInput(
  input
) {

  if (
    !input
  ) {

    return {

      valid:
        false,

      message:
        "多項式輸入器尚未準備完成。"
    };
  }

  const result =
    input.validate();

  if (
    !result.valid
  ) {

    return {

      valid:
        false,

      message:
        result.message ||
        "請將多項式答案輸入完整。"
    };
  }

  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(
              term.coefficient.numerator,
              term.coefficient.denominator
            )
        })
      );

  return {

    valid:
      true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}

function readAnswer(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return readMonomialAnswer();
  }

  if (
    question.type ===
    "polynomial"
  ) {

    return parseExpressionInput(
      answerInput
    );
  }

  if (
    question.type ===
    "division"
  ) {

    const quotientResult =
      parseExpressionInput(
        divisionQuotientInput
      );

    if (
      !quotientResult.valid
    ) {

      return quotientResult;
    }

    const remainderRaw =
      $("remainder-answer")
        ?.value
        .trim() ??
      "";

    if (
      !/^-?\d+$/
        .test(
          remainderRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入整數餘式。"
      };
    }

    return {

      valid:
        true,

      value: {

        quotient:
          quotientResult.value,

        remainder:
          Number(
            remainderRaw
          )
      },

      display:
        `商式 ${quotientResult.display}，餘式 ${remainderRaw}`
    };
  }

  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }

  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );

  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}

/* =========================
   判定
========================= */

function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );

  const b =
    normalizePolynomial(
      second
    );

  if (
    a.length !==
    b.length
  ) {

    return false;
  }

  return a.every(
    (
      term,
      i
    ) =>
      term.exponent ===
        b[i].exponent &&

      sameF(
        term.coefficient,
        b[i].coefficient
      )
  );
}

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "monomial"
  ) {

    return (
      sameF(
        answer.value.coefficient,
        question.coefficient
      ) &&

      answer.value.exponent ===
        question.exponent
    );
  }

  if (
    question.type ===
    "polynomial"
  ) {

    return samePolynomial(
      answer.value,
      question.answer
    );
  }

  if (
    question.type ===
    "division"
  ) {

    return (
      samePolynomial(
        answer.value.quotient,
        question.quotient
      ) &&

      answer.value.remainder ===
        question.remainder
    );
  }

  return (
    answer.value ===
    question.answer
  );
}

/* =========================
   正確答案
========================= */

function correctAnswerHTML(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return monomialHTML(
      question.coefficient,
      question.exponent
    );
  }

  if (
    question.type ===
    "polynomial"
  ) {

    return polynomialHTML(
      question.answer
    );
  }

  if (
    question.type ===
    "division"
  ) {

    return `

      商式
      ${polynomialHTML(
        question.quotient
      )}，

      餘式
      ${question.remainder}
    `;
  }

  const choice =
    question.choices
      .find(
        item =>
          item.value ===
          question.answer
      );

  return (
    choice?.text ||
    question.answer
  );
}

/* =========================
   提交
========================= */

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }

  const question =
    questions[
      index
    ];

  const answer =
    readAnswer(
      question
    );

  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";

    $("feedback")
      .textContent =
        answer.message;

    return;
  }

  answered =
    true;

  answerInput
    ?.setDisabled
    ?.(
      true
    );

  divisionQuotientInput
    ?.setDisabled
    ?.(
      true
    );

  const isCorrect =
    checkCorrect(
      question,
      answer
    );

  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );

    $("feedback")
      .className =
        "feedback correct";

    $("feedback")
      .textContent =
        "✨ 回答正確！";

    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;

    $("feedback")
      .className =
        "feedback wrong";

    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;

    playGameSound(
      "playWrong"
    );
  }

  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );

  $("correct-count")
    .textContent =
      correct;

  $("combo-count")
    .textContent =
      maxCombo;

  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );

  $("explanation")
    .classList
    .remove(
      "hidden"
    );

  $("submit-button")
    .classList
    .add(
      "hidden"
    );

  $("next-button")
    .classList
    .remove(
      "hidden"
    );

  $("next-button")
    .textContent =
      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";

  $("next-button")
    .focus();
}

/* =========================
   時間
========================= */

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );

  const remain =
    seconds %
    60;

  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}

function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );

    timerId =
      null;
  }

  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}

function startTimer() {

  stopTimer(
    false
  );

  startTime =
    Date.now();

  elapsed =
    0;

  $("timer-display")
    .textContent =
      "00:00";

  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );

        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

  ) {

  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意乘法公式、降冪排列與商式餘式。"
    };
  }

  if (
    score >=
    60
  ) {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再加強分配律與多項式除法。"
    };
  }

/* =========================
   Firestore
========================= */

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }

  scoreSaved =
    true;

  const status =
    $("save-status");

  status.textContent =
    "☁️ 正在儲存本次成績……";

  status.style.color =
    "#1d4ed8";

  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );

    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";

      status.style.color =
        "#15803d";

      return;
    }

    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";

      status.style.color =
        "#b45309";

      return;
    }

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "多項式乘除成績儲存失敗：",
      error
    );

    status.textContent =
      "⚠️ 成績暫時無法儲存。";

    status.style.color =
      "#b91c1c";
  }
}

/* =========================
   錯題回顧
========================= */

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );

  $("review-list")
    .innerHTML =
      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;

  showOnly(
    "review-screen"
  );
}

/* =========================
   事件
========================= */

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );
          }
        );
    }
  );

$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );

$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );

$("restart-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();

      showOnly(
        "start-screen"
      );
    }
  );

$("again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );

$("review-button")
  .addEventListener(
    "click",
    showReview
  );

$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );

$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );

/* =========================
   Enter
========================= */

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }

      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }

      event.preventDefault();

      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );

/* =========================
   初始化
========================= */

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();

      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );

showOnly(
  "start-screen"
);

</script>
