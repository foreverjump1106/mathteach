<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    多項式乘除大挑戰｜數學遊戲樂園
  </title>

  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >

  <link
    rel="stylesheet"
    href="../css/expression-input.css?v=5"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }

    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e8
        );
    }

    button,
    input,
    select {

      font-family: inherit;
    }

    .hidden {

      display: none !important;
    }

    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }

    #commonHeaderMount {

      margin-bottom: 14px;
    }

    .game-card {

      overflow: hidden;

      border:
        1px solid
        #eadcf0;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }

    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }

    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }

    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }

    .screen {

      padding: 22px;
    }

    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }

    .mode-card {

      min-height: 215px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }

    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }

    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }

    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }

    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }

    /*
    ==================================================
    狀態列
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }

    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }

    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }

    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }

    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }

    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }

    /*
    ==================================================
    進度
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }

    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ab47bc
        );

      transition:
        width .2s ease;
    }

    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        white;

      text-align: center;
    }

    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-weight: 900;
    }

    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      padding:
        14px 6px;

      color:
        #0f172a;

      font-size:
        clamp(
          25px,
          4.5vw,
          42px
        );

      font-weight: 900;

      line-height: 1.75;

      -webkit-overflow-scrolling: touch;
    }

    .math-expression {

      display:
        inline-flex;

      align-items: center;

      justify-content: center;

      flex-wrap: nowrap;

      gap: .10em;

      min-width:
        max-content;

      white-space:
        nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    長題目允許自動換行
    */

    .math-expression.math-wrap {

      width: 100%;

      min-width: 0;

      max-width:
        900px;

      flex-wrap: wrap;

      white-space:
        normal;

      column-gap:
        .22em;

      row-gap:
        .32em;

      line-height:
        1.75;
    }

    .question-segment {

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;
    }

    .question-break {

      flex-basis:
        100%;

      width: 0;

      height: 0;
    }

    .math-expression sup,
    .explanation sup,
    .review-question sup,
    .preview-value sup,
    .correct-answer sup {

      position: relative;

      top:
        -.48em;

      margin-left: 1px;

      font-size:
        .60em;

      line-height: 1;

      vertical-align:
        baseline;
    }

    .negative-monomial {

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;
    }

    .implicit-multiply {

      display:
        inline-flex;

      align-items: center;

      gap: .05em;

      white-space: nowrap;
    }

    .dot-multiply {

      display:
        inline-block;

      padding:
        0 .10em;

      color:
        #111827;

      font-weight: 900;
    }

    /*
    ==================================================
    數學分數顯示
    ==================================================
    */

    .math-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.5em;

      margin:
        0 .10em;

      vertical-align: middle;

      line-height: 1.05;
    }

    .math-fraction-top {

      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding:
        0 .14em .08em;

      border-bottom:
        2px solid
        currentColor;

      text-align: center;
    }

    .math-fraction-bottom {

      display: flex;

      justify-content: center;

      align-items: center;

      min-width: 100%;

      padding:
        .08em .14em 0;

      text-align: center;
    }

    /*
    ==================================================
    Answer panel
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }

    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }

    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }

    /*
    ==================================================
    單項式答案
    ==================================================
    */

    .monomial-editor {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .mono-sign-wrap,
    .mono-coefficient-wrap {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 5px;
    }

    .mono-label {

      color:
        #64748b;

      font-size: 13px;

      font-weight: 900;
    }

    .mono-sign-wrap select,
    .integer-coefficient-input {

      height: 58px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background: white;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .mono-sign-wrap select {

      width: 78px;
    }

    .integer-coefficient-input {

      width: 105px;
    }

    /*
    自訂分數係數格
    */

    .fraction-coefficient-input {

      position: relative;

      width: 120px;

      overflow: hidden;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background:
        white;
    }

    .fraction-coefficient-input input {

      display: block;

      width: 100%;

      height: 48px;

      padding:
        4px 8px;

      border: 0;

      border-radius: 0;

      background:
        transparent;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    /*
    ★ 修正：
    原本 input:first-child 會因為前方有 div 而失效。
    改成 first-of-type。
    */

    .fraction-coefficient-input
    input:first-of-type {

      border-bottom:
        2px solid
        #334155;
    }

    .fraction-coefficient-input
    input::placeholder {

      color:
        #94a3b8;

      opacity: 1;
    }

    /*
    另外用 pseudo element 再保險補一次中線
    */

    .fraction-coefficient-input::after {

      content: "";

      position: absolute;

      left: 10px;

      right: 10px;

      top: 50%;

      border-top:
        2px solid
        #334155;

      pointer-events: none;
    }

    .monomial-x-power {

      position: relative;

      display:
        inline-flex;

      align-items:
        flex-end;

      min-width:
        105px;

      height:
        78px;

      padding:
        0 48px 8px 0;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }

    .monomial-x {

      font-size:
        42px;

      font-weight: 900;

      line-height: 1;
    }

    .exponent-input {

      position: absolute;

      top: 0;

      right: 0;

      width: 50px;

      height: 43px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 9px;

      background:
        white;

      font-size: 20px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .exponent-caption {

      position: absolute;

      top:
        -20px;

      right: 0;

      color:
        #64748b;

      font-size: 11px;

      font-weight: 900;
    }

    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width:
        760px;

      min-height:
        62px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 19px;

      font-weight: 900;
    }

    .preview-value {

      display:
        inline-flex;

      align-items: center;

      flex-wrap: wrap;

      justify-content: center;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 27px;

      font-family:
        "Cambria Math",
        "Times New Roman",
        "Microsoft JhengHei",
        serif;
    }

    /*
    ==================================================
    ExpressionInput
    ==================================================
    */

    .polynomial-answer-shell {

      width:
        min(
          100%,
          840px
        );

      margin:
        0 auto;
    }

    /*
    分數係數改成真正上下式
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient {

      position:
        relative !important;

      display:
        grid !important;

      grid-template-columns:
        minmax(
          105px,
          145px
        ) !important;

      grid-template-rows:
        1fr 1fr !important;

      gap:
        0 !important;

      width:
        min(
          145px,
          100%
        ) !important;

      min-height:
        102px !important;

      margin:
        0 !important;

      overflow:
        hidden !important;

      border:
        2px solid
        var(--primary-border) !important;

      border-radius:
        12px !important;

      background:
        white !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-slash {

      display:
        none !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field {

      display:
        flex !important;

      flex-direction:
        column !important;

      align-items:
        center !important;

      justify-content:
        center !important;

      gap:
        2px !important;

      width:
        100% !important;

      height:
        50px !important;

      margin:
        0 !important;

      padding:
        4px 8px !important;

      border:
        0 !important;

      background:
        white !important;
    }

    /*
    不依賴 first-child
    */

    .polynomial-answer-shell
    .expression-input__fraction-field:first-of-type {

      border-bottom:
        2px solid
        #334155 !important;
    }

    .polynomial-answer-shell
    .expression-input__fraction-field input {

      width:
        100% !important;

      min-width:
        0 !important;

      height:
        36px !important;

      padding:
        3px !important;

      border:
        0 !important;

      border-radius:
        0 !important;

      outline:
        none !important;

      background:
        transparent !important;

      text-align:
        center !important;

      font-size:
        20px !important;

      font-weight:
        900 !important;

      box-shadow:
        none !important;
    }

    /*
    ★ 強制分數中線
    避免元件 DOM 結構不同時 first-of-type 失效
    */

    .polynomial-answer-shell
    .expression-input__fraction-coefficient::after {

      content: "";

      position: absolute;

      left: 10px;

      right: 10px;

      top: 50%;

      z-index: 10;

      border-top:
        2px solid
        #334155;

      pointer-events: none;
    }

    /*
    ==================================================
    商式＋餘式
    ==================================================
    */

    .division-combined-shell {

      width:
        min(
          100%,
          850px
        );

      margin:
        0 auto;

      padding:
        18px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          #fbf3fd,
          #fff
        );
    }

    .division-answer-grid {

      display: grid;

      grid-template-columns:
        minmax(
          0,
          1fr
        )
        165px;

      gap: 14px;

      align-items: stretch;
    }

    .division-quotient-box {

      min-width: 0;
    }

    .division-section-title {

      margin-bottom: 8px;

      color:
        var(--primary-dark);

      font-weight: 900;

      text-align: center;
    }

    .remainder-box {

      display: flex;

      flex-direction: column;

      justify-content:
        flex-start;

      padding:
        12px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 14px;

      background:
        white;
    }

    .remainder-box label {

      display: block;

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      font-size: 18px;

      font-weight: 900;

      text-align: center;
    }

    .remainder-box input {

      width: 100%;

      height: 58px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 11px;

      background: white;

      font-size: 23px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }

    .division-preview {

      margin-top: 16px;
    }

    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;
    }

    .choice-button {

      min-height: 62px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;

      color:
        #263238;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }

    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }

    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }

    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }

    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }

    .game-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }

    .feedback.correct {

      color:
        var(--success);
    }

    .feedback.wrong {

      color:
        var(--danger);
    }

    .feedback.warning {

      color:
        var(--warning);
    }

    /*
    ==================================================
    Explanation
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background:
        #f5ecf8;

      color:
        #334155;

      line-height: 1.95;
    }

    .explanation-step {

      margin:
        8px 0;
    }

    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }

    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size:
        56px;

      font-weight: 900;
    }

    .result-stars {

      margin-bottom: 10px;

      font-size:
        31px;
    }

    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }

    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }

    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }

    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }

    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

  10;

  monomial:
    "單項式乘除",

  multiply:
    "多項式乘法",

  divide:
    "多項式除法",

  mixed:
    "乘除綜合挑戰"
};


const $ =
  id =>
    document.getElementById(
      id
    );


let mode =
  "monomial";


let questions =
  [];


let index =
  0;


let correct =
  0;


let wrong =
  0;


let combo =
  0;


let maxCombo =
  0;


let records =
  [];


let answered =
  false;


let selectedChoice =
  null;


let answerInput =
  null;


let divisionQuotientInput =
  null;


let startTime =
  0;


let elapsed =
  0;


let timerId =
  null;


let scoreSaved =
  false;


/*
==================================================
基本工具
==================================================
*/

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [
      ...array
    ];


  for (
    let i =
      result.length -
      1;

    i >
    0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );


  b =
    Math.abs(
      b
    );


  while (
    b !==
    0
  ) {

    const temp =
      a %
      b;


    a =
      b;


    b =
      temp;
  }


  return (
    a ||
    1
  );
}


function gcdArray(
  numbers
) {

  const filtered =
    numbers
      .map(
        value =>
          Math.abs(
            Number(
              value
            )
          )
      )
      .filter(
        value =>
          value !==
          0
      );


  if (
    !filtered.length
  ) {

    return 1;
  }


  return filtered.reduce(
    (
      current,
      value
    ) =>
      gcd(
        current,
        value
      )
  );
}


/*
==================================================
分數
==================================================
*/

function F(
  numerator,
  denominator =
    1
) {

  if (
    denominator ===
    0
  ) {

    throw new Error(
      "分母不可為 0"
    );
  }


  if (
    denominator <
    0
  ) {

    numerator =
      -numerator;


    denominator =
      -denominator;
  }


  const g =
    gcd(
      numerator,
      denominator
    );


  return {

    numerator:
      numerator /
      g,

    denominator:
      denominator /
      g
  };
}


function addF(
  a,
  b
) {

  return F(

    a.numerator *
    b.denominator +

    b.numerator *
    a.denominator,

    a.denominator *
    b.denominator
  );
}


function mulF(
  a,
  b
) {

  return F(

    a.numerator *
    b.numerator,

    a.denominator *
    b.denominator
  );
}


function sameF(
  a,
  b
) {

  const first =
    F(
      a.numerator,
      a.denominator
    );


  const second =
    F(
      b.numerator,
      b.denominator
    );


  return (

    first.numerator ===
      second.numerator &&

    first.denominator ===
      second.denominator
  );
}


function isZeroF(
  value
) {

  return (
    value.numerator ===
    0
  );
}


/*
==================================================
數學顯示
==================================================
*/

function fractionHTML(
  fraction
) {

  const f =
    F(
      fraction.numerator,
      fraction.denominator
    );


  if (
    f.denominator ===
    1
  ) {

    return String(
      f.numerator
    )
      .replace(
        "-",
        "−"
      );
  }


  const sign =

    f.numerator <
    0

      ? "−"

      : "";


  return `

    ${sign}

    <span class="math-fraction">

      <span class="math-fraction-top">

        ${Math.abs(
          f.numerator
        )}

      </span>

      <span class="math-fraction-bottom">

        ${f.denominator}

      </span>

    </span>
  `;
}


function powerHTML(
  base,
  exponent
) {

  if (
    exponent ===
    0
  ) {

    return "1";
  }


  if (
    exponent ===
    1
  ) {

    return String(
      base
    );
  }


  return `

    ${base}<sup>${exponent}</sup>
  `;
}


/*
==================================================
單項式
==================================================
*/

function monomialCoreHTML(
  coefficient,
  exponent
) {

  const c =
    F(
      coefficient.numerator,
      coefficient.denominator
    );


  if (
    isZeroF(
      c
    )
  ) {

    return "0";
  }


  const negative =
    c.numerator <
    0;


  const absolute =
    F(
      Math.abs(
        c.numerator
      ),
      c.denominator
    );


  let coefficientText =
    "";


  if (
    exponent ===
    0
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );

  } else if (
    !(
      absolute.numerator ===
      1 &&

      absolute.denominator ===
      1
    )
  ) {

    coefficientText =
      fractionHTML(
        absolute
      );
  }


  return `

    ${
      negative

        ? "−"

        : ""
    }

    ${coefficientText}

    ${
      exponent ===
      0

        ? ""

        : powerHTML(
            "x",
            exponent
          )
    }
  `;
}


function monomialHTML(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  const core =
    monomialCoreHTML(
      coefficient,
      exponent
    );


  const negative =

    F(
      coefficient.numerator,
      coefficient.denominator
    )
      .numerator <
    0;


  if (
    wrapNegative &&
    negative
  ) {

    return `

      <span class="negative-monomial">

        (${core})

      </span>
    `;
  }


  return core;
}


function monomialFromInteger(
  coefficient,
  exponent,
  wrapNegative =
    false
) {

  return monomialHTML(

    F(
      coefficient
    ),

    exponent,

    wrapNegative
  );
}


/*
==================================================
多項式
==================================================
*/

function normalizePolynomial(
  terms
) {

  const map =
    new Map();


  for (
    const term of
    terms
  ) {

    const exponent =
      Number(
        term.exponent
      );


    const coefficient =
      F(
        term.coefficient.numerator,
        term.coefficient.denominator
      );


    const current =
      map.get(
        exponent
      ) ||
      F(
        0
      );


    map.set(

      exponent,

      addF(
        current,
        coefficient
      )
    );
  }


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          exponent,
          coefficient
        ]
      ) => ({

        exponent,

        coefficient
      })
    )
    .filter(
      term =>
        !isZeroF(
          term.coefficient
        )
    )
    .sort(
      (
        a,
        b
      ) =>
        b.exponent -
        a.exponent
    );
}


function polynomialHTML(
  terms
) {

  const polynomial =
    normalizePolynomial(
      terms
    );


  if (
    !polynomial.length
  ) {

    return "0";
  }


  let result =
    "";


  polynomial
    .forEach(
      (
        term,
        i
      ) => {

        const coefficient =
          F(
            term.coefficient.numerator,
            term.coefficient.denominator
          );


        const negative =
          coefficient.numerator <
          0;


        const absolute =
          F(
            Math.abs(
              coefficient.numerator
            ),
            coefficient.denominator
          );


        if (
          i ===
          0
        ) {

          result +=
            monomialHTML(
              coefficient,
              term.exponent
            );

        } else {

          result +=

            negative

              ? "－"

              : "＋";


          result +=
            monomialHTML(
              absolute,
              term.exponent
            );
        }
      }
    );


  return result;
}


function bracketPolynomial(
  terms
) {

  return `

    (
      ${polynomialHTML(
        terms
      )}
    )
  `;
}


function polynomialCoefficientGCD(
  polynomial
) {

  const normalized =
    normalizePolynomial(
      polynomial
    );


  const integerCoefficients =
    normalized
      .map(
        term => {

          if (
            term.coefficient.denominator !==
            1
          ) {

            return null;
          }


          return term.coefficient.numerator;
        }
      );


  if (
    integerCoefficients.some(
      value =>
        value ===
        null
    )
  ) {

    return null;
  }


  return gcdArray(
    integerCoefficients
  );
}


function isPrimitiveIntegerPolynomial(
  polynomial
) {

  const gcdValue =
    polynomialCoefficientGCD(
      polynomial
    );


  return (
    gcdValue ===
    1
  );
}


function multiplyTwoPolynomials(
  first,
  second
) {

  const result =
    [];


  for (
    const a of
    first
  ) {

    for (
      const b of
      second
    ) {

      result.push(
        {

          exponent:
            a.exponent +
            b.exponent,

          coefficient:
            mulF(
              a.coefficient,
              b.coefficient
            )
        }
      );
    }
  }


  return normalizePolynomial(
    result
  );
}


function multiplyPolynomialByMonomial(
  polynomial,
  coefficient,
  exponent
) {

  return normalizePolynomial(

    polynomial.map(
      term => ({

        exponent:
          term.exponent +
          exponent,

        coefficient:
          mulF(
            term.coefficient,
            coefficient
          )
      })
    )
  );
}


function addConstantToPolynomial(
  polynomial,
  constant
) {

  return normalizePolynomial(
    [

      ...polynomial,

      {

        exponent:
          0,

        coefficient:
          F(
            constant
          )
      }
    ]
  );
}


function randomPolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  const available =
    shuffle(

      Array.from(
        {

          length:
            maxDegree -
            minDegree +
            1
        },

        (
          _,
          i
        ) =>
          minDegree +
          i
      )
    );


  const termCount =
    Math.min(

      rand(
        minTerms,
        maxTerms
      ),

      available.length
    );


  const exponents =
    available.slice(
      0,
      termCount
    );


  return normalizePolynomial(

    exponents.map(
      exponent => ({

        exponent,

        coefficient:
          F(
            nonZeroRand(
              coefficientMin,
              coefficientMax
            )
          )
      })
    )
  );
}


/*
產生整數係數且整體互質的多項式
*/

function randomPrimitivePolynomial(
  minDegree,
  maxDegree,
  minTerms,
  maxTerms,
  coefficientMin =
    -7,
  coefficientMax =
    7
) {

  for (
    let attempt =
      0;

    attempt <
    500;

    attempt++
  ) {

    const polynomial =
      randomPolynomial(
        minDegree,
        maxDegree,
        minTerms,
        maxTerms,
        coefficientMin,
        coefficientMax
      );


    if (
      isPrimitiveIntegerPolynomial(
        polynomial
      )
    ) {

      return polynomial;
    }
  }


  /*
  後備
  */

  return [

    {

      exponent:
        Math.max(

function makeMonomialDivide(
  forceFraction =
    false
) {

  const divisorCoefficient =
    pick(
      [
        2,
        3,
        4,
        5,
        6,
        8,
        9
      ]
    ) *
    (
      Math.random() <
      .35

        ? -1

        : 1
    );


  let numeratorCoefficient;


  if (
    forceFraction
  ) {

    do {

      numeratorCoefficient =
        nonZeroRand(
          -12,
          12
        );

    } while (
      gcd(
        Math.abs(
          numeratorCoefficient
        ),
        Math.abs(
          divisorCoefficient
        )
      ) !==
      1
    );

  } else {

    numeratorCoefficient =
      divisorCoefficient *
      nonZeroRand(
        -5,
        5
      );
  }


  const divisorExponent =
    rand(
      1,
      3
    );


  const answerExponent =
    rand(
      1,
      4
    );


  const numeratorExponent =
    divisorExponent +
    answerExponent;


  const answerCoefficient =
    F(
      numeratorCoefficient,
      divisorCoefficient
    );


  return monomialQuestion(

    `

      ${monomialFromInteger(
        numeratorCoefficient,
        numeratorExponent,
        true
      )}

      ÷

      ${monomialFromInteger(
        divisorCoefficient,
        divisorExponent,
        true
      )}
    `,

    answerCoefficient,

    answerExponent,

    [

      `先算係數：
      ${numeratorCoefficient}
      ÷
      ${divisorCoefficient}
      ＝
      ${fractionHTML(
        answerCoefficient
      )}。`,

      `同底數相除，指數相減：

      `所以答案＝

        answerExponent
      )}。`
    ],

    "請計算單項式的商；分數係數請化成最簡分數"
  );
}

/*
==================================================
多項式除法
==================================================
*/

function allIntegerCoefficients(
  polynomial
) {

  return polynomial.every(
    term =>
      term.coefficient.denominator ===
      1
  );
}


/*
產生：
除式 × 商式 ＝ 被除式

要求：
1. 除式整體係數 gcd = 1
2. 商式整體係數 gcd = 1
3. 因 Gauss lemma，
   被除式也會是 primitive polynomial
*/

function generatePrimitiveExactDivision() {

  for (
    let attempt =
      0;

    attempt <
    800;

    attempt++
  ) {

    const divisor =
      randomPrimitivePolynomial(
        0,
        1,
        2,
        2,
        -6,
        6
      );


    const quotient =
      randomPrimitivePolynomial(
        0,
        1,
        2,
        2,
        -5,
        5
      );


    const dividend =
      multiplyTwoPolynomials(
        divisor,
        quotient
      );


    if (
      dividend.length !==
      3
    ) {

      continue;
    }


    if (
      !allIntegerCoefficients(
        dividend
      )
    ) {

      continue;
    }


    if (
      !isPrimitiveIntegerPolynomial(
        divisor
      )
    ) {

      continue;
    }


    if (
      !isPrimitiveIntegerPolynomial(
        dividend
      )
    ) {

      continue;
    }


    return {

      divisor,

      quotient,

      dividend
    };
  }


  /*
  後備：
  (x+1)(2x+1)
  = 2x²+3x+1
  */

  const divisor =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            1
          )
      }
    ];


  const quotient =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            2
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            1
          )
      }
    ];


  return {

    divisor,

    quotient,

    dividend:
      multiplyTwoPolynomials(
        divisor,
        quotient
      )
  };
}

/*
==================================================
求商式與餘式
==================================================
*/

function makeDivisionWithRemainder(
  missingTerm =
    false
) {

  for (
    let attempt =
      0;

    attempt <
    800;

    attempt++
  ) {

    /*
    除式使用 monic，
    保證係數 gcd = 1
    */

    const constantOfDivisor =
      nonZeroRand(
        -6,
        6
      );


    const divisor =
      [

        {

          exponent:
            1,

          coefficient:
            F(
              1
            )
        },

        {

          exponent:
            0,

          coefficient:
            F(
              constantOfDivisor
            )
        }
      ];


    const quotientLeading =
      nonZeroRand(
        -5,
        5
      );


    let quotientConstant;


    if (
      missingTerm
    ) {

      /*
      讓 x 項係數為 0：
      a*x*(x+c) + b*(x+c)
      x項係數 = ac+b
      因此 b = -ac
      */

      quotientConstant =
        -quotientLeading *
        constantOfDivisor;

    } else {

      quotientConstant =
        nonZeroRand(
          -7,
          7
        );
    }


    const quotient =
      normalizePolynomial(
        [

          {

            exponent:
              1,

            coefficient:
              F(
                quotientLeading
              )
          },

          {

            exponent:
              0,

            coefficient:
              F(
                quotientConstant
              )
          }
        ]
      );


    const remainder =
      nonZeroRand(
        -12,
        12
      );


    const dividend =
      addConstantToPolynomial(

        multiplyTwoPolynomials(
          divisor,
          quotient
        ),

        remainder
      );


    /*
    被除式、除式都必須 primitive
    */

    if (
      !isPrimitiveIntegerPolynomial(
        divisor
      )
    ) {

      continue;
    }


    if (
      !isPrimitiveIntegerPolynomial(
        dividend
      )
    ) {

      continue;
    }


    return divisionQuestion(

      `

        ${bracketPolynomial(
          dividend
        )}

        ÷

        ${bracketPolynomial(
          divisor
        )}
      `,

      quotient,

      remainder,

      [

        `先把被除式與除式依降冪排列
        ${
          missingTerm

            ? "；被除式缺少 x 項，做直式時要補上 0x。"

            : "。"
        }`,

        `用被除式最高次項除以除式最高次項，得到商的第一項。`,

        `用商的第一項乘回除式，再相減。`,

        `繼續以上步驟，直到餘式的次數低於除式。`,

        `最後：
        商式＝
        ${polynomialHTML(
          quotient
        )}，
        餘式＝
        ${remainder}。`
      ],

      "請填寫商式與餘式"
    );
  }


  /*
  後備
  */

  const divisor =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            -2
          )
      }
    ];


  const quotient =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            2
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            1
          )
      }
    ];


  const remainder =
    3;


  const dividend =
    addConstantToPolynomial(

      multiplyTwoPolynomials(
        divisor,
        quotient
      ),

      remainder
    );


  return divisionQuestion(

    `

      ${bracketPolynomial(
        dividend
      )}

      ÷

      ${bracketPolynomial(
        divisor
      )}
    `,

    quotient,

    remainder,

    [

      `使用多項式長除法。`,

      `逐次以最高次項相除。`,

      `最後得到：
      商式＝
      ${polynomialHTML(
        quotient
      )}，
      餘式＝${remainder}。`
    ],

    "請填寫商式與餘式"
  );
}

      )
    ]

}


/*
==================================================
模式四挑戰乘法
==================================================
*/

function makeChallengeProduct() {

  const a =
    pick(
      [
        1,
        2
      ]
    );


  const b =
    rand(
      1,
      5
    );


  const c =
    rand(
      1,
      5
    );


  const first =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            a
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            b
          )
      }
    ];


  const second =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            a
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            -b
          )
      }
    ];


  const third =
    [

      {

        exponent:
          1,

        coefficient:
          F(
            1
          )
      },

      {

        exponent:
          0,

        coefficient:
          F(
            c
          )
      }
    ];


  const answer =
    multiplyTwoPolynomials(

      multiplyTwoPolynomials(
        first,
        second
      ),

      third
    );


  return polynomialQuestion(

    `

      <span class="implicit-multiply">

        ${bracketPolynomial(
          first
        )}

        ${bracketPolynomial(
          second
        )}

        ${bracketPolynomial(
          third
        )}

      </span>
    `,

    answer,

    [

      `先觀察前兩個括號符合平方差公式。`,

      `先化成 A²－B²。`,

      `再乘第三個括號。`,

      `最後答案＝
      ${polynomialHTML(
        answer
      )}。`
    ],

    "挑戰題：請選擇合適的方法展開"
  );
}


/*
==================================================
模式四
==================================================
*/

function makeMode4() {

  return shuffle(
    [

      /*
      模式一
      */

      makeMonomialMultiply(),

      makeMonomialDivide(
        true
      ),

      /*
      模式二
      */

      makeSquareFormula(

            "minus"
          ]
        )
      ),

      makeDifferenceSquares(),

      makeQuadraticTimesLinear(),

      /*

      makeDivisionWithRemainder(

      ),

      /*

      makeFindDividendQuestion(),

}

function monomialPreviewHTML() {

      $("mono-sign")

  const exponentRaw =
    $("mono-exp")
      ?.value
      .trim() ??
    "";


  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return "";
  }


  const exponent =
    Number(
      exponentRaw
    );


  let coefficient;


  if (
    $("mono-int")
  ) {

      $("mono-int")
        .value
        .trim();


    if (
      !/^\d+$/
        .test(
          raw
        )
    ) {

      return "";
    }


    coefficient =
      F(
        sign *
        Number(
          raw
        )
      );

  } else {

    const numerator =
      $("mono-num")
        ?.value
        .trim() ??
      "";


    const denominator =
      $("mono-den")
        ?.value
        .trim() ??
      "";


    if (
      !/^\d+$/
        .test(
          numerator
        ) ||

      !/^\d+$/
        .test(
          denominator

    ) {

      return "";
    }


    if (
      Number(
        denominator

      0
    ) {

      return "";

    coefficient =
      F(

        sign *
        Number(
          numerator
        ),

        Number(
          denominator
        )
      );
  }


  return monomialHTML(
    coefficient,
    exponent
  );
}

/*
==================================================
清除 ExpressionInput 自動填入的分母 1
==================================================
*/

function clearAutomaticDenominatorOnes(
  mount
) {

  if (
    !mount
  ) {

    return;
  }


  const clear =
    () => {

      const fractionBoxes =
        mount.querySelectorAll(
          ".expression-input__fraction-coefficient"
        );


      fractionBoxes
        .forEach(
          box => {

            const fields =
              box.querySelectorAll(
                ".expression-input__fraction-field"
              );


            if (
              fields.length <
              2
            ) {

              return;
            }


            const denominatorInput =
              fields[
                fields.length -
                1
              ]
                .querySelector(
                  "input"
                );


            if (
              !denominatorInput
            ) {

              return;
            }


            if (
              denominatorInput.dataset
                .initialOneHandled ===
              "true"
            ) {

              return;
            }


            denominatorInput.dataset
              .initialOneHandled =
                "true";


            if (
              denominatorInput.value ===
              "1"
            ) {

              denominatorInput.value =
                "";


              denominatorInput
                .dispatchEvent(
                  new Event(
                    "input",
                    {
                      bubbles:
                        true
                    }
                  )
                );
            }
          }
        );
    };


  clear();


  const observer =
    new MutationObserver(
      clear
    );


  observer.observe(
    mount,
    {

      childList:
        true,

      subtree:
        true
    }
  );


  setTimeout(
    () =>
      observer.disconnect(),
    15000
  );
}

/*
==================================================
解析 ExpressionInput
==================================================
*/

function parseExpressionInput(
  input
) {

  if (
    !input
  ) {

    return {

      valid:
        false,

      message:
        "多項式輸入器尚未準備完成。"
    };
  }


  const result =
    input.validate();


  if (
    !result.valid
  ) {

    return {

      valid:
        false,

      message:
        result.message ||
        "請將多項式答案輸入完整。"
    };
  }


  const terms =
    (
      result.value.fractionTerms ||
      []
    )
      .map(
        term => ({

          exponent:
            Number(
              term.exponent
            ),

          coefficient:
            F(

              term.coefficient.numerator,

              term.coefficient.denominator
            )
        })
      );


  return {

    valid:
      true,

    value:
      normalizePolynomial(
        terms
      ),

    display:
      result.value.html ||
      polynomialHTML(
        terms
      )
  };
}

/*
==================================================
Read Monomial
==================================================
*/

function readMonomialAnswer() {

  const sign =
    Number(
      $("mono-sign")
        ?.value ??
      1
    );


  const exponentRaw =
    $("mono-exp")
      ?.value
      .trim() ??
    "";


  if (
    !/^\d+$/
      .test(
        exponentRaw
      )
  ) {

    return {

      valid:
        false,

      message:
        "請輸入完整次方。"
    };
  }


  let coefficient;


  if (
    $("mono-int")
  ) {

    const raw =
      $("mono-int")
        .value
        .trim();


    if (
      !/^\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入整數係數。"
      };
    }


    coefficient =
      F(
        sign *
        Number(
          raw
        )
      );

  } else {

    const numeratorRaw =
      $("mono-num")
        ?.value
        .trim() ??
      "";


    const denominatorRaw =
      $("mono-den")
        ?.value
        .trim() ??
      "";


    if (
      !/^\d+$/
        .test(
          numeratorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請填寫分子。"
      };
    }


    if (
      !/^\d+$/
        .test(
          denominatorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請填寫分母。"
      };
    }


    const numerator =
      Number(
        numeratorRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不可為 0。"
      };
    }


    if (
      gcd(
        numerator,
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "係數還不是最簡分數，請先約分。"
      };
    }


    coefficient =
      F(

        sign *
        numerator,

        denominator
      );
  }


  const exponent =
    Number(
      exponentRaw
    );


  return {

    valid:
      true,

    value: {

      coefficient,

      exponent
    },

    display:
      monomialHTML(
        coefficient,
        exponent
      )
  };
}


/*
==================================================
Read Answer
==================================================
*/

function readAnswer(
  question
) {

  if (
    question.type ===
    "monomial"
  ) {

    return readMonomialAnswer();
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return parseExpressionInput(
      answerInput
    );
  }


  if (
    question.type ===
    "division"
  ) {

    const quotientResult =
      parseExpressionInput(
        divisionQuotientInput
      );


    if (
      !quotientResult.valid
    ) {

      return quotientResult;
    }


    const remainderRaw =
      $("remainder-answer")
        ?.value
        .trim() ??
      "";


    if (
      !/^-?\d+$/
        .test(
          remainderRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請填寫完整的整數餘式。"
      };
    }


    return {

      valid:
        true,

      value: {

        quotient:
          quotientResult.value,

        remainder:
          Number(
            remainderRaw
          )
      },

      display: `

        商式＝
        ${polynomialHTML(
          quotientResult.value
        )}，

        餘式＝
        ${remainderRaw}
      `
    };
  }


  return {

    valid:
      false,

    message:
      "目前題型無法讀取答案。"
  };
}


/*
==================================================
判定
==================================================
*/

function samePolynomial(
  first,
  second
) {

  const a =
    normalizePolynomial(
      first
    );


  const b =
    normalizePolynomial(
      second
    );


  if (
    a.length !==
    b.length
  ) {

    return false;
  }


  return a.every(
    (
      term,
      i
    ) => {

      return (

        term.exponent ===
          b[
            i
          ].exponent &&

        sameF(
          term.coefficient,
          b[
            i
          ].coefficient
        )
      );
    }
  );
}


function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "monomial"
  ) {

    return (

      sameF(
        answer.value.coefficient,
        question.coefficient
      ) &&

      answer.value.exponent ===
        question.exponent
    );
  }


  if (
    question.type ===
    "polynomial"
  ) {

    return samePolynomial(

      answer.value,

      question.answer
    );
  }


  if (
    question.type ===
    "division"
  ) {

    return (

      samePolynomial(
        answer.value.quotient,
        question.quotient
      ) &&

      answer.value.remainder ===
        question.remainder
    );
  }


  return false;
}

  }


  return "";
}


/*
==================================================
Explanation
==================================================
*/

function explanationHTML(
  question
) {

  return question.explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>

            步驟 ${i + 1}｜

          </strong>

          ${step}

        </div>
      `
    )
    .join("");
}


/*
==================================================
Display Question
==================================================
*/

function displayQuestion() {

  answered =
    false;


  const question =
    questions[
      index
    ];


  $("mode-name")
    .textContent =
      MODE_NAMES[
        mode
      ];


  $("question-number")
    .textContent =
      `${index + 1} / ${TOTAL_QUESTIONS}`;


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("progress-bar")
    .style
    .width =
      `${
        index /
        TOTAL_QUESTIONS *
        100
      }%`;


  $("question-label")
    .textContent =
      question.label;


  $("question-content")
    .innerHTML =
      question.html;


  $("feedback")
    .textContent =
      "";


  $("feedback")
    .className =
      "feedback";


  $("explanation")
    .innerHTML =
      "";


  $("explanation")
    .classList
    .add(
      "hidden"
    );


  $("submit-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .classList
    .add(
      "hidden"
    );


  renderAnswer(
    question
  );


  window
    .resetGameScratchpad
    ?.();
}


/*
==================================================
Submit
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  answerInput
    ?.setDisabled
    ?.(
      true
    );


  divisionQuotientInput
    ?.setDisabled
    ?.(
      true
    );


  if (
    $("remainder-answer")
  ) {

    $("remainder-answer")
      .disabled =
        true;
  }


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong class="correct-answer">

          ${correctAnswerHTML(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      TOTAL_QUESTIONS -
      1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
Next
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    TOTAL_QUESTIONS
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
Time
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (

    `${String(minutes).padStart(2, "0")}:` +

    `${String(remain).padStart(2, "0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}


/*
==================================================
Sound
==================================================
*/

function playGameSound(
  method
) {

  try {

    const sound =
      window.GameSound ||
      window.MathGameSound;


    sound
      ?.[
        method
      ]
      ?.();

  } catch (
    error
  ) {

    console.warn(
      "音效播放失敗：",
      error
    );
  }
}


/*
==================================================
Scratchpad
==================================================
*/

function moveScratchpadButtonToTop() {

  const mount =
    $("scratchpad-mobile-button");


  const button =
    $("scratchpadOpenButton");


  if (
    mount &&
    button &&
    !mount.contains(
      button
    )
  ) {

    mount.appendChild(
      button
    );
  }
}


/*
==================================================
Screen
==================================================
*/

function showOnly(
  id
) {

  [
    "start-screen",
    "quiz-screen",
    "result-screen",
    "review-screen"
  ]
    .forEach(
      screen => {

        $(screen)
          .classList
          .toggle(
            "hidden",
            screen !==
            id
          );
      }
    );


  if (
    id ===
    "quiz-screen"
  ) {

    moveScratchpadButtonToTop();


    window
      .showGameScratchpadButton
      ?.();

  } else {

    window
      .hideGameScratchpadButton
      ?.();
  }
}


/*
==================================================
Start
==================================================
*/

function startGame(
  selectedMode
) {

  stopTimer(
    false
  );


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  selectedChoice =
    null;


  answerInput =
    null;


  divisionQuotientInput =
    null;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
Rating
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已能熟練處理多項式的乘法與除法。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意乘法公式、降冪排列與商式餘式。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本概念已掌握，再加強分配律與多項式除法。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從單項式乘除開始，再逐步挑戰多項式乘法與除法。"
  };
}


/*
==================================================
Result
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      TOTAL_QUESTIONS *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            TOTAL_QUESTIONS
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "多項式乘除成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
Review
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">

                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>

                  <div class="review-question">

                    ${record.question.html}

                  </div>

                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>

                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerHTML(
                        record.question
                      )}

                    </strong>

                  </p>

                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>
              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
Events
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            startGame(
              button.dataset.mode
            );
          }
        );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "start-screen"
      );
    }
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () => {

      startGame(
        mode
      );
    }
  );


$("review-result-button")
  .addEventListener(
    "click",
    () => {

      showOnly(
        "result-screen"
      );
    }
  );


/*
==================================================
Enter
==================================================
*/

document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {

        return;
      }


      if (
        $("quiz-screen")
          .classList
          .contains(
            "hidden"
          )
      ) {

        return;
      }


      event.preventDefault();


      if (
        answered
      ) {

        nextQuestion();

      } else {

        submitAnswer();
      }
    }
  );


/*
==================================================
Init
==================================================
*/

window
  .addEventListener(
    "DOMContentLoaded",
    () => {

      moveScratchpadButtonToTop();


      setTimeout(
        moveScratchpadButtonToTop,
        100
      );
    }
  );


showOnly(
  "start-screen"
);

</script>
