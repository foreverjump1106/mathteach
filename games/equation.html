dow:0 0 0 4px #dbeafe}.frac-input input::placeholder{font-size:12px;font-weight:700;color:#94a3b8}.frac-input .frac-line{position:absolute;left:5px;right:5px;top:50%;height:2px;background:#1f2937;transform:translateY(-1px);z-index:2;pointer-events:none}.frac-input.integer-input{display:flex;width:min(190px,55vw)}.frac-input.integer-input input:first-child{display:block}.frac-input.integer-input input:last-child,.frac-input.integer-input .frac-line{display:none}.math-x{font-family:"Times New Roman",serif;font-size:42px;font-weight:900}.fraction-help{text-align:center;color:#64748b;font-size:13px;margin:8px 0 12px}.answer-type-label{font-size:13px;font-weight:800;color:#64748b;text-align:center;margin-top:5px}.math-frac{display:inline-flex;flex-direction:column;align-items:stretch;justify-content:center;min-width:.78em;text-align:center;line-height:.92;margin:0 .035em;vertical-align:middle;transform:translateY(.01em)}.math-frac .top,.math-frac .bottom{display:block;font-size:.64em;line-height:.95;padding:0 .08em}.math-frac .top{border-bottom:2px solid currentColor;padding-bottom:.07em}.math-frac .bottom{padding-top:.07em}.math-frac .bar{display:none}.math-expression{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-width:max-content;line-height:1.15}.mode4-answer.disabled{opacity:.65;pointer-events:none}.preview{min-height:26px;text-align:center;color:#64748b;margin:9px 0 14px;font-size:14px}.actions{display:grid;gap:10px}.feedback{min-height:60px;margin-top:15px;text-align:center;font-size:19px;font-weight:900;line-height:1.55}.solution{margin-top:12px;background:#f8fafc;border-radius:14px;padding:14px;color:#334155;font-family:"Times New Roman",serif;font-size:21px;line-height:1.75}.scratch{display:block;border:2px solid #c7d2fe;background:#eef2ff;border-radius:19px;padding:13px;position:sticky;top:10px}.scratch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.scratch-title{font-weight:900;color:#4338ca;font-size:19px}.scratch-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tool{border:1px solid #c7d2fe;background:#fff;color:#4338ca;border-radius:10px;padding:7px 9px;font-weight:900;cursor:pointer;min-width:38px}.tool.active{background:#4338ca;color:#fff}.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8;display:inline-block;vertical-align:middle}.canvas-wrap{background-color:white;border:2px solid var(--line);border-radius:14px;overflow:hidden;background-image:linear-gradient(#dbeafe 1px,transparent 1px),linear-gradient(90deg,#dbeafe 1px,transparent 1px);background-size:28px 28px;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.scratch canvas{display:block;width:100%;height:570px;touch-action:none;overscroll-behavior:contain;cursor:crosshair;background:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.scratch-note{font-size:12px;color:#6366f1;margin:8px 2px 0}.result-box{max-width:700px;margin:auto;text-align:center}.grade-card{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:2px solid #bfdbfe;border-radius:22px;padding:24px;margin:18px 0}.grade-big{font-size:54px;font-weight:900;color:var(--blue-dark)}.stars{font-size:34px;letter-spacing:4px;margin:6px 0}.comment{font-size:20px;font-weight:900;color:#334155}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.score-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:15px}.score-card b{display:block;font-size:26px;margin-top:5px}.save-status{min-height:24px;margin:10px 0 16px;font-size:15px;font-weight:900;line-height:1.6}.result-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.review-list{display:grid;gap:14px;text-align:left;margin-top:18px}.review-card{border:2px solid #fecaca;background:#fff7f7;border-radius:17px;padding:16px}.review-title{font-weight:900;color:#b91c1c;margin-bottom:8px}.review-problem{font-family:"Times New Roman",serif;font-size:23px;font-weight:700;margin:8px 0}.review-answer{line-height:1.7;color:#475569}.fullscreen-scratch{position:fixed!important;inset:0!important;z-index:9999!important;border-radius:0!important;padding:14px!important;background:#eef2ff!important}.fullscreen-scratch .canvas-wrap{height:calc(100vh - 92px)}.fullscreen-scratch canvas{height:100%!important}.mobile-scratch-btn{display:none;align-items:center;justify-content:center;gap:6px;background:#4f46e5;color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:16px;cursor:pointer}.mobile-scratch-btn:active{transform:scale(.98)}.scratch-close-btn{display:none}.fullscreen-scratch .scratch-close-btn{display:inline-block}

html,body{width:100%;min-height:100%}
body{margin:0;padding:4px;overflow-x:hidden}
.app{width:100%;max-width:none;min-height:calc(100vh - 8px);margin:0 auto}

.scratch-head,.scratch-tools,.tool{pointer-events:auto;position:relative;z-index:3}
.scratch.dragging{position:fixed!important;z-index:9998!important;margin:0!important;user-select:none}
.scratch.edge-draggable{will-change:left,top}
.scratch.edge-left,.scratch.edge-right{cursor:ew-resize}
.scratch.edge-top,.scratch.edge-bottom{cursor:ns-resize}
.scratch.edge-corner{cursor:move}

/* 方程式遊戲：將共用計算紙按鈕放到上方資訊列 */
#scratchpad-mobile-button{
  display:flex;
  align-items:center;
}

#scratchpad-mobile-button .scratchpad-open-button{
  position:static !important;
  inset:auto !important;
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:10px 16px;
  border:2px solid #c7d2fe;
  border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#2563eb);
  color:#fff;
  box-shadow:0 6px 16px #3730a333;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

#scratchpad-mobile-button .scratchpad-open-button:hover{
  filter:brightness(1.05);
}

@media(max-width:980px){
  .topbar{align-items:center}
  #scratchpad-mobile-button{width:100%}
  #scratchpad-mobile-button .scratchpad-open-button{width:100%}
}

</head>
<body>
<main id="app" class="app">
  <div class="progress"><div id="progress-bar"></div></div>
  <div class="inner">
    <section id="start-screen">
      <h1 class="title">一元一次方程式挑戰賽</h1>
      <p class="subtitle">請選擇模式：模式一～三每回合 10 題，模式四每回合 5 題</p>
      <div class="modes">
        <label class="mode-card"><input type="radio" name="mode" value="1" checked><span><div class="mode-title">模式一｜基本一元一次方程式</div><div class="example">例如：6x = 7、−3x = 6</div></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="2"><span><div class="mode-title">模式二｜移項與合併同類項</div><div class="example">例如：3x − 5 = 2x + 4</div></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="3"><span><div class="mode-title">模式三｜括號、負號與化簡</div><div class="example">例如：3(x − 2) = 2(x + 1)、5x − (2x − 3) = 12</div></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="4"><span><div class="mode-title">模式四｜分數係數方程式</div><div class="example">例如：分式型態方程式求解</div></span></label>
      </div>
      <div class="center"><button id="start-btn" class="btn btn-primary">開始挑戰</button></div>
    </section>

    <section id="quiz-screen" class="hidden">
      <div class="quiz-grid">
        <div>
          <div class="topbar">
            <button id="change-mode-btn" class="btn btn-light">← 重選模式</button>
            <div class="stats"><span id="question-number" class="pill pill-blue">第 1 / 10 題</span><span id="mode-badge" class="pill pill-amber">模式一</span><span id="time-display" class="pill pill-gray">⏳ 00:00</span></div>
            <div id="scratchpad-mobile-button"></div>
          </div>
          <div id="problem-text" class="problem"></div>
          <div class="answer-wrap">
            <div class="label">方程式解</div>
            <div class="answer-entry-row">
              <div id="mode4-answer" class="mode4-answer" aria-label="方程式答案輸入區">
                <span class="answer-x" aria-hidden="true">x =</span>
                <select id="x-sign" class="answer-sign-select hidden" aria-label="分數正負號">
                  <option value="1">＋</option>
                  <option value="-1">−</option>
                </select>
                <div id="x-frac-box" class="frac-input" title="x 值答案輸入">
                  <input id="x-num" inputmode="text" autocomplete="off" aria-label="x值整數或分子" placeholder="整數">
                  <span class="frac-line"></span>
                  <input id="x-den" inputmode="numeric" autocomplete="off" aria-label="x值分母" placeholder="分母">
                </div>
              </div>
            </div>
            <div id="fraction-help" class="fraction-help">整數請填一格；分數請先選正負號，上格填分子、下格填分母，並化成最簡分數。</div>
            <div id="normalized-preview" class="preview"></div>
            <div class="actions">
              <button id="submit-btn" class="btn btn-green">送出答案（Enter）</button>
              <button id="next-btn" class="btn btn-primary hidden">下一題（Enter）</button>
              <button id="reset-btn" class="btn btn-danger-light">重新測驗（維持目前模式）</button>
            </div>
            <div id="feedback" class="feedback" aria-live="polite"></div>
          </div>
        </div>


      </div>
    </section>

    <section id="result-screen" class="hidden result-box">
      <h2 class="title">挑戰完成！</h2>
      <div class="grade-card"><div id="final-score" class="grade-big">0 分</div><div id="final-stars" class="stars">☆☆☆☆☆</div><div id="final-comment" class="comment"></div></div>
      <div class="score-grid"><div class="score-card">答對<b id="final-correct">0</b></div><div class="score-card">答錯<b id="final-wrong">0</b></div><div class="score-card">總時間<b id="final-time">0:00</b></div></div>
      <p id="save-status" class="save-status" aria-live="polite"></p>
      <div class="result-actions">
        <button id="review-btn" class="btn btn-neutral">錯題回顧</button>
        <button id="again-btn" class="btn btn-primary">🔄 再玩一次</button>
        <button id="result-change-mode-btn" class="btn btn-light">重選模式</button>
        <a class="btn btn-neutral" href="../leaderboard.html">🏆 排行榜</a>
        <a class="btn btn-neutral" href="../my-scores.html">📊 我的成績</a>
        <a class="btn btn-light" href="../index.html">🏠 回首頁</a>
      </div>
    </section>

    <section id="review-screen" class="hidden result-box">
      <h2 class="title">錯題回顧</h2>
      <div id="review-list" class="review-list"></div>
      <div class="result-actions" style="margin-top:18px"><button id="review-back-btn" class="btn btn-light">返回成績</button><button id="review-again-btn" class="btn btn-primary">重新測驗</button><button id="review-mode-btn" class="btn btn-neutral">重選模式</button></div>
    </section>
  </div>
</main>
<script src="../js/scratchpad.js"></script>

<script type="module">
import { saveGameScore } from "../js/scores.js";

'use strict';

/*
共用計算紙元件會由 scratchpad-template.js 自動建立。
建立完成後，把「開啟計算紙」按鈕移到遊戲上方資訊列。
*/
document.addEventListener("DOMContentLoaded", () => {
  const buttonMount = document.getElementById("scratchpad-mobile-button");
  const openButton = document.getElementById("scratchpadOpenButton");

  if (buttonMount && openButton) {
    buttonMount.appendChild(openButton);
  }
});

const GAME_ID = "equation";
const MODE_NAMES={1:'模式一',2:'模式二',3:'模式三',4:'模式四'};
function totalQuestions(){return mode===4?5:10}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rand(0,i);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const $=id=>document.getElementById(id);
let mode=1,questions=[],index=0,correct=0,wrong=0,startTime=0,timer=null,locked=false,nextReady=false,nextTimer=null,records=[],scoreSaved=false,finalElapsed=0;
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function nz(min,max){let n=0;while(!n)n=rand(min,max);return n}
function fx(n){if(n===1)return'x';if(n===-1)return'−x';return(n<0?'−'+Math.abs(n):n)+'x'}
function linear(a,b){let s='';if(a)s=fx(a);if(b){if(!s)s=String(b).replace('-','−');else s+=b>0?' + '+b:' − '+Math.abs(b)}return s||'0'}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function rat(n,d=1){if(d===0)throw new Error('分母不可為 0');if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
function ratEq(a,b){return a.n===b.n&&a.d===b.d}
function ratAbs(a){return rat(Math.abs(a.n),a.d)}
function ratText(a){if(a.d===1)return String(a.n).replace('-','−');return `${a.n<0?'−':''}${Math.abs(a.n)}/${a.d}`}
function mathFracHTML(a,showSign=true){const neg=a.n<0,abs=Math.abs(a.n),sign=showSign&&neg?'−':'';if(a.d===1)return sign+abs;return `${sign}<span class="math-frac"><span class="top">${abs}</span><span class="bar"></span><span class="bottom">${a.d}</span></span>`}
function stackedFractionHTML(top,bottom){return `<span class="math-frac"><span class="top">${top}</span><span class="bar"></span><span class="bottom">${bottom}</span></span>`}
function questionHTML(q){return `<span class="math-expression">${q.qStr}</span>`}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function makeAnswerByRatio(){
  // 每題有 70% 機率為整數解，30% 機率為最簡分數解。
  if(Math.random()<0.7){
    return rat(nz(-9,9),1);
  }

  let n,d;
  do{
    d=rand(2,7);
    n=nz(-15,15);
  }while(gcd(n,d)!==1 || Math.abs(n)===d);

  return rat(n,d);
}

function makeQuestions(m){
  const out=[],used=new Set(),target=m===4?5:10;

  while(out.length<target){
    const ansRat=makeAnswerByRatio();
    const p=ansRat.n;
    const q=ansRat.d;
    let qStr='';

    if(m===1){
      // 基本型：ax = b。係數選成分母的倍數，確保等號右側為整數。
      const k=nz(-5,5);
      const a=k*q;
      const b=k*p;
      if(Math.abs(a)>35 || Math.abs(b)>60)continue;
      qStr=`${fx(a)} = ${String(b).replace('-','−')}`;

    }else if(m===2){
      // 原模式一：ax+b=cx+d。
      const k=nz(-4,4);
      const c=nz(-7,7);
      const a=c+k*q;
      const b=nz(-15,15);
      const d=b+k*p;
      if(a===c || Math.abs(a)>28 || Math.abs(d)>45)continue;
      qStr=`${linear(a,b)} = ${linear(c,d)}`;

    }else if(m===3){
      // 原模式二與模式三混合出題。
      if(Math.random()<0.5){
        // 括號型：k(ax+b)=cx+d。
        const outer=nz(-4,4);
        const innerA=nz(-5,5);
        const innerB=nz(-8,8);
        const t=nz(-3,3);
        const c=outer*innerA-t*q;
        const d=outer*innerB+t*p;
        if(Math.abs(c)>32 || Math.abs(d)>50)continue;
        qStr=`${outer}(${linear(innerA,innerB)}) = ${linear(c,d)}`;
      }else{
        // 負號括號型：ax−(bx+c)=d。
        const k=nz(-4,4);
        const b=nz(-7,7);
        const a=b+k*q;
        const c=nz(-12,12);
        const d=k*p-c;
        if(Math.abs(a)>30 || Math.abs(d)>50)continue;
        qStr=`${linear(a,0)} − (${linear(b,c)}) = ${String(d).replace('-','−')}`;
      }

    }else{
      // 模式四保留分數係數方程式型態。
      const denominator=rand(2,6);
      const rightX=nz(-5,5);
      const k=nz(-3,3);
      const numeratorX=rightX*denominator+k*q;
      const rightConstant=nz(-8,8);
      const numeratorConstant=denominator*rightConstant-k*p;
      if(Math.abs(numeratorX)>35 || Math.abs(numeratorConstant)>55)continue;
      qStr=`${stackedFractionHTML(linear(numeratorX,numeratorConstant),denominator)} = ${linear(rightX,rightConstant)}`;
    }

    const key=qStr.replace(/<[^>]+>/g,'');
    if(used.has(key))continue;
    used.add(key);
    out.push({qStr,ans:ansRat,meta:{}});
  }

  return shuffle(out);
}

function readAnswer(){
  const q=questions[index];
  if(!q)return null;

  const ns=$('x-num').value.trim();
  const ds=$('x-den').value.trim();
  const isInteger=q.ans.d===1;

  if(!ns)return null;

  if(isInteger){
    if(!/^[+\-]?\d+$/.test(ns))return null;
    const n=Number(ns);
    if(!Number.isSafeInteger(n))return null;
    return{value:rat(n,1),simplest:true,raw:String(n),displayHTML:String(n)};
  }

  if(!/^\d+$/.test(ns)||!/^\d+$/.test(ds))return null;
  const numerator=Number(ns);
  const denominator=Number(ds);
  const sign=Number($('x-sign').value);
  if(!Number.isSafeInteger(numerator)||!Number.isSafeInteger(denominator))return null;
  if(numerator<=0||denominator<=1)return null;

  const signedNumerator=sign*numerator;
  const simplest=gcd(numerator,denominator)===1;
  const value=rat(signedNumerator,denominator);
  return{
    value,
    simplest,
    numerator,
    denominator,
    sign,
    raw:`${sign<0?'−':''}${numerator}/${denominator}`,
    displayHTML:`${sign<0?'−':''}<span class="math-frac"><span class="top">${numerator}</span><span class="bar"></span><span class="bottom">${denominator}</span></span>`
  };
}

function configureAnswerInputs(q){
  const box=$('x-frac-box');
  const sign=$('x-sign');
  const num=$('x-num');
  const den=$('x-den');
  const isInteger=q.ans.d===1;

  box.classList.toggle('integer-input',isInteger);
  sign.classList.toggle('hidden',isInteger);
  num.placeholder=isInteger?'整數':'分子';
  num.inputMode=isInteger?'text':'numeric';
  den.placeholder='分母';
  den.tabIndex=isInteger?-1:0;
  den.disabled=isInteger;

  if(isInteger){
    sign.value='1';
    den.value='';
  }
}

function clearAnswerInputs(){
  $('x-sign').value='1';
  ['x-num','x-den'].forEach(id=>{
    $(id).value='';
    $(id).disabled=false;
  });
  $('x-sign').disabled=false;
  $('mode4-answer').classList.remove('disabled');
}

function disableAnswerInputs(){
  $('x-sign').disabled=true;
  ['x-num','x-den'].forEach(id=>$(id).disabled=true);
  $('mode4-answer').classList.add('disabled');
}

function updateAnswerPreview(){
  const p=readAnswer();
  $('normalized-preview').innerHTML=!p?'':`系統判讀：x ＝ ${p.displayHTML}`;
}

function setTimer(){clearInterval(timer);timer=setInterval(()=>{const e=Math.floor((Date.now()-startTime)/1000);$('time-display').textContent=`⏳ ${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`},1000)}
function showOnly(id){['start-screen','quiz-screen','result-screen','review-screen'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}

function startGame(keepMode=false){
  clearTimeout(nextTimer);
  if(!keepMode)mode=Number(document.querySelector('input[name="mode"]:checked').value);
  questions=makeQuestions(mode);
  index=correct=wrong=0;
  records=[];
  scoreSaved=false;
  finalElapsed=0;
  $('save-status').textContent='';
  $('save-status').style.color='';
  locked=nextReady=false;
  startTime=Date.now();
  setTimer();
  showOnly('quiz-screen');
  $('mode-badge').textContent=MODE_NAMES[mode];
  loadQuestion();
}

function loadQuestion(){
  if(typeof window.resetGameScratchpad === "function") window.resetGameScratchpad();
  clearTimeout(nextTimer);
  locked=nextReady=false;
  $('submit-btn').classList.remove('hidden');
  $('next-btn').classList.add('hidden');
  $('feedback').innerHTML='';
  $('problem-text').innerHTML=questionHTML(questions[index]);
  const total=totalQuestions();
  $('question-number').textContent=`第 ${index+1} / ${total} 題`;
  $('progress-bar').style.width=`${index/total*100}%`;
  $('normalized-preview').innerHTML='';
  clearAnswerInputs();
  configureAnswerInputs(questions[index]);
  setTimeout(()=>$('x-num').focus(),0);
}

function updatePreview(){
  updateAnswerPreview();
}

function check(){
  if(locked)return;
  const q=questions[index];
  const res=readAnswer();
  if(!res){
    const isInteger=q.ans.d===1;
    $('feedback').innerHTML=isInteger?
      '<span style="color:#d97706">請在答案格輸入完整整數。</span>':
      '<span style="color:#d97706">請選擇正負號，並完整填寫分子與分母。</span>';
    return;
  }
  if(!res.simplest){
    $('feedback').innerHTML='<span style="color:#d97706">分數尚未化成最簡分數，請約分後再送出。</span>';
    return;
  }
  const p=res.value;
  const raw=res.raw;

  locked=true;
  disableAnswerInputs();

  const ok=ratEq(p,q.ans);
  ok?correct++:wrong++;
  records.push({number:index+1,question:q,userRaw:raw,userParsed:p,ok});

  const ansHTML=mathFracHTML(q.ans);
  $('feedback').innerHTML=ok?
    `<span style="color:#15803d">✨ 正確！</span><div class="solution">方程式之解為：x ＝ ${ansHTML}</div>`:
    `<span style="color:#b91c1c">❌ 答案不正確，正確答案是 x ＝ ${ansHTML}</span><div class="solution">方程式之解為：x ＝ ${ansHTML}</div>`;

  nextTimer=setTimeout(()=>{
    $('submit-btn').classList.add('hidden');
    $('next-btn').classList.remove('hidden');
    $('next-btn').textContent=index===totalQuestions()-1?'查看測驗結果（Enter）':'下一題（Enter）';
    nextReady=true;
    $('next-btn').focus();
  },ok?850:1200);
}

function next(){if(!nextReady)return;index++;index<totalQuestions()?loadQuestion():showResult()}
function rating(score){if(score>=90)return{stars:'★★★★★',comment:'太棒了！你已經完全掌握一元一次方程式的解法。'};if(score>=80)return{stars:'★★★★☆',comment:'表現很好，再注意移項正負號就更完美。'};if(score>=60)return{stars:'★★★☆☆',comment:'已掌握基本概念，繼續練習會更熟練。'};return{stars:'★★☆☆☆',comment:'多加利用草稿紙慢慢化簡，再挑戰一次！'}}
async function saveCurrentScore(score){
  if(scoreSaved)return;
  scoreSaved=true;

  const status=$('save-status');
  status.textContent='☁️ 正在儲存本次成績……';
  status.style.color='#1d4ed8';

  try{
    const result=await saveGameScore({
      game:GAME_ID,
      score,
      correctCount:correct,
      wrongCount:wrong,
      maxCombo:0,
      playTime:finalElapsed,
      mode:String(mode)
    });

    if(result.success){
      status.textContent='✅ 本次成績已儲存。';
      status.style.color='#15803d';
      return;
    }

    if(result.reason==='not-logged-in'){
      status.textContent='ℹ️ 尚未登入，因此本次成績沒有儲存。';
      status.style.color='#b45309';
      return;
    }

    status.textContent='⚠️ 成績暫時無法儲存，請稍後再試。';
    status.style.color='#b91c1c';
  }catch(error){
    console.error('一元一次方程式成績儲存失敗：',error);
    status.textContent='⚠️ 成績暫時無法儲存，請稍後再試。';
    status.style.color='#b91c1c';
  }
}

async function showResult(){
  clearInterval(timer);
  $('progress-bar').style.width='100%';

  finalElapsed=Math.floor((Date.now()-startTime)/1000);
  const score=Math.round(correct/totalQuestions()*100);
  const r=rating(score);

  showOnly('result-screen');
  $('final-score').textContent=`${score} 分`;
  $('final-stars').textContent=r.stars;
  $('final-comment').textContent=r.comment;
  $('final-correct').textContent=correct;
  $('final-wrong').textContent=wrong;
  $('final-time').textContent=`${String(Math.floor(finalElapsed/60)).padStart(2,'0')}:${String(finalElapsed%60).padStart(2,'0')}`;
  $('review-btn').disabled=wrong===0;
  $('review-btn').textContent=wrong===0?'全部答對，無錯題':'錯題回顧';

  await saveCurrentScore(score);
}
function showReview(){const wrongs=records.filter(r=>!r.ok),box=$('review-list');box.innerHTML=wrongs.length?wrongs.map(r=>`<article class="review-card"><div class="review-title">第 ${r.number} 題 ❌</div><div class="review-problem">${r.question.qStr}</div><div class="review-answer">你的答案：<b>x ＝ ${r.userParsed?mathFracHTML(r.userParsed):'未作答'}</b><br>正確答案：<b>x ＝ ${mathFracHTML(r.question.ans)}</b></div></article>`).join(''):'<div class="grade-card">全部答對，沒有需要回顧的錯題！</div>';showOnly('review-screen')}
function modeSelect(){clearInterval(timer);clearTimeout(nextTimer);$('save-status').textContent='';$('save-status').style.color='';showOnly('start-screen');$('progress-bar').style.width='0%'}

$('start-btn').onclick=()=>startGame(false);$('change-mode-btn').onclick=modeSelect;$('result-change-mode-btn').onclick=modeSelect;$('review-mode-btn').onclick=modeSelect;$('submit-btn').onclick=check;$('next-btn').onclick=next;$('reset-btn').onclick=()=>startGame(true);$('again-btn').onclick=()=>startGame(true);$('review-again-btn').onclick=()=>startGame(true);$('review-btn').onclick=showReview;$('review-back-btn').onclick=()=>showOnly('result-screen');['x-num','x-den'].forEach(id=>$(id).addEventListener('input',updateAnswerPreview));$('x-sign').addEventListener('change',updateAnswerPreview);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||$('quiz-screen').classList.contains('hidden'))return;e.preventDefault();nextReady?next():!locked&&check()});


</script>
