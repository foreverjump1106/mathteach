<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    根式運算大挑戰｜數學遊戲樂園
  </title>


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e1
        );
    }


    button,
    input,
    select {

      font-family: inherit;
    }


    .hidden {

      display: none !important;
    }


    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }


    #commonHeaderMount {

      margin-bottom:
        14px;
    }


    .game-card {

      overflow:
        hidden;

      border:
        1px solid
        #eadcf0;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align:
        center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .concept-strip {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .concept-chip {

      min-height: 38px;

      display:
        inline-flex;

      justify-content: center;

      align-items: center;

      padding:
        6px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }


    .screen {

      padding: 22px;
    }


    /*
    ==================================================
    ★ 統一的題目根號
    Safari 不再使用 MathML msqrt
    ==================================================
    */

    .math-expression {

      display:
        inline-flex;

      justify-content:
        center;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap: .12em;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }


    .display-radical {

      position: relative;

      display:
        inline-flex;

      align-items:
        center;

      min-height:
        1.55em;

      padding:
        .14em .08em 0 .72em;

      margin:
        0 .08em;

      vertical-align:
        middle;
    }


    .display-radical-svg {

      position:
        absolute;

      inset:
        0;

      width:
        100%;

      height:
        100%;

      overflow:
        visible;

      pointer-events:
        none;
    }


    .display-radical-path {

      fill: none;

      stroke:
        currentColor;

      stroke-width:
        3.4;

      stroke-linejoin:
        round;

      stroke-linecap:
        round;

      vector-effect:
        non-scaling-stroke;
    }


    .display-radicand {

      position: relative;

      z-index: 2;

      display:
        inline-flex;

      align-items:
        center;

      white-space:
        nowrap;

      padding:
        0 .10em .02em .02em;
    }


    .display-radicand sup {

      position:
        relative;

      top:
        -.48em;

      margin-left:
        1px;

      font-size:
        .58em;

      line-height: 1;
    }


    .math-times,
    .math-plus,
    .math-minus,
    .math-divide {

      display:
        inline-block;

      margin:
        0 .13em;
    }


    /*
    ==================================================
    CSS Fraction
    ==================================================
    */

    .display-fraction {

      display:
        inline-flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        stretch;

      min-width:
        1.8em;

      margin:
        0 .12em;

      vertical-align:
        middle;
    }


    .display-fraction-top,
    .display-fraction-bottom {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      padding:
        .08em .16em;
    }


    .display-fraction-top {

      border-bottom:
        2.5px solid
        currentColor;
    }


    /*
    ==================================================
    Modes
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }


    .mode-card {

      min-height: 215px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }


    /*
    ==================================================
    Status
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }


    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ba68c8
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }


    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-weight: 900;
    }


    .question-content {

      min-height: 145px;

      display: flex;

      justify-content: center;

      align-items: center;

      color:
        #0f172a;

      font-size:
        clamp(
          28px,
          5vw,
          44px
        );

      font-weight: 500;

      line-height: 1.7;

      overflow-x: auto;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }


    /*
    ==================================================
    Number
    ==================================================
    */

    .number-answer {

      display: flex;

      justify-content: center;
    }


    .number-answer input {

      width:
        min(
          250px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    一般 Fraction
    ==================================================
    */

    .fraction-answer {

      display: flex;

      justify-content: center;
    }


    .fraction-input {

      display: flex;

      flex-direction: column;

      width: 120px;
    }


    .fraction-input input {

      width: 100%;

      padding: 10px;

      border:
        2px solid
        #cbd5e1;

      background: white;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    .fraction-input
    input:first-child {

      border-radius:
        10px 10px 0 0;

      border-bottom:
        2.5px solid
        #334155;
    }


    .fraction-input
    input:last-child {

      border-radius:
        0 0 10px 10px;

      border-top: 0;
    }


    /*
    ==================================================
    ★ 有理化根式分數
    真正上下排列
    ==================================================
    */

    .radical-fraction-stack {

      width:
        min(
          100%,
          560px
        );

      margin:
        0 auto;
    }


    .rf-numerator {

      padding:
        8px 10px 14px;

      border-bottom:
        3px solid
        #334155;
    }


    .rf-numerator-title,
    .rf-denominator-title {

      margin-bottom: 7px;

      color:
        var(--muted);

      text-align: center;

      font-size: 13px;

      font-weight: 900;
    }


    .rf-numerator-editor {

      display: flex;

      justify-content: center;

      align-items: flex-end;

      gap: 10px;

      flex-wrap: wrap;
    }


    .rf-field {

      text-align: center;
    }


    .rf-field label {

      display: block;

      margin-bottom: 5px;

      color:
        var(--muted);

      font-size: 12px;

      font-weight: 900;
    }


    .rf-sign {

      width: 78px;

      height: 52px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 10px;

      background: white;

      font-size: 21px;

      font-weight: 900;
    }


    .rf-coefficient {

      width: 100px;

      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 10px;

      background: white;

      font-size: 21px;

      font-weight: 900;

      text-align: center;
    }


    /*
    SVG answer radical
    */

    .answer-svg-radical {

      position: relative;

      width: 185px;

      height: 63px;
    }


    .answer-svg-radical svg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .answer-svg-radical path {

      fill: none;

      stroke:
        #0f172a;

      stroke-width: 4;

      stroke-linejoin:
        round;

      stroke-linecap:
        round;

      vector-effect:
        non-scaling-stroke;
    }


    .answer-svg-radical input {

      position: absolute;

      left: 43px;

      top: 10px;

      width: 138px;

      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 8px;

      background: white;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    .rf-denominator {

      display: flex;

      flex-direction: column;

      align-items: center;

      padding:
        13px 10px 4px;
    }


    .rf-denominator input {

      width: 130px;

      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 10px;

      background: white;

      font-size: 22px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    ★ 多項根式答案
    ==================================================
    */

    .multi-radical-editor {

      width:
        min(
          100%,
          760px
        );

      margin:
        0 auto;

      display: grid;

      gap: 12px;
    }


    .multi-radical-row {

      display: grid;

      grid-template-columns:
        90px 145px minmax(190px, 1fr);

      align-items: end;

      gap: 10px;

      padding:
        10px;

      border:
        1px solid
        #e5e7eb;

      border-radius: 14px;

      background: white;
    }


    .multi-radical-row-title {

      grid-column:
        1 / -1;

      color:
        var(--primary-dark);

      font-size: 13px;

      font-weight: 900;

      text-align: left;
    }


    .mr-field {

      text-align: center;
    }


    .mr-field label {

      display: block;

      margin-bottom: 5px;

      color:
        var(--muted);

      font-size: 12px;

      font-weight: 900;
    }


    .mr-sign {

      width: 100%;

      height: 50px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      background: white;

      font-size: 20px;

      font-weight: 900;
    }


    .mr-coefficient {

      width: 100%;

      height: 50px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      font-size: 20px;

      font-weight: 900;

      text-align: center;
    }


    .mr-root-wrap {

      display: flex;

      justify-content: center;
    }


    .mr-root {

      position: relative;

      width:
        min(
          100%,
          220px
        );

      height: 61px;
    }


    .mr-root svg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .mr-root path {

      fill: none;

      stroke:
        #0f172a;

      stroke-width: 4;

      stroke-linejoin:
        round;

      stroke-linecap:
        round;

      vector-effect:
        non-scaling-stroke;
    }


    .mr-radicand {

      position: absolute;

      left: 43px;

      top: 9px;

      width:
        calc(
          100% - 47px
        );

      height: 51px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 8px;

      font-size: 20px;

      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width: 720px;

      min-height: 58px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }


    .answer-preview-value {

      display:
        inline-flex;

      justify-content: center;

      align-items: center;

      margin-left: 7px;

      color:
        var(--primary);

      font-size: 25px;
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }


    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background:
        #faf1fc;

      color:
        #334155;

      line-height: 1.95;
    }


    .explanation-step {

      margin:
        7px 0;
    }


    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }


    .result-stars {

      font-size: 31px;
    }


    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding:
        16px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }


    .save-status {

      min-height: 28px;

      margin-top: 14px;

      font-weight: 900;
    }


    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }


    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }


    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }


    .review-question {

      margin:
        12px 0;

      font-size: 24px;

      text-align: center;
    }


    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:760px
    ) {

      body {

        padding: 8px;
      }


      .screen {

        padding:
          18px 12px;
      }


      .mode-grid {

        grid-template-columns:
          1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .timer-box {

        grid-column:
          1 / -1;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .multi-radical-row {

        grid-template-columns:
          74px 100px minmax(145px, 1fr);

        gap: 6px;
      }


      .mr-root {

        width: 100%;
      }

    }

  </style>

</head>


<body>


<div class="page-shell">


  <div id="commonHeaderMount"></div>


  <main class="game-card">


    <header class="game-header">


      <h1 class="game-title">
        ⚡ 根式運算大挑戰
      </h1>


      <p class="game-subtitle">
        從根式乘法開始，逐步挑戰除法、有理化、加減與四則綜合運算。
      </p>


      <div class="concept-strip">

        <span class="concept-chip">
          根式乘法
        </span>

        <span class="concept-chip">
          根式除法
        </span>

        <span class="concept-chip">
          分母有理化
        </span>

        <span class="concept-chip">
          根式加減
        </span>

        <span class="concept-chip">
          四則運算
        </span>

      </div>


    </header>


    <!-- 模式 -->

    <section
      id="start-screen"
      class="screen"
    >


      <div class="mode-grid">

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  return RU().gcd(
    a,
    b
  );
}


/*

★ 題目根號 SVG
==================================================
*/

function sqrtDisplay(
  content
) {

  return `

    <span class="display-radical">

      <svg
        class="display-radical-svg"
        viewBox="0 0 100 62"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <path
          class="display-radical-path"
          d="
            M 1 36
            L 7 36
            L 13 56
            L 25 7
            L 99 7
          "
        />

      </svg>


      <span class="display-radicand">

        ${content}

      </span>

    </span>
  `;
}


function radicalDisplay(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient
    );


  if (
    radicand === 1
  ) {

    return String(
      coefficient
    );
  }


  let prefix =
    "";


  if (
    coefficient ===
    -1
  ) {

    prefix =
      "−";

  } else if (
    coefficient !==
    1
  ) {

    prefix =
      String(
        coefficient
      )
        .replace(
          "-",
          "−"
        );
  }


  return `

    <span class="math-expression">

      ${prefix}

      ${sqrtDisplay(
        String(
          radicand
        )
      )}

    </span>
  `;
}


function radicalFactorDisplay(
  coefficient,
  radicand
) {

  return radicalDisplay(
    coefficient,
    radicand
  );
}


function multiplyDisplay(
  c1,
  r1,
  c2,
  r2
) {

  return `

    <span class="math-expression">

      ${radicalFactorDisplay(
        c1,
        r1
      )}

      <span class="math-times">
        ×
      </span>

      ${radicalFactorDisplay(
        c2,
        r2
      )}

    </span>
  `;
}


function rootFractionDisplay(
  numeratorHTML,
  denominatorHTML
) {

  return `

    <span class="display-fraction">

      <span class="display-fraction-top">

        ${numeratorHTML}

      </span>

      <span class="display-fraction-bottom">

        ${denominatorHTML}

      </span>

    </span>
  `;
}


function divideDisplay(
  c1,
  r1,
  c2,
  r2
) {

  return rootFractionDisplay(

    radicalDisplay(
      c1,
      r1
    ),

    radicalDisplay(
      c2,
      r2
    )
  );
}


function radicalFractionDisplay(
  coefficient,
  radicand,
  denominator
) {

  return rootFractionDisplay(

    radicalDisplay(
      coefficient,
      radicand
    ),

    String(
      denominator
    )
  );
}


function plainFractionDisplay(
  numerator,
  denominator
) {

  return rootFractionDisplay(
    String(
      numerator
    ),
    String(
      denominator
    )
  );
}


/*
==================================================
多項根式顯示
==================================================
*/

function normalizeTerms(
  terms
) {

  return terms

    .filter(
      term =>
        term.coefficient !==
        0
    )

    .sort(
      (
        a,
        b
      ) =>
        a.radicand -
        b.radicand
    );
}


function multiRadicalDisplay(
  terms
) {

  const normalized =
    normalizeTerms(
      terms
    );


  if (
    !normalized.length
  ) {

    return "0";
  }


  return `

    <span class="math-expression">

      ${
        normalized
          .map(
            (
              term,
              i
            ) => {

              const coefficient =
                term.coefficient;


              const sign =

                coefficient <
                0

                  ? "−"

                  : (
                      i === 0
                        ? ""
                        : "＋"
                    );


              const absolute =
                Math.abs(
                  coefficient
                );


              const radical =
                radicalDisplay(
                  absolute,
                  term.radicand
                );


              return `

                <span>

                  ${sign}

                  ${radical}

                </span>
              `;
            }
          )
          .join("")
      }

    </span>
  `;
}

==================================================
題目物件

function numberQuestion(
  html,
  answer,
  explanation,
  label
) {

  return {

    type:
      "number",

    html,

    answer,

    explanation,

    label
  };
}


function radicalQuestion(
  html,
  coefficient,
  radicand,
  explanation,
  label
) {

  return {

    type:
      "radical",

    html,

    coefficient,

    radicand,

    explanation,

    label
  };
}


function radicalFractionQuestion(
  html,
  coefficient,
  radicand,
  denominator,
  explanation,
  label
) {

  const divisor =
    gcd(
      Math.abs(
        coefficient
      ),
      denominator
    );


  coefficient /=
    divisor;

  denominator /=
    divisor;


  return {

    type:
      "radicalFraction",

    html,

    coefficient,

    radicand,

    denominator,

    explanation,

    label
  };
}


function multiRadicalQuestion(
  html,
  terms,
  explanation,
  label
) {

  return {

    type:
      "multiRadical",

    html,

    terms:
      normalizeTerms(
        terms
      ),

    explanation,

    label
  };
}

          ＋

    `,

    [

      {
        coefficient:
          a - c,

        radicand:
          r1
      },

      {
        coefficient:
          b,

        radicand:
          r2
      }
    ],

    [

      `${radicalDisplay(
        a,
        r1
      )} 與 ${radicalDisplay(
        c,
        r1
      )} 為同類根式。`,

      `${a}－${c}＝${a - c}`,

      `答案＝${multiRadicalDisplay(
        [
          {
            coefficient:
              a - c,

            radicand:
              r1
          },

          {
            coefficient:
              b,

            radicand:
              r2
          }
        ]
      )}`
    ],

    "請合併可以合併的同類根式"
  );
}


/*
√8 + √12 + √18

=
2√2 + 2√3 + 3√2
=
5√2 + 2√3
*/

function makeSimplifyTwoKinds() {

  const [
    r1,
    r2
  ] =
    pick(
      [
        [2,3],
        [2,5],
        [3,5],
        [3,7]
      ]
    );


  const k1 =
    rand(
      2,
      4
    );


  const k2 =
    rand(
      2,
      4
    );


  const k3 =
    rand(
      2,
      4
    );


  const n1 =
    r1 *
    k1 *
    k1;


  const n2 =
    r2 *
    k2 *
    k2;


  const n3 =
    r1 *
    k3 *
    k3;


  return multiRadicalQuestion(

    `

      <span class="math-expression">

        ${sqrtDisplay(
          n1
        )}

        <span>
          ＋
        </span>

        ${sqrtDisplay(
          n2
        )}

        <span>
          ＋
        </span>

        ${sqrtDisplay(
          n3
        )}

      </span>
    `,

    [

      {
        coefficient:
          k1 + k3,

        radicand:
          r1
      },

      {
        coefficient:
          k2,

        radicand:
          r2
      }
    ],

    [

      `√${n1}＝${k1}√${r1}`,

      `√${n2}＝${k2}√${r2}`,

      `√${n3}＝${k3}√${r1}`,

      `答案＝${multiRadicalDisplay(
        [
          {
            coefficient:
              k1 + k3,

            radicand:
              r1
          },

          {
            coefficient:
              k2,

            radicand:
              r2
          }
        ]
      )}`
    ],

    "請先化簡，再合併同類根式"
  );
}


/*
三個不同根式
*/

function makeThreeDifferentTerms() {

  const roots =
    shuffle(
      [
        2,
        3,
        5,
        7
      ]
    )
      .slice(
        0,
        3
      )
      .sort(
        (
          a,
          b
        ) =>
          a -
          b
      );


  const a =
    rand(
      1,
      4
    );


  const b =
    rand(
      1,
      4
    );


  const c =
    rand(
      1,
      4
    );


  return multiRadicalQuestion(

    `

      <span class="math-expression">

        ${radicalDisplay(
          a,
          roots[0]
        )}

        <span>
          ＋
        </span>

        ${radicalDisplay(
          b,
          roots[1]
        )}

        <span>
          −
        </span>

        ${radicalDisplay(
          c,
          roots[2]
        )}

      </span>
    `,

    [

      {
        coefficient:
          a,

        radicand:
          roots[0]
      },

      {
        coefficient:
          b,

        radicand:
          roots[1]
      },

      {
        coefficient:
          -c,

        radicand:
          roots[2]
      }
    ],

    [

      "三個根式的根號內皆不同，因此不能互相合併。",

      `答案保持為 ${multiRadicalDisplay(
        [
          {
            coefficient:
              a,

            radicand:
              roots[0]
          },

          {
            coefficient:
              b,

            radicand:
              roots[1]
          },

          {
            coefficient:
              -c,

            radicand:
              roots[2]
          }
        ]
      )}`
    ],

    "請整理成最簡形式"
  );
}


function makeMode3() {

  return shuffle(
    [

      makeSameRadicalAdd(),
      makeSameRadicalAdd(),
      makeSameRadicalAdd(),

      makeTwoDifferentTerms(),
      makeTwoDifferentTerms(),

      makeSimplifyTwoKinds(),
      makeSimplifyTwoKinds(),
      makeSimplifyTwoKinds(),

      makeThreeDifferentTerms(),
      makeThreeDifferentTerms()
    ]
  );
}


/*

模式四
==================================================
*/

/*
√2×√3 + 2√5
=
√6 + 2√5
*/

function makeMultiplyPlusDifferent() {

  const [
    a,
    b,
    c
  ] =
    pick(
      [
        [2,3,5],
        [2,5,3],
        [3,5,7],
        [2,7,3]
      ]
    );


  const extra =
    rand(
      1,
      4
    );


  return multiRadicalQuestion(

    `

      <span class="math-expression">

        ${sqrtDisplay(
          a
        )}

        <span>
          ×
        </span>

        ${sqrtDisplay(
          b
        )}

        <span>
          ＋
        </span>

        ${radicalDisplay(
          extra,
          c
        )}

      </span>
    `,

    [

      {
        coefficient:
          1,

        radicand:
          a * b
      },

      {
        coefficient:
          extra,

        radicand:
          c
      }
    ],

    [

      `√${a}×√${b}＝√${a * b}`,

      `與 ${radicalDisplay(
        extra,
        c
      )} 不是同類根式，因此不能合併。`,

      `答案＝${multiRadicalDisplay(
        [
          {
            coefficient:
              1,

            radicand:
              a * b
          },

          {
            coefficient:
              extra,

            radicand:
              c
          }
        ]
      )}`
    ],

    "請依運算順序計算"
  );
}


/*
√2(√3 + √5)
=
√6 + √10
*/

function makeDistributionDifferent() {

  const outside =
    pick(
      [
        2,
        3,
        5
      ]
    );


  const others =
    shuffle(
      [
        2,
        3,
        5,
        7
      ]
        .filter(
          value =>
            value !== outside
        )
    )
      .slice(
        0,
        2
      );


  const r1 =
    outside *
    others[0];


  const r2 =
    outside *
    others[1];


  return multiRadicalQuestion(

    `

      <span class="math-expression">

        ${sqrtDisplay(
          outside
        )}

        <span>
          (
        </span>

        ${sqrtDisplay(
          others[0]
        )}

        <span>
          ＋
        </span>

        ${sqrtDisplay(
          others[1]
        )}

        <span>
          )
        </span>

      </span>
    `,

    [

      {
        coefficient:
          1,

        radicand:
          r1
      },

      {
        coefficient:
          1,

        radicand:
          r2
      }
    ],

    [

      `√${outside}×√${others[0]}
       ＝√${r1}`,

      `√${outside}×√${others[1]}
       ＝√${r2}`,

      `答案＝${multiRadicalDisplay(
        [
          {
            coefficient:
              1,

            radicand:
              r1
          },

          {
            coefficient:
              1,

            radicand:
              r2
          }
        ]
      )}`
    ],

    "請使用分配律展開"
  );
}


/*
(√a+√b)(√a−√b)
*/

function makeConjugate() {

  const a =
    pick(
      [
        5,
        6,
        7,
        10,
        11
      ]
    );


  const b =
    pick(
      [
        2,
        3,
        5
      ]
        .filter(
          value =>
            value !== a
        )
    );


  return numberQuestion(

    `

      <span class="math-expression">

        <span>
          (
        </span>

        ${sqrtDisplay(
          a
        )}

        <span>
          ＋
        </span>

        ${sqrtDisplay(
          b
        )}

        <span>
          )
        </span>

        <span>
          (
        </span>

        ${sqrtDisplay(
          a
        )}

        <span>
          −
        </span>

        ${sqrtDisplay(
          b
        )}

        <span>
          )
        </span>

      </span>
    `,

    a - b,

    [

      "利用平方差公式。",

      `(√${a})²－(√${b})²`,

      `＝${a}－${b}`,

      `＝${a - b}`
    ],

    "請利用乘法公式計算"
  );
}


/*
2√3 × √2 − √8 + √5
=
2√6 − 2√2 + √5
*/

function makeThreeTermMixed() {

  const a =
    pick(
      [
        2,
        3,
        5
      ]
    );


  const b =
    pick(
      [
        2,
        3,
        5,
        7
      ]
        .filter(
          value =>
            value !== a
        )
    );


  const third =
    pick(
      [
        3,
        5,
        7,
        11
      ]
        .filter(
          value =>
            value !== a &&
            value !== b &&
            value !== a * b
        )
    );


  const coefficient =
    rand(
      2,
      4
    );


  return multiRadicalQuestion(

    `

      <span class="math-expression">

        ${radicalDisplay(
          coefficient,
          a
        )}

        <span>
          ×
        </span>

        ${sqrtDisplay(
          b
        )}

        <span>
          −
        </span>

        ${sqrtDisplay(
          4 * a
        )}

        <span>
          ＋
        </span>

        ${sqrtDisplay(
          third
        )}

      </span>
    `,

    [

      {
        coefficient,

        radicand:
          a * b
      },

      {
        coefficient:
          -2,

        radicand:
          a
      },

      {
        coefficient:
          1,

        radicand:
          third
      }
    ],

    [

      `${radicalDisplay(
        coefficient,
        a
      )}×√${b}
       ＝
       ${radicalDisplay(
         coefficient,
         a * b
       )}`,

      `√${4 * a}
       ＝
       2√${a}`,

      `答案＝${multiRadicalDisplay(
        [
          {
            coefficient,

            radicand:
              a * b
          },

          {
            coefficient:
              -2,

            radicand:
              a
          },

          {
            coefficient:
              1,

            radicand:
              third
          }
        ]
      )}`
    ],

    "請依四則運算順序計算並化簡"
  );
}


function makeMode4() {

  return shuffle(
    [

      makeMultiplyPlusDifferent(),
      makeMultiplyPlusDifferent(),

      makeDistributionDifferent(),
      makeDistributionDifferent(),

      makeConjugate(),
      makeConjugate(),

      makeThreeTermMixed(),
      makeThreeTermMixed(),
      makeThreeTermMixed(),
      makeThreeTermMixed()
    ]
  );
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );

    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

function updateNumberPreview() {

function updateRadicalFractionPreview() {

  const coefficientRaw =
    $("rf-coefficient")
      ?.value
      .trim() ||
    "";


  const radicandRaw =
    $("rf-radicand")
      ?.value
      .trim() ||
    "";


  const denominatorRaw =
    $("rf-denominator")
      ?.value
      .trim() ||
    "";


  if (
    !coefficientRaw ||
    !radicandRaw ||
    !denominatorRaw
  ) {

    $("answer-preview")
      .innerHTML =
        "目前尚未完成答案。";


    return;
  }


  const sign =
    Number(
      $("rf-sign")
        .value
    );


  const coefficient =
    sign *
    Number(
      coefficientRaw
    );


  $("answer-preview")
    .innerHTML = `

      目前答案：

      <span class="answer-preview-value">

        ${radicalFractionDisplay(
          coefficient,
          Number(
            radicandRaw
          ),
          Number(
            denominatorRaw
          )
        )}

      </span>
  `;
}


function readMultiRawTerms() {

  const terms =
    [];


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const coefficientRaw =
      $(
        `mr-coefficient-${i}`
      )
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $(
        `mr-radicand-${i}`
      )
        ?.value
        .trim() ||
      "";


    /*
    整列留白
    */

    if (
      !coefficientRaw &&
      !radicandRaw
    ) {

      continue;
    }


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      )
    ) {

      return {

        valid:
          false
      };
    }


    const sign =
      Number(
        $(
          `mr-sign-${i}`
        ).value
      );


    terms.push(
      {

        coefficient:
          sign *
          Number(
            coefficientRaw
          ),

        radicand:
          Number(
            radicandRaw
          )
      }
    );
  }


  return {

    valid:
      true,

    terms
  };
}


function updateMultiPreview() {

  const result =
    readMultiRawTerms();


  if (
    !result.valid ||
    !result.terms.length
  ) {

    $("answer-preview")
      .innerHTML =
        "目前尚未完成答案。";


    return;
  }


  $("answer-preview")
    .innerHTML = `

      目前答案：

      <span class="answer-preview-value">

        ${multiRadicalDisplay(
          result.terms
        )}

      </span>
  `;
}

    [
      "rf-sign",
      "rf-coefficient",
      "rf-radicand",
      "rf-denominator"
    ]
      .forEach(
        id => {

          $(id)
            .addEventListener(
              "input",
              updateRadicalFractionPreview
            );


          $(id)
            .addEventListener(
              "change",
              updateRadicalFractionPreview
            );
        }
      );


    $("rf-radicand")
      .focus();


    return;
  }


  /*
  ★ Multi Radical
  */

  panel.innerHTML = `

    <div class="answer-title">

      ${question.label}

    </div>


    <p class="answer-help">

      請將每一個不同類根式分開填寫。<br>

      同類根式必須先自行合併；
      不需要的項目請留白。

    </p>


    <div class="multi-radical-editor">

      ${multiRadicalRowHTML(0)}

      ${multiRadicalRowHTML(1)}

      ${multiRadicalRowHTML(2)}

    </div>


    <div
      id="answer-preview"
      class="answer-preview"
    >

      目前尚未完成答案。

    </div>
  `;


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    [
      `mr-sign-${i}`,
      `mr-coefficient-${i}`,
      `mr-radicand-${i}`
    ]
      .forEach(
        id => {

          $(id)
            .addEventListener(
              "input",
              updateMultiPreview
            );


          $(id)
            .addEventListener(
              "change",
              updateMultiPreview
            );
        }
      );
  }


  $("mr-coefficient-0")
    .focus();
}

/*
==================================================
多根式驗證
==================================================
*/

function validateMultiTerms() {

  const result =
    readMultiRawTerms();


  if (
    !result.valid ||
    !result.terms.length
  ) {

    return {

      valid:
        false,

      message:
        "請至少完整填寫一個根式項目。"
    };
  }


  /*
  radicand 檢查
  */

  for (
    const term of result.terms
  ) {

    if (
      term.coefficient ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "根號外係數不可填 0；若沒有這一項請直接留白。"
      };
    }


    if (
      term.radicand <=
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號內請填大於 1 的正整數。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          term.radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${term.radicand} 還可以繼續化簡，請先化成最簡根式。`
      };
    }
  }


  /*
  不能出現相同 radicand 兩次
  */

  const roots =
    result.terms.map(
      term =>
        term.radicand
    );


  if (
    new Set(
      roots
    ).size !==
    roots.length
  ) {

    return {

      valid:
        false,

      message:
        "⚠️ 仍有同類根式尚未合併，請先自行合併後再提交。"
    };
  }


  return {

    valid:
      true,

    terms:
      normalizeTerms(
        result.terms
      ),

    display:
      multiRadicalDisplay(
        result.terms
      )
  };
}


/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  /*
  number
  */

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  radical
  */

  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把答案填寫完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  /*
  radicalFraction
  */

  if (
    question.type ===
    "radicalFraction"
  ) {

    const coefficientRaw =
      $("rf-coefficient")
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $("rf-radicand")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("rf-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      ) ||
      !/^\d+$/.test(
        denominatorRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子根式與分母填寫完整。"
      };
    }


    const sign =
      Number(
        $("rf-sign")
          .value
      );


    const coefficient =
      sign *
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      radicand <=
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號內請填大於 1 的正整數。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${radicand} 還不是最簡根式，請自行化簡。`
      };
    }


    if (
      gcd(
        Math.abs(
          coefficient
        ),
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 分子係數與分母還可以約分，請先化成最簡分數。"
      };
    }


    return {

      valid:
        true,

      coefficient,

      radicand,

      denominator,

      display:
        radicalFractionDisplay(
          coefficient,
          radicand,
          denominator
        )
    };
  }


  /*
  multi
  */

  return validateMultiTerms();
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return (

      answer.coefficient ===
        question.coefficient &&

      answer.radicand ===
        question.radicand &&

      answer.denominator ===
        question.denominator
    );
  }


  /*
  Multi
  */

  if (
    answer.terms.length !==
    question.terms.length
  ) {

    return false;
  }


  return answer.terms.every(
    (
      term,
      i
    ) =>

      term.coefficient ===
        question.terms[i].coefficient &&

      term.radicand ===
        question.terms[i].radicand
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return radicalDisplay(
      question.coefficient,
      question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return radicalFractionDisplay(
      question.coefficient,
      question.radicand,
      question.denominator
    );
  }


  return multiRadicalDisplay(
    question.terms
  );
}


/*
==================================================
解析
==================================================
*/

function explanationHTML(
  question
) {

  return question
    .explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>

            步驟 ${i + 1}｜

          </strong>

          ${step}

        </div>

      `
    )
    .join("");
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length - 1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  try {

    questions =
      createQuestions();

  } catch (
    error
  ) {

    console.error(
      "建立根式運算題目失敗：",
      error
    );


    alert(
      "題目建立失敗，請重新整理後再試一次。"
    );


    return;
  }


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  radicalInput =
    null;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經能熟練處理各種根式運算。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意有理化與不同類根式的整理。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本運算已掌握，再加強化簡與同類根式判斷。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從根式乘法與加減開始，再進入綜合題。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firebase
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


  } catch (
    error
  ) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";
  }
}


/*
==================================================
錯題
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">


                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>


                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>


                </article>

              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}

==================================================
事件
==================================================
*/

      button.addEventListener(

  );

  );

      );

  );

  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);

==================================================
初始化
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showOnly(
  "start-screen"
);


</script>
