<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    根式運算大挑戰｜數學遊戲樂園
  </title>


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #7b1fa2;
      --primary-dark: #4a148c;
      --primary-light: #f3e5f5;
      --primary-border: #ce93d8;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }


    body {

      margin: 0;
      min-height: 100vh;
      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #f3e5f5,
          #fff8e1
        );
    }


    button,
    input,
    select {

      font-family: inherit;
    }


    .hidden {
      display: none !important;
    }


    .page-shell {

      width: min(100%, 980px);
      margin: 0 auto;
    }


    #commonHeaderMount {
      margin-bottom: 14px;
    }


    .game-card {

      overflow: hidden;

      border:
        1px solid
        #eadcf0;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(15,23,42,.13);
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .concept-strip {

      display: flex;
      justify-content: center;
      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;
      font-weight: 900;
    }


    .screen {
      padding: 22px;
    }


    /*
    ==================================================
    題目數學式
    ==================================================
    */

    .math-expression {

      display:
        inline-flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: .10em;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;
    }


    /*
    ==================================================
    題目根號 SVG
    ==================================================
    */

    .display-radical {

      position: relative;

      display:
        inline-flex;

      align-items: center;

      min-width: 1.15em;
      min-height: 1.55em;

      padding:
        .15em .10em .02em .78em;

      margin:
        0 .04em;

      vertical-align: middle;
    }


    .display-radical-svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .display-radical-path {

      fill: none;

      stroke:
        currentColor;

      stroke-width: 3.6;

      stroke-linejoin: round;
      stroke-linecap: round;

      vector-effect:
        non-scaling-stroke;
    }


    .display-radicand {

      position: relative;

      z-index: 2;

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;

      padding:
        0 .10em 0 .02em;
    }


    /*
    ==================================================
    分數
    ==================================================
    */

    .display-fraction {

      display:
        inline-flex;

      flex-direction: column;

      justify-content: center;
      align-items: stretch;

      min-width: 1.8em;

      margin:
        0 .12em;

      vertical-align: middle;
    }


    .display-fraction-top,
    .display-fraction-bottom {

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        .08em .18em;
    }


    .display-fraction-top {

      border-bottom:
        2.5px solid
        currentColor;
    }


    /*
    ==================================================
    Mode
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 16px;
    }


    .mode-card {

      min-height: 220px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(15,23,42,.11);
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;
      font-weight: 900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;
      font-weight: 900;

      line-height: 1.65;
    }


    /*
    ==================================================
    Status
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(0,1fr)
        );

      gap: 10px;

      margin-bottom: 12px;
    }


    .status-box {

      min-height: 66px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display: flex;
      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display: flex;
      justify-content: center;

      width: 100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius: 999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #ba68c8
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }


    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-weight: 900;
    }


    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        #0f172a;

      font-size:
        clamp(
          27px,
          5vw,
          43px
        );

      line-height: 1.8;

      overflow-x: auto;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }


    /*
    ==================================================
    Number
    ==================================================
    */

    .number-answer {

      display: flex;
      justify-content: center;
    }


    .number-answer input {

      width:
        min(
          250px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;
      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    ★ Expression Answer
    常數 + 根式
    ==================================================
    */

    .expression-editor {

      width:
        min(
          100%,
          850px
        );

      margin:
        0 auto;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      gap: 14px;

      flex-wrap: wrap;
    }


    .expression-piece {

      min-width: 150px;

      padding: 10px;

      border:
        1px solid
        #e5e7eb;

      border-radius: 14px;

      background: white;

      text-align: center;
    }


    .expression-piece-title {

      margin-bottom: 7px;

      color:
        var(--primary-dark);

      font-size: 13px;
      font-weight: 900;
    }


    .constant-piece {

      width: 150px;
    }


    .constant-controls {

      display: flex;

      gap: 6px;
    }


    .constant-sign {

      width: 62px;
      height: 52px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      background: white;

      font-size: 20px;
      font-weight: 900;
    }


    .constant-value {

      width: 76px;
      height: 52px;

      padding: 7px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      font-size: 20px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    ★ 根式作答格
    ==================================================
    */

    .radical-piece {

      width:
        min(
          100%,
          365px
        );
    }


    .radical-piece-controls {

      display: grid;

      grid-template-columns:
        72px 105px minmax(150px,1fr);

      align-items: end;

      gap: 7px;
    }


    .answer-field {

      text-align: center;
    }


    .answer-field label {

      display: block;

      margin-bottom: 5px;

      color:
        var(--muted);

      font-size: 12px;
      font-weight: 900;
    }


    .answer-sign {

      width: 100%;
      height: 52px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      background: white;

      font-size: 20px;
      font-weight: 900;
    }


    .answer-coefficient {

      width: 100%;
      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 9px;

      font-size: 20px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    SVG answer radical
    ==================================================
    */

    .answer-radical {

      position: relative;

      width: 100%;
      height: 62px;
    }


    .answer-radical svg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .answer-radical path {

      fill: none;

      stroke:
        #0f172a;

      stroke-width: 4;

      stroke-linejoin:
        round;

      stroke-linecap:
        round;

      vector-effect:
        non-scaling-stroke;
    }


    .answer-radicand {

      position: absolute;

      left: 43px;
      top: 9px;

      width:
        calc(
          100% - 47px
        );

      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 8px;

      background: white;

      font-size: 20px;
      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    Radical fraction
    ==================================================
    */

    .radical-fraction-stack {

      width:
        min(
          100%,
          560px
        );

      margin:
        0 auto;
    }


    .rf-numerator {

      padding:
        8px 10px 14px;

      border-bottom:
        3px solid
        #334155;
    }


    .rf-numerator-editor {

      display: flex;

      justify-content: center;
      align-items: flex-end;

      gap: 10px;

      flex-wrap: wrap;
    }


    .rf-denominator {

      display: flex;

      flex-direction: column;

      align-items: center;

      padding:
        13px 10px 4px;
    }


    .rf-denominator input {

      width: 130px;
      height: 52px;

      padding: 8px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 10px;

      font-size: 21px;
      font-weight: 900;

      text-align: center;
    }


    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        15px auto 0;

      padding: 13px;

      max-width: 760px;
      min-height: 60px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;
      font-weight: 900;
    }


    .answer-preview-value {

      display:
        inline-flex;

      align-items: center;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 25px;
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }


    /*
    ==================================================
    詳解專用根號
    不使用 SVG 字串插入，避免 Safari/iPad 把 SVG 屬性顯示成文字
    ==================================================
    */

    .explanation-radical {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      margin: 0 .08em;
      padding: .08em .12em 0 .58em;
      min-height: 1.35em;
      vertical-align: middle;
      font-family: "Cambria Math", "Times New Roman", serif;
    }

    .explanation-radical::before {
      content: "";
      position: absolute;
      left: .08em;
      top: .52em;
      width: .30em;
      height: .52em;
      border-left: 2.4px solid currentColor;
      border-bottom: 2.4px solid currentColor;
      transform: skew(-18deg);
      transform-origin: left bottom;
    }

    .explanation-radical::after {
      content: "";
      position: absolute;
      left: .38em;
      right: 0;
      top: .08em;
      border-top: 2.4px solid currentColor;
    }

    .explanation-radicand {
      position: relative;
      z-index: 1;
      padding: 0 .05em;
      line-height: 1.2;
    }

    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;
      font-weight: 900;

      line-height: 1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background:
        #faf1fc;

      color:
        #334155;

      line-height: 1.95;
    }


    .explanation-step {
      margin: 12px 0;
    }

    .explanation-math-line {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: .12em;
      margin-top: 5px;
      overflow-x: auto;
      white-space: nowrap;
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 1.08em;
    }

    .explanation-math-line .display-radical {
      flex: 0 0 auto;
    }


    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {
      text-align: center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;
      font-weight: 900;
    }


    .result-stars {
      font-size: 31px;
    }


    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );

      gap: 12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding: 16px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }


    .save-status {

      min-height: 28px;

      margin-top: 14px;

      font-weight: 900;
    }


    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;
      gap: 14px;
    }


    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }


    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }


    .review-question {

      margin:
        12px 0;

      font-size: 23px;

      text-align: center;
    }


    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:760px
    ) {

      body {
        padding: 8px;
      }


      .screen {

        padding:
          18px 12px;
      }


      .mode-grid {
        grid-template-columns: 1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }


      .timer-box {
        grid-column: 1 / -1;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }


      .expression-editor {

        align-items: stretch;
      }


      .radical-piece {

        width: 100%;
      }


      .radical-piece-controls {

        grid-template-columns:
          66px 90px minmax(140px,1fr);
      }

    }

  </style>

</head>


<body>


<div class="page-shell">


  <div id="commonHeaderMount"></div>


  <main class="game-card">


    <header class="game-header">


      <h1 class="game-title">
        ⚡ 根式運算大挑戰
      </h1>


      <p class="game-subtitle">

        根式乘除、分母有理化、同類方根、乘法公式與根式四則運算。

      </p>


      <div class="concept-strip">

        <span class="concept-chip">
          根式乘法
        </span>

        <span class="concept-chip">
          根式除法
        </span>

        <span class="concept-chip">
          分母有理化
        </span>

        <span class="concept-chip">
          根式加減
        </span>

        <span class="concept-chip">
          乘法公式
        </span>

        <span class="concept-chip">
          四則運算
        </span>

      </div>


    </header>


    <!-- Mode -->

    <section
      id="start-screen"
      class="screen"
    >


      <div class="mode-grid">


        <button
          class="mode-card"
          type="button"
          data-mode="multiply"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式一｜根式乘法
          </h2>

          <p>
            基本根式乘法、含係數根式及相同根式相乘。
          </p>

          <div class="mode-example">
            題目以直接乘法為主，不額外加入複雜化簡。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="divide"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式二｜除法與有理化
          </h2>

          <p>
            根式除法、含係數除法、單一根式分母有理化。
          </p>

          <div class="mode-example">
            分數答案使用上下分子、分母格式作答。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="addSubtract"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式三｜根式加減
          </h2>

/*

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  return RU().gcd(
    a,
    b
  );
}

function simplifyRadicalData(
  coefficient,

) {

    RU().simplifyRadical(

    );


  if (

  ) {

    return {

      value:
        result.value
    };
  }


  return {

    type:
      "radical",

    coefficient:
      result.coefficient,

    radicand:
      result.radicand
  };
}


/*

function sqrtDisplay(
  content
) {

  return `

    <span class="display-radical">

      <svg
        class="display-radical-svg"
        viewBox="0 0 100 62"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <path
          class="display-radical-path"
          d="
            M 1 37
            L 7 37
            L 13 51
            L 18 58
            L 29 8
            L 98 8
          "
        />

      </svg>


      <span class="display-radicand">

        ${content}

      </span>

    </span>
  `;
}


function radicalDisplay(
  coefficient,
  radicand
) {

  coefficient =
    Number(
      coefficient
    );


  if (
    radicand ===
    1
  ) {

    return String(
      coefficient
    );
  }


  let prefix =
    "";


  if (
    coefficient ===
    -1
  ) {

    prefix =
      "−";

  } else if (
    coefficient !==
    1
  ) {

    prefix =
      String(
        coefficient
      )
        .replace(
          "-",
          "−"
        );
  }


  return `

    <span class="math-expression">

      ${prefix}

      ${sqrtDisplay(
        String(
          radicand
        )
      )}

    </span>
  `;
}


function fractionDisplay(
  top,
  bottom
) {

  return `

    <span class="display-fraction">

      <span class="display-fraction-top">
        ${top}
      </span>

      <span class="display-fraction-bottom">
        ${bottom}
      </span>

    </span>
  `;
}


function divideDisplay(
  c1,
  r1,
  c2,
  r2
) {

  return fractionDisplay(

    radicalDisplay(
      c1,
      r1
    ),

    radicalDisplay(
      c2,
      r2
    )
  );
}


/*
==================================================
Expression
==================================================
*/

function normalizeRadicalTerms(
  terms
) {

  const map =
    new Map();


  terms.forEach(
    term => {

      if (
        !term.coefficient
      ) {

        return;
      }


      const old =
        map.get(
          term.radicand
        ) ||
        0;


      map.set(
        term.radicand,
        old +
        term.coefficient
      );
    }
  );


  return [
    ...map.entries()
  ]
    .map(
      (
        [
          radicand,
          coefficient
        ]
      ) => ({

        coefficient,

        radicand:
          Number(
            radicand
          )
      })
    )
    .filter(
      term =>
        term.coefficient !==
        0
    )
    .sort(
      (
        a,
        b
      ) =>
        a.radicand -
        b.radicand
    );
}


function expressionDisplay(
  constant,
  radicals
) {

  radicals =
    normalizeRadicalTerms(
      radicals
    );


  const parts =
    [];


  if (
    constant !==
    0
  ) {

    parts.push(
      {

        sign:
          constant < 0
            ? "−"
            : "+",

        html:
          String(
            Math.abs(
              constant
            )
          )
      }
    );
  }


  radicals.forEach(
    term => {

      parts.push(
        {

          sign:
            term.coefficient < 0
              ? "−"
              : "+",

          html:
            radicalDisplay(
              Math.abs(
                term.coefficient
              ),
              term.radicand
            )
        }
      );
    }
  );


  if (
    !parts.length
  ) {

    return "0";
  }


  return `

    <span class="math-expression">

      ${
        parts
          .map(
            (
              part,
              i
            ) => `

              <span>

                ${
                  i === 0 &&
                  part.sign ===
                  "+"

                    ? ""

                    : part.sign
                }

                ${part.html}

              </span>
            `
          )
          .join("")
      }

    </span>
  `;
}


/*
==================================================
題目物件
==================================================
*/

function numberQuestion(
  html,
  answer,
  explanation,
  label
) {

  return {

    type:
      "number",

    html,

    answer,

    explanation,

    label
  };
}


function radicalQuestion(
  html,
  coefficient,
  radicand,
  explanation,
  label
) {

  return {

    type:
      "radical",

    html,

    coefficient,

    radicand,

    explanation,

    label
  };
}


function expressionQuestion(
  html,
  constant,
  radicals,
  explanation,
  label
) {

  return {

    type:
      "expression",

    html,

    constant,

    radicals:
      normalizeRadicalTerms(
        radicals
      ),

    explanation,

    label
  };
}


function radicalFractionQuestion(
  html,
  coefficient,
  radicand,
  denominator,
  explanation,
  label
) {

  const divisor =
    gcd(
      Math.abs(
        coefficient
      ),
      Math.abs(
        denominator
      )
    );


  coefficient /=
    divisor;


  denominator /=
    divisor;


  if (
    denominator <
    0
  ) {

    coefficient *=
      -1;

    denominator *=
      -1;
  }


  return {

    type:
      "radicalFraction",

    html,

    coefficient,

    radicand,

    denominator,

    explanation,

    label
  };
}

function makeDivideBasic() {

  const b =
    pick(
      [
        2,
        3,
        5,
        7
      ]
    );


  const answerRoot =
    pick(
      [

  return radicalQuestion(

    ),

      `＝√${answerRoot}`
    ],

    "請計算並化成最簡根式"
  );
}


function makeDivideCoefficient() {

  const rootDen =
    pick(
      [
        2,
        3,
        5
      ]
    );


  const answerRoot =
    pick(
      [
        2,
        3,
        5,
        7
      ]
    );


  const answerCoef =
    rand(
      2,
      5
    );


  const denominatorCoef =
    rand(
      2,
      4
    );


  const numeratorCoef =
    answerCoef *
    denominatorCoef;


  return radicalQuestion(

    divideDisplay(

      numeratorCoef,

      rootDen *
      answerRoot,

      denominatorCoef,

      rootDen
    ),

    answerCoef,

    answerRoot,

    [

      `根號外：
       ${numeratorCoef}÷${denominatorCoef}
       ＝${answerCoef}`,

      `根號內：
       ${
         rootDen *
         answerRoot
       }÷${rootDen}
       ＝${answerRoot}`
    ],

    "請計算並化成最簡根式"
  );
}


function makeSimpleRationalize() {

  const r =
    pick(
      [
        2,
        3,
        5,
        6,
        7,
        10
      ]
    );


  const n =
    rand(
      1,
      7
    );


  return radicalFractionQuestion(

    fractionDisplay(

      n,

      sqrtDisplay(
        r
      )
    ),

    n,

    r,

    r,

    [

      `原式的分母含有 √${r}，因此要把分母中的根號消去。`,

      `分子、分母同乘 √${r}，數值不會改變：\n${n}／√${r} × √${r}／√${r}。`,

      `先算分子：${n}×√${r}＝${n}√${r}。`,

      `再算分母：√${r}×√${r}＝(√${r})²＝${r}。`,

      `所以原式＝${n}√${r}／${r}。`,

      `最後檢查根號是否已是最簡根式，並檢查根號外係數 ${n} 與分母 ${r} 是否可以約分；若可以，還要繼續約成最簡形式。`

    ],

    "請將分母有理化"
  );
}

    r,

      `兩項都是同類方根。`,

      `${a}
       ${
         minus
           ? "－"
           : "＋"
       }
       ${b}
       ＝${coefficient}`
    ],

    "請合併同類方根"
  );
}

/*

A
例9：分配律／兩括號
--------------------------------------------------
*/

function makeMode4A() {

  if (
    Math.random() <
    .5
  ) {

    /*
    -2√a(√b - √c)
    */

    const a =
      pick(
        [
          2,
          3,
          5
        ]
      );


    const b =
      pick(
        [
          2,
          3,
          5,
          6
        ]
      );


    const c =
      pick(
        [
          2,
          3,
          5,
          6,
          7
        ].filter(
          value =>
            value !== b
      )
    );


    const coef =
      rand(
        1,
        3
      );


    const first =
      simplifyRadicalData(
        -coef,
        a * b
      );


    const second =
      simplifyRadicalData(
        coef,
        a * c
      );


    const radicals =
      [];


    let constant =
      0;


    [
      first,
      second
    ]
      .forEach(
        result => {

          if (
            result.type ===
            "number"
          ) {

            constant +=
              result.value;

          } else {

            radicals.push(
              result
            );
          }
        }
      );


    return expressionQuestion(

      `

        <span class="math-expression">

          −${coef}

          ${sqrtDisplay(a)}

          <span>(</span>

          ${sqrtDisplay(b)}

          <span>−</span>

          ${sqrtDisplay(c)}

          <span>)</span>

        </span>
      `,

      constant,

      radicals,

      [

        "先利用分配律展開。",

        `每一個乘積再化成最簡根式。`
      ],

      "請利用分配律計算並化簡"
    );

  }


  /*
  (√a - √b)(√c + 1)
  */

  const [
    a,
    b,
    c
  ] =
    pick(
      [
        [3,2,6],
        [5,2,10],
        [7,3,6],
        [6,2,3]
      ]
    );


  const results =
    [

      simplifyRadicalData(
        1,
        a * c
      ),

      {
        type:
          "radical",
        coefficient:
          1,
        radicand:
          a
      },

      simplifyRadicalData(
        -1,
        b * c
      ),

      {
        type:
          "radical",
        coefficient:
          -1,
        radicand:
          b
      }
    ];


  let constant =
    0;


  const radicals =
    [];


  results.forEach(
    result => {

      if (
        result.type ===
        "number"
      ) {

        constant +=
          result.value;

      } else {

        radicals.push(
          result
        );
      }
    }
  );


  return expressionQuestion(

    `

      <span class="math-expression">

        <span>(</span>

        ${sqrtDisplay(a)}

        <span>−</span>

        ${sqrtDisplay(b)}

        <span>)</span>

        <span>(</span>

        ${sqrtDisplay(c)}

        <span>＋1)</span>

      </span>
    `,

    constant,

    radicals,

    [

      "利用分配律將四項全部乘開。",

      "將每一個根式化簡後，再合併同類方根。"
    ],

    "請展開並化為最簡形式"
  );
}


/*
--------------------------------------------------
B
例10：乘除混合
--------------------------------------------------
*/

function makeMode4B() {

  /*
  ==================================================
  單一根式分母的乘除混合題

  解題方向統一採用課本式：
  1. 分子、分母同乘分母的根式
  2. 先讓分母有理化成整數
  3. 分子再利用分配律做根式乘法
  4. 化成最簡根式
  5. 最後約分整理
  ==================================================
  */

  const [
    r,
    s
  ] =
    pick(
      [
        [2,3],
        [2,5],
        [2,7],
        [3,2],
        [3,5],
        [3,7],
        [5,2],
        [5,3],
        [5,7]
      ]
    );


  const a =
    rand(
      2,
      5
    );


  const rs =
    r * s;


  const originalNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a,
        rs
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

    </span>
  `;


  const originalFraction =
    fractionDisplay(
      originalNumerator,
      sqrtDisplay(s)
    );


  const rationalizingFactor =
    fractionDisplay(
      sqrtDisplay(s),
      sqrtDisplay(s)
    );


  const multipliedNumerator = `

    <span class="math-expression">

      <span>(</span>

      ${radicalDisplay(
        a,
        rs
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

      <span>)</span>

      ${sqrtDisplay(s)}

    </span>
  `;


  const distributedNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a,
        rs
      )}

      <span>×</span>

      ${sqrtDisplay(s)}

      <span>＋</span>

      ${radicalDisplay(
        s,
        r
      )}

      <span>×</span>

      ${sqrtDisplay(s)}

    </span>
  `;


  const rootProductNumerator = `

    <span class="math-expression">

      ${a}

      ${sqrtDisplay(
        rs * s
      )}

      <span>＋</span>

      ${s}

      ${sqrtDisplay(rs)}

    </span>
  `;


  const simplifiedNumerator = `

    <span class="math-expression">

      ${radicalDisplay(
        a * s,
        r
      )}

      <span>＋</span>

      ${radicalDisplay(
        s,
        rs
      )}

    </span>
  `;


  const finalAnswer =
    expressionDisplay(
      0,
      [
        {
          coefficient:
            a,

          radicand:
            r
        },

        {
          coefficient:
            1,

          radicand:
            rs
        }
      ]
    );


  return expressionQuestion(

    originalFraction,

    0,

    [
      {
        coefficient:
          a,

        radicand:
          r
      },

      {
        coefficient:
          1,

        radicand:
          rs
      }
    ],

    [

      `分母是 ${sqrtDisplay(s)}，為了使分母成為整數，分子、分母同乘 ${sqrtDisplay(s)}。`,

      `
        ${originalFraction}
        <span style="margin:0 .35em;">×</span>
        ${rationalizingFactor}
      `,

      `先計算分母：${sqrtDisplay(s)}×${sqrtDisplay(s)}＝${s}。`,

      `分子整體同乘 ${sqrtDisplay(s)}：${multipliedNumerator}。`,

      `利用分配律將分子乘開：${distributedNumerator}。`,

      `做根式乘法：${rootProductNumerator}。`,

      `因為 ${sqrtDisplay(rs * s)}＝${s}${sqrtDisplay(r)}，所以分子化簡為 ${simplifiedNumerator}。`,

      `因此原式＝${fractionDisplay(simplifiedNumerator, String(s))}。`,

      `分子兩項都有公因數 ${s}，與分母 ${s} 約分後，得到 ${finalAnswer}。`,

      `最後檢查：各根式都已是最簡根式；若兩項不是同類方根，就不能再合併。`
    ],

    "請計算並化為最簡根式"
  );
}

/*
--------------------------------------------------
E
例13：平方差公式有理化分母

設計兩類：
1. 3/(√7-2) 型
2. √2/(√6+√5) 型
--------------------------------------------------
*/

function makeMode4E() {

  if (
    Math.random() <
    .5
  ) {

    /*
    d / (√a - b)

    控制：
    a-b² = d

    => 答案 √a + b
    */

    const [
      a,
      b
    ] =
      pick(
        [
          [7,2],
          [11,3],
          [13,3],
          [6,2]
        ]
      );


    const d =
      a -
      b *
      b;


    return expressionQuestion(

      fractionDisplay(

        String(
          d
        ),

        `

          <span class="math-expression">

            ${sqrtDisplay(a)}

            <span>−</span>

            ${b}

          </span>
        `
      ),

      b,

      [

        {
          coefficient:
            1,

          radicand:
            a
        }
      ],

      [

        `原式分母為 √${a}－${b}，要利用平方差公式有理化分母。`,

        `分子、分母同乘共軛式 √${a}＋${b}。`,

        `分子：${d}(√${a}＋${b})＝${d}√${a}＋${d * b}。`,

        `分母：(√${a}－${b})(√${a}＋${b})＝(√${a})²－${b}²。`,

        `分母＝${a}－${b * b}＝${d}。`,

        `所以原式＝(${d}√${a}＋${d * b})／${d}。`,

        `分子、分母同除以 ${d}，得到 √${a}＋${b}。`
      ],

      "請利用平方差公式有理化分母"
    );

  }


  /*
  √2/(√6+√5)
  =>
  √2(√6-√5)/(6-5)
  =>
  2√3-√10
  */

  const [
    n,
    a,
    b
  ] =
    pick(
      [
        [2,6,5],
        [3,7,6],
        [2,5,3]
      ]
    );


  const denominator =
    a -
    b;


  const first =
    simplifyRadicalData(
      1,
      n *
      a
    );


  const second =
    simplifyRadicalData(
      -1,
      n *
      b
    );


  let constant =
    0;


  const radicals =
    [];


  [
    first,
    second
  ]
    .forEach(
      result => {

        if (
          result.type ===
          "number"
        ) {

          constant +=
            result.value;

        } else {

          radicals.push(
            {

              coefficient:
                result.coefficient /
                denominator,

              radicand:
                result.radicand
            }
          );
        }
      }
    );


  /*
  只保留 denominator = 1 的題組
  */

  if (
    denominator !==
    1
  ) {

    return makeMode4E();
  }


  return expressionQuestion(

    fractionDisplay(

      sqrtDisplay(
        n
      ),

      `

        <span class="math-expression">

          ${sqrtDisplay(a)}

          <span>＋</span>

          ${sqrtDisplay(b)}

        </span>
      `
    ),

    constant,

    radicals,

    [

      `原式分母為 ${sqrtDisplay(a)}＋${sqrtDisplay(b)}，所以分子、分母同乘它的共軛式 ${sqrtDisplay(a)}－${sqrtDisplay(b)}。`,

      `${fractionDisplay(
        sqrtDisplay(n),
        `<span class="math-expression">${sqrtDisplay(a)}<span>＋</span>${sqrtDisplay(b)}</span>`
      )}
      ×
      ${fractionDisplay(
        `<span class="math-expression">${sqrtDisplay(a)}<span>－</span>${sqrtDisplay(b)}</span>`,
        `<span class="math-expression">${sqrtDisplay(a)}<span>－</span>${sqrtDisplay(b)}</span>`
      )}`,

      `先算分子：${sqrtDisplay(n)}(${sqrtDisplay(a)}－${sqrtDisplay(b)})
      ＝${sqrtDisplay(n)}×${sqrtDisplay(a)}－${sqrtDisplay(n)}×${sqrtDisplay(b)}
      ＝${sqrtDisplay(n * a)}－${sqrtDisplay(n * b)}。`,

      (() => {
        const firstText = first.type === "number"
          ? `${sqrtDisplay(n * a)}＝${first.value}`
          : (
              first.coefficient === 1
                ? `${sqrtDisplay(n * a)} 已經是最簡根式。`
                : `${sqrtDisplay(n * a)}＝${sqrtDisplay(`${first.coefficient * first.coefficient}×${first.radicand}`)}＝${first.coefficient}${sqrtDisplay(first.radicand)}`
            );

        const secondAbs = second.type === "number"
          ? { type: "number", value: Math.abs(second.value) }
          : { type: "radical", coefficient: Math.abs(second.coefficient), radicand: second.radicand };

        const secondText = secondAbs.type === "number"
          ? `${sqrtDisplay(n * b)}＝${secondAbs.value}`
          : (
              secondAbs.coefficient === 1
                ? `${sqrtDisplay(n * b)} 已經是最簡根式。`
                : `${sqrtDisplay(n * b)}＝${sqrtDisplay(`${secondAbs.coefficient * secondAbs.coefficient}×${secondAbs.radicand}`)}＝${secondAbs.coefficient}${sqrtDisplay(secondAbs.radicand)}`
            );

        return `化簡分子中的根式：${firstText}；${secondText}`;
      })(),

      `因此分子整理為 ${expressionDisplay(
        0,
        [
          first.type === "radical" ? { coefficient: first.coefficient, radicand: first.radicand } : null,
          second.type === "radical" ? { coefficient: second.coefficient, radicand: second.radicand } : null
        ].filter(Boolean)
      )}${
        first.type === "number" || second.type === "number"
          ? `（若有整數項再一起整理）`
          : ""
      }。`,

      `再算分母：(${sqrtDisplay(a)}＋${sqrtDisplay(b)})(${sqrtDisplay(a)}－${sqrtDisplay(b)})
      ＝(${sqrtDisplay(a)})²－(${sqrtDisplay(b)})²
      ＝${a}－${b}
      ＝${denominator}。`,

      denominator === 1
        ? `分母已化為 1，所以最後答案就是化簡後的分子：${expressionDisplay(constant, radicals)}。`
        : `最後將化簡後的分子除以 ${denominator}，再約分成最簡形式。`
    ],

    "請利用平方差公式有理化分母"
  );
}

/*
==================================================
時間
==================================================
*/

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed

/*
==================================================
依照學生填答順序顯示 Expression
判分仍會另外標準化，因此交換根式順序也能判對。
==================================================
*/

function expressionDisplayInInputOrder(
  constant,
  radicals
) {

  const parts = [];

  if (constant !== 0) {
    parts.push({
      sign: constant < 0 ? "−" : "+",
      html: String(Math.abs(constant))
    });
  }

  radicals.forEach(term => {
    if (!term.coefficient) return;
    parts.push({
      sign: term.coefficient < 0 ? "−" : "+",
      html: radicalDisplay(Math.abs(term.coefficient), term.radicand)
    });
  });

  if (!parts.length) return "0";

  return `
    <span class="math-expression">
      ${parts.map((part, i) => `
        <span>
          ${i === 0 && part.sign === "+" ? "" : part.sign}
          ${part.html}
        </span>
      `).join("")}
    </span>
  `;
}


/*
==================================================
讀取 Expression UI
==================================================
*/

function readExpressionInputs(
  question
) {

  let constant =
    0;


  if (
    question.constant !==
    0
  ) {

    const raw =
      $("expr-constant")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        raw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請將整數項填寫完整。"
      };
    }


    constant =
      Number(
        $("expr-constant-sign")
          .value
      ) *
      Number(
        raw
      );
  }


  const radicals =
    [];


  for (
    let i = 0;

    i <
    question.radicals.length;

    i++
  ) {

    const coefficientRaw =
      $(
        `expr-coefficient-${i}`
      )
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $(
        `expr-radicand-${i}`
      )
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把所有根式答案填寫完整。"
      };
    }


    const coefficient =
      Number(
        $(
          `expr-sign-${i}`
        ).value
      ) *
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    if (
      coefficient ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "根號外係數不可為 0。"
      };
    }


    if (
      radicand <=
      1
    ) {

      return {

        valid:
          false,

        message:
          "根號內必須是大於 1 的正整數。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${radicand} 還可以化簡，請先整理成最簡根式。`
      };
    }


    radicals.push(
      {

        coefficient,

        radicand
      }
    );
  }


  /*
  同類方根不能分開輸入
  */

  const roots =
    radicals.map(
      term =>
        term.radicand
    );


  if (
    new Set(
      roots
    ).size !==
    roots.length
  ) {

    return {

      valid:
        false,

      message:
        "⚠️ 還有同類方根尚未合併，請先自行整理答案。"
    };
  }


  return {

    valid:
      true,

    constant,

    // 判分用：標準化後依根號內排序
    radicals:
      normalizeRadicalTerms(
        radicals
      ),

    // 顯示用：保留學生實際填答順序
    display:
      expressionDisplayInInputOrder(
        constant,
        radicals
      )
  };
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  /*
  Number
  */

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  Radical
  */

  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把根式答案填寫完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  /*
  Radical Fraction
  */

  if (
    question.type ===
    "radicalFraction"
  ) {

    const coefficientRaw =
      $("rf-coefficient")
        ?.value
        .trim() ||
      "";


    const radicandRaw =
      $("rf-radicand")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("rf-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        coefficientRaw
      ) ||
      !/^\d+$/.test(
        radicandRaw
      ) ||
      !/^\d+$/.test(
        denominatorRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子與分母填寫完整。"
      };
    }


    const coefficient =
      Number(
        $("rf-sign")
          .value
      ) *
      Number(
        coefficientRaw
      );


    const radicand =
      Number(
        radicandRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      RU()
        .getLargestSquareFactor(
          radicand
        ) >
      1
    ) {

      return {

        valid:
          false,

        message:
          `⚠️ √${radicand} 還可以化簡。`
      };
    }


    if (
      gcd(
        Math.abs(
          coefficient
        ),
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 分數還可以約分，請先整理成最簡形式。"
      };
    }


    return {

      valid:
        true,

      coefficient,

      radicand,

      denominator,

      display:
        fractionDisplay(

          radicalDisplay(
            coefficient,
            radicand
          ),

          denominator
        )
    };
  }


  /*
  Expression
  */

  return readExpressionInputs(
    question
  );
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return (

      answer.coefficient ===
        question.coefficient &&

      answer.radicand ===
        question.radicand &&

      answer.denominator ===
        question.denominator
    );
  }


  if (
    answer.constant !==
    question.constant
  ) {

    return false;
  }


  if (
    answer.radicals.length !==
    question.radicals.length
  ) {

    return false;
  }


  return answer.radicals
    .every(
      (
        term,
        i
      ) =>

        term.coefficient ===
          question.radicals[
            i
          ].coefficient &&

        term.radicand ===
          question.radicals[
            i
          ].radicand
    );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return radicalDisplay(
      question.coefficient,
      question.radicand
    );
  }


  if (
    question.type ===
    "radicalFraction"
  ) {

    return fractionDisplay(

      radicalDisplay(
        question.coefficient,
        question.radicand
      ),

      question.denominator
    );
  }


  return expressionDisplay(
    question.constant,
    question.radicals
  );
}


/*
==================================================
解析
==================================================
*/

function formatExplanationMath(step) {

  const source = String(step ?? "");

  /*
  ==================================================
  詳解格式化（安全版）

  關鍵修正：
  1. 若 step 本身已經含有 HTML（例如 sqrtDisplay / radicalDisplay），
     直接原樣回傳，絕對不在標籤內插入 <br>。
  2. 純文字詳解先完成跳脫與換行處理，再把 √n 轉成 SVG 根號。
     這樣 <br> 只會出現在文字換行，不會跑進 <svg ...> 標籤裡。
  ==================================================
  */

  if (source.includes("<")) {
    return `<div class="explanation-math-line">${source}</div>`;
  }

  let escaped = source
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\s*\n\s*/g, " ")
    .replace(/\s{2,}/g, " ")
    .trim();

  escaped = escaped.replace(
    /√\s*(\d+)/g,
    (_, n) => sqrtDisplay(String(n))
  );

  return `<div class="explanation-math-line">${escaped}</div>`;
}


function explanationHTML(
  question
) {

  return question
    .explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>
            步驟 ${i + 1}｜
          </strong>

          ${formatExplanationMath(step)}

        </div>

      `
    )
    .join("");
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length - 1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  scoreSaved =
    false;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
評價
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經能靈活處理根式四則運算。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意同類方根與有理化細節。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再加強根式化簡與乘法公式。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從根式乘法、除法與同類方根開始複習。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firebase
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


  } catch (
    error
  ) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">


                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>


                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>


                </article>

              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
事件
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () =>
          startGame(
            button.dataset.mode
          )
      );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();

      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
初始化
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showOnly(
  "start-screen"
);


</script>
