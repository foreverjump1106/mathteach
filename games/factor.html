<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>質因數分解、公因數公倍數大挑戰</title>

  <link rel="stylesheet" href="../css/scratchpad.css">

  <link rel="stylesheet" href="../css/expression-input.css">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #00897b;
      --primary-dark: #00695c;
      --primary-light: #e0f2f1;
      --primary-border: #80cbc4;
      --text: #1f2937;
      --muted: #64748b;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --surface: #ffffff;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.13);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          135deg,
          #e8f5f3,
          #fff8e8
        );
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      width: min(100%, 920px);
      margin: 0 auto;
    }

    #commonHeaderMount {
      margin-bottom: 14px;
    }

    .game-card {
      overflow: hidden;
      border: 1px solid #dbe7e5;
      border-top: 8px solid var(--primary);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--shadow);
    }

    .game-header {
      padding: 26px 24px 20px;
      text-align: center;
      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );
    }

    .game-title {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.35;
    }

    .game-subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .screen {
      padding: 24px;
    }

    .hidden {
      display: none !important;
    }

    .mode-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .mode-card {
      min-height: 170px;
      padding: 20px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 10px 24px
        rgba(15, 23, 42, 0.11);
    }

    .mode-card h2 {
      margin: 0 0 9px;
      color: var(--primary-dark);
      font-size: 21px;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-note {
      margin-top: 8px;
      color: #475569;
      font-size: 14px;
      font-weight: 800;
    }

    .quiz-topbar {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .status-box {
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 8px;
      border-radius: 14px;
      background: var(--primary-light);
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .status-value {
      margin-top: 4px;
      font-size: 19px;
    }

    .progress-shell {
      height: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--primary),
          #26a69a
        );
      transition: width 0.2s ease;
    }

    .question-card {
      padding: 24px 18px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background: #ffffff;
      text-align: center;
    }

    .question-label {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: clamp(17px, 2.2vw, 21px);
      font-weight: 900;
      line-height: 1.6;
    }

    .question-content {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: clamp(21px, 3.2vw, 31px);
      font-weight: 900;
      line-height: 1.55;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .question-line {
      white-space: nowrap;
    }

    .pair-expression {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
      max-width: 100%;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .pair-bracket,
    .pair-comma {
      color: var(--primary-dark);
      font-weight: 900;
    }

    .pair-bracket {
      font-size: 1.12em;
    }

    .pair-comma {
      margin: 0 3px;
    }

    .question-content sup {
      position: relative;
      top: -0.48em;
      margin-left: 1px;
      font-size: 0.58em;
      line-height: 1;
      vertical-align: baseline;
    }

    sup {
      font-size: 0.62em;
      vertical-align: super;
    }

    .scratchpad-row {
      display: flex;
      justify-content: center;
      margin: 14px 0;
    }

    #scratchpad-mobile-button {
      display: flex;
      justify-content: center;
    }

    .answer-panel {
      margin-top: 18px;
      padding: 20px;
      border: 2px solid var(--primary-border);
      border-radius: 20px;
      background:
        linear-gradient(
          180deg,
          #f0fdfa,
          #ffffff
        );
    }

    .answer-title {
      margin-bottom: 12px;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 900;
    }

    .prime-expression {
      display: flex;
      min-height: 94px;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 12px;
      border: 3px solid var(--primary-border);
      border-radius: 16px;
      background: #ffffff;
    }

    .factor-slot {
      position: relative;
      min-width: 74px;
      min-height: 64px;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      padding: 17px 12px 8px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      background: #ffffff;
      cursor: pointer;
      transition:
        border-color 0.14s ease,
        box-shadow 0.14s ease;
    }

    .factor-slot.active {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px
        rgba(0, 137, 123, 0.14);
    }

    .factor-base {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
    }

    .factor-exponent {
      position: absolute;
      top: 5px;
      right: 9px;
      color: var(--primary-dark);
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    .factor-placeholder {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 900;
    }

    .multiply-symbol {
      flex: 0 0 auto;
      color: var(--primary-dark);
      font-size: 30px;
      font-weight: 900;
    }

    .input-controls {
      margin-top: 16px;
    }

    .control-group {
      margin-top: 12px;
    }

    .control-label {
      margin-bottom: 8px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .control-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .math-key {
      min-width: 54px;
      min-height: 44px;
      padding: 8px 12px;
      border: 2px solid var(--primary-border);
      border-radius: 12px;
      background: #ffffff;
      color: var(--primary-dark);
      font-weight: 900;
      cursor: pointer;
    }

    .math-key:hover,
    .math-key:active {
      background: var(--primary-light);
    }

    .math-key.action {
      min-width: 112px;
    }

    .math-key.danger {
      border-color: #fecaca;
      background: #fff7f7;
      color: var(--danger);
    }

    .input-hint {
      margin: 13px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .input-message {
      min-height: 24px;
      margin-top: 10px;
      color: var(--warning);
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .game-button {
      min-width: 136px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 5px 0
        var(--primary-dark);
    }

    .game-button:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0
        var(--primary-dark);
    }

    .game-button.secondary {
      background: #607d8b;
      box-shadow:
        0 5px 0
        #455a64;
    }

    .game-button.orange {
      background: #f57c00;
      box-shadow:
        0 5px 0
        #d86600;
    }

    .feedback {
      min-height: 54px;
      margin-top: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.6;
    }

    .feedback.correct {
      color: var(--success);
    }

    .feedback.wrong {
      color: var(--danger);
    }

    .explanation {
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: #f8fafc;
      color: #334155;
      line-height: 1.75;
    }

    .result-panel {
      text-align: center;
    }

    .result-score {
      margin: 16px 0;
      color: #f57c00;
      font-size: 56px;
      font-weight: 900;
    }

    .result-stars {
      margin-bottom: 10px;
      font-size: 31px;
    }

    .result-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }

    .result-stat {
      padding: 16px 10px;
      border-radius: 16px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 900;
    }

    .save-status {
      min-height: 28px;
      margin: 14px 0 0;
      font-weight: 900;
      line-height: 1.5;
    }

    .review-list {
      display: grid;
      gap: 14px;
    }

    .review-card {
      padding: 18px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #ffffff;
      box-shadow:
        0 8px 20px
        rgba(15, 23, 42, 0.08);
    }

    .review-title {
      margin-bottom: 8px;
      color: var(--danger);
      font-weight: 900;
    }

    .review-question {
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.6;
    }

    .review-answer {
      color: #475569;
      line-height: 1.7;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }

      .screen {
        padding: 18px 12px;
      }

      .game-header {
        padding: 22px 14px 17px;
      }

      .mode-grid {
        grid-template-columns: 1fr;
      }

      .quiz-topbar {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .answer-panel {
        padding: 16px 10px;
      }

      .question-label {
        font-size: 17px;
      }

      .question-content {
        justify-content: flex-start;
        font-size: clamp(18px, 4.6vw, 25px);
      }

      .pair-expression {
        min-width: max-content;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page-shell">

    <div id="commonHeaderMount"></div>

    <main class="game-card">

      <header class="game-header">
        <h1 class="game-title">
          🧩 質因數分解、公因數公倍數大挑戰
        </h1>

        <p class="game-subtitle">
          四種模式皆使用標準分解式作答。<br>
          質因數由小到大排列，相同質因數合併成次方。
        </p>
      </header>

      <section id="start-screen" class="screen">

        <div class="mode-grid">

          <button
            class="mode-card"
            type="button"
            data-mode="primeFactorization"
          >
            <h2>模式一｜標準分解式</h2>
            <p>
              將一般整數寫成標準分解式。
            </p>
            <div class="mode-note">
              例如：180＝2²×3²×5
            </div>
          </button>

          <button
            class="mode-card"
            type="button"
            data-mode="gcd"
          >
            <h2>模式二｜最大公因數</h2>
            <p>
              比較兩個標準分解式，取共同質因數的較小指數。
            </p>
            <div class="mode-note">
              答案也必須寫成標準分解式
            </div>
          </button>

          <button
            class="mode-card"
            type="button"
            data-mode="lcm"
          >
            <h2>模式三｜最小公倍數</h2>
            <p>
              比較兩個標準分解式，取所有質因數的較大指數。
            </p>
            <div class="mode-note">
              答案也必須寫成標準分解式
            </div>
          </button>

          <button
            class="mode-card"
            type="button"
            data-mode="mixed"
          >
            <h2>模式四｜進階混合</h2>
            <p>
              一般整數、標準分解式與連續乘積交錯出題。
            </p>
            <div class="mode-note">
              先分解，再求最大公因數或最小公倍數
            </div>
          </button>

        </div>

      </section>

      <section id="quiz-screen" class="screen hidden">

        <div class="quiz-topbar">

          <div class="status-box">
            模式
            <span id="mode-badge" class="status-value"></span>
          </div>

          <div class="status-box">
            題目
            <span id="question-number" class="status-value"></span>
          </div>

          <div class="status-box">
            分數
            <span id="score-display" class="status-value">0</span>
          </div>

          <div class="status-box">
            時間
            <span id="time-display" class="status-value">00:00</span>
          </div>

        </div>

        <div class="progress-shell">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-card">

          <div id="question-label" class="question-label"></div>

          <div id="question-content" class="question-content"></div>

        </div>

        <div class="scratchpad-row">
          <div id="scratchpad-mobile-button"></div>
        </div>

        <div class="answer-panel">
          <div id="answerMount"></div>
        </div>

        <div class="button-row">

          <button
            id="submit-button"
            class="game-button"
            type="button"
          >
            送出答案
          </button>

          <button
            id="next-button"
            class="game-button hidden"
            type="button"
          >
            下一題
          </button>

          <button
            id="change-mode-button"
            class="game-button secondary"
            type="button"
          >
            重新選擇模式
          </button>

        </div>

        <div id="feedback" class="feedback"></div>

        <div
          id="explanation"
          class="explanation hidden"
        ></div>

      </section>

      <section id="result-screen" class="screen result-panel hidden">

        <h2>🏆 挑戰完成</h2>

        <div id="final-score" class="result-score">
          0 分
        </div>

        <div id="final-stars" class="result-stars"></div>

        <p id="final-comment"></p>

        <div class="result-grid">

          <div class="result-stat">
            答對<br>
            <span id="final-correct">0</span> 題
          </div>

          <div class="result-stat">
            答錯<br>
            <span id="final-wrong">0</span> 題
          </div>

          <div class="result-stat">
            用時<br>
            <span id="final-time">00:00</span>
          </div>

        </div>

        <div
          id="save-status"
          class="save-status"
          aria-live="polite"
        ></div>

        <div class="button-row">

          <button
            id="again-button"
            class="game-button"
            type="button"
          >
            再玩一次
          </button>

          <button
            id="review-button"
            class="game-button orange"
            type="button"
          >
            錯題回顧
          </button>

          <button
            id="result-mode-button"
            class="game-button secondary"
            type="button"
          >
            選擇模式
          </button>

        </div>

      </section>

      <section id="review-screen" class="screen hidden">

        <h2>📝 錯題回顧</h2>

        <div id="review-list" class="review-list"></div>

        <div class="button-row">

          <button
            id="review-again-button"
            class="game-button"
            type="button"
          >
            再玩一次
          </button>

          <button
            id="review-result-button"
            class="game-button secondary"
            type="button"
          >
            回到測驗結果
          </button>

        </div>

      </section>

    </main>

  </div>

  <script src="../js/common-header.js"></script>
  <script src="../js/scratchpad.js"></script>
  <script src="../js/scratchpad-template.js"></script>
  <script src="../js/sound-manager.js?v=1"></script>
  <script src="../js/expression-input.js?v=1"></script>

  <script type="module">

    import {
      saveGameScore
    } from "../js/scores.js";

    "use strict";

    const GAME_ID =
      "factor";

    const TOTAL_QUESTIONS =
      10;

    const PRIME_OPTIONS = [
      2,
      3,
      5,
      7,
      11,
      13
    ];

    const EXPONENT_OPTIONS = [
      1,
      2,
      3,
      4,
      5,
      6
    ];

    const MODE_NAMES = {
      primeFactorization:
        "標準分解式",

      gcd:
        "最大公因數",

      lcm:
        "最小公倍數",

      mixed:
        "進階混合"
    };

    const $ =
      (id) =>
        document.getElementById(id);

    let mode =
      "primeFactorization";

    let questions =
      [];

    let index =
      0;

    let correct =
      0;

    let wrong =
      0;

    let combo =
      0;

    let maxCombo =
      0;

    let records =
      [];

    let startTime =
      0;

    let finalElapsed =
      0;

    let timer =
      null;

    let locked =
      false;

    let nextReady =
      false;

    let scoreSaved =
      false;

    const answerInput =
      new window.ExpressionInput({
        mountId:
          "answerMount",

        allowNumber:
          false,

        allowExpression:
          true,

        defaultMode:
          "expression",

        baseOptions: [
          2,
          3,
          5,
          7,
          11,
          13
        ],

        exponentOptions: [
          1,
          2,
          3,
          4,
          5,
          6
        ],

        allowCustomBase:
          false,

        maxTerms:
          7,

        requireAscendingBases:
          true,

        disallowDuplicateBases:
          true,

        omitExponentOne:
          true,

        theme: {
          primary:
            "#00897b",

          light:
            "#f0fdfa",

          border:
            "#80cbc4"
        },

        labels: {
          expressionLabel:
            "請輸入標準分解式",

          baseLabel:
            "選擇質因數",

          exponentLabel:
            "選擇指數",

          editLabel:
            "編輯答案"
        }
      });

    /*
    ==================================================
    共用 Header
    ==================================================
    */

    window.addEventListener(
      "DOMContentLoaded",
      () => {
        if (
          window.MathGameCommonHeader
        ) {
          window.MathGameCommonHeader.init({
            mountId:
              "commonHeaderMount",

            basePath:
              "../"
          });
        }

        const buttonMount =
          $("scratchpad-mobile-button");

        const openButton =
          $("scratchpadOpenButton");

        if (
          buttonMount &&
          openButton
        ) {
          buttonMount.appendChild(
            openButton
          );
        }
      }
    );

    /*
    ==================================================
    音效
    ==================================================
    */

    function playGameSound(
      soundName
    ) {
      try {
        const soundManager =
          window.GameSound ||
          window.MathGameSound;

        const soundFunction =
          soundManager?.[
            soundName
          ];

        if (
          typeof soundFunction !==
          "function"
        ) {
          return;
        }

        const result =
          soundFunction.call(
            soundManager
          );

        if (
          result &&
          typeof result.catch ===
          "function"
        ) {
          result.catch(
            (error) => {
              console.warn(
                `音效播放失敗：${soundName}`,
                error
              );
            }
          );
        }
      } catch (error) {
        console.warn(
          `音效播放失敗：${soundName}`,
          error
        );
      }
    }

    /*
    ==================================================
    畫面切換
    ==================================================
    */

    function showOnly(
      screenId
    ) {
      [
        "start-screen",
        "quiz-screen",
        "result-screen",
        "review-screen"
      ].forEach(
        (id) => {
          $(id).classList.toggle(
            "hidden",
            id !== screenId
          );
        }
      );
    }

    /*
    ==================================================
    開始遊戲
    ==================================================
    */

    function startGame(
      selectedMode
    ) {
      clearInterval(
        timer
      );

      mode =
        selectedMode ||
        mode;

      questions =
        createQuestionSet(
          mode
        );

      index =
        0;

      correct =
        0;

      wrong =
        0;

      combo =
        0;

      maxCombo =
        0;

      records =
        [];

      locked =
        false;

      nextReady =
        false;

      scoreSaved =
        false;

      finalElapsed =
        0;

      startTime =
        Date.now();

      $("save-status")
        .textContent =
        "";

      $("mode-badge")
        .textContent =
        MODE_NAMES[mode];

      setTimer();

      showOnly(
        "quiz-screen"
      );

      loadQuestion();
    }

    function setTimer() {
      clearInterval(
        timer
      );

      timer =
        setInterval(
          () => {
            const elapsed =
              Math.floor(
                (
                  Date.now() -
                  startTime
                ) /
                1000
              );

            $("time-display")
              .textContent =
              formatElapsed(
                elapsed
              );
          },
          1000
        );
    }

    /*
    ==================================================
    載入題目
    ==================================================
    */

    function loadQuestion() {
      if (
        typeof window
          .resetGameScratchpad ===
        "function"
      ) {
        window
          .resetGameScratchpad();
      }

      locked =
        false;

      nextReady =
        false;

      $("submit-button")
        .classList.remove(
          "hidden"
        );

      $("next-button")
        .classList.add(
          "hidden"
        );

      $("feedback")
        .textContent =
        "";

      $("feedback")
        .className =
        "feedback";

      $("explanation")
        .innerHTML =
        "";

      $("explanation")
        .classList.add(
          "hidden"
        );

      const question =
        questions[index];

      if (!question) {
        console.error(
          "題目載入失敗：找不到目前題目",
          { index, questions, mode }
        );

        $("question-label")
          .textContent =
          "題目載入失敗";

        $("question-content")
          .textContent =
          "請重新選擇模式後再試一次。";

        return;
      }

      $("question-label")
        .textContent =
        question.label;

      $("question-content")
        .innerHTML =
        question.html;

      $("question-number")
        .textContent =
        `${index + 1} / ${TOTAL_QUESTIONS}`;

      $("score-display")
        .textContent =
        Math.round(
          correct /
          TOTAL_QUESTIONS *
          100
        );

      $("progress-bar")
        .style.width =
        `${
          index /
          TOTAL_QUESTIONS *
          100
        }%`;

      answerInput.reset();

      answerInput.setDisabled(
        false
      );
    }

    /*
    ==================================================
    讀取共用標準分解式輸入器
    ==================================================
    */

    function readPrimeFactorAnswer() {
      const validation =
        answerInput.validate();

      if (
        !validation.valid
      ) {
        return {
          valid:
            false,

          message:
            "請完成正確的標準分解式。"
        };
      }

      const terms =
        validation.value.terms;

      const isStandard =
        window.ExpressionInputUtils
          .isStandardPrimeFactorization(
            terms
          );

      if (
        !isStandard
      ) {
        return {
          valid:
            false,

          message:
            "答案必須是質因數由小到大排列的標準分解式。"
        };
      }

      return {
        valid:
          true,

        map:
          window.ExpressionInputUtils
            .termsToFactorMap(
              terms
            ),

        terms,

        html:
          validation.value.html
      };
    }

    /*
    ==================================================
    判斷答案
    ==================================================
    */

    function checkAnswer() {
      if (locked) {
        return;
      }

      const answer =
        readPrimeFactorAnswer();

      if (
        !answer.valid
      ) {
        answerInput.showMessage(
          answer.message
        );

        return;
      }

      const question =
        questions[index];

      const isCorrect =
        mapsEqual(
          answer.map,
          question.answerMap
        );

      locked =
        true;

      answerInput.setDisabled(
        true
      );

      if (
        isCorrect
      ) {
        correct++;

        combo++;

        maxCombo =
          Math.max(
            maxCombo,
            combo
          );

        $("feedback")
          .textContent =
          "✨ 答對了！這是正確的標準分解式。";

        $("feedback")
          .className =
          "feedback correct";

        playGameSound(
          "playCorrect"
        );
      } else {
        wrong++;

        combo =
          0;

        $("feedback")
          .textContent =
          "❌ 答案不正確，請查看解析。";

        $("feedback")
          .className =
          "feedback wrong";

        playGameSound(
          "playWrong"
        );
      }

      records.push({
        number:
          index + 1,

        question,

        userAnswerMap:
          answer.map,

        correct:
          isCorrect
      });

      $("score-display")
        .textContent =
        Math.round(
          correct /
          TOTAL_QUESTIONS *
          100
        );

      $("explanation")
        .innerHTML =
        buildExplanation(
          question
        );

      $("explanation")
        .classList.remove(
          "hidden"
        );

      $("submit-button")
        .classList.add(
          "hidden"
        );

      $("next-button")
        .classList.remove(
          "hidden"
        );

      $("next-button")
        .textContent =
        index ===
          TOTAL_QUESTIONS -
          1
          ? "查看測驗結果"
          : "下一題";

      nextReady =
        true;

      $("next-button")
        .focus();
    }

    function nextQuestion() {
      if (
        !nextReady
      ) {
        return;
      }

      index++;

      if (
        index <
        TOTAL_QUESTIONS
      ) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    /*
    ==================================================
    題目產生
    ==================================================
    */

    function createQuestionSet(
      selectedMode
    ) {
      const generated =
        [];

      while (
        generated.length <
        TOTAL_QUESTIONS
      ) {
        const question =
          createQuestion(
            selectedMode
          );

        const key =
          `${question.type}|${question.plainText}`;

        if (
          !generated.some(
            (item) =>
              `${item.type}|${item.plainText}` ===
              key
          )
        ) {
          generated.push(
            question
          );
        }
      }

      return generated;
    }

    function createQuestion(
      selectedMode
    ) {
      if (
        selectedMode ===
        "primeFactorization"
      ) {
        return createPrimeFactorizationQuestion();
      }

      if (
        selectedMode ===
        "gcd"
      ) {
        return createStandardPairQuestion(
          "gcd"
        );
      }

      if (
        selectedMode ===
        "lcm"
      ) {
        return createStandardPairQuestion(
          "lcm"
        );
      }

      return createMixedQuestion();
    }

    function createPrimeFactorizationQuestion() {
      const factorMap =
        randomFactorMap({
          maxValue:
            1800,

          minPrimeCount:
            2,

          maxPrimeCount:
            4
        });

      const number =
        valueFromMap(
          factorMap
        );

      return {
        type:
          "primeFactorization",

        label:
          "請將下列整數寫成標準分解式",

        html:
          `<div class="question-line">${number}＝？</div>`,

        plainText:
          `${number}`,

        sourceMaps: [
          factorMap
        ],

        answerMap:
          factorMap
      };
    }

    function createStandardPairQuestion(
      operation
    ) {
      const pair =
        randomStandardPair(
          operation
        );

      const firstExpression =
        mapToExpression(
          pair.firstMap
        );

      const secondExpression =
        mapToExpression(
          pair.secondMap
        );

      const answerMap =
        operation ===
        "gcd"
          ? gcdMap(
              pair.firstMap,
              pair.secondMap
            )
          : lcmMap(
              pair.firstMap,
              pair.secondMap
            );

      return {
        type:
          operation,

        label:
          operation ===
          "gcd"
            ? "求下列兩數的最大公因數，答案請寫成標準分解式"
            : "求下列兩數的最小公倍數，答案請寫成標準分解式",

        html:
          operation === "gcd"
            ? `<div class="pair-expression"><span class="pair-bracket">(</span>${expressionToHtml(firstExpression)}<span class="pair-comma">,</span>${expressionToHtml(secondExpression)}<span class="pair-bracket">)</span></div>`
            : `<div class="pair-expression"><span class="pair-bracket">[</span>${expressionToHtml(firstExpression)}<span class="pair-comma">,</span>${expressionToHtml(secondExpression)}<span class="pair-bracket">]</span></div>`,

        plainText:
          `${firstExpression}|${secondExpression}`,

        sourceMaps: [
          pair.firstMap,
          pair.secondMap
        ],

        answerMap
      };
    }

    function createMixedQuestion() {
      const operation =
        Math.random() <
        0.5
          ? "gcd"
          : "lcm";

      const pair =
        randomStandardPair(
          operation
        );

      const firstFormType =
        randomChoice([
          "integer",
          "standard"
        ]);

      const secondFormType =
        "product";

      const firstDisplay =
        firstFormType ===
        "integer"
          ? String(
              valueFromMap(
                pair.firstMap
              )
            )
          : expressionToHtml(
              mapToExpression(
                pair.firstMap
              )
            );

      const secondProduct =
        mapToCompositeProduct(
          pair.secondMap
        );

      const answerMap =
        operation ===
        "gcd"
          ? gcdMap(
              pair.firstMap,
              pair.secondMap
            )
          : lcmMap(
              pair.firstMap,
              pair.secondMap
            );

      return {
        type:
          "mixed",

        operation,

        label:
          operation ===
          "gcd"
            ? "進階：求下列兩數的最大公因數，答案請寫成標準分解式"
            : "進階：求下列兩數的最小公倍數，答案請寫成標準分解式",

        html:
          operation === "gcd"
            ? `<div class="pair-expression"><span class="pair-bracket">(</span>${firstDisplay}<span class="pair-comma">,</span>${secondProduct.join("×")}<span class="pair-bracket">)</span></div>`
            : `<div class="pair-expression"><span class="pair-bracket">[</span>${firstDisplay}<span class="pair-comma">,</span>${secondProduct.join("×")}<span class="pair-bracket">]</span></div>`,

        plainText:
          `${firstDisplay}|${secondProduct.join("x")}`,

        sourceMaps: [
          pair.firstMap,
          pair.secondMap
        ],

        answerMap
      };
    }

    function randomStandardPair(
      operation
    ) {
      let firstMap;
      let secondMap;

      do {
        firstMap =
          randomFactorMap({
            maxValue:
              5000,

            minPrimeCount:
              2,

            maxPrimeCount:
              4
          });

        secondMap =
          randomFactorMap({
            maxValue:
              5000,

            minPrimeCount:
              2,

            maxPrimeCount:
              4
          });

        if (
          operation ===
          "gcd" &&
          Object.keys(
            gcdMap(
              firstMap,
              secondMap
            )
          ).length ===
          0
        ) {
          const sharedPrime =
            randomChoice([
              2,
              3,
              5,
              7
            ]);

          firstMap[
            sharedPrime
          ] =
            Math.max(
              1,
              firstMap[
                sharedPrime
              ] ||
              0
            );

          secondMap[
            sharedPrime
          ] =
            Math.max(
              1,
              secondMap[
                sharedPrime
              ] ||
              0
            );
        }
      } while (
        mapsEqual(
          firstMap,
          secondMap
        ) ||
        valueFromMap(
          firstMap
        ) >
          8000 ||
        valueFromMap(
          secondMap
        ) >
          8000
      );

      return {
        firstMap,
        secondMap
      };
    }

    function randomFactorMap({
      maxValue,
      minPrimeCount,
      maxPrimeCount
    }) {
      const map =
        {};

      const primeCount =
        randomInteger(
          minPrimeCount,
          maxPrimeCount
        );

      const selectedPrimes =
        shuffle([
          2,
          3,
          5,
          7,
          11,
          13
        ])
          .slice(
            0,
            primeCount
          )
          .sort(
            (
              firstPrime,
              secondPrime
            ) =>
              firstPrime -
              secondPrime
          );

      selectedPrimes.forEach(
        (prime) => {
          const maximumExponent =
            prime === 2
              ? 5
              : prime === 3
                ? 4
                : prime === 5
                  ? 3
                  : 2;

          map[prime] =
            randomInteger(
              1,
              maximumExponent
            );
        }
      );

      while (
        valueFromMap(
          map
        ) >
        maxValue
      ) {
        const reduciblePrimes =
          Object.keys(
            map
          )
            .map(
              Number
            )
            .filter(
              (prime) =>
                map[prime] >
                1
            )
            .sort(
              (
                firstPrime,
                secondPrime
              ) =>
                secondPrime -
                firstPrime
            );

        if (
          reduciblePrimes.length
        ) {
          map[
            reduciblePrimes[0]
          ]--;
        } else {
          const largestPrime =
            Object.keys(
              map
            )
              .map(
                Number
              )
              .sort(
                (
                  firstPrime,
                  secondPrime
                ) =>
                  secondPrime -
                  firstPrime
              )[0];

          delete map[
            largestPrime
          ];
        }
      }

      return map;
    }

    function mapToCompositeProduct(
      factorMap
    ) {
      const primeCopies =
        [];

      Object.entries(
        factorMap
      ).forEach(
        (
          [
            prime,
            exponent
          ]
        ) => {
          for (
            let copyIndex =
              0;
            copyIndex <
              exponent;
            copyIndex++
          ) {
            primeCopies.push(
              Number(
                prime
              )
            );
          }
        }
      );

      shuffle(
        primeCopies
      );

      const parts =
        [];

      while (
        primeCopies.length
      ) {
        const takeCount =
          primeCopies.length >=
          4
            ? randomInteger(
                1,
                2
              )
            : 1;

        let part =
          1;

        for (
          let takeIndex =
            0;
          takeIndex <
            takeCount &&
          primeCopies.length;
          takeIndex++
        ) {
          part *=
            primeCopies.pop();
        }

        parts.push(
          part
        );
      }

      if (
        parts.length <
        2
      ) {
        const value =
          parts[0];

        const divisor =
          smallestPrimeFactor(
            value
          );

        return [
          divisor,
          value /
            divisor
        ];
      }

      return parts;
    }

    /*
    ==================================================
    解析
    ==================================================
    */

    function buildExplanation(
      question
    ) {
      if (
        question.type ===
        "primeFactorization"
      ) {
        const number =
          valueFromMap(
            question.answerMap
          );

        return (
          `<strong>標準分解式：</strong><br>` +
          `${number}＝${expressionToHtml(mapToExpression(question.answerMap))}`
        );
      }

      const firstExpression =
        expressionToHtml(
          mapToExpression(
            question.sourceMaps[0]
          )
        );

      const secondExpression =
        expressionToHtml(
          mapToExpression(
            question.sourceMaps[1]
          )
        );

      const answerExpression =
        expressionToHtml(
          mapToExpression(
            question.answerMap
          )
        );

      const operation =
        question.operation ||
        question.type;

      const rule =
        operation ===
        "gcd"
          ? "共同質因數取較小指數"
          : "所有質因數取較大指數";

      return (
        `<strong>先化成標準分解式：</strong><br>` +
        `第一個數：${firstExpression}<br>` +
        `第二個數：${secondExpression}<br><br>` +
        `<strong>${rule}</strong><br>` +
        `答案：${answerExpression}`
      );
    }

    /*
    ==================================================
    結果與儲存
    ==================================================
    */

    function rating(

    ) {

      ) {

            "太棒了！你已熟練標準分解式與指數比較。"
        };
      }

      if (
        score >=
        80
      ) {
        return {
          stars:
            "★★★★☆",

          comment:

        };
      }

      ) {

          stars:
            "★★★☆☆",

          comment:
            "已掌握基本概念，建議再練習標準分解式。"
        };
      }

      return {
        stars:
          "★★☆☆☆",

        comment:
          "先從模式一練習，再挑戰最大公因數與最小公倍數。"

      }

      status.style.color =
        "#1d4ed8";

      try {
        const result =
          await saveGameScore({
            game:
              GAME_ID,

            score,

          });

        ) {

          "⚠️ 成績暫時無法儲存。";

          error

        status.textContent =

    function showReview() {
      const wrongRecords =
        records.filter(
          (record) =>
            !record.correct
        );

      const reviewList =
        $("review-list");

      if (
        wrongRecords.length ===
        0
      ) {
        reviewList.innerHTML =
          `<div class="review-card">全部答對，沒有需要回顧的錯題！</div>`;
      } else {
        reviewList.innerHTML =
          wrongRecords
            .map(
              (record) => {
                return (
                  `<article class="review-card">` +
                    `<div class="review-title">第 ${record.number} 題 ❌</div>` +
                    `<div class="review-question">${record.question.label}<br>${record.question.html}</div>` +
                    `<div class="review-answer">` +
                      `你的答案：<strong>${expressionToHtml(mapToExpression(record.userAnswerMap))}</strong><br>` +
                      `正確答案：<strong>${expressionToHtml(mapToExpression(record.question.answerMap))}</strong>` +
                    `</div>` +
                    `<div class="explanation">${buildExplanation(record.question)}</div>` +
                  `</article>`
                );
              }
            )
            .join("");
      }

      showOnly(
        "review-screen"
      );
    }

    /*
    ==================================================
    數學工具
    ==================================================
    */

    function gcdMap(
      firstMap,
      secondMap
    ) {
      const result =
        {};

      Object.keys(
        firstMap
      ).forEach(
        (prime) => {
          if (
            secondMap[
              prime
            ]
          ) {
            result[
              prime
            ] =
              Math.min(
                firstMap[
                  prime
                ],
                secondMap[
                  prime
                ]
              );
          }
        }
      );

      return result;
    }

    function lcmMap(
      firstMap,
      secondMap
    ) {
      const result =
        {};

      new Set([
        ...Object.keys(
          firstMap
        ),
        ...Object.keys(
          secondMap
        )
      ]).forEach(
        (prime) => {
          result[
            prime
          ] =
            Math.max(
              firstMap[
                prime
              ] ||
              0,
              secondMap[
                prime
              ] ||
              0
            );
        }
      );

      return result;
    }

    function mapToExpression(
      factorMap
    ) {
      const primes =
        Object.keys(
          factorMap
        )
          .map(
            Number
          )
          .sort(
            (
              firstPrime,
              secondPrime
            ) =>
              firstPrime -
              secondPrime
          );

      if (
        primes.length ===
        0
      ) {
        return "1";
      }

      return primes
        .map(
          (prime) => {
            const exponent =
              factorMap[
                prime
              ];

            return exponent ===
              1
              ? `${prime}`
              : `${prime}^${exponent}`;
          }
        )
        .join("*");
    }

    function expressionToHtml(
      expression
    ) {
      return String(
        expression
      )
        .replace(
          /\*/g,
          "×"
        )
        .replace(
          /\^(\d+)/g,
          "<sup>$1</sup>"
        );
    }

    function valueFromMap(
      factorMap
    ) {
      return Object.entries(
        factorMap
      ).reduce(
        (
          product,
          [
            prime,
            exponent
          ]
        ) => {
          return (
            product *
            Math.pow(
              Number(
                prime
              ),
              Number(
                exponent
              )
            )
          );
        },
        1
      );
    }

    function mapsEqual(
      firstMap,
      secondMap
    ) {
      const keys =
        new Set([
          ...Object.keys(
            firstMap
          ),
          ...Object.keys(
            secondMap
          )
        ]);

      return [
        ...keys
      ].every(
        (key) => {
          return (
            (
              firstMap[
                key
              ] ||
              0
            ) ===
            (
              secondMap[
                key
              ] ||
              0
            )
          );
        }
      );
    }

    function toSuperscript(
      value
    ) {
      const superscriptDigits = {
        0:
          "⁰",

        1:
          "¹",

        2:
          "²",

        3:
          "³",

        4:
          "⁴",

        5:
          "⁵",

        6:
          "⁶",

        7:
          "⁷",

        8:
          "⁸",

        9:
          "⁹"
      };

      return String(
        value
      )
        .split("")
        .map(
          (digit) =>
            superscriptDigits[
              digit
            ] ||
            digit
        )
        .join("");
    }

    function smallestPrimeFactor(
      number
    ) {
      for (
        let divisor =
          2;
        divisor <=
          number;
        divisor++
      ) {
        if (
          number %
            divisor ===
          0
        ) {
          return divisor;
        }
      }

      return number;
    }

    function randomInteger(
      minimum,
      maximum
    ) {
      return (
        Math.floor(
          Math.random() *
          (
            maximum -
            minimum +
            1
          )
        ) +
        minimum
      );
    }

    function randomChoice(
      values
    ) {
      return values[
        randomInteger(
          0,
          values.length -
          1
        )
      ];
    }

    function shuffle(
      values
    ) {
      for (
        let currentIndex =
          values.length -
          1;
        currentIndex >
          0;
        currentIndex--
      ) {
        const randomIndex =
          randomInteger(
            0,
            currentIndex
          );

        [
          values[
            currentIndex
          ],
          values[
            randomIndex
          ]
        ] = [
          values[
            randomIndex
          ],
          values[
            currentIndex
          ]
        ];
      }

      return values;
    }

    function formatElapsed(
      seconds
    ) {
      const minutes =
        Math.floor(
          seconds /
          60
        );

      const remainingSeconds =
        seconds %
        60;

      return (
        `${String(minutes).padStart(2, "0")}:` +
        `${String(remainingSeconds).padStart(2, "0")}`
      );
    }

    /*

    事件
    ==================================================

    document
      .querySelectorAll(
        "[data-mode]"
      )
      .forEach(
        (button) => {
          button.addEventListener(
            "click",
            () => {
              startGame(
                button.dataset.mode
              );
            }
          );
        }
      );

    $("submit-button")
      .addEventListener(
        "click",
        checkAnswer
      );

    $("next-button")
      .addEventListener(
        "click",
        nextQuestion
      );

    $("change-mode-button")
      .addEventListener(
        "click",
        () => {
          clearInterval(
            timer
          );

          showOnly(
            "start-screen"
          );
        }
      );

    $("again-button")
      .addEventListener(
        "click",
        () => {
          startGame(
            mode
          );
        }
      );

    $("review-button")
      .addEventListener(
        "click",
        showReview
      );

    $("result-mode-button")
      .addEventListener(
        "click",
        () => {
          showOnly(
            "start-screen"
          );
        }
      );

    $("review-again-button")
      .addEventListener(
        "click",
        () => {
          startGame(
            mode
          );
        }
      );

    $("review-result-button")
      .addEventListener(
        "click",
        () => {
          showOnly(
            "result-screen"
          );
        }
      );

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key !==
            "Enter" ||
          $("quiz-screen")
            .classList.contains(
              "hidden"
            )
        ) {
          return;
        }

        event.preventDefault();

        if (
          nextReady
        ) {
          nextQuestion();
        } else if (
          !locked
        ) {
          checkAnswer();
        }
      }
    );

  </script>
