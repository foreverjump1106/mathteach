<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    平方根大挑戰｜數學遊戲樂園
  </title>


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #0288d1;
      --primary-dark: #0277bd;
      --primary-light: #e1f5fe;
      --primary-border: #81d4fa;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;

      --restart: #00897b;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e8f7ff,
          #fffbea
        );
    }


    button,
    input,
    select {

      font-family: inherit;
    }


    .hidden {

      display: none !important;
    }


    .page-shell {

      width:
        min(
          100%,
          980px
        );

      margin:
        0 auto;
    }


    #commonHeaderMount {

      margin-bottom: 14px;
    }


    .game-card {

      overflow: hidden;

      border:
        1px solid
        #d5eef9;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          30px,
          5vw,
          42px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .concept-chip {

      padding:
        7px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }


    .screen {

      padding: 22px;
    }


    /*
    ==================================================
    數學式
    ==================================================
    */

    .math-expression {

      display:
        inline-flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      gap: .08em;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      white-space: nowrap;
    }


    .math-expression sup,
    .detail-math sup {

      position: relative;

      top: -.48em;

      margin-left: 1px;

      font-size: .60em;

      line-height: 1;

      vertical-align: baseline;
    }


    /*
    ==================================================
    完整根號
    題目、詳解、答案統一
    ==================================================
    */

    .display-radical {

      position: relative;

      display:
        inline-flex;

      align-items: center;

      min-height: 1.58em;

      padding:
        .14em .10em .01em .76em;

      margin:
        0 .04em;

      vertical-align: middle;
    }


    .display-radical-svg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      overflow: visible;

      pointer-events: none;
    }


    .display-radical-path {

      fill: none;

      stroke:
        currentColor;

      stroke-width: 2;

      stroke-linejoin: round;

      stroke-linecap: round;

      vector-effect:
        non-scaling-stroke;
    }


    .display-radicand {

      position: relative;

      z-index: 2;

      display:
        inline-flex;

      align-items: center;

      white-space: nowrap;

      padding:
        0 .10em .01em .02em;
    }


    /*
    ==================================================
    分數
    ==================================================
    */

    .display-fraction {

      display:
        inline-flex;

      flex-direction: column;

      align-items: stretch;

      justify-content: center;

      min-width: 1.8em;

      margin:
        0 .12em;

      vertical-align: middle;
    }


    .display-fraction-top,
    .display-fraction-bottom {

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        .08em .20em;
    }


    .display-fraction-top {

      border-bottom:
        2.5px solid
        currentColor;
    }


    /*
    ==================================================
    模式首頁
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 16px;
    }


    .mode-card {

      min-height: 215px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align: left;

      cursor: pointer;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .11
        );
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom: 10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size: 12px;

      font-weight: 900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size: 21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.65;
    }


    /*
    ==================================================
    狀態
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;

      margin-bottom: 12px;
    }


    .status-box {

      min-height: 68px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    計算紙
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    進度條
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #29b6f6
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    題目
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }


    .question-label {

      margin-bottom: 12px;

      color:
        var(--muted);

      font-weight: 900;
    }


    .question-content {

      min-height: 145px;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #0f172a;

      font-size:
        clamp(
          30px,
          5vw,
          45px
        );

      line-height: 1.8;

      overflow-x: auto;
    }


    /*
    ==================================================
    參考數值
    ==================================================
    */

    .reference-box {

      margin-top: 15px;

      padding: 13px;

      border:
        1px dashed
        var(--primary-border);

      border-radius: 13px;

      background:
        #f0f9ff;

      color:
        #334155;

      text-align: center;

      font-size: 16px;

      font-weight: 800;

      line-height: 1.8;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        var(--muted);

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.6;
    }


    /*
    ==================================================
    Number
    ==================================================
    */

    .number-answer {

      display: flex;

      justify-content: center;
    }


    .number-answer input {

      width:
        min(
          260px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    Decimal
    ==================================================
    */

    .decimal-answer {

      display: flex;

      justify-content: center;
    }


    .decimal-answer input {

      width:
        min(
          260px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    /*
    ==================================================
    Fraction
    ==================================================
    */

    .fraction-answer {

      display: flex;

      justify-content: center;
    }


    .fraction-input {

      display: flex;

      flex-direction: column;

      width: 120px;
    }


    .fraction-input input {

      width: 100%;

      padding: 10px;

      border:
        2px solid
        #cbd5e1;

      background: white;

      font-size: 21px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    .fraction-input
    input:first-child {

      border-radius:
        10px 10px 0 0;

      border-bottom:
        2.5px solid
        #334155;
    }


    .fraction-input
    input:last-child {

      border-radius:
        0 0 10px 10px;

      border-top: 0;
    }


    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 10px;
    }


    .choice-button {

      min-height: 60px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background: white;

      color:
        #263238;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;
    }


    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }


    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding: 13px;

      max-width: 720px;

      min-height: 58px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-wrap: wrap;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align: center;

      font-size: 18px;

      font-weight: 900;
    }


    .answer-preview-value {

      display:
        inline-flex;

      align-items: center;

      margin-left: 8px;

      color:
        var(--primary);

      font-size: 25px;
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        var(--restart);

      box-shadow:
        0 5px 0
        #00695c;
    }


    .game-button:disabled {

      opacity: .55;

      cursor: not-allowed;
    }


    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    /*
    ==================================================
    詳解
    ==================================================
    */

    .explanation {

      margin-top: 12px;

      padding: 18px;

      border-radius: 14px;

      background:
        #eaf7fd;

      color:
        #334155;

      line-height: 1.95;
    }


    .explanation-step {

      margin:
        10px 0;
    }


    .detail-math {

      display:
        inline-flex;

      align-items: center;

      flex-wrap: nowrap;

      white-space: nowrap;

      font-family:
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 1.08em;
    }


    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }


    .result-stars {

      font-size: 31px;
    }


    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap: 12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding: 16px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }


    .save-status {

      min-height: 28px;

      margin-top: 14px;

      font-weight: 900;
    }


    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }


    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }


    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }


    .review-question {

      margin:
        12px 0;

      font-size: 23px;

      text-align: center;
    }


    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:760px
    ) {

      body {

        padding: 8px;
      }


      .screen {

        padding:
          18px 12px;
      }


      .mode-grid {

        grid-template-columns:
          1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .timer-box {

        grid-column:
          1 / -1;
      }


      .choice-grid {

        grid-template-columns:
          1fr;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

    }

  </style>

</head>


<body>


<div class="page-shell">


  <div id="commonHeaderMount"></div>


  <main class="game-card">


    <!-- Header -->

    <header class="game-header">


      <h1 class="game-title">
        🌱 平方根大挑戰
      </h1>


      <p class="game-subtitle">
        熟練平方數，再進入根式化簡、十分逼近與平方根的意義。
      </p>


      <div class="concept-strip">

        <span class="concept-chip">
          平方數
        </span>

        <span class="concept-chip">
          √a²
        </span>

        <span class="concept-chip">
          質因數分解
        </span>

        <span class="concept-chip">
          十分逼近
        </span>

        <span class="concept-chip">
          平方根的意義
        </span>

      </div>


    </header>


    <!-- Start -->

    <section
      id="start-screen"
      class="screen"
    >


      <div class="mode-grid">


        <button
          class="mode-card"
          type="button"
          data-mode="squarePractice"
        >

          <span class="mode-tag">
            12 題
          </span>

          <h2>
            模式一｜平方數熟練場
          </h2>

          <p>
            從 11² 到 32² 隨機抽出 12 題，熟練常用平方數。
          </p>

          <div class="mode-example">
            例如：17²＝？、26²＝？
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="simplify"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式二｜根式化簡訓練
          </h2>

          <p>
            練習 √(a²) 與利用質因數標準分解式化簡根式。
          </p>

          <div class="mode-example">
            √(a²)＝|a|；質因數由小到大排列。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="approximation"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式三｜根號值與十分逼近
          </h2>

          <p>
            判斷根號介於哪兩個整數之間，並利用十分逼近法估算。
          </p>

          <div class="mode-example">
            題目會提供鄰近小數平方值作為參考。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="meaning"
        >

          <span class="mode-tag">
            10 題
          </span>

          <h2>
            模式四｜平方根觀念應用
          </h2>

          <p>
            練習平方根、正平方根、負平方根的意義與課本型應用。
          </p>

          <div class="mode-example">
            例如：若 8 是 4x＋56 的正平方根，求 x。
          </div>

        </button>


      </div>


    </section>


    <!-- Quiz -->

    <section
      id="quiz-screen"
      class="screen hidden"
    >


      <div class="quiz-topbar">


        <div class="status-box">

          模式

          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          進度

          <span
            id="question-number"
            class="status-value"
          >
            1 / 10
          </span>

        </div>


        <div class="status-box">

          答對

          <span
            id="correct-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box">

          最高連擊

          <span
            id="combo-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box timer-box">

          測驗時間

          <span
            id="timer-display"
            class="status-value"
          >
            00:00
          </span>

        </div>


      </div>


      <div class="scratchpad-row">

        <div
          id="scratchpad-mobile-button"
        ></div>

      </div>


      <div class="progress-shell">

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>


      <div class="question-card">


        <div
          id="question-label"
          class="question-label"
        ></div>


        <div
          id="question-content"
          class="question-content"
        ></div>


        <div
          id="reference-box"
          class="reference-box hidden"
        ></div>


      </div>


      <div
        id="answer-panel"
        class="answer-panel"
      ></div>


      <div class="button-row">


        <button
          id="submit-button"
          class="game-button"
          type="button"
        >
          提交答案（Enter）
        </button>


        <button
          id="next-button"
          class="game-button hidden"

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function gcd(
  a,
  b
) {

  while (
    b !==
    0
  ) {

    const t =
      a %
      b;


    a =
      b;


    b =
      t;
  }


  return Math.abs(
    a
  );
}

}


function radicalDisplay(

/*
==================================================
Prime factor
==================================================
*/

function primeFactorization(
  number
) {

  const factors =
    [];


  let n =
    number;


  let p =
    2;


  while (
    p *
    p <=
    n
  ) {

    let count =
      0;


    while (
      n %
      p ===
      0
    ) {

      n /=
        p;

      count++;
    }


    if (
      count >
      0
    ) {

      factors.push(
        [
          p,
          count
        ]
      );
    }


    p++;
  }


  if (
    n >
    1
  ) {

    factors.push(
      [
        n,
        1
      ]
    );
  }


  return factors;
}


function factorHTML(
  factors
) {

  return factors
    .map(
      (
        [
          base,
          exponent
        ]
      ) => {

        if (
          exponent ===
          1
        ) {

          return String(
            base
          );
        }


        return powerHTML(
          base,
          exponent
        );
      }
    )
    .join(
      " × "
    );
}


/*
==================================================
化簡根式
==================================================
*/

function simplifyRadical(
  n
) {

  let outside =
    1;


  let inside =
    n;


  for (
    let square =
      Math.floor(
        Math.sqrt(
          n
        )
      );

    square >=
    2;

    square--
  ) {

    const squareValue =
      square *
      square;


    if (
      n %
      squareValue ===
      0
    ) {

      outside =
        square;

      inside =
        n /
        squareValue;


      break;
    }
  }


  if (
    inside ===
    1
  ) {

    return {

      type:
        "number",

      value:
        outside
    };
  }


  return {

    type:
      "radical",

    coefficient:
      outside,

    radicand:
      inside
  };
}

/*
--------------------------------------------------
B.
質因數標準分解式化簡

保證至少有一個指數 ≥2
--------------------------------------------------
*/

function makePrimeSimplifyQuestion() {

  const primes =
    shuffle(
      [
        2,
        3,
        5,
        7
      ]
    )
      .slice(
        0,
        rand(
          2,
          3
        )
      )
      .sort(
        (
          a,
          b
        ) =>
          a -
          b
      );


  const exponents =
    [];


  let hasAtLeastTwo =
    false;


  primes.forEach(
    (
      prime,
      i
    ) => {

      let exponent =
        rand(
          1,
          5
        );


      if (
        i ===
        primes.length -
        1 &&
        !hasAtLeastTwo
      ) {

        exponent =
          rand(
            2,
            5
          );
      }


      if (
        exponent >=
        2
      ) {

        hasAtLeastTwo =
          true;
      }


      exponents.push(
        exponent
      );
    }
  );


  let number =
    1;


  primes.forEach(
    (
      prime,
      i
    ) => {

      number *=
        prime **
        exponents[
          i
        ];
    }
  );


  const factors =
    primes.map(
      (
        prime,
        i
      ) => [
        prime,
        exponents[
          i
        ]
      ]
    );


  let outside =
    1;


  let inside =
    1;


  const outsideParts =
    [];


  const insideParts =
    [];


  factors.forEach(
    (
      [
        prime,
        exponent
      ]
    ) => {

      const outExponent =
        Math.floor(
          exponent /
          2
        );


      const inExponent =
        exponent %
        2;


      if (
        outExponent >
        0
      ) {

        outside *=
          prime **
          outExponent;


        outsideParts.push(
          outExponent ===
          1

            ? String(
                prime
              )

            : powerHTML(
                prime,
                outExponent
              )
        );
      }


      if (
        inExponent ===
        1
      ) {

        inside *=
          prime;


        insideParts.push(
          String(
            prime
          )
        );
      }
    }
  );


  const standard =
    factorHTML(
      factors
    );


  const questionHTML = `

    <span class="math-expression">

      ${sqrtDisplay(
        standard
      )}

    </span>
  `;


  const explanation =
    [

      `先觀察根號內的標準分解式：
      ${detailMath(
        standard
      )}。`,

      `質因數已經依照由小到大排列；指數為 1 時不另外寫出 1。`,

      `平方根化簡時，每兩個相同的質因數可以提出根號外一個。`,

      `根號外得到：
      ${
        outsideParts.length

          ? detailMath(
              outsideParts.join(
                " × "
              )
            )

          : "1"
      }。`,

      inside ===
      1

        ? `根號內的質因數全部成對提出，所以根號內不再留下質因數。`

        : `根號內剩下：
           ${detailMath(
             insideParts.join(
               " × "
             )
           )}
           ＝${inside}。`
    ];


  if (
    inside ===
    1
  ) {

    explanation.push(
      `因此答案＝${outside}。`
    );


    return numberQuestion(

      questionHTML,

      outside,

      explanation,

      "請利用質因數標準分解式化成最簡形式"
    );
  }


  explanation.push(

    `所以答案＝
    ${detailRadical(
      outside,
      inside
    )}。`
  );


  return radicalQuestion(

    questionHTML,

    outside,

    inside,

    explanation,

    "請利用質因數標準分解式化成最簡根式"
  );
}

      }
      ＜
      ${n}
      ＜
      ${

      ＜
      ${detailSqrt(

      )}
      ＜
      ${upper}。`
    ],

    "請選出正確範圍"
  );
}


/*
--------------------------------------------------

十分逼近
--------------------------------------------------
*/

function makeApproximationQuestion() {

  let n;


  do {

    n =
      rand(
        20,
        220
      );

  } while (
    Number.isInteger(
      Math.sqrt(
        n
      )
    )
  );


  const actual =
    Math.sqrt(
      n
    );


  const answer =
    Number(
      actual.toFixed(
        1
      )
    );


  const tenthBelow =
    Math.floor(
      actual *
      10
    ) /
    10;


  const tenthAbove =
    tenthBelow +
    .1;


  /*
  依使用者之前需求：
  類似
  13.15² = ...
  13.25² = ...

  給學生較接近的平方值
  */

  const ref1 =
    Number(
      (
        tenthBelow +
        .05
      ).toFixed(
        2
      )
    );


  const ref2 =
    Number(
      (
        tenthAbove +
        .05
      ).toFixed(
        2
      )
    );


  const square1 =
    (
      ref1 *
      ref1
    )
      .toFixed(
        4
      );


  const square2 =
    (
      ref2 *
      ref2
    )
      .toFixed(
        4
      );


  const reference = `

    參考數值：

    ${powerHTML(
      ref1,
      2
    )}
    ＝
    ${square1}

    &nbsp;&nbsp;&nbsp;

    ${powerHTML(
      ref2,
      2
    )}
    ＝
    ${square2}
  `;


  return decimalQuestion(

    `

      <span class="math-expression">

        ${sqrtDisplay(
          n
        )}

        <span>
          ≈ ?
        </span>

      </span>
    `,

    answer,

    [

      `本題要求利用十分逼近法，估算到小數第一位。`,

      `先找出
      ${detailSqrt(
        n
      )}
      介於哪兩個一位小數之間。`,

      `比較附近小數的平方與 ${n} 的大小。`,

      `因為
      ${detailPower(
        ref1,
        2
      )}
      ＝${square1}，
      ${detailPower(
        ref2,
        2
      )}
      ＝${square2}，`,

      `可判斷
      ${detailSqrt(
        n
      )}
      約為
      ${answer}。`
    ],

    "利用十分逼近法，求到小數第一位",

    reference
  );
}

/*
==================================================
模式四
平方根的意義
==================================================
*/


/*
--------------------------------------------------
正平方根應用
--------------------------------------------------
*/

function makePositiveRootApplication() {

  const root =
    rand(
      3,
      12
    );


  const x =
    rand(
      -8,
      12
    );


  const coefficient =
    pick(
      [
        2,
        3,
        4,
        5
      ]
    );


  const constant =
    root *
    root -
    coefficient *
    x;


  const constantText =

    constant >=
    0

      ? `＋${constant}`

      : `－${Math.abs(
          constant
        )}`;


  return numberQuestion(

    `

      <span class="math-expression">

        若 ${root} 是
        ${coefficient}x
        ${constantText}
        的正平方根，則 x＝？

      </span>
    `,

    x,

    [

      `「${root} 是
      ${coefficient}x${constantText}
      的正平方根」表示：`,

      `${detailPower(
        root,
        2
      )}
      ＝
      ${coefficient}x
      ${constantText}。`,

      `${root * root}
      ＝
      ${coefficient}x
      ${constantText}。`,

      `解這個一元一次方程式，可得 x＝${x}。`
    ],

    "請利用平方根的意義求 x"
  );
}


/*
--------------------------------------------------
負平方根
--------------------------------------------------
*/

function makeNegativeRootApplication() {

  const root =
    rand(
      3,
      12
    );


  const answer =
    -root;


  return numberQuestion(

    `

      <span class="math-expression">

        ${root * root}
        的負平方根是多少？

      </span>
    `,

    answer,

    [

      `${root * root}
      ＝
      ${detailPower(
        root,
        2
      )}。`,

      `${root * root}
      的兩個平方根是
      ${root}
      與
      −${root}。`,

      `題目要求「負平方根」，所以答案＝−${root}。`
    ],

    "請寫出負平方根"
  );
}


/*
--------------------------------------------------
平方根兩個
--------------------------------------------------
*/

function makeBothRootsQuestion() {

  const root =
    rand(
      2,
      15
    );


  const n =
    root *
    root;


  const choices =
    shuffle(
      [

        {
          value:
            "correct",

          text:
            `±${root}`
        },

        {
          value:
            "a",

          text:
            `${root}`
        },

        {
          value:
            "b",

          text:
            `−${root}`
        },

        {
          value:
            "c",

          text:
            `±${n}`
        }
      ]
    );


  return choiceQuestion(

    `

      <span class="math-expression">

        ${n} 的平方根為何？

      </span>
    `,

    "correct",

    choices,

    [

      `因為
      ${detailPower(
        root,
        2
      )}
      ＝${n}，`,

      `而
      ${detailPower(
        `−${root}`,
        2
      )}
      也等於 ${n}。`,

      `所以 ${n} 的平方根有兩個：
      ${root}
      和
      −${root}。`,

      `可合寫為 ±${root}。`
    ],

    "請選出正確答案"
  );
}


/*
--------------------------------------------------
√(a²)
此處也避免 a=1
--------------------------------------------------
*/

function makeAbsoluteValueRootQuestion() {

  /*
  ★ 同樣不出 ±1
  避免又出現 √(1²)
  */

  const absolute =
    rand(
      2,
      15
    );


  const a =
    Math.random() <
    .5

      ? absolute

      : -absolute;


  return numberQuestion(

    `

      <span class="math-expression">

        ${sqrtDisplay(
          powerHTML(
            `(${a})`,
            2
          )
        )}

      </span>
    `,

    Math.abs(
      a
    ),

    [

      `平方根的重要性質是：`,

      `${detailSqrt(
        powerHTML(
          "a",
          2
        )
      )}
      ＝
      |a|。`,

      `本題
      a＝${a}。`,

      `所以
      |${a}|
      ＝
      ${Math.abs(
        a
      )}。`,

      `因此答案＝
      ${Math.abs(
        a
      )}。`
    ],

    "請求出根號的值"
  );
}


function makeMode4() {

  return shuffle(
    [

      makePositiveRootApplication(),
      makePositiveRootApplication(),
      makePositiveRootApplication(),

      makeNegativeRootApplication(),

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer(
  update =
    true
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    update &&
    startTime
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }
}


function startTimer() {

  stopTimer(
    false
  );


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  /*
  Number
  */

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整整數答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  Decimal
  */

  if (
    question.type ===
    "decimal"
  ) {

    const raw =
      $("decimal-answer")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?(?:\d+|\d*\.\d+)$/
        .test(
          raw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整數值。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  /*
  Fraction
  */

  if (
    question.type ===
    "fraction"
  ) {

    const numeratorRaw =
      $("fraction-numerator")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("fraction-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^-?\d+$/.test(
        numeratorRaw
      ) ||
      !/^-?\d+$/.test(
        denominatorRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子與分母填寫完整。"
      };
    }


    let numerator =
      Number(
        numeratorRaw
      );


    let denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      denominator <
      0
    ) {

      numerator *=
        -1;

      denominator *=
        -1;
    }


    if (
      gcd(
        Math.abs(
          numerator
        ),
        Math.abs(
          denominator
        )
      ) !==
      1
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 目前答案還不是最簡分數，請自行約分後再提交。"
      };
    }


    return {

      valid:
        true,

      numerator,

      denominator,

      display:
        fractionDisplay(
          numerator,
          denominator
        )
    };
  }


  /*
  Radical
  */

  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把根式答案填寫完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  /*
  Choice
  */

  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          selectedChoice
      );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      answer.value ===
      question.answer
    );
  }


  if (
    question.type ===
    "decimal"
  ) {

    return (
      Math.abs(
        answer.value -
        question.answer
      ) <
      .000001
    );
  }


  if (
    question.type ===
    "fraction"
  ) {

    return (

      answer.numerator ===
        question.numerator &&

      answer.denominator ===
        question.denominator
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "decimal"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "fraction"
  ) {

    return fractionDisplay(
      question.numerator,
      question.denominator
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return radicalDisplay(
      question.coefficient,
      question.radicand
    );
  }


  const choice =
    question
      .choices
      .find(
        item =>
          item.value ===
          question.answer
      );


  return (
    choice?.text ||
    question.answer
  );
}

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML = `

        ❌ 答案不正確。正確答案：

        <strong>

          ${correctAnswerText(
            question
          )}

        </strong>
      `;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
        questions.length -
        1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  scoreSaved =
    false;


  radicalInput =
    null;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =
      "";


  showOnly(
    "quiz-screen"
  );


  displayQuestion();


  startTimer();


  playGameSound(
    "playStart"
  );
}


/*
==================================================
Rating
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經能熟練掌握平方根與根式化簡。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意根式化簡與平方根的意義即可。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再加強平方數與根式化簡。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議從平方數熟練場開始，再逐步挑戰其他模式。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const score =
    Math.round(
      correct /
      questions.length *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firestore
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "平方根成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題回顧
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords
            .map(
              record => `

                <article class="review-card">


                  <div class="review-title">

                    第 ${record.number} 題 ❌

                  </div>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <p>

                    你的答案：

                    <strong>

                      ${record.userAnswer}

                    </strong>

                  </p>


                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>


                </article>

              `
            )
            .join("")

        : `

            <div class="review-card">

              全部答對，沒有需要回顧的錯題！

            </div>
          `;


  showOnly(
    "review-screen"
  );
}


/*
==================================================
事件
==================================================
*/

document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          startGame(
            button.dataset.mode
          );
        }
      );
    }
  );


$("submit-button")
  .addEventListener(
    "click",
    submitAnswer
  );


$("next-button")
  .addEventListener(
    "click",
    nextQuestion
  );


$("restart-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("mode-button")
  .addEventListener(
    "click",
    () => {

      stopTimer();


      showOnly(
        "start-screen"
      );
    }
  );


$("again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("result-mode-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "start-screen"
      )
  );


$("review-button")
  .addEventListener(
    "click",
    showReview
  );


$("review-again-button")
  .addEventListener(
    "click",
    () =>
      startGame(
        mode
      )
  );


$("review-result-button")
  .addEventListener(
    "click",
    () =>
      showOnly(
        "result-screen"
      )
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Enter"
    ) {

      return;
    }


    if (
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      answered
    ) {

      nextQuestion();

    } else {

      submitAnswer();
    }
  }
);


/*
==================================================
初始化
==================================================
*/

window.addEventListener(
  "DOMContentLoaded",
  () => {

    moveScratchpadButtonToTop();


    setTimeout(
      moveScratchpadButtonToTop,
      100
    );
  }
);


showOnly(
  "start-screen"
);


</script>
