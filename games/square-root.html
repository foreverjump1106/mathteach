<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    平方根大挑戰｜數學遊戲樂園
  </title>


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #0288d1;
      --primary-dark: #01579b;
      --primary-light: #e1f5fe;
      --primary-border: #81d4fa;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #e1f5fe,
          #fff8e1
        );
    }


    button,
    input,
    select {

      font-family: inherit;
    }


    .hidden {

      display: none !important;
    }


    .page-shell {

      width:
        min(
          100%,
          960px
        );

      margin:
        0 auto;
    }


    #commonHeaderMount {

      margin-bottom: 14px;
    }


    .game-card {

      overflow: hidden;

      border:
        1px solid
        #d5edf9;

      border-top:
        8px solid
        var(--primary);

      border-radius: 26px;

      background: white;

      box-shadow:
        0 14px 34px
        rgba(15,23,42,.13);
    }


    /*
    ==================================================
    MathML
    ==================================================
    */

    math {

      font-family:
        "STIX Two Math",
        "Cambria Math",
        "Times New Roman",
        serif;

      font-size: 1em;
    }


    .question-content math {

      font-size: 1.18em;
    }


    .explanation math,
    .review-question math {

      font-size: 1.05em;
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .concept-strip {

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .concept-chip {

      padding:
        7px 11px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size: 14px;

      font-weight: 900;
    }


    .screen {

      padding: 22px;
    }


    /*
    ==================================================
    Mode
    ==================================================
    */

    .mode-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 16px;
    }


    .mode-card {

      min-height: 205px;

      padding: 21px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          #ffffff
        );

      text-align: left;

      cursor: pointer;

      transition:
        .15s ease;
    }


    .mode-card:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 24px
        rgba(15,23,42,.11);
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom:
        10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background: white;

      color:
        var(--primary-dark);

      font-size:
        12px;

      font-weight: 900;
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size:
        21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height: 1.7;
    }


    .mode-example {

      margin-top: 10px;

      color:
        #475569;

      font-size: 14px;

      font-weight: 900;

      line-height: 1.6;
    }


    /*
    ==================================================
    Status
    ==================================================
    */

    .quiz-topbar {

      display: grid;

      grid-template-columns:
        repeat(
          5,
          minmax(0,1fr)
        );

      gap: 10px;

      margin-bottom: 12px;
    }


    .status-box {

      min-height: 64px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding: 8px;

      border-radius: 14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .status-value {

      margin-top: 3px;

      font-size: 18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display: flex;

      justify-content: center;

      min-height: 46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display: flex;

      justify-content: center;

      width: 100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height: 10px;

      margin-bottom: 16px;

      overflow: hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #29b6f6
        );

      transition:
        width .2s ease;
    }


    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 20px;

      background: white;

      text-align: center;
    }


    .question-label {

      margin-bottom: 10px;

      color:
        var(--muted);

      font-weight: 900;
    }


    .question-content {

      min-height: 130px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow-x: auto;

      color:
        #0f172a;

      font-size:
        clamp(
          27px,
          5.5vw,
          45px
        );

      font-weight: 900;

      line-height: 1.8;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top: 16px;

      padding: 18px;

      border-radius: 18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom: 10px;

      color:
        var(--primary-dark);

      text-align: center;

      font-weight: 900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align: center;

      font-size: 14px;

      font-weight: 800;

      line-height: 1.65;
    }


    .number-answer {

      display: flex;

      justify-content: center;
    }


    .number-answer input {

      width:
        min(
          250px,
          100%
        );

      padding: 13px;

      border:
        2px solid
        #cbd5e1;

      border-radius: 12px;

      font-size: 24px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    .number-answer input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(2,136,209,.11);
    }


    /*
    ==================================================
    Fraction answer
    ==================================================
    */

    .fraction-answer {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;
    }


    .fraction-input {

      display: flex;

      flex-direction: column;

      width: 100px;
    }


    .fraction-input input {

      width: 100%;

      padding: 9px;

      border:
        2px solid
        #cbd5e1;

      background:
        white;

      font-size: 20px;

      font-weight: 900;

      text-align: center;

      outline: none;
    }


    .fraction-input
    input:first-child {

      border-radius:
        10px 10px 0 0;

      border-bottom:
        2px solid
        #334155;
    }


    .fraction-input
    input:last-child {

      border-radius:
        0 0 10px 10px;

      border-top: 0;
    }


    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 10px;
    }


    .choice-button {

      min-height: 62px;

      padding: 11px;

      border:
        2px solid
        var(--primary-border);

      border-radius: 13px;

      background:
        white;

      color:
        #263238;

      font-size: 16px;

      font-weight: 900;

      line-height: 1.6;

      cursor: pointer;
    }


    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 16px;

      flex-wrap: wrap;
    }


    .game-button {

      min-width: 132px;

      padding:
        12px 20px;

      border: none;

      border-radius: 12px;

      background:
        var(--primary);

      color: white;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        #00897b;

      box-shadow:
        0 5px 0
        #00695c;
    }


    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height: 48px;

      margin-top: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 900;

      line-height: 1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      background:
        #eaf8fe;

      color:
        #334155;

      line-height: 1.95;
    }


    .explanation-step {

      margin:
        8px 0;
    }


    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align: center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size: 56px;

      font-weight: 900;
    }


    .result-stars {

      margin-bottom: 10px;

      font-size: 31px;
    }


    .result-grid {

      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );

      gap: 12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding:
        16px 10px;

      border-radius: 16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight: 900;
    }


    .save-status {

      min-height: 28px;

      margin:
        14px 0 0;

      font-weight: 900;
    }


    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display: grid;

      gap: 14px;
    }


    .review-card {

      padding: 18px;

      border:
        1px solid
        #e2e8f0;

      border-radius: 16px;

      background: white;
    }


    .review-title {

      color:
        var(--danger);

      font-weight: 900;
    }


    .review-question {

      margin:
        8px 0;

      font-size: 20px;

      font-weight: 900;

      line-height: 1.8;
    }


    .review-answer {

      color:
        #475569;

      line-height: 1.9;
    }


    @media(
      max-width:760px
    ) {

      body {
        padding: 8px;
      }


      .screen {

        padding:
          18px 12px;
      }


      .mode-grid {

        grid-template-columns:
          1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }


      .timer-box {

        grid-column:
          1 / -1;
      }


      .choice-grid {

        grid-template-columns:
          1fr;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

    }

  </style>

</head>


<body>


<div class="page-shell">


  <div id="commonHeaderMount"></div>


  <main class="game-card">


    <!-- Header -->

    <header class="game-header">

      <h1 class="game-title">
        🌱 平方根大挑戰
      </h1>

      <p class="game-subtitle">
        熟練平方數，再進入根式化簡、十分逼近與平方根的意義。
      </p>


      <div class="concept-strip">

        <span class="concept-chip">
          平方數
        </span>

        <span class="concept-chip">
          √a²
        </span>

        <span class="concept-chip">
          質因數分解
        </span>

        <span class="concept-chip">
          十分逼近
        </span>

        <span class="concept-chip">
          平方根的意義
        </span>

      </div>

    </header>


    <!-- Mode -->

    <section
      id="start-screen"
      class="screen"
    >

      <div class="mode-grid">


        <button
          class="mode-card"
          type="button"
          data-mode="squarePractice"
        >

          <span class="mode-tag">
            12 題
          </span>

          <h2>
            模式一｜平方數熟練場
          </h2>

          <p>
            從 11² 到 32² 隨機抽出 12 題，熟練常用平方數。
          </p>

          <div class="mode-example">
            例如：17²＝？、26²＝？
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="simplify"
        >

          <span class="mode-tag">
            化簡
          </span>

          <h2>
            模式二｜根式化簡訓練
          </h2>

          <p>
            練習 √a²，以及利用質因數標準分解式化簡根式。
          </p>

          <div class="mode-example">
            質因數固定由小到大排列，一次方省略不寫。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="approximation"
        >

          <span class="mode-tag">
            數值
          </span>

          <h2>
            模式三｜根號值與十分逼近
          </h2>

          <p>
            求整數、小數與分數根號的值，並利用十分逼近法估計。
          </p>

          <div class="mode-example">
            √2.25、√(9/16)、√19≈？
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="meaning"
        >

          <span class="mode-tag">
            應用
          </span>

          <h2>
            模式四｜平方根觀念應用
          </h2>

          <p>
            練習平方根、正平方根、負平方根的意義與課本型應用。
          </p>

          <div class="mode-example">
            若 14 是 a 的正平方根，則 a＝？
          </div>

        </button>


      </div>

    </section>


    <!-- Quiz -->

    <section
      id="quiz-screen"
      class="screen hidden"
    >

      <div class="quiz-topbar">


        <div class="status-box">

          模式

          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          進度

          <span
            id="question-number"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          答對

          <span
            id="correct-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box">

          最高連擊

          <span
            id="combo-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box timer-box">

          測驗時間

          <span
            id="timer-display"
            class="status-value"
          >
            00:00
          </span>

        </div>

      </div>


      <div class="scratchpad-row">

        <div
          id="scratchpad-mobile-button"
        ></div>

      </div>


      <div class="progress-shell">

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>


      <div class="question-card">

        <div
          id="question-label"
          class="question-label"
        ></div>


        <div
          id="question-content"
          class="question-content"
        ></div>

      </div>


      <div
        id="answer-panel"
        class="answer-panel"
      ></div>


      <div class="button-row">

        <button
          id="submit-button"
          class="game-button"
          type="button"
        >
          提交答案（Enter）
        </button>


        <button
          id="next-button"
          class="game-button hidden"
          type="button"
        >
          下一題（Enter）
        </button>


        <button
          id="restart-button"
          class="game-button restart"
          type="button"
        >
          🔄 重新測驗
        </button>


        <button
          id="mode-button"
          class="game-button secondary"
          type="button"
        >
          選擇模式
        </button>

      </div>


      <div
        id="feedback"
        class="feedback"
      ></div>


      <div
        id="explanation"
        class="explanation hidden"
      ></div>

    </section>


    <!-- Result -->

    <section
      id="result-screen"
      class="screen hidden result-panel"
    >

      <h2>
        🎉 挑戰完成
      </h2>


      <div
        id="final-score"
        class="result-score"
      >
        0 分
      </div>


      <div
        id="final-stars"
        class="result-stars"
      >
        ★★★☆☆
      </div>


      <p id="final-comment"></p>


      <div class="result-grid">

        <div class="result-stat">
          答對
          <br>
          <span id="final-correct">0</span>
          題
        </div>

        <div class="result-stat">
          答錯
          <br>
          <span id="final-wrong">0</span>
          題
        </div>

        <div class="result-stat">
          最高連擊
          <br>
          <span id="final-combo">0</span>
        </div>

        <div class="result-stat">
          測驗時間
          <br>
          <span id="final-time">00:00</span>
        </div>

      </div>


      <div
        id="save-status"
        class="save-status"
      ></div>


      <div class="button-row">

        <button
          id="again-button"
          class="game-button restart"
          type="button"
        >
          🔄 重新測驗
        </button>


        <button
          id="review-button"
          class="game-button orange"
          type="button"
        >
          錯題回顧
        </button>


        <button
          id="result-mode-button"
          class="game-button secondary"
          type="button"
        >
          選擇模式
        </button>

      </div>

    </section>


    <!-- Review -->

    <section
      id="review-screen"
      class="screen hidden"
    >

      <h2>
        📝 錯題回顧
      </h2>


      <div
        id="review-list"
        class="review-list"
      ></div>


      <div class="button-row">

        <button
          id="review-again-button"
          class="game-button restart"
          type="button"
        >
          🔄 重新測驗
        </button>


        <button
          id="review-result-button"
          class="game-button secondary"
          type="button"
        >
          回到測驗結果
        </button>

      </div>

    </section>


  </main>

</div>


<script src="../js/common-header.js"></script>

<script src="../js/scratchpad.js"></script>

<script src="../js/scratchpad-template.js"></script>

<script src="../js/sound-manager.js?v=1"></script>

<script src="../js/radical-input.js?v=3"></script>


<script type="module">


import {
  saveGameScore
} from "../js/scores.js";


"use strict";


/*
==================================================
設定
==================================================
*/

const GAME_ID =
  "squareRoot";


const MODE_NAMES = {

  squarePractice:
    "平方數熟練場",

  simplify:
    "根式化簡訓練",

  approximation:
    "根號值與十分逼近",

  meaning:
    "平方根觀念應用"
};


const $ =
  id =>
    document.getElementById(
      id
    );


const RU =
  () =>
    window.RadicalInputUtils;


let mode =
  "squarePractice";


let questions =
  [];


let index =
  0;


let correct =
  0;


let wrong =
  0;


let combo =
  0;

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length -
      1;

    i >
      0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value ===
    0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}

function sqrtSquareValueHTML(
  value
) {

  const number =
    Number(
      value
    );


  const base =

    number <
    0

      ? `
          <mrow>

            <mo>(</mo>

            <mo>−</mo>

            <mn>
              ${Math.abs(number)}
            </mn>

            <mo>)</mo>

          </mrow>
        `

      : `
          <mn>
            ${number}
          </mn>
        `;


  return mathWrap(
    `

      <msqrt>

        <msup>

          ${base}

          <mn>2</mn>

        </msup>

      </msqrt>
    `
  );
}

/*
==================================================
質因數標準分解式 MathML

重要規則：

2¹ × 3³ × 5¹

顯示成：

2 × 3³ × 5

而且底數一定：
2 → 3 → 5 → 7
==================================================
*/

function primeFactorMathML(
  factors
) {

  const sorted =
    [...factors]
      .sort(
        (
          a,
          b
        ) =>
          a.prime -
          b.prime
      );


  return sorted
    .map(
      factor => {

        /*
        次方 1 省略
        */

        if (
          factor.exponent ===
          1
        ) {

          return `

            <mn>
              ${factor.prime}
            </mn>
          `;
        }


        return `

          <msup>

            <mn>
              ${factor.prime}
            </mn>

            <mn>
              ${factor.exponent}
            </mn>

          </msup>
        `;
      }
    )
    .join(
      `
        <mo>×</mo>
      `
    );
}


/*
==================================================
√質因數標準分解式
==================================================
*/

function sqrtPrimeFactorHTML(
  factors
) {

  return mathWrap(
    `

      <msqrt>

        <mrow>

          ${primeFactorMathML(
            factors
          )}

        </mrow>

      </msqrt>
    `
  );
}


/*
==================================================
質因數文字版
解析使用
==================================================
*/

function primeFactorPlainText(
  factors
) {

  return [...factors]

    .sort(
      (
        a,
        b
      ) =>
        a.prime -
        b.prime
    )

    .map(
      factor => {

        if (
          factor.exponent ===
          1
        ) {

          return String(
            factor.prime
          );
        }


        return (
          `${factor.prime}^${factor.exponent}`
        );
      }
    )

    .join(
      " × "
    );
}

function formatTime(
  seconds
) {

  const minutes =
    Math.floor(
      seconds /
      60
    );


  const remain =
    seconds %
    60;


  return (
    `${String(minutes).padStart(2,"0")}:` +
    `${String(remain).padStart(2,"0")}`
  );
}


function stopTimer() {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  if (
    startTime >
    0
  ) {

    elapsed =
      Math.floor(
        (
          Date.now() -
          startTime
        ) /
        1000
      );
  }


  $("timer-display")
    .textContent =
      formatTime(
        elapsed
      );
}


function startTimer() {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );
  }


  startTime =
    Date.now();


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  timerId =
    setInterval(
      () => {

        elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) /
            1000
          );


        $("timer-display")
          .textContent =
            formatTime(
              elapsed
            );

      },
      500
    );
}

/*
==================================================
模式二 B
建立質因數標準分解資料

★ 底數由小到大
★ 一次方顯示時省略
==================================================
*/

function createPrimeFactorData(
  forceInteger =
    false
) {

  const primePool = [
    2,
    3,
    5,
    7
  ];


  const count =
    rand(
      2,
      3
    );


  /*
  隨機挑選後立即排序
  */

  const primes =
    shuffle(
      primePool
    )
      .slice(
        0,
        count
      )
      .sort(
        (
          a,
          b
        ) =>
          a -
          b
      );


  const factors =
    [];


  let outside =
    1;


  let inside =
    1;


  primes.forEach(
    (
      prime,
      factorIndex
    ) => {

      let exponent;


      /*
      全部為偶數次方
      → 化簡後為整數
      */

      if (
        forceInteger
      ) {

        exponent =
          pick(
            [
              2,
              4
            ]
          );

      } else {

        /*
        第一個質因數一定使用奇數次方，
        確保至少有東西留在根號內。
        */

        if (
          factorIndex ===
          0
        ) {

          exponent =
            pick(
              [
                1,
                3,
                5
              ]
            );

        } else {

          exponent =
            pick(
              [
                1,
                2,
                3,
                4
              ]
            );
        }
      }


      factors.push(
        {

          prime,

          exponent
        }
      );


      outside *=
        Math.pow(
          prime,
          Math.floor(
            exponent /
            2
          )
        );


      if (
        exponent %
        2 ===
        1
      ) {

        inside *=
          prime;
      }
    }
  );


  /*
  再排序一次保險
  */

  factors.sort(
    (
      a,
      b
    ) =>
      a.prime -
      b.prime
  );


  return {

    factors,

    outside,

    inside
  };
}


/*
==================================================
模式二 B
質因數標準分解式化簡
==================================================
*/

function makePrimeSimplifyQuestion(
  forceInteger =
    false
) {

  const data =
    createPrimeFactorData(
      forceInteger
    );


  /*
  全部可以提出
  */

  if (
    data.inside ===
    1
  ) {

    return numberQuestion(

      sqrtPrimeFactorHTML(
        data.factors
      ),

      data.outside,

      [

        `根號內的質因數標準分解式為：${primeFactorPlainText(
          data.factors
        )}`,

        "相同質因數每兩個可以提出根號外一個。",

        `所有質因數都能成對提出，所以答案＝${data.outside}。`
      ],

      "請利用質因數標準分解式化簡"
    );
  }


  return radicalQuestion(

    sqrtPrimeFactorHTML(
      data.factors
    ),

    data.outside,

    data.inside,

    [

      `根號內的質因數標準分解式為：${primeFactorPlainText(
        data.factors
      )}`,

      "相同質因數每兩個可以提出根號外一個。",

      `根號外係數＝${data.outside}`,

      `根號內剩下＝${data.inside}`,

      `所以答案＝${
        RU().radicalToHTML(
          data.outside,
          data.inside
        )
      }`
    ],

    "請利用質因數標準分解式化成最簡根式"
  );
}

/*
==================================================
模式三 C
分數平方根

MathML 會真正顯示：

     ______
    √ 4/9

整個分數都在根號內。
==================================================
*/

function makeExactFractionRoot() {

  let numerator =
    rand(
      1,
      8
    );


  let denominator =
    rand(
      2,
      9
    );


  while (
    RU().gcd(
      numerator,
      denominator
    ) !==
      1 ||
    numerator >=
      denominator
  ) {

    numerator =
      rand(
        1,
        8
      );


    denominator =
      rand(
        2,
        9
      );
  }


  const squareNumerator =
    numerator *
    numerator;


  const squareDenominator =
    denominator *
    denominator;


  return fractionQuestion(

    sqrtFractionHTML(
      squareNumerator,
      squareDenominator
    ),

    numerator,

    denominator,

    [

      `分子的算術平方根為 ${numerator}。`,

      `分母的算術平方根為 ${denominator}。`,

      `所以答案為 ${numerator}/${denominator}。`
    ],

    "請求出根號的值，答案化成最簡分數"
  );
}


/*
==================================================
模式三 D
十分逼近
==================================================
*/

function makeTenthApproximation() {

  let number;


  do {

    number =
      rand(
        2,
        200
      );

  } while (
    RU().isPerfectSquare(
      number
    )
  );


  const actual =
    Math.sqrt(
      number
    );


  const answer =
    Number(
      actual.toFixed(
        1
      )
    );


  const lowerTenth =
    Math.floor(
      actual *
      10
    ) /
    10;


  const upperTenth =
    Number(
      (
        lowerTenth +
        .1
      )
        .toFixed(
          1
        )
    );


  const lowerSquare =
    Number(
      (
        lowerTenth *
        lowerTenth
      )
        .toFixed(
          2
        )
    );


  const upperSquare =
    Number(
      (
        upperTenth *
        upperTenth
      )
        .toFixed(
          2
        )
    );


  return numberQuestion(

    mathWrap(
      `
        <msqrt>

          <mn>
            ${number}
          </mn>

        </msqrt>

        <mo>≈</mo>

        <mo>?</mo>
      `
    ),

    answer,

    [

      `${lowerTenth}²＝${lowerSquare}`,

      `${upperTenth}²＝${upperSquare}`,

      `${lowerSquare}＜${number}＜${upperSquare}`,

      `所以 √${number} 介於 ${lowerTenth} 與 ${upperTenth} 之間。`,

      `取到小數第一位約為 ${answer}。`
    ],

    "利用十分逼近法，求到小數第一位",

    {
      decimal:
        true
    }
  );
}

function makeLinearRootApplication(
  negative =
    false
) {

  const root =
    rand(
      3,
      12
    );


  const square =
    root *
    root;


  const coefficient =
    pick(
      [
        2,
        3,
        4,
        5
      ]
    );


  const x =
    rand(
      2,
      15
    );


  const constant =
    square -
    coefficient *
    x;


  const expression =

    constant >=
    0

      ? `${coefficient}x＋${constant}`

      : `${coefficient}x－${Math.abs(
          constant
        )}`;


  return numberQuestion(

    `若 ${
      negative
        ? "−"
        : ""
    }${root}
     是 ${expression} 的 ${
       negative
         ? "負平方根"
         : "正平方根"
     }，則 x＝？`,

    x,

    [

      `平方根為 ${
        negative
          ? "−"
          : ""
      }${root}。`,

      `所以 ${expression}＝${square}。`,

      `解方程式可得 x＝${x}。`
    ],

    "請利用平方根的意義求 x"
  );
}

        ]
      ),

      "correct",

      [

        `${root}²＝${square}`,

        `(−${root})²＝${square}`,

        `所以平方根為 ±${root}。`
      ],

      "請選出正確答案"
    );
  }


  if (
    type ===
    "negative"
  ) {

    return choiceQuestion(

      `在實數範圍內，−25 有平方根嗎？`,

      [

        {
          value:
            "yes",

          text:
            "有"
        },

        {
          value:
            "no",

          text:
            "沒有"
        }
      ],

      "no",

      [

        "實數的平方一定大於或等於 0。",

        "因此負數在實數範圍內沒有平方根。"
      ],

      "請判斷敘述"
    );
  }


  return choiceQuestion(

    `0 的平方根是多少？`,

    [

      {
        value:
          "correct",

        text:
          "0"
      },

      {
        value:
          "pm",

        text:
          "±0"
      },

      {
        value:
          "none",

        text:
          "沒有平方根"
      },

      {
        value:
          "one",

        text:
          "1"
      }
    ],

    "correct",

    [

      "0²＝0。",

      "所以 0 的平方根就是 0。"
    ],

    "請選出正確答案"
  );
}


function makeMode4() {

  return shuffle(
    [

      makePositiveRootApplication(),
      makePositiveRootApplication(),

      makeNegativeRootApplication(),

      makeLinearRootApplication(false),
      makeLinearRootApplication(false),

      makeLinearRootApplication(true),
      makeLinearRootApplication(true),

      makeMeaningChoice(),
      makeMeaningChoice(),
      makeMeaningChoice()
    ]
  );
}


/*
==================================================
建立題組
==================================================
*/

function createQuestions() {

  if (
    mode ===
    "squarePractice"
  ) {

    return makeMode1();
  }


  if (
    mode ===
    "simplify"
  ) {

    return makeMode2();
  }


  if (
    mode ===
    "approximation"
  ) {

    return makeMode3();
  }


  return makeMode4();
}

/*
==================================================
讀答案
==================================================
*/

function readAnswer(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    if (
      question.decimal
    ) {

      if (
        !/^-?(?:\d+|\d*\.\d+)$/
          .test(
            raw
          )
      ) {

        return {

          valid:
            false,

          message:
            "請輸入完整的數值答案。"
        };
      }

    } else {

      if (
        !/^-?\d+$/
          .test(
            raw
          )
      ) {

        return {

          valid:
            false,

          message:
            "請輸入完整的整數答案。"
        };
      }
    }


    return {

      valid:
        true,

      value:
        Number(
          raw
        ),

      display:
        raw
    };
  }


  if (
    question.type ===
    "fraction"
  ) {

    const numeratorRaw =
      $("fraction-numerator")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("fraction-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/
        .test(
          numeratorRaw
        ) ||
      !/^\d+$/
        .test(
          denominatorRaw
        )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子與分母填寫完整。"
      };
    }


    const numerator =
      Number(
        numeratorRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator ===
      0
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 分母不能是 0。"
      };
    }


    if (
      RU().gcd(
        numerator,
        denominator
      ) !==
      1
    ) {

      return {

        valid:
          false,

        reason:
          "fraction-not-simplified",

        message:
          `⚠️ ${numerator}/${denominator} 還不是最簡分數，請先約分後再提交。`
      };
    }


    return {

      valid:
        true,

      numerator,

      denominator,

      display:
        fractionHTML(
          numerator,
          denominator
        )
    };
  }


  if (
    question.type ===
    "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        reason:
          result?.reason,

        message:
          result?.message ||
          "請把根式答案輸入完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇一個答案。"
    };
  }


  const choice =
    question.choices.find(
      item =>
        item.value ===
        selectedChoice
    );


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      choice?.text ||
      selectedChoice
  };
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type ===
    "number"
  ) {

    return (
      Math.abs(
        answer.value -
        question.answer
      ) <
      0.0000001
    );
  }


  if (
    question.type ===
    "fraction"
  ) {

    return (

      answer.numerator ===
        question.numerator &&

      answer.denominator ===
        question.denominator
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
正解顯示
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type ===
    "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type ===
    "fraction"
  ) {

    return fractionHTML(
      question.numerator,
      question.denominator
    );
  }


  if (
    question.type ===
    "radical"
  ) {

    return RU()
      .radicalToHTML(
        question.coefficient,
        question.radicand
      );
  }


  return (
    question.choices.find(
      item =>
        item.value ===
        question.answer
    )?.text ||
    question.answer
  );
}


/*
==================================================
解析
==================================================
*/

function explanationHTML(
  question
) {

  return question.explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>
            步驟 ${i + 1}｜
          </strong>

          ${step}

        </div>
      `
    )
    .join("");
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML =
        `❌ 答案不正確。正確答案：<strong>${
          correctAnswerText(
            question
          )
        }</strong>`;


    playGameSound(
      "playWrong"
    );
  }


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  records.push(
    {

      number:
        index +
        1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
        questions.length -
        1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始遊戲
==================================================
*/

function startGame(
  selectedMode
) {

  if (
    timerId !==
    null
  ) {

    clearInterval(
      timerId
    );


    timerId =
      null;
  }


  mode =
    selectedMode;


  questions =
    createQuestions();


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  answered =
    false;


  selectedChoice =
    null;


  radicalInput =
    null;


  elapsed =
    0;


  startTime =
    0;


  scoreSaved =
    false;


  $("save-status")
    .textContent =
      "";


  $("timer-display")
    .textContent =
      "00:00";


  showOnly(
    "quiz-screen"
  );


  window
    .resetGameScratchpad
    ?.();


  playGameSound(
    "playStart"
  );


  displayQuestion();


  startTimer();
}


/*
==================================================
評語
==================================================
*/

function rating(
  score
) {

  if (
    score >=
    90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！你已經熟悉平方數、根式化簡與平方根的應用。"
    };
  }


  if (
    score >=
    80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再注意根式化簡與平方根的意義。"
    };
  }


  if (
    score >=
    60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "基本觀念已掌握，再加強平方數與十分逼近。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議先從平方數熟練場開始，再逐步進入平方根。"
  };
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  stopTimer();


  const total =
    questions.length;


  const score =
    Math.round(
      correct /
      total *
      100
    );


  const result =
    rating(
      score
    );


  $("progress-bar")
    .style
    .width =
      "100%";


  showOnly(
    "result-screen"
  );


  playGameSound(
    "playComplete"
  );


  $("final-score")
    .textContent =
      `${score} 分`;


  $("final-stars")
    .textContent =
      result.stars;


  $("final-comment")
    .textContent =
      result.comment;


  $("final-correct")
    .textContent =
      correct;


  $("final-wrong")
    .textContent =
      wrong;


  $("final-combo")
    .textContent =
      maxCombo;


  $("final-time")
    .textContent =
      formatTime(
        elapsed
      );


  $("review-button")
    .disabled =
      wrong ===
      0;


  $("review-button")
    .textContent =

      wrong ===
      0

        ? "全部答對，無錯題"

        : "錯題回顧";


  await saveCurrentScore(
    score
  );
}


/*
==================================================
Firebase
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        `✅ 本次成績已儲存（${formatTime(
          elapsed
        )}）。`;


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "平方根成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  const list =
    $("review-list");


  if (
    !wrongRecords.length
  ) {

    list.innerHTML = `

      <div class="review-card">

        全部答對，沒有需要回顧的錯題！

      </div>
    `;

  } else {

    list.innerHTML =

      wrongRecords

        .map(
          record => `

            <article class="review-card">

              <div class="review-title">
                第 ${record.number} 題 ❌
              </div>


              <div class="review-question">
                ${record.question.html}
              </div>


              <div class="review-answer">

                你的答案：

                <strong>
                  ${record.userAnswer}
                </strong>

                <br>

                正確答案：

                <strong>
                  ${correctAnswerText(
                    record.question
                  )}
                </strong>

              </div>


              <div class="explanation">

                ${explanationHTML(
                  record.question
                )}

              </div>

            </article>
          `
        )

        .join("");
  }


  showOnly(
    "review-screen"
  );
}

window.addEventListener(

showOnly(

);
