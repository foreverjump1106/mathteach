<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    平方根大挑戰｜數學遊戲樂園
  </title>


  <link
    rel="stylesheet"
    href="../css/scratchpad.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary: #0288d1;
      --primary-dark: #01579b;
      --primary-light: #e1f5fe;
      --primary-border: #81d4fa;

      --text: #1f2937;
      --muted: #64748b;

      --success: #15803d;
      --danger: #b91c1c;
      --warning: #b45309;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 16px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e1f5fe,
          #fff8e1
        );
    }


    button,
    input {

      font-family:
        inherit;
    }


    .hidden {

      display:
        none !important;
    }


    .page-shell {

      width:
        min(
          100%,
          960px
        );

      margin:
        0 auto;
    }


    #commonHeaderMount {

      margin-bottom:
        14px;
    }


    .game-card {

      overflow:
        hidden;

      border:
        1px solid
        #d5edf9;

      border-top:
        8px solid
        var(--primary);

      border-radius:
        26px;

      background:
        white;

      box-shadow:
        0 14px 34px
        rgba(
          15,
          23,
          42,
          .13
        );
    }


    /*
    ==================================================
    MathML
    ==================================================
    */

    math {

      font-family:
        "Cambria Math",
        "STIX Two Math",
        "Times New Roman",
        serif;
    }


    .question-content math {

      font-size:
        1.2em;
    }


    /*
    ==================================================
    Header
    ==================================================
    */

    .game-header {

      padding:
        24px 20px 18px;

      text-align:
        center;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );
    }


    .game-title {

      margin: 0;

      color:
        var(--primary-dark);

      font-size:
        clamp(
          28px,
          5vw,
          40px
        );
    }


    .game-subtitle {

      margin:
        10px 0 0;

      color:
        var(--muted);

      line-height:
        1.7;
    }


    .concept-strip {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        8px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }


    .concept-chip {

      min-height:
        38px;

      display:
        inline-flex;

      justify-content:
        center;

      align-items:
        center;

      padding:
        6px 12px;

      border:
        1px solid
        var(--primary-border);

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        14px;

      font-weight:
        900;
    }


    .concept-chip math {

      font-size:
        1.15em;
    }


    .screen {

      padding:
        22px;
    }


    /*
    ==================================================
    Mode
    ==================================================
    */

    .mode-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap:
        16px;
    }


    .mode-card {

      min-height:
        205px;

      padding:
        21px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        linear-gradient(
          180deg,
          var(--primary-light),
          white
        );

      text-align:
        left;

      cursor:
        pointer;
    }


    .mode-card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 24px
        rgba(
          15,
          23,
          42,
          .10
        );
    }


    .mode-card h2 {

      margin:
        0 0 9px;

      color:
        var(--primary-dark);

      font-size:
        21px;
    }


    .mode-card p {

      margin: 0;

      color:
        var(--muted);

      line-height:
        1.7;
    }


    .mode-tag {

      display:
        inline-block;

      margin-bottom:
        10px;

      padding:
        4px 9px;

      border-radius:
        999px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        12px;

      font-weight:
        900;
    }


    .mode-example {

      margin-top:
        10px;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        900;

      line-height:
        1.6;
    }


    /*
    ==================================================
    Status
    ==================================================
    */

    .quiz-topbar {

      display:
        grid;

      grid-template-columns:
        repeat(
          5,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;

      margin-bottom:
        12px;
    }


    .status-box {

      min-height:
        64px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      padding:
        8px;

      border-radius:
        14px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }


    .status-value {

      margin-top:
        3px;

      font-size:
        18px;
    }


    .timer-box {

      background:
        #fff7ed;

      color:
        #c2410c;
    }


    /*
    ==================================================
    Scratchpad
    ==================================================
    */

    .scratchpad-row {

      display:
        flex;

      justify-content:
        center;

      min-height:
        46px;

      margin:
        4px 0 12px;
    }


    #scratchpad-mobile-button {

      display:
        flex;

      justify-content:
        center;

      width:
        100%;
    }


    #scratchpad-mobile-button
    #scratchpadOpenButton,

    #scratchpad-mobile-button
    .scratchpad-open-button {

      position:
        static !important;

      inset:
        auto !important;

      transform:
        none !important;

      margin:
        0 !important;
    }


    /*
    ==================================================
    Progress
    ==================================================
    */

    .progress-shell {

      height:
        10px;

      margin-bottom:
        16px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        #e2e8f0;
    }


    .progress-bar {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--primary),
          #29b6f6
        );
    }


    /*
    ==================================================
    Question
    ==================================================
    */

    .question-card {

      padding:
        22px 18px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        20px;

      background:
        white;

      text-align:
        center;
    }


    .question-label {

      margin-bottom:
        10px;

      color:
        var(--muted);

      font-weight:
        900;
    }


    .question-content {

      min-height:
        130px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      color:
        #0f172a;

      font-size:
        clamp(
          27px,
          5.5vw,
          45px
        );

      font-weight:
        900;

      overflow-x:
        auto;
    }


    /*
    ==================================================
    ★ 十分逼近參考值
    ==================================================
    */

    .approx-reference {

      margin:
        14px auto 0;

      padding:
        11px 16px;

      max-width:
        620px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        12px;

      background:
        #eff9ff;

      color:
        var(--primary-dark);

      font-size:
        17px;

      font-weight:
        900;

      line-height:
        1.8;
    }


    .approx-reference-title {

      margin-right:
        10px;

      color:
        #475569;
    }


    .reference-values {

      display:
        inline-flex;

      justify-content:
        center;

      gap:
        18px;

      flex-wrap:
        wrap;
    }


    /*
    ==================================================
    Answer
    ==================================================
    */

    .answer-panel {

      margin-top:
        16px;

      padding:
        18px;

      border-radius:
        18px;

      background:
        #f8fafc;
    }


    .answer-title {

      margin-bottom:
        10px;

      color:
        var(--primary-dark);

      text-align:
        center;

      font-weight:
        900;
    }


    .answer-help {

      margin:
        0 0 12px;

      color:
        #64748b;

      text-align:
        center;

      font-size:
        14px;

      font-weight:
        800;

      line-height:
        1.65;
    }


    .number-answer {

      display:
        flex;

      justify-content:
        center;
    }


    .number-answer input {

      width:
        min(
          250px,
          100%
        );

      padding:
        13px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        12px;

      font-size:
        24px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }


    .number-answer input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(
          2,
          136,
          209,
          .10
        );
    }


    /*
    ==================================================
    Preview
    ==================================================
    */

    .answer-preview {

      margin:
        14px auto 0;

      padding:
        13px;

      max-width:
        680px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        13px;

      background:
        var(--primary-light);

      color:
        #334155;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;
    }


    .answer-preview-value {

      display:
        inline-flex;

      align-items:
        center;

      margin-left:
        7px;

      color:
        var(--primary);

      font-size:
        26px;
    }


    /*
    ==================================================
    Fraction
    ==================================================
    */

    .fraction-answer {

      display:
        flex;

      justify-content:
        center;
    }


    .fraction-input {

      display:
        flex;

      flex-direction:
        column;

      width:
        110px;
    }


    .fraction-input input {

      width:
        100%;

      padding:
        10px;

      border:
        2px solid
        #cbd5e1;

      background:
        white;

      font-size:
        21px;

      font-weight:
        900;

      text-align:
        center;

      outline:
        none;
    }


    .fraction-input
    input:first-child {

      border-radius:
        10px 10px 0 0;

      border-bottom:
        2px solid
        #334155;
    }


    .fraction-input
    input:last-child {

      border-radius:
        0 0 10px 10px;

      border-top:
        0;
    }


    /*
    ==================================================
    Choice
    ==================================================
    */

    .choice-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;
    }


    .choice-button {

      min-height:
        62px;

      padding:
        11px;

      border:
        2px solid
        var(--primary-border);

      border-radius:
        13px;

      background:
        white;

      color:
        #263238;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .choice-button.selected {

      border-color:
        var(--primary);

      background:
        var(--primary-light);

      color:
        var(--primary-dark);
    }


    /*
    ==================================================
    Buttons
    ==================================================
    */

    .button-row {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

      margin-top:
        16px;

      flex-wrap:
        wrap;
    }


    .game-button {

      min-width:
        132px;

      padding:
        12px 20px;

      border:
        none;

      border-radius:
        12px;

      background:
        var(--primary);

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 5px 0
        var(--primary-dark);
    }


    .game-button.secondary {

      background:
        #607d8b;

      box-shadow:
        0 5px 0
        #455a64;
    }


    .game-button.orange {

      background:
        #f57c00;

      box-shadow:
        0 5px 0
        #d86600;
    }


    .game-button.restart {

      background:
        #00897b;

      box-shadow:
        0 5px 0
        #00695c;
    }


    /*
    ==================================================
    Feedback
    ==================================================
    */

    .feedback {

      min-height:
        48px;

      margin-top:
        14px;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;

      line-height:
        1.7;
    }


    .feedback.correct {

      color:
        var(--success);
    }


    .feedback.wrong {

      color:
        var(--danger);
    }


    .feedback.warning {

      color:
        var(--warning);
    }


    .explanation {

      margin-top:
        12px;

      padding:
        16px;

      border-radius:
        14px;

      background:
        #eaf8fe;

      color:
        #334155;

      line-height:
        1.95;
    }


    .explanation-step {

      margin:
        7px 0;
    }


    /*
    ==================================================
    Result
    ==================================================
    */

    .result-panel {

      text-align:
        center;
    }


    .result-score {

      margin:
        16px 0;

      color:
        #f57c00;

      font-size:
        56px;

      font-weight:
        900;
    }


    .result-stars {

      font-size:
        31px;
    }


    .result-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          4,
          minmax(
            0,
            1fr
          )
        );

      gap:
        12px;

      margin:
        20px 0;
    }


    .result-stat {

      padding:
        16px;

      border-radius:
        16px;

      background:
        var(--primary-light);

      color:
        var(--primary-dark);

      font-weight:
        900;
    }


    .save-status {

      min-height:
        28px;

      margin-top:
        14px;

      font-weight:
        900;
    }


    /*
    ==================================================
    Review
    ==================================================
    */

    .review-list {

      display:
        grid;

      gap:
        14px;
    }


    .review-card {

      padding:
        18px;

      border:
        1px solid
        #e2e8f0;

      border-radius:
        16px;

      background:
        white;
    }


    .review-question {

      margin:
        10px 0;

      font-size:
        20px;

      font-weight:
        900;
    }


    /*
    ==================================================
    Mobile
    ==================================================
    */

    @media(
      max-width:760px
    ) {

      body {

        padding:
          8px;
      }


      .mode-grid {

        grid-template-columns:
          1fr;
      }


      .quiz-topbar {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .timer-box {

        grid-column:
          1 / -1;
      }


      .choice-grid {

        grid-template-columns:
          1fr;
      }


      .result-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }

    }

  </style>

</head>


<body>


<div class="page-shell">


  <div id="commonHeaderMount"></div>


  <main class="game-card">


    <header class="game-header">


      <h1 class="game-title">
        🌱 平方根大挑戰
      </h1>


      <p class="game-subtitle">
        熟練平方數，再進入根式化簡、十分逼近與平方根的意義。
      </p>


      <div class="concept-strip">


        <span class="concept-chip">
          平方數
        </span>


        <span class="concept-chip">

          <math
            xmlns="http://www.w3.org/1998/Math/MathML"
          >

            <msqrt>

              <msup>

                <mi>a</mi>

                <mn>2</mn>

              </msup>

            </msqrt>

          </math>

        </span>


        <span class="concept-chip">
          質因數分解
        </span>


        <span class="concept-chip">
          十分逼近
        </span>


        <span class="concept-chip">
          平方根的意義
        </span>


      </div>


    </header>


    <!-- 模式 -->

    <section
      id="start-screen"
      class="screen"
    >


      <div class="mode-grid">


        <button
          class="mode-card"
          type="button"
          data-mode="squarePractice"
        >

          <span class="mode-tag">
            12 題
          </span>


          <h2>
            模式一｜平方數熟練場
          </h2>


          <p>
            從 11² 到 32² 隨機抽出 12 題。
          </p>


          <div class="mode-example">
            例如：17²＝？、26²＝？
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="simplify"
        >

          <span class="mode-tag">
            化簡
          </span>


          <h2>
            模式二｜根式化簡訓練
          </h2>


          <p>
            練習根號內平方與質因數標準分解式化簡。
          </p>


          <div class="mode-example">
            質因數底數由小到大，每個指數至少為 2。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="approximation"
        >

          <span class="mode-tag">
            數值
          </span>


          <h2>
            模式三｜根號值與十分逼近
          </h2>


          <p>
            整數、小數、分數及十分逼近法。
          </p>


          <div class="mode-example">
            十分逼近題會提供小數平方參考值。
          </div>

        </button>


        <button
          class="mode-card"
          type="button"
          data-mode="meaning"
        >

          <span class="mode-tag">
            應用
          </span>


          <h2>
            模式四｜平方根觀念應用
          </h2>


          <p>
            平方根、正平方根、負平方根及課本型應用。
          </p>

        </button>


      </div>


    </section>


    <!-- Quiz -->

    <section
      id="quiz-screen"
      class="screen hidden"
    >


      <div class="quiz-topbar">


        <div class="status-box">

          模式

          <span
            id="mode-name"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          進度

          <span
            id="question-number"
            class="status-value"
          >
            —
          </span>

        </div>


        <div class="status-box">

          答對

          <span
            id="correct-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box">

          最高連擊

          <span
            id="combo-count"
            class="status-value"
          >
            0
          </span>

        </div>


        <div class="status-box timer-box">

          測驗時間

          <span
            id="timer-display"
            class="status-value"
          >
            00:00
          </span>

        </div>


      </div>


      <div class="scratchpad-row">

        <div
          id="scratchpad-mobile-button"
        ></div>

      </div>


      <div class="progress-shell">

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>


      <div class="question-card">


        <div
          id="question-label"
          class="question-label"
        ></div>


        <div
          id="question-content"
          class="question-content"
        ></div>


        <!--
        ★ 十分逼近參考數值
        其他題型自動隱藏
        -->

        <div
          id="approx-reference"
          class="approx-reference hidden"
        ></div>


      </div>


      <div
        id="answer-panel"
        class="answer-panel"
      ></div>


      <div class="button-row">


        <button
          id="submit-button"
          class="game-button"
          type="button"
        >
          提交答案（Enter）
        </button>


        <button
          id="next-button"
          class="game-button hidden"
          type="button"
        >
          下一題（Enter）
        </button>


        <button
          id="restart-button"
          class="game-button restart"
          type="button"
        >
          🔄 重新測驗
        </button>


        <button
          id="mode-button"
          class="game-button secondary"
          type="button"
        >
          選擇模式
        </button>


      </div>


      <div
        id="feedback"
        class="feedback"
      ></div>


      <div
        id="explanation"
        class="explanation hidden"
      ></div>


    </section>


    <!-- Result -->

    <section
      id="result-screen"
      class="screen hidden result-panel"
    >


      <h2>
        🎉 挑戰完成
      </h2>


      <div
        id="final-score"
        class="result-score"
      >
        0 分
      </div>


      <div
        id="final-stars"
        class="result-stars"
      >
        ★★★☆☆
      </div>


      <p id="final-comment"></p>


      <div class="result-grid">


        <div class="result-stat">
          答對
          <br>

function rand(
  min,
  max
) {

  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];
}


function shuffle(
  array
) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


function nonZeroRand(
  min,
  max
) {

  let value =
    0;


  while (
    value === 0
  ) {

    value =
      rand(
        min,
        max
      );
  }


  return value;
}


/*

避免：

function cleanDecimal(

    4
) {

  return Number(
    Number(value)
      .toFixed(
        digits
      )
  );
}


/*

*/

function mathWrap(

) {

  return `

    <math
      xmlns="http://www.w3.org/1998/Math/MathML"
    >

      ${content}

    </math>
  `;
}


function fractionHTML(

}


/*
==================================================
質因數
==================================================
*/

function primeFactorMathML(
  factors
) {

  return [...factors]

    .sort(
      (
        a,
        b
      ) =>
        a.prime -
        b.prime
    )

    .map(
      factor => {

        if (
          factor.exponent === 1
        ) {

          return `

            <mn>
              ${factor.prime}
            </mn>

          `;
        }


        return `

          <msup>

            <mn>
              ${factor.prime}
            </mn>

            <mn>
              ${factor.exponent}
            </mn>

          </msup>

        `;
      }
    )

    .join(
      "<mo>×</mo>"
    );
}


function sqrtPrimeFactorHTML(
  factors
) {

  return mathWrap(

    `

      <msqrt>

        <mrow>

          ${primeFactorMathML(
            factors
          )}

        </mrow>

      </msqrt>

    `
  );
}


function primeFactorText(
  factors
) {

  return [...factors]

    .sort(
      (
        a,
        b
      ) =>
        a.prime -
        b.prime
    )

    .map(
      factor => {

        if (
          factor.exponent === 1
        ) {

          return `${factor.prime}`;
        }


        return (
          `${factor.prime}^${factor.exponent}`
        );
      }
    )

    .join(
      " × "
    );
}

/*
==================================================
模式二 B
質因數

規則：
1. 底數由小到大
2. 每個指數至少 2
3. 根式答案至少有一個奇數次方
==================================================
*/

function createPrimeFactorData(
  forceInteger =
    false
) {

  const primePool =
    [
      2,
      3,
      5,
      7
    ];


  const primes =
    shuffle(
      primePool
    )
      .slice(
        0,
        rand(
          2,
          3
        )
      )
      .sort(
        (
          a,
          b
        ) =>
          a - b
      );


  let outside =
    1;


  let inside =
    1;


  const factors =
    primes.map(
      (
        prime,
        factorIndex
      ) => {

        let exponent;


        if (
          forceInteger
        ) {

          exponent =
            pick(
              [
                2,
                4
              ]
            );

        } else if (
          factorIndex === 0
        ) {

          /*
          保證至少一個奇數次方
          */

          exponent =
            pick(
              [
                3,
                5
              ]
            );

        } else {

          exponent =
            pick(
              [
                2,
                3,
                4,
                5
              ]
            );
        }


        outside *=
          Math.pow(
            prime,
            Math.floor(
              exponent /
              2
            )
          );


        if (
          exponent % 2 === 1
        ) {

          inside *=
            prime;
        }


        return {

          prime,

          exponent
        };
      }
    );


  return {

    factors,

    outside,

    inside
  };
}


function makePrimeQuestion(
  forceInteger =
    false
) {

  const data =
    createPrimeFactorData(
      forceInteger
    );


  if (
    data.inside === 1
  ) {

    return numberQuestion(

      sqrtPrimeFactorHTML(
        data.factors
      ),

      data.outside,

      [

        `標準分解式：${primeFactorText(
          data.factors
        )}`,

        "每兩個相同的質因數可以提出根號外一個。",

        `答案＝${data.outside}`
      ],

      "請利用質因數標準分解式化簡"
    );
  }


  return radicalQuestion(

    sqrtPrimeFactorHTML(
      data.factors
    ),

    data.outside,

    data.inside,

    [

      `標準分解式：${primeFactorText(
        data.factors
      )}`,

      "每兩個相同的質因數可以提出根號外一個。",

      `根號外係數＝${data.outside}`,

      `根號內剩下＝${data.inside}`,

      `答案＝${
        RU().radicalToHTML(
          data.outside,
          data.inside
        )
      }`
    ],

    "請利用質因數標準分解式化成最簡根式"
  );
}

function makeExactFractionRoot() {

/*
==================================================
模式三 D
十分逼近

★ 新版參考值

例如：

√174

正確近似值約為 13.2

系統提供：

13.15²＝172.9225
13.25²＝175.5625

讓學生判斷取到小數第一位。
==================================================
*/

function makeApproximation() {

  let number;


  do {

    number =
      rand(
        2,
        200
      );

  } while (
    RU()
      .isPerfectSquare(
        number
      )
  );


  const actual =
    Math.sqrt(
      number
    );


  const answer =
    Number(
      actual.toFixed(
        1
      )
    );


  /*
  --------------------------------------------------
  以答案小數第一位為中心，
  前後各 0.05

  13.2

  → 13.15
  → 13.25
  --------------------------------------------------
  */

  const lowerReference =
    Number(
      (
        answer -
        0.05
      )
        .toFixed(
          2
        )
    );


  const upperReference =
    Number(
      (
        answer +
        0.05
      )
        .toFixed(
          2
        )
    );


  const lowerSquare =
    cleanDecimal(
      lowerReference *
      lowerReference,
      4
    );


  const upperSquare =
    cleanDecimal(
      upperReference *
      upperReference,
      4
    );


  /*
  解析用
  */

  const lowerTenth =
    Math.floor(
      actual *
      10
    ) /
    10;


  const upperTenth =
    Number(
      (
        lowerTenth +
        0.1
      )
        .toFixed(
          1
        )
    );


  return numberQuestion(

    mathWrap(

      `

        <msqrt>

          <mn>
            ${number}
          </mn>

        </msqrt>

        <mo>≈</mo>

        <mo>?</mo>

      `
    ),

    answer,

    [

      `參考：${lowerReference}²＝${lowerSquare}`,

      `參考：${upperReference}²＝${upperSquare}`,

      `因此 √${number} 介於相鄰的小數值之間。`,

      `取到小數第一位，答案約為 ${answer}。`
    ],

    "利用十分逼近法，求到小數第一位",

    true,

    {

      approximationReference: {

        lowerReference,

        lowerSquare,

        upperReference,

        upperSquare
      }
    }
  );
}


function makeMode3() {

  return shuffle(

}

/*
==================================================
模式四 C
求 x

★ 不產生：

4x＋0
4x－0

若 constant = 0

直接：

4x
==================================================
*/

function makeLinearApplication() {

  const root =
    rand(
      3,
      12
    );


  const coefficient =
    pick(
      [
        2,
        3,
        4,
        5
      ]
    );


  const answer =
    rand(
      2,
      12
    );


  const square =
    root *
    root;


  const constant =
    square -
    coefficient *
    answer;


  let expression;


  if (
    constant > 0
  ) {

    expression =
      `${coefficient}x＋${constant}`;

  } else if (
    constant < 0
  ) {

    expression =
      `${coefficient}x－${Math.abs(
        constant
      )}`;

  } else {

    /*
    ★ constant = 0

    不寫 +0 / -0
    */

    expression =
      `${coefficient}x`;
  }


  return numberQuestion(

    `若 ${root} 是 ${expression} 的正平方根，則 x＝？`,

    answer,

    [

      `${expression}＝${root}²`,

      `${expression}＝${square}`,

      `所以 x＝${answer}`
    ],

    "請利用平方根的意義求 x"
  );
}

  ) {

    return makeMode1();
  }


  if (
    mode === "simplify"
  ) {

    return makeMode2();
  }


  if (
    mode === "approximation"
  ) {

    return makeMode3();
  }


  return makeMode4();
}

/*
==================================================
讀取答案
==================================================
*/

function readAnswer(
  question
) {

  if (
    question.type === "number"
  ) {

    const raw =
      $("number-answer")
        ?.value
        .trim() ||
      "";


    const regex =

      question.decimal

        ? /^-?(?:\d+|\d*\.\d+)$/

        : /^-?\d+$/;


    if (
      !regex.test(raw)
    ) {

      return {

        valid:
          false,

        message:
          "請輸入完整答案。"
      };
    }


    return {

      valid:
        true,

      value:
        Number(raw),

      display:
        raw
    };
  }


  if (
    question.type === "fraction"
  ) {

    const numeratorRaw =
      $("fraction-numerator")
        ?.value
        .trim() ||
      "";


    const denominatorRaw =
      $("fraction-denominator")
        ?.value
        .trim() ||
      "";


    if (
      !/^\d+$/.test(
        numeratorRaw
      ) ||
      !/^\d+$/.test(
        denominatorRaw
      )
    ) {

      return {

        valid:
          false,

        message:
          "請把分子與分母填寫完整。"
      };
    }


    const numerator =
      Number(
        numeratorRaw
      );


    const denominator =
      Number(
        denominatorRaw
      );


    if (
      denominator === 0
    ) {

      return {

        valid:
          false,

        message:
          "分母不能是 0。"
      };
    }


    if (
      RU().gcd(
        numerator,
        denominator
      ) !== 1
    ) {

      return {

        valid:
          false,

        message:
          "⚠️ 目前答案還不是最簡分數，請先自行約分。"
      };
    }


    return {

      valid:
        true,

      numerator,

      denominator,

      display:
        fractionHTML(
          numerator,
          denominator
        )
    };
  }


  if (
    question.type === "radical"
  ) {

    const result =
      radicalInput
        ?.validate();


    if (
      !result?.valid
    ) {

      return {

        valid:
          false,

        message:
          result?.message ||
          "請把根式答案輸入完整。"
      };
    }


    return {

      valid:
        true,

      value:
        result.value,

      display:
        result.value.display
    };
  }


  if (
    !selectedChoice
  ) {

    return {

      valid:
        false,

      message:
        "請先選擇答案。"
    };
  }


  return {

    valid:
      true,

    value:
      selectedChoice,

    display:
      question
        .choices
        .find(
          item =>
            item.value ===
            selectedChoice
        )
        ?.text
  };
}


/*
==================================================
判定
==================================================
*/

function checkCorrect(
  question,
  answer
) {

  if (
    question.type === "number"
  ) {

    return (
      Math.abs(
        answer.value -
        question.answer
      ) <
      0.000001
    );
  }


  if (
    question.type === "fraction"
  ) {

    return (

      answer.numerator ===
        question.numerator &&

      answer.denominator ===
        question.denominator
    );
  }


  if (
    question.type === "radical"
  ) {

    return (

      answer.value.coefficient ===
        question.coefficient &&

      answer.value.radicand ===
        question.radicand
    );
  }


  return (
    answer.value ===
    question.answer
  );
}


/*
==================================================
正確答案
==================================================
*/

function correctAnswerText(
  question
) {

  if (
    question.type === "number"
  ) {

    return String(
      question.answer
    );
  }


  if (
    question.type === "fraction"
  ) {

    return fractionHTML(
      question.numerator,
      question.denominator
    );
  }


  if (
    question.type === "radical"
  ) {

    return RU()
      .radicalToHTML(
        question.coefficient,
        question.radicand
      );
  }


  return question
    .choices
    .find(
      item =>
        item.value ===
        question.answer
    )
    ?.text ||
    "";
}


/*
==================================================
解析
==================================================
*/

function explanationHTML(
  question
) {

  return question
    .explanation
    .map(
      (
        step,
        i
      ) => `

        <div class="explanation-step">

          <strong>

            步驟 ${i + 1}｜

          </strong>

          ${step}

        </div>

      `
    )
    .join("");
}


/*
==================================================
提交
==================================================
*/

function submitAnswer() {

  if (
    answered
  ) {

    return;
  }


  const question =
    questions[
      index
    ];


  const answer =
    readAnswer(
      question
    );


  if (
    !answer.valid
  ) {

    $("feedback")
      .className =
        "feedback warning";


    $("feedback")
      .textContent =
        answer.message;


    return;
  }


  answered =
    true;


  radicalInput
    ?.setDisabled(
      true
    );


  const isCorrect =
    checkCorrect(
      question,
      answer
    );


  if (
    isCorrect
  ) {

    correct++;

    combo++;

    maxCombo =
      Math.max(
        maxCombo,
        combo
      );


    $("feedback")
      .className =
        "feedback correct";


    $("feedback")
      .textContent =
        "✨ 回答正確！";


    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    combo =
      0;


    $("feedback")
      .className =
        "feedback wrong";


    $("feedback")
      .innerHTML =
        `❌ 答案不正確。正確答案：<strong>${
          correctAnswerText(
            question
          )
        }</strong>`;


    playGameSound(
      "playWrong"
    );
  }


  records.push(
    {

      number:
        index + 1,

      question,

      userAnswer:
        answer.display,

      correct:
        isCorrect
    }
  );


  $("correct-count")
    .textContent =
      correct;


  $("combo-count")
    .textContent =
      maxCombo;


  $("explanation")
    .innerHTML =
      explanationHTML(
        question
      );


  $("explanation")
    .classList
    .remove(
      "hidden"
    );


  $("submit-button")
    .classList
    .add(
      "hidden"
    );


  $("next-button")
    .classList
    .remove(
      "hidden"
    );


  $("next-button")
    .textContent =

      index ===
      questions.length - 1

        ? "查看測驗結果（Enter）"

        : "下一題（Enter）";


  $("next-button")
    .focus();
}


/*

下一題
==================================================
*/

function nextQuestion() {

    !answered
  ) {

    return;
  }


  index++;


  if (
    index <
    questions.length
  ) {

    displayQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
開始
==================================================
*/

function startGame(
  selectedMode
) {

  mode =
    selectedMode;


  try {

    questions =
      createQuestions();

  } catch (
    error
  ) {

    console.error(
      "建立平方根題目失敗：",
      error
    );


    alert(
      "題目建立失敗，請重新整理頁面後再試一次。"
    );


    return;
  }


  index =
    0;


  correct =
    0;


  wrong =
    0;


  combo =
    0;


  maxCombo =
    0;


  records =
    [];


  scoreSaved =
    false;


  answered =
    false;


  selectedChoice =
    null;


  radicalInput =
    null;


  elapsed =
    0;


  $("timer-display")
    .textContent =
      "00:00";


  $("save-status")
    .textContent =

  showOnly(

  );

  startTimer();


  playGameSound(

/*
==================================================
評分
==================================================
*/

function rating(
  score
) {

  if (
    score >= 90
  ) {

    return {

      stars:
        "★★★★★",

      comment:
        "太棒了！平方根觀念相當熟練。"
    };
  }


  if (
    score >= 80
  ) {

    return {

      stars:
        "★★★★☆",

      comment:
        "表現很好，再熟悉不同題型就更完整。"
    };
  }


  if (
    score >= 60
  ) {

    return {

      stars:
        "★★★☆☆",

      comment:
        "已掌握基本觀念，再多練習根式化簡與十分逼近。"
    };
  }


  return {

    stars:
      "★★☆☆☆",

    comment:
      "建議從平方數熟練場開始重新練習。"
  };
}

結果

    .textContent =

  await saveCurrentScore(

/*
==================================================
Firebase
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {

    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore(
        {

          game:
            GAME_ID,

          mode,

          score,

          correctCount:
            correct,

          wrongCount:
            wrong,

          maxCombo,

          playTime:
            elapsed,

          totalQuestions:
            questions.length
        }
      );


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";


      status.style.color =
        "#15803d";


      return;
    }


    if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";


      status.style.color =
        "#b45309";


      return;
    }


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";

  } catch (
    error
  ) {

    console.error(
      "平方根成績儲存失敗：",
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
錯題
==================================================
*/

function showReview() {

  const wrongRecords =
    records.filter(
      record =>
        !record.correct
    );


  $("review-list")
    .innerHTML =

      wrongRecords.length

        ? wrongRecords

            .map(
              record => `

                <article class="review-card">

                  <strong>
                    第 ${record.number} 題 ❌
                  </strong>


                  <div class="review-question">

                    ${record.question.html}

                  </div>


                  <p>

                    你的答案：

                    <strong>
                      ${record.userAnswer}
                    </strong>

                  </p>


                  <p>

                    正確答案：

                    <strong>

                      ${correctAnswerText(
                        record.question
                      )}

                    </strong>

                  </p>


                  <div class="explanation">

                    ${explanationHTML(
                      record.question
                    )}

                  </div>

                </article>

              `
            )

            .join("")

        : `

            <div class="review-card">

              全部答對！

            </div>

          `;


  showOnly(
    "review-screen"
  );
}
