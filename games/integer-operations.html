<style>

*{

html,

body{

input,

.mode-title{

.example{
  font-family:

  margin-top:7px;
  color:#475569
}

.btn{

.btn-primary{

.btn-green{

.btn-light{

}

.btn-danger-light{

.btn-neutral{

.topbar{

.pill{

.pill-amber{

#scratchpad-mobile-button{

<script type="module">

import {
  saveGameScore
} from "../js/scores.js";

"use strict";


document.addEventListener(
  "DOMContentLoaded",
  () => {

    const mount =
      document.getElementById(
        "scratchpad-mobile-button"
      );

    const button =
      document.getElementById(
        "scratchpadOpenButton"
      );

    if (
      mount &&
      button
    ) {
      mount.appendChild(
        button
      );
    }
  }
);


const $ =
  id =>
    document.getElementById(
      id
    );


const GAME_ID =
  "integer-operations";

const TOTAL =
  10;


/*
==================================================
音效
==================================================
*/

let operationsAudioContext =
  null;


function getOperationsAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (
    !AudioContextClass
  ) {
    return null;
  }

  if (
    !operationsAudioContext
  ) {
    operationsAudioContext =
      new AudioContextClass();
  }

  return operationsAudioContext;
}


async function ensureOperationsAudio() {

  const context =
    getOperationsAudioContext();

  if (
    !context
  ) {
    return null;
  }

  if (
    context.state ===
    "suspended"
  ) {
    try {
      await context.resume();
    } catch (error) {
      console.warn(
        "音效系統無法啟用：",
        error
      );
    }
  }

  return (
    context.state ===
    "running"
      ? context
      : null
  );
}


async function playOperationsTone({
  frequency = 440,
  duration = 0.18,
  type = "sine",
  volume = 0.14,
  delay = 0
} = {}) {

  const context =
    await ensureOperationsAudio();

  if (
    !context
  ) {
    return;
  }

  const startTime =
    context.currentTime +
    Math.max(
      0,
      delay
    );

  const endTime =
    startTime +
    Math.max(
      0.05,
      duration
    );

  const oscillator =
    context.createOscillator();

  const gain =
    context.createGain();

  oscillator.type =
    type;

  oscillator.frequency
    .setValueAtTime(
      frequency,
      startTime
    );

  gain.gain
    .setValueAtTime(
      0.0001,
      startTime
    );

  gain.gain
    .exponentialRampToValueAtTime(
      Math.max(
        0.0001,
        volume
      ),
      startTime + 0.02
    );

  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      endTime
    );

  oscillator.connect(
    gain
  );

  gain.connect(
    context.destination
  );

  oscillator.start(
    startTime
  );

  oscillator.stop(
    endTime
  );

  oscillator.addEventListener(
    "ended",
    () => {

      oscillator.disconnect();

      gain.disconnect();
    },
    {
      once:true
    }
  );
}


function playGameSound(
  soundName
) {

  try {

    if (
      soundName ===
      "playStart"
    ) {

      Promise.all([
        playOperationsTone({
          frequency:392,
          duration:0.16,
          volume:0.12
        }),

        playOperationsTone({
          frequency:523.25,
          duration:0.22,
          volume:0.13,
          delay:0.12
        })
      ]);

      return;
    }


    if (
      soundName ===
      "playCorrect"
    ) {

      Promise.all([
        playOperationsTone({
          frequency:523.25,
          duration:0.17,
          volume:0.14
        }),

        playOperationsTone({
          frequency:659.25,
          duration:0.20,
          volume:0.13,
          delay:0.10
        }),

        playOperationsTone({
          frequency:783.99,
          duration:0.25,
          volume:0.12,

/*
==================================================
數學工具
==================================================
*/

function rand(
  min,
  max
) {
  return (
    Math.floor(
      Math.random() *
      (
        max -
        min +
        1
      )
    ) +
    min
  );
}


function pick(
  arr
) {
  return arr[
    rand(
      0,
      arr.length - 1
    )
  ];
}


function shuffle(
  arr
) {

  for (
    let i =
      arr.length - 1;

    i > 0;

    i--
  ) {

    const j =
      rand(
        0,
        i
      );

    [
      arr[i],
      arr[j]
    ] = [
      arr[j],
      arr[i]
    ];
  }

  return arr;
}


function gcd(
  a,
  b
) {

  a =
    Math.abs(
      a
    );

  b =
    Math.abs(
      b
    );

  while (
    b
  ) {

    const t =
      a % b;

    a =
      b;

    b =
      t;
  }

  return (
    a ||
    1
  );
}


function simplify(
  n,
  d
) {

  if (
    d === 0
  ) {
    throw new Error(
      "分母不可為 0"
    );
  }

  if (
    d < 0
  ) {
    n =
      -n;

    d =
      -d;
  }

  const g =
    gcd(
      n,
      d
    );

  return {
    n:
      n / g,

    d:
      d / g
  };
}


function addR(
  a,
  b
) {
  return simplify(
    a.n * b.d +
    b.n * a.d,

    a.d * b.d
  );
}


function subR(
  a,
  b
) {
  return simplify(
    a.n * b.d -
    b.n * a.d,

    a.d * b.d
  );
}


function mulR(
  a,
  b
) {
  return simplify(
    a.n * b.n,
    a.d * b.d
  );
}


function divR(
  a,
  b
) {
  return simplify(
    a.n * b.d,
    a.d * b.n
  );
}


function intR(
  n
) {
  return {
    n,
    d:1
  };
}


function absR(
  a
) {
  return {
    n:
      Math.abs(
        a.n
      ),

    d:
      a.d
  };
}


function eqR(
  a,
  b
) {
  return (
    a.n === b.n &&
    a.d === b.d
  );
}


function formatNumber(
  n
) {
  return String(
    n
  ).replace(
    "-",
    "−"
  );
}


/*
==================================================
數學符號格式
==================================================

規則：

1. 正整數：
   5

2. 負整數：
   (−5)
   當它是另一個運算元時加括號

3. 減去負數：
   5 − (−3)

4. 乘以負數：
   (−6) × (−1)

5. 正整數乘方：
   6²

6. 負整數乘方：
   (−6)²
==================================================
*/


function signedInteger(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : String(
          n
        )
  );
}


/*
專門用於絕對值內的第二個加減運算元。

例如：

|−4 − (−3)|

而不是：

|−4 − −3|
*/

function signedInnerOperand(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : formatNumber(
          n
        )
  );
}


/*
乘法／除法的整數因數。

負數一定加括號。
*/

function integerFactorHTML(
  n
) {

  return (
    n < 0
      ? `(${formatNumber(
          n
        )})`
      : String(
          n
        )
  );
}


function powerBaseHTML(
  base
) {

  return (
    base < 0
      ? `(${formatNumber(
          base
        )})`
      : String(
          base
        )
  );
}


function power(
  base,
  exp
) {
  return Math.pow(
    base,
    exp
  );
}


/*
==================================================
分數格式
==================================================
*/

function fracHTML(
  value,
  parens = false
) {

  const r =
    simplify(
      value.n,
      value.d
    );


  if (
    r.d === 1
  ) {

    const s =
      formatNumber(
        r.n
      );

    return (
      parens &&
      r.n < 0
        ? `(${s})`
        : s
    );
  }


  const core =
    `${
      r.n < 0
        ? "−"
        : ""
    }` +
    `<span class="math-frac">` +
      `<span class="top">` +
        `${Math.abs(
          r.n
        )}` +
      `</span>` +
      `<span class="bottom">` +
        `${r.d}` +
      `</span>` +
    `</span>`;


  return (
    parens &&
    r.n < 0
      ? `(${core})`
      : core
  );
}


/*
乘法／除法中的分數。

分數形式加括號；
負整數也加括號；
正整數不加括號。
*/

function factorHTML(
  value
) {

  const r =
    simplify(
      value.n,
      value.d
    );


  if (
    r.d === 1
  ) {

    return integerFactorHTML(
      r.n
    );
  }


  const fraction =
    fracHTML(
      r,
      false
    );

  return (
    `(${fraction})`
  );
}


function rationalText(
  value
) {

  const r =
    simplify(
      value.n,
      value.d
    );

  return (
    r.d === 1
      ? formatNumber(
          r.n
        )
      : `${r.n}/${r.d}`
  );
}


function randomProperFraction({
  positiveOnly = false
} = {}) {

  let n;
  let d;

  do {

    d =
      rand(
        2,
        12
      );

    n =
      rand(
        1,
        d - 1
      );

  } while (
    gcd(
      n,
      d
    ) !== 1
  );


  if (
    !positiveOnly &&
    Math.random() < .5
  ) {
    n =
      -n;
  }


  return {
    n,
    d
  };
}


function randomNonZeroInteger(
  min = -12,
  max = 12,
  positiveOnly = false
) {

  let n;

  do {

    n =
      rand(
        min,
        max
      );

  } while (
    n === 0
  );


  if (
    positiveOnly
  ) {
    n =
      Math.abs(
        n
      );
  }


  return n;
}


/*
==================================================
模式一：乘除
==================================================
*/

function makeMulDivQuestion(
  positivePositive = false
) {

  const kind =
    pick([
      "ii",
      "if",
      "fi",
      "ff"
    ]);

  const op =
    Math.random() < .5
      ? "×"
      : "÷";

  let left;
  let right;
  let answer;


  const makeSign =
    () => {

      if (
        positivePositive
      ) {
        return 1;
      }

      return (
        Math.random() < .5
          ? -1
          : 1
      );
    };


  if (
    kind === "ii"
  ) {

    left =
      intR(
        randomNonZeroInteger(
          2,
          12,
          true
        ) *
        makeSign()
      );

    right =
      intR(
        randomNonZeroInteger(
          2,
          12,
          true
        ) *
        makeSign()
      );

  } else if (
    kind === "if"
  ) {

    left =
      intR(
        randomNonZeroInteger(
          2,
          10,
          true
        ) *
        makeSign()
      );

    right =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

  } else if (
    kind === "fi"
  ) {

    left =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

    right =
      intR(
        randomNonZeroInteger(
          2,
          10,
          true
        ) *
        makeSign()
      );

  } else {

    left =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });

    right =
      randomProperFraction({
        positiveOnly:
          positivePositive
      });
  }


  if (
    op === "÷" &&
    right.n === 0
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  answer =
    op === "×"
      ? mulR(
          left,
          right
        )
      : divR(
          left,
          right
        );


  if (
    Math.abs(
      answer.n
    ) > 120 ||
    answer.d > 60
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  const steps =
    [];


  if (
    op === "×"
  ) {

    steps.push([
      "判斷正負號",

      `${
        left.n *
        right.n <
        0
          ? "異號相乘，結果為負"
          : "同號相乘，結果為正"
      }。`
    ]);


    steps.push([
      "分子乘分子、分母乘分母",

      `${factorHTML(
        left
      )} × ${factorHTML(
        right
      )} = ${fracHTML({
        n:
          left.n *
          right.n,

        d:
          left.d *
          right.d
      })}`
    ]);

  } else {

    steps.push([
      "除以一個數等於乘以它的倒數",

      `${factorHTML(
        left
      )} ÷ ${factorHTML(
        right
      )} = ${factorHTML(
        left
      )} × ${factorHTML({
        n:
          right.d,

        d:
          right.n
      })}`
    ]);


    steps.push([
      "進行乘法",

      `${factorHTML(
        left
      )} × ${factorHTML({
        n:
          right.d,

        d:
          right.n
      })} = ${fracHTML(
        answer
      )}`
    ]);
  }


  steps.push([
    "化成最簡分數",

    `${fracHTML(
      answer
    )}`
  ]);


  return {

    html:
      `${factorHTML(
        left
      )} ${op} ${factorHTML(
        right
      )}`,

    answer,

    steps
  };
}

function randomPowerBase() {

  if (
    Math.random() <
    0.65
  ) {

    return pick([
      -4,
      -3,
      -2,
      2,
      3,
      4
    ]);
  }


  return pick([
    -8,
    -7,
    -6,
    -5,
    5,
    6,
    7,
    8
  ]);
}


function exponentForBase(
  base
) {

  const absoluteBase =
    Math.abs(
      base
    );


  if (
    absoluteBase ===
    2
  ) {
    return rand(
      2,
      10
    );
  }


  if (
    absoluteBase ===
    3
  ) {
    return rand(
      2,
      6
    );
  }


  if (
    absoluteBase ===
    4
  ) {
    return rand(
      2,
      5
    );
  }


  return rand(
    2,
    3
  );
}


function makePowerQuestion(

) {

          )}`
        ],

        ]

      );

    const p =
      makeMixedModePower();


    answer =
      intR(
        Math.abs(
          a - b
        ) -
        b *
        p.base +
        p.value
      );


    /*
    關鍵修正：

    |−4 − −3|

    改成：

    |−4 − (−3)|
    */

    html =
      `|${formatNumber(
        a
      )} − ${signedInnerOperand(
        b
      )}|` +
      ` − ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        p.base
      )}` +
      ` + ${p.html}`;


    steps = [
      [
        "先算絕對值內與乘方",

        `|${formatNumber(
          a
        )} − ${signedInnerOperand(
          b
        )}|` +
        ` = ${Math.abs(
          a - b
        )}，` +
        `${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )} × ${integerFactorHTML(
          p.base
        )}` +
        ` = ${formatNumber(
          b *
          p.base
        )}`
      ],

      [
        "最後由左到右做加減",

        `${Math.abs(
          a - b
        )}` +
        ` − ${signedInteger(
          b *
          p.base
        )}` +
        ` + ${formatNumber(
          p.value
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 2
  ) {

    const a =
      randomNonZeroInteger(
        -9,
        9
      );

    const b =
      randomNonZeroInteger(
        -5,
        5
      );

    const p =
      makeMixedModePower();


    answer =
      intR(
        Math.abs(
          a
        ) +
        b *
        p.base -
        p.value
      );


    html =
      `|${formatNumber(
        a
      )}|` +
      ` + ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        p.base
      )}` +
      ` − ${p.html}`;


    steps = [
      [
        "先算絕對值與乘方",

        `|${formatNumber(
          a
        )}| = ${Math.abs(
          a
        )}，${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )} × ${integerFactorHTML(
          p.base
        )}` +
        ` = ${formatNumber(
          b *
          p.base
        )}`
      ],

      [
        "最後做加減",

        `${Math.abs(
          a
        )}` +
        ` + ${signedInteger(
          b *
          p.base
        )}` +
        ` − ${formatNumber(
          p.value
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 3
  ) {

    const divisor =
      pick([
        -6,
        -5,
        -4,
        -3,
        3,
        4,
        5,
        6
      ]);

    const quotient =
      randomNonZeroInteger(
        -8,
        8
      );

    const dividend =
      divisor *
      quotient;

    const c =
      randomNonZeroInteger(
        -9,
        9
      );


    answer =
      intR(
        quotient +
        Math.abs(
          c
        )
      );


    html =
      `${integerFactorHTML(
        dividend
      )}` +
      ` ÷ ${integerFactorHTML(
        divisor
      )}` +
      ` + |${formatNumber(
        c
      )}|`;


    steps = [
      [
        "先算除法與絕對值",

        `${integerFactorHTML(
          dividend
        )}` +
        ` ÷ ${integerFactorHTML(
          divisor
        )}` +
        ` = ${formatNumber(
          quotient
        )}，` +
        `|${formatNumber(
          c
        )}| = ${Math.abs(
          c
        )}`
      ],

      [
        "再相加",

        `${formatNumber(
          quotient
        )}` +
        ` + ${Math.abs(
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else if (
    type === 4
  ) {

    const p =
      makeMixedModePower();

    const b =
      randomNonZeroInteger(
        -6,
        6
      );

    const c =
      randomNonZeroInteger(
        -5,
        5
      );


    answer =
      intR(
        p.value +
        b *
        c
      );


    /*
    關鍵修正：

    (−6) × −1

    改成：

    (−6) × (−1)
    */

    html =
      `${p.html}` +
      ` + ${integerFactorHTML(
        b
      )}` +
      ` × ${integerFactorHTML(
        c
      )}`;


    steps = [
      [
        "先算乘方",

        `${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再算乘法",

        `${integerFactorHTML(
          b
        )}` +
        ` × ${integerFactorHTML(
          c
        )}` +
        ` = ${formatNumber(
          b *
          c
        )}`
      ],

      [
        "最後相加",

        `${formatNumber(
          p.value
        )}` +
        ` + ${signedInteger(
          b *
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];


  } else {

    const a =
      randomNonZeroInteger(
        -10,
        10
      );

    const b =
      randomNonZeroInteger(
        -8,
        8
      );

    const c =
      randomNonZeroInteger(
        -6,
        6
      );


    answer =
      intR(
        Math.abs(
          a + b
        ) -
        c
      );


    html =
      `|${formatNumber(
        a
      )}` +
      ` + ${signedInnerOperand(
        b
      )}|` +
      ` − ${signedInteger(
        c
      )}`;


    steps = [
      [
        "先算絕對值內",

        `${formatNumber(
          a
        )}` +
        ` + ${signedInnerOperand(
          b
        )}` +
        ` = ${formatNumber(
          a + b
        )}`
      ],

      [
        "取絕對值",

        `|${formatNumber(
          a + b
        )}|` +
        ` = ${Math.abs(
          a + b
        )}`
      ],

      [
        "再做減法",

        `${Math.abs(
          a + b
        )}` +
        ` − ${signedInteger(
          c
        )}` +
        ` = ${formatNumber(
          answer.n
        )}`
      ]
    ];
  }


  if (
    Math.abs(
      answer.n
    ) > 5000
  ) {

    return makeMixedQuestion();
  }


  return {
    html,
    answer,
    steps
  };
}


/*
==================================================
模式五：進階
==================================================
*/

function makeAdvancedQuestion() {

  const type =
    rand(
      1,
      5
    );

  const f1 =
    randomProperFraction();

  const f2 =
    randomProperFraction();

  const i =
    randomNonZeroInteger(
      -8,
      8
    );

  let html;
  let answer;
  let steps;


  if (
    type === 1
  ) {

    answer =
      addR(
        mulR(
          f1,
          intR(
            i
          )
        ),
        f2
      );


    html =
      `${factorHTML(
        f1
      )}` +
      ` × ${integerFactorHTML(
        i
      )}` +
      ` + ${fracHTML(
        f2,
        true
      )}`;


    steps = [
      [
        "先算乘法",

        `${factorHTML(
          f1
        )}` +
        ` × ${integerFactorHTML(
          i
        )}` +
        ` = ${fracHTML(
          mulR(
            f1,
            intR(
              i
            )
          )
        )}`
      ],

      [
        "再做加法",

        `${fracHTML(
          mulR(
            f1,
            intR(
              i
            )
          )
        )}` +
        ` + ${fracHTML(
          f2,
          true
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];


  } else if (
    type === 2
  ) {

    answer =
      subR(
        divR(
          f1,
          f2
        ),
        intR(
          i
        )
      );


    html =
      `${factorHTML(
        f1
      )}` +
      ` ÷ ${factorHTML(
        f2
      )}` +
      ` − ${signedInteger(
        i
      )}`;


    steps = [
      [
        "先算除法",

        `${factorHTML(
          f1
        )}` +
        ` ÷ ${factorHTML(
          f2
        )}` +
        ` = ${fracHTML(
          divR(
            f1,
            f2
          )
        )}`
      ],

      [
        "再做減法",

        `${fracHTML(
          divR(
            f1,
            f2
          )
        )}` +
        ` − ${signedInteger(
          i
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];


  } else if (
    type === 3
  ) {

    const absInt =
      Math.abs(
        i
      );


    answer =
      addR(
        absR(
          f1
        ),
        mulR(
          f2,
          intR(
            absInt
          )
        )
      );


    html =
      `|${fracHTML(
        f1
      )}|` +
      ` + ${factorHTML(
        f2
      )}` +
      ` × ${absInt}`;


    steps = [
      [
        "先算絕對值與乘法",

        `|${fracHTML(
          f1
        )}|` +
        ` = ${fracHTML(
          absR(
            f1
          )
        )}，` +
        `${factorHTML(
          f2
        )}` +
        ` × ${absInt}` +
        ` = ${fracHTML(
          mulR(
            f2,
            intR(
              absInt
            )
          )
        )}`
      ],

      [
        "再相加",

        `${fracHTML(
          absR(
            f1
          )
        )}` +
        ` + ${fracHTML(
          mulR(
            f2,
            intR(
              absInt
            )
          )
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];


  } else if (
    type === 4
  ) {

    const p =
      makeMixedModePower();

    const powerValue =
      intR(
        p.value
      );


    answer =
      addR(
        powerValue,
        f1
      );


    html =
      `${p.html}` +
      ` + ${fracHTML(
        f1,
        true
      )}`;


    steps = [
      [
        "先算乘方",

        `${p.html}` +
        ` = ${formatNumber(
          p.value
        )}`
      ],

      [
        "再與分數相加",

        `${formatNumber(
          p.value
        )}` +
        ` + ${fracHTML(
          f1,
          true
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];


  } else {

    const f3 =
      randomProperFraction();


    answer =
      subR(
        addR(
          f1,
          mulR(
            f2,
            f3
          )
        ),
        intR(
          i
        )
      );


    html =
      `${fracHTML(
        f1,
        true
      )}` +
      ` + ${factorHTML(
        f2
      )}` +
      ` × ${factorHTML(
        f3
      )}` +
      ` − ${signedInteger(
        i
      )}`;


    steps = [
      [
        "先算分數乘法",

        `${factorHTML(
          f2
        )}` +
        ` × ${factorHTML(
          f3
        )}` +
        ` = ${fracHTML(
          mulR(
            f2,
            f3
          )
        )}`
      ],

      [
        "再由左到右做加減",

        `${fracHTML(
          f1,
          true
        )}` +
        ` + ${fracHTML(
          mulR(
            f2,
            f3
          )
        )}` +
        ` − ${signedInteger(
          i
        )}` +
        ` = ${fracHTML(
          answer
        )}`
      ]
    ];
  }


  if (
    Math.abs(
      answer.n
    ) > 500 ||
    answer.d > 120
  ) {

    return makeAdvancedQuestion();
  }


  return {
    html,
    answer,
    steps
  };
}


/*
==================================================
依模式產生題目
==================================================
*/

function makeQuestionByMode(
  selectedMode,
  positivePositive = false
) {

  if (
    selectedMode ===
    "muldiv"
  ) {

    return makeMulDivQuestion(
      positivePositive
    );
  }


  if (
    selectedMode ===
    "absolute"
  ) {

    return makeAbsoluteQuestion();
  }


  if (
    selectedMode ===
    "power"
  ) {

    return makePowerQuestion();
  }


  if (
    selectedMode ===
    "mixed"
  ) {

    return makeMixedQuestion();
  }


  return makeAdvancedQuestion();
}


/*
==================================================
產生十題
==================================================
*/

function makeQuestions() {

  const out =
    [];

  const used =
    new Set();


  if (
    mode ===
    "muldiv"
  ) {

    const positiveQuestion =
      makeMulDivQuestion(
        true
      );

    out.push(
      positiveQuestion
    );

    used.add(
      positiveQuestion.html
        .replace(
          /\s+/g,
          " "
        )
    );


    while (
      out.length <
      TOTAL
    ) {

      const q =
        makeMulDivQuestion(
          false
        );

      const bothPositive =
        !q.html.includes(
          "−"
        );

      if (
        bothPositive
      ) {
        continue;
      }


      const key =
        q.html.replace(
          /\s+/g,
          " "
        );


      if (
        used.has(
          key
        )
      ) {
        continue;
      }


      used.add(
        key
      );

      out.push(
        q
      );
    }


  } else if (
    mode ===
    "power"
  ) {

    const confusingCount =
      6;


    for (
      let i = 0;
      i <
      confusingCount;
      i++
    ) {

      let q;

      do {

        q =
          makePowerQuestion(
            true
          );

      } while (
        used.has(
          q.html
        )
      );


      used.add(
        q.html
      );

      out.push(
        q
      );
    }


    while (
      out.length <
      TOTAL
    ) {

      const q =
        makePowerQuestion(
          false
        );


      if (
        used.has(
          q.html
        )
      ) {
        continue;
      }


      used.add(
        q.html
      );

      out.push(
        q
      );
    }


  } else {

    while (
      out.length <
      TOTAL
    ) {

      const q =
        makeQuestionByMode(
          mode
        );

      const key =
        q.html.replace(
          /\s+/g,
          " "
        );


      if (
        used.has(
          key
        )
      ) {
        continue;
      }


      used.add(
        key
      );

      out.push(
        q
      );
    }
  }


  return shuffle(
    out
  );
}

/*

開始遊戲

*/

function startGame(

) {

  );


  if (
    !keepMode
  ) {

    mode =
      document.querySelector(
        'input[name="mode"]:checked'
      ).value;
  }


  questions =
    makeQuestions();

  index =
    0;

  correct =
    0;

  wrong =
    0;

  locked =
    false;

  nextReady =
    false;

  scoreSaved =
    false;

計時
==================================================
*/

function updateTimer() {

  const elapsed =
    Math.floor(
      (
        Date.now() -
        startTime
      ) /
      1000
    );


  $("time-display").textContent =
    `⏳ ${
      String(

        )
      ).padStart(
        2,
        "0"
      )
    }:${
      String(

        60
      ).padStart(
        2,
        "0"
      )
    }`;

function loadQuestion() {

  ) {

  }

/*
==================================================
讀取答案
==================================================
*/

function readAnswer() {

  const correctAnswer =
    questions[
      index
    ].answer;


  const isInteger =
    correctAnswer.d ===
    1;


  if (
    isInteger
  ) {

    const raw =
      $("answer-input")
        .value
        .trim();


    if (
      !/^-?\d+$/.test(
        raw
      )
    ) {
      return null;
    }


    return {
      value:
        intR(
          Number(
            raw
          )
        ),

      simplest:
        true,

      mixedValid:
        true
    };
  }


  const wholeText =
    $("answer-whole")
      .value
      .trim();


  const numeratorText =
    $("answer-num")
      .value
      .trim();


  const denominatorText =
    $("answer-den")
      .value
      .trim();


  if (
    !/^\d*$/.test(
      wholeText
    ) ||
    !/^\d+$/.test(
      numeratorText
    ) ||
    !/^\d+$/.test(
      denominatorText
    )
  ) {

    return null;
  }


  const whole =
    wholeText === ""
      ? 0
      : Number(
          wholeText
        );


  const numerator =
    Number(
      numeratorText
    );


  const denominator =
    Number(
      denominatorText
    );


  if (
    whole < 0 ||
    numerator < 0 ||
    denominator <= 0
  ) {

    return null;
  }


  const sign =
    Number(
      $("answer-sign")
        .value
    );


  const mixedValid =
    whole === 0 ||
    numerator <
    denominator;


  const improperNumerator =
    whole *
    denominator +
    numerator;


  return {

    value:
      simplify(
        sign *
        improperNumerator,

        denominator
      ),

    simplest:
      gcd(
        numerator,
        denominator
      ) === 1,

    mixedValid
  };
}


/*
==================================================
答案預覽
==================================================
*/

function updatePreview() {

  const answer =
    readAnswer();


  if (
    !answer
  ) {

    $("answer-preview")
      .innerHTML =
      "";

    return;
  }


  const wholeText =
    $("answer-whole")
      ?.value
      .trim() ||
    "";


  const numeratorText =
    $("answer-num")
      ?.value
      .trim() ||
    "";


  const denominatorText =
    $("answer-den")
      ?.value
      .trim() ||
    "";


  if (
    questions[
      index
    ].answer.d !== 1
  ) {

    const signText =
      $("answer-sign")
        .value === "-1"
        ? "−"
        : "";


    const wholePart =
      wholeText === ""
        ? ""
        : `${wholeText}`;


    const fractionPart =
      `
        <span class="math-frac">
          <span class="top">
            ${numeratorText}
          </span>

          <span class="bottom">
            ${denominatorText}
          </span>
        </span>
      `;


    $("answer-preview")
      .innerHTML =
      `系統判讀：` +
      `${signText}` +
      `${wholePart}` +
      `${fractionPart}`;


  } else {


    $("answer-preview")
      .innerHTML =
      `系統判讀：${
        fracHTML(
          answer.value
        )
      }`;
  }
}


/*
==================================================
解析
==================================================
*/

function explanationHTML(
  q
) {

  const steps =
    q.steps
      .map(
        (
          step,
          i
        ) =>
          `
            <div class="explanation-step">

              <span class="explanation-step-label">
                步驟 ${i + 1}｜${step[0]}
              </span>

              <div class="explanation-math">
                ${step[1]}
              </div>

            </div>
          `
      )
      .join(
        ""
      );


  return `
    <div class="explanation-title">
      逐步解題解析
    </div>

    ${steps}

    <div
      class="
        explanation-step
        explanation-final
      "
    >

      <span class="explanation-step-label">
        最後答案
      </span>

      <div class="explanation-math">
        ${fracHTML(
          q.answer
        )}
      </div>

    </div>
  `;
}


/*
==================================================
判斷答案
==================================================
*/

function checkAnswer() {

  if (
    locked
  ) {
    return;
  }


  const answer =
    readAnswer();


  if (
    !answer
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">請完整輸入有效答案。</span>';

    return;
  }


  if (
    questions[
      index
    ].answer.d !== 1 &&
    !answer.mixedValid
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">帶分數的分子必須小於分母。</span>';

    return;
  }


  if (
    questions[
      index
    ].answer.d !== 1 &&
    !answer.simplest
  ) {

    $("feedback")
      .innerHTML =
      '<span style="color:#d97706">分數尚未化成最簡分數，請繼續約分。</span>';

    return;
  }


  locked =
    true;


  const q =
    questions[
      index
    ];


  const isCorrect =
    eqR(
      answer.value,
      q.answer
    );


  if (
    isCorrect
  ) {

    correct++;

    playGameSound(
      "playCorrect"
    );

  } else {

    wrong++;

    playGameSound(
      "playWrong"
    );
  }


  $("feedback").innerHTML =
    `
      <span
        style="
          color:${
            isCorrect
              ? "#15803d"
              : "#b91c1c"
          }
        "
      >
        ${
          isCorrect
            ? "✨ 正確！"
            : "❌ 答案不正確"
        }
      </span>

      <div class="explanation-actions">

        <button
          id="explanation-toggle"
          class="explanation-toggle"
        >
          查看解析
        </button>

      </div>

      <div
        id="explanation-panel"
        class="
          explanation-panel
          hidden
        "
      ></div>
    `;


  $("explanation-toggle")
    .onclick =
    () => {

      const panel =
        $("explanation-panel");


      const opening =
        panel.classList
          .contains(
            "hidden"
          );


      panel.classList
        .toggle(
          "hidden",
          !opening
        );


      $("explanation-toggle")
        .textContent =
        opening
          ? "收起解析"
          : "查看解析";


      if (
        opening
      ) {

        panel.innerHTML =
          explanationHTML(
            q
          );
      }
    };


  setTimeout(
    () => {

      $("submit-btn")
        .classList
        .add(
          "hidden"
        );


      $("next-btn")
        .classList
        .remove(
          "hidden"
        );


      $("next-btn")
        .textContent =
        index ===
        TOTAL - 1
          ? "查看測驗結果（Enter）"
          : "下一題（Enter）";


      nextReady =
        true;


      $("next-btn")
        .focus();

    },

    isCorrect
      ? 650
      : 950
  );
}


/*
==================================================
下一題
==================================================
*/

function nextQuestion() {

  if (
    !nextReady
  ) {
    return;
  }


  index++;


  if (
    index <
    TOTAL
  ) {

    loadQuestion();

  } else {

    showResult();
  }
}


/*
==================================================
評語
==================================================
*/

function rating(
  score
) {

  if (
    score >= 90
  ) {

    return {
      stars:
        "★★★★★",

      comment:
        "太棒了！你已經熟練掌握正負數運算。"
    };
  }


  if (
    score >= 80
  ) {

    return {
      stars:
        "★★★★☆",

      comment:
        "表現很好，再多練習幾次就更穩定。"
    };
  }


  if (
    score >= 60
  ) {

    return {
      stars:
        "★★★☆☆",

      comment:
        "已掌握基本概念，繼續注意運算順序與正負號。"
    };
  }


  return {
    stars:
      "★★☆☆☆",

    comment:
      "先從個別模式練習，再挑戰進階四則運算。"
  };
}


/*
==================================================
儲存成績
==================================================
*/

async function saveCurrentScore(
  score
) {

  if (
    scoreSaved
  ) {
    return;
  }


  scoreSaved =
    true;


  const status =
    $("save-status");


  status.textContent =
    "☁️ 正在儲存本次成績……";


  status.style.color =
    "#1d4ed8";


  try {

    const result =
      await saveGameScore({

        game:
          GAME_ID,

        mode,

        score,

        correctCount:
          correct,

        wrongCount:
          wrong,

        maxCombo:
          0,

        playTime:
          finalElapsed
      });


    if (
      result.success
    ) {

      status.textContent =
        "✅ 本次成績已儲存。";

      status.style.color =
        "#15803d";


    } else if (
      result.reason ===
      "not-logged-in"
    ) {

      status.textContent =
        "ℹ️ 尚未登入，因此本次成績沒有儲存。";

      status.style.color =
        "#b45309";


    } else {

      status.textContent =
        "⚠️ 成績暫時無法儲存。";

      status.style.color =
        "#b91c1c";
    }


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      "⚠️ 成績暫時無法儲存。";


    status.style.color =
      "#b91c1c";
  }
}


/*
==================================================
結果
==================================================
*/

async function showResult() {

  clearInterval(
    timer
  );


  playGameSound(
    "playComplete"
  );


  $("progress-bar")
    .style
    .width =
    "100%";


  finalElapsed =
    Math.floor(
      (
        Date.now() -
        startTime
      ) /
      1000
    );


  const score =
    Math.round(
      correct /
      TOTAL *
      100
    );


  const result =
    rating(
      score
    );


  showOnly(
    "result-screen"
  );


  $("final-score")
    .textContent =
    `${score} 分`;


  $("final-stars")
    .textContent =
    result.stars;


  $("final-comment")
    .textContent =
    result.comment;


  $("final-correct")
    .textContent =
    correct;


  $("final-wrong")
    .textContent =
    wrong;


  $("final-time")
    .textContent =
    `${
      String(
        Math.floor(
          finalElapsed /
          60
        )
      ).padStart(
        2,
        "0"
      )
    }:${
      String(
        finalElapsed %
        60
      ).padStart(
        2,
        "0"
      )
    }`;


  await saveCurrentScore(
    score
  );
}


/*
==================================================
回模式選擇
==================================================
*/

function showModeSelection() {

  clearInterval(
    timer
  );


  showOnly(
    "start-screen"
  );


  $("progress-bar")
    .style
    .width =
    "0%";
}


/*
==================================================
事件
==================================================
*/

$("start-btn")
  .onclick =
  () =>
    startGame(
      false
    );


$("change-mode-btn")
  .onclick =
  showModeSelection;


$("result-change-mode-btn")
  .onclick =
  showModeSelection;


$("reset-btn")
  .onclick =
  () =>
    startGame(
      true
    );


$("again-btn")
  .onclick =
  () =>
    startGame(
      true
    );


$("submit-btn")
  .onclick =
  checkAnswer;


$("next-btn")
  .onclick =
  nextQuestion;


[
  "answer-input",
  "answer-whole",
  "answer-num",
  "answer-den"
].forEach(
  id => {

    $(id)
      .addEventListener(
        "input",
        updatePreview
      );
  }
);


$("answer-sign")
  .addEventListener(
    "change",
    updatePreview
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
        "Enter" ||
      $("quiz-screen")
        .classList
        .contains(
          "hidden"
        )
    ) {

      return;
    }


    event.preventDefault();


    if (
      nextReady
    ) {

      nextQuestion();

    } else if (
      !locked
    ) {

      checkAnswer();
    }
  }
);

</script>

<script src="../js/common-header.js"></script>

</body>
</html>
