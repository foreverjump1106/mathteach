<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正負數四則運算大挑戰</title>
<link rel="stylesheet" href="../css/scratchpad.css">
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --amber:#d97706;
  --ink:#1f2937;
  --muted:#64748b;
  --line:#dbe3ef;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#eff6ff,#f8fafc);padding:8px}
button,input,select{font:inherit}
.hidden{display:none!important}
.app{
  width:100%;
  max-width:1500px;
  min-height:calc(100vh - 16px);
  margin:auto;
  background:#fff;
  border:3px solid #bfdbfe;
  border-radius:24px;
  box-shadow:0 18px 45px #1e3a8a22;
  overflow:hidden;
}
.progress{height:10px;background:#e5e7eb}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .25s}
.inner{padding:24px}
.title{text-align:center;color:var(--blue-dark);font-size:clamp(28px,4vw,42px);font-weight:900;margin:0 0 8px}
.subtitle{text-align:center;color:var(--muted);margin:0 0 24px;line-height:1.7}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:980px;margin:0 auto 24px}
.mode-card input{position:absolute;opacity:0}
.mode-card span{display:block;border:2px solid var(--line);border-radius:17px;padding:16px;cursor:pointer;background:#fff;transition:.2s;height:100%}
.mode-card input:checked+span{border-color:#3b82f6;background:#eff6ff;box-shadow:0 0 0 4px #3b82f622}
.mode-title{font-weight:900;color:var(--blue-dark);font-size:18px}
.example{font-family:"Times New Roman",serif;font-size:18px;margin-top:7px;color:#475569}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:17px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-light{background:#eff6ff;color:var(--blue-dark);border:2px solid #bfdbfe}
.btn-danger-light{background:#fff1f2;color:#be123c;border:2px solid #fecdd3}
.btn-neutral{background:#f1f5f9;color:#334155;border:2px solid #cbd5e1}
.center{text-align:center}
.topbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{padding:9px 14px;border-radius:14px;font-size:15px;font-weight:900;box-shadow:0 4px 12px #0f172a10}
.pill-blue{background:#dbeafe;color:var(--blue-dark)}
.pill-amber{background:#fef3c7;color:#92400e}
.pill-gray{background:#f1f5f9;color:#475569}
#scratchpad-mobile-button{display:flex;align-items:center}
#scratchpad-mobile-button .scratchpad-open-button{
  position:static!important;
  inset:auto!important;
  display:inline-flex!important;
  min-height:42px;
  padding:10px 16px;
  border:2px solid #c7d2fe;
  border-radius:14px;
  background:linear-gradient(135deg,#4f46e5,#2563eb);
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}
.problem{
  background:#f8fafc;
  border:2px solid #e2e8f0;
  border-radius:20px;
  padding:28px 14px;
  text-align:center;
  font-family:"Times New Roman",serif;
  font-size:clamp(30px,5vw,52px);
  font-weight:700;
  margin-bottom:20px;
  white-space:nowrap;
  overflow-x:auto;
}
.problem sup{font-size:.62em}
.answer-wrap{max-width:760px;margin:auto}
.answer-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-height:118px;
  padding:14px;
  border:2px solid #dbeafe;
  border-radius:18px;
  background:#f8fbff;
}
.answer-card input{
  width:min(250px,72vw);
  min-height:58px;
  border:2px solid #cbd5e1;
  border-radius:12px;
  text-align:center;
  font-size:28px;
  font-weight:900;
  outline:none;
}
.help{text-align:center;color:#64748b;font-size:13px;margin:9px 0 12px}
.preview{min-height:26px;text-align:center;color:#64748b;margin:8px 0 14px}
.actions{display:grid;gap:10px}
.feedback{min-height:58px;margin-top:15px;text-align:center;font-size:19px;font-weight:900;line-height:1.55}
.explanation-actions{display:flex;justify-content:center;margin-top:12px}
.explanation-toggle{
  border:2px solid #93c5fd;
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:12px;
  padding:10px 16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}
.explanation-panel{
  margin-top:12px;
  border:2px solid #bfdbfe;
  border-radius:16px;
  background:#f8fbff;
  padding:16px;
  text-align:left;
  color:#334155;
  line-height:1.7;
}
.explanation-title{text-align:center;font-size:19px;font-weight:900;color:#1d4ed8;margin-bottom:10px}
.explanation-step{border-left:4px solid #60a5fa;background:#fff;border-radius:10px;padding:10px 12px;margin:9px 0}
.explanation-step-label{display:block;color:#1e40af;font-weight:900;margin-bottom:5px}
.explanation-math{text-align:center;font-family:"Times New Roman",serif;font-size:24px;font-weight:700;overflow-x:auto;white-space:nowrap;padding:4px 0}
.explanation-final{border-color:#22c55e;background:#f0fdf4}
.result-box{max-width:760px;margin:auto;text-align:center}
.grade-card{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:2px solid #bfdbfe;border-radius:22px;padding:24px;margin:18px 0}
.grade-big{font-size:54px;font-weight:900;color:var(--blue-dark)}
.stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.comment{font-size:20px;font-weight:900;color:#334155}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.score-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:15px}
.score-card b{display:block;font-size:26px;margin-top:5px}
.result-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.save-status{min-height:24px;margin:10px 0 16px;font-size:15px;font-weight:900}
@media(max-width:760px){
  body{padding:4px}
  .inner{padding:14px}
  .modes{grid-template-columns:1fr}
  .topbar{gap:8px}
  .btn{padding:11px 13px;font-size:15px}
  .score-grid,.result-actions{grid-template-columns:1fr}
  .problem{font-size:clamp(28px,8vw,40px)}
}
</style>
</head>
<body>
<main class="app">
  <div class="progress"><div id="progress-bar"></div></div>
  <div class="inner">

    <section id="start-screen">
      <h1 class="title">正負數四則運算大挑戰</h1>
      <p class="subtitle">從正負數加減、乘除、絕對值到乘方與綜合四則運算，逐步建立完整計算能力。</p>

      <div class="modes">
        <label class="mode-card">
          <input type="radio" name="mode" value="addsub" checked>
          <span>
            <div class="mode-title">模式一｜正負數加減</div>
            <div class="example">例如：−8＋15、12−(−7)</div>
          </span>
        </label>

        <label class="mode-card">
          <input type="radio" name="mode" value="multiply">
          <span>
            <div class="mode-title">模式二｜正負數乘法</div>
            <div class="example">例如：(−6)×8、(−7)×(−4)</div>
          </span>
        </label>

        <label class="mode-card">
          <input type="radio" name="mode" value="divide">
          <span>
            <div class="mode-title">模式三｜正負數除法</div>
            <div class="example">例如：(−48)÷6、72÷(−8)</div>
          </span>
        </label>

        <label class="mode-card">
          <input type="radio" name="mode" value="absolute">
          <span>
            <div class="mode-title">模式四｜絕對值運算</div>
            <div class="example">例如：|−8|、|−5|−3</div>
          </span>
        </label>

        <label class="mode-card">
          <input type="radio" name="mode" value="power">
          <span>
            <div class="mode-title">模式五｜乘方計算</div>
            <div class="example">例如：(−3)³、−3²、7³</div>
          </span>
        </label>

        <label class="mode-card">
          <input type="radio" name="mode" value="mixed">
          <span>
            <div class="mode-title">模式六｜綜合四則運算</div>
            <div class="example">例如：|−8|＋(−3)²×(−2)</div>
          </span>
        </label>
      </div>

      <div class="center">
        <button id="start-btn" class="btn btn-primary">開始挑戰</button>
      </div>
    </section>

    <section id="quiz-screen" class="hidden">
      <div class="topbar">
        <button id="change-mode-btn" class="btn btn-light">← 重選模式</button>
        <span id="question-number" class="pill pill-blue">第 1 / 10 題</span>
        <span id="mode-badge" class="pill pill-amber">模式一</span>
        <span id="time-display" class="pill pill-gray">⏳ 00:00</span>
        <button id="reset-btn" class="btn btn-danger-light">重新測驗（目前模式）</button>
        <div id="scratchpad-mobile-button"></div>
      </div>

      <div id="problem-text" class="problem"></div>

      <div class="answer-wrap">
        <div class="answer-card">
          <input id="answer-input" inputmode="numeric" autocomplete="off" placeholder="輸入答案">
        </div>

        <div class="help">答案為整數，負數請輸入「-」號。</div>
        <div id="answer-preview" class="preview"></div>

        <div class="actions">
          <button id="submit-btn" class="btn btn-green">送出答案（Enter）</button>
          <button id="next-btn" class="btn btn-primary hidden">下一題（Enter）</button>
        </div>

        <div id="feedback" class="feedback" aria-live="polite"></div>
      </div>
    </section>

    <section id="result-screen" class="hidden result-box">
      <h2 class="title">挑戰完成！</h2>

      <div class="grade-card">
        <div id="final-score" class="grade-big">0 分</div>
        <div id="final-stars" class="stars">☆☆☆☆☆</div>
        <div id="final-comment" class="comment"></div>
      </div>

      <div class="score-grid">
        <div class="score-card">答對<b id="final-correct">0</b></div>
        <div class="score-card">答錯<b id="final-wrong">0</b></div>
        <div class="score-card">總時間<b id="final-time">00:00</b></div>
      </div>

      <p id="save-status" class="save-status"></p>

      <div class="result-actions">
        <button id="again-btn" class="btn btn-primary">🔄 再玩一次</button>
        <button id="result-change-mode-btn" class="btn btn-light">重選模式</button>
        <a class="btn btn-neutral" href="../leaderboard.html">🏆 排行榜</a>
        <a class="btn btn-neutral" href="../my-scores.html">📊 我的成績</a>
        <a class="btn btn-light" href="../index.html">🏠 回首頁</a>
      </div>
    </section>

  </div>
</main>

<script src="../js/scratchpad.js"></script>
<script src="../js/scratchpad-template.js"></script>

<script type="module">
import { saveGameScore } from "../js/scores.js";

"use strict";

document.addEventListener("DOMContentLoaded",()=>{
  const mount=document.getElementById("scratchpad-mobile-button");
  const button=document.getElementById("scratchpadOpenButton");
  if(mount&&button)mount.appendChild(button);
});

const $=id=>document.getElementById(id);
const GAME_ID="integer-operations";
const TOTAL=10;

const MODE_NAMES={
  addsub:"模式一｜正負數加減",
  multiply:"模式二｜正負數乘法",
  divide:"模式三｜正負數除法",
  absolute:"模式四｜絕對值運算",
  power:"模式五｜乘方計算",
  mixed:"模式六｜綜合四則運算"
};

let mode="addsub";
let questions=[];
let index=0;
let correct=0;
let wrong=0;
let locked=false;
let nextReady=false;
let startTime=0;
let timer=null;
let finalElapsed=0;
let scoreSaved=false;

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function pick(arr){
  return arr[rand(0,arr.length-1)];
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=rand(0,i);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function signed(n){
  return n<0?`(${n})`:String(n);
}

function formatNumber(n){
  return String(n).replace("-","−");
}

function power(base,exp){
  return Math.pow(base,exp);
}

function makeAddSubQuestion(){
  let a,b,op,answer;
  do{
    a=rand(-20,20);
    b=rand(-20,20);
  }while(a===0||b===0);

  op=Math.random()<.5?"+":"−";
  answer=op==="+"?a+b:a-b;

  return{
    html:`${formatNumber(a)} ${op} ${signed(b).replace("-","−")}`,
    answer,
    steps:[
      ["判斷運算","先依照加減規則處理正負號。"],
      ["計算",`${formatNumber(a)} ${op} ${signed(b).replace("-","−")} = ${formatNumber(answer)}`]
    ]
  };
}

function makeMultiplyQuestion(){
  let a,b;
  do{
    a=rand(-12,12);
    b=rand(-12,12);
  }while(a===0||b===0||Math.abs(a)===1||Math.abs(b)===1);

  const answer=a*b;

  return{
    html:`${signed(a).replace("-","−")} × ${signed(b).replace("-","−")}`,
    answer,
    steps:[
      ["判斷正負號",`${a<0?"負":"正"}數 × ${b<0?"負":"正"}數，結果為 ${answer<0?"負":"正"}。`],
      ["計算絕對值",`${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(answer)}`],
      ["寫出答案",`${formatNumber(answer)}`]
    ]
  };
}

function makeDivideQuestion(){
  let divisor,quotient,dividend;
  do{
    divisor=rand(-12,12);
  }while(divisor===0||Math.abs(divisor)===1);

  do{
    quotient=rand(-12,12);
  }while(quotient===0||Math.abs(quotient)===1);

  dividend=divisor*quotient;

  return{
    html:`${signed(dividend).replace("-","−")} ÷ ${signed(divisor).replace("-","−")}`,
    answer:quotient,
    steps:[
      ["判斷正負號",`${dividend<0?"負":"正"}數 ÷ ${divisor<0?"負":"正"}數，結果為 ${quotient<0?"負":"正"}。`],
      ["計算絕對值",`${Math.abs(dividend)} ÷ ${Math.abs(divisor)} = ${Math.abs(quotient)}`],
      ["寫出答案",`${formatNumber(quotient)}`]
    ]
  };
}

function makeAbsoluteQuestion(){
  const type=rand(1,3);
  let a,b,answer,html,steps;

  if(type===1){
    do{a=rand(-25,25)}while(a===0);
    answer=Math.abs(a);
    html=`|${formatNumber(a)}|`;
    steps=[
      ["理解絕對值",`絕對值表示與 0 的距離。`],
      ["計算",`|${formatNumber(a)}| = ${answer}`]
    ];
  }else if(type===2){
    do{
      a=rand(-15,15);
      b=rand(-12,12);
    }while(a===0||b===0);
    answer=Math.abs(a)+b;
    html=`|${formatNumber(a)}| ${b>=0?"+":"−"} ${Math.abs(b)}`;
    steps=[
      ["先算絕對值",`|${formatNumber(a)}| = ${Math.abs(a)}`],
      ["再做加減",`${Math.abs(a)} ${b>=0?"+":"−"} ${Math.abs(b)} = ${formatNumber(answer)}`]
    ];
  }else{
    do{
      a=rand(-15,15);
      b=rand(-15,15);
    }while(a===0||b===0);
    answer=Math.abs(a)-Math.abs(b);
    html=`|${formatNumber(a)}| − |${formatNumber(b)}|`;
    steps=[
      ["先算絕對值",`|${formatNumber(a)}| = ${Math.abs(a)}，|${formatNumber(b)}| = ${Math.abs(b)}`],
      ["再做減法",`${Math.abs(a)} − ${Math.abs(b)} = ${formatNumber(answer)}`]
    ];
  }

  return{html,answer,steps};
}

function makePowerQuestion(){
  const type=rand(1,3);
  let base,exp,answer,html,steps;

  if(type===1){
    base=rand(2,9);
    exp=rand(2,4);
    answer=power(base,exp);
    html=`${base}<sup>${exp}</sup>`;
    steps=[
      ["展開乘方",`${base}<sup>${exp}</sup> 表示 ${Array(exp).fill(base).join(" × ")}`],
      ["計算",`${answer}`]
    ];
  }else if(type===2){
    base=-rand(2,6);
    exp=rand(2,4);
    answer=power(base,exp);
    html=`(${formatNumber(base)})<sup>${exp}</sup>`;
    steps=[
      ["辨認底數",`括號內的底數是 ${formatNumber(base)}。`],
      ["判斷正負",`${exp} 是${exp%2===0?"偶":"奇"}數，所以答案為${answer<0?"負":"正"}。`],
      ["計算",`${formatNumber(answer)}`]
    ];
  }else{
    base=rand(2,6);
    exp=rand(2,4);
    answer=-power(base,exp);
    html=`−${base}<sup>${exp}</sup>`;
    steps=[
      ["先算乘方",`${base}<sup>${exp}</sup> = ${power(base,exp)}`],
      ["再處理前方負號",`−${power(base,exp)} = ${formatNumber(answer)}`]
    ];
  }

  return{html,answer,steps};
}

function makeMixedQuestion(){
  const type=rand(1,4);
  let html,answer,steps;

  if(type===1){
    const a=rand(2,8);
    const b=-rand(2,6);
    const c=rand(2,5);
    answer=a+b*c;
    html=`${a} + ${signed(b).replace("-","−")} × ${c}`;
    steps=[
      ["先算乘法",`${signed(b).replace("-","−")} × ${c} = ${formatNumber(b*c)}`],
      ["再算加法",`${a} + ${signed(b*c).replace("-","−")} = ${formatNumber(answer)}`]
    ];
  }else if(type===2){
    const a=-rand(3,9);
    const b=rand(2,5);
    const c=rand(2,4);
    answer=Math.abs(a)+power(b,c);
    html=`|${formatNumber(a)}| + ${b}<sup>${c}</sup>`;
    steps=[
      ["先算絕對值與乘方",`|${formatNumber(a)}| = ${Math.abs(a)}，${b}<sup>${c}</sup> = ${power(b,c)}`],
      ["再相加",`${Math.abs(a)} + ${power(b,c)} = ${answer}`]
    ];
  }else if(type===3){
    const divisor=pick([-6,-5,-4,-3,3,4,5,6]);
    const quotient=rand(-8,8)||2;
    const dividend=divisor*quotient;
    const c=rand(2,9);
    answer=quotient-c;
    html=`${signed(dividend).replace("-","−")} ÷ ${signed(divisor).replace("-","−")} − ${c}`;
    steps=[
      ["先算除法",`${signed(dividend).replace("-","−")} ÷ ${signed(divisor).replace("-","−")} = ${formatNumber(quotient)}`],
      ["再做減法",`${formatNumber(quotient)} − ${c} = ${formatNumber(answer)}`]
    ];
  }else{
    const a=-rand(2,6);
    const exp=rand(2,3);
    const b=pick([-4,-3,3,4]);
    const c=rand(2,5);
    answer=power(a,exp)+b*c;
    html=`(${formatNumber(a)})<sup>${exp}</sup> + ${signed(b).replace("-","−")} × ${c}`;
    steps=[
      ["先算乘方",`(${formatNumber(a)})<sup>${exp}</sup> = ${formatNumber(power(a,exp))}`],
      ["再算乘法",`${signed(b).replace("-","−")} × ${c} = ${formatNumber(b*c)}`],
      ["最後相加",`${formatNumber(power(a,exp))} + ${signed(b*c).replace("-","−")} = ${formatNumber(answer)}`]
    ];
  }

  return{html,answer,steps};
}

function makeQuestionByMode(selectedMode){
  if(selectedMode==="addsub")return makeAddSubQuestion();
  if(selectedMode==="multiply")return makeMultiplyQuestion();
  if(selectedMode==="divide")return makeDivideQuestion();
  if(selectedMode==="absolute")return makeAbsoluteQuestion();
  if(selectedMode==="power")return makePowerQuestion();
  return makeMixedQuestion();
}

function makeQuestions(){
  const out=[];
  const used=new Set();

  while(out.length<TOTAL){
    const q=makeQuestionByMode(mode);
    const key=q.html.replace(/\s+/g," ");
    if(used.has(key))continue;
    used.add(key);
    out.push(q);
  }

  return shuffle(out);
}

function showOnly(id){
  ["start-screen","quiz-screen","result-screen"].forEach(section=>{
    $(section).classList.toggle("hidden",section!==id);
  });
}

function startGame(keepMode=false){
  if(!keepMode){
    mode=document.querySelector('input[name="mode"]:checked').value;
  }

  questions=makeQuestions();
  index=0;
  correct=0;
  wrong=0;
  locked=false;
  nextReady=false;
  scoreSaved=false;
  startTime=Date.now();

  clearInterval(timer);
  timer=setInterval(updateTimer,1000);

  showOnly("quiz-screen");
  $("mode-badge").textContent=MODE_NAMES[mode];
  loadQuestion();
}

function updateTimer(){
  const elapsed=Math.floor((Date.now()-startTime)/1000);
  $("time-display").textContent=
    `⏳ ${String(Math.floor(elapsed/60)).padStart(2,"0")}:${String(elapsed%60).padStart(2,"0")}`;
}

function loadQuestion(){
  if(typeof window.resetGameScratchpad==="function"){
    window.resetGameScratchpad();
  }

  locked=false;
  nextReady=false;

  $("submit-btn").classList.remove("hidden");
  $("next-btn").classList.add("hidden");
  $("feedback").innerHTML="";
  $("answer-preview").textContent="";
  $("answer-input").value="";

  $("question-number").textContent=`第 ${index+1} / ${TOTAL} 題`;
  $("progress-bar").style.width=`${index/TOTAL*100}%`;
  $("problem-text").innerHTML=questions[index].html;

  setTimeout(()=>$("answer-input").focus(),0);
}

function readAnswer(){
  const raw=$("answer-input").value.trim();
  if(!/^-?\d+$/.test(raw))return null;
  return Number(raw);
}

function updatePreview(){
  const answer=readAnswer();
  $("answer-preview").textContent=
    answer===null?"":`系統判讀：${formatNumber(answer)}`;
}

function explanationHTML(q){
  const steps=q.steps.map((step,i)=>`
    <div class="explanation-step">
      <span class="explanation-step-label">步驟 ${i+1}｜${step[0]}</span>
      <div class="explanation-math">${step[1]}</div>
    </div>
  `).join("");

  return`
    <div class="explanation-title">逐步解題解析</div>
    ${steps}
    <div class="explanation-step explanation-final">
      <span class="explanation-step-label">最後答案</span>
      <div class="explanation-math">${formatNumber(q.answer)}</div>
    </div>
  `;
}

function checkAnswer(){
  if(locked)return;

  const answer=readAnswer();
  if(answer===null){
    $("feedback").innerHTML='<span style="color:#d97706">請輸入有效的整數答案。</span>';
    return;
  }

  locked=true;
  const q=questions[index];
  const isCorrect=answer===q.answer;

  if(isCorrect){
    correct++;
  }else{
    wrong++;
  }

  $("feedback").innerHTML=`
    <span style="color:${isCorrect?"#15803d":"#b91c1c"}">
      ${isCorrect?"✨ 正確！":"❌ 答案不正確"}
    </span>
    <div class="explanation-actions">
      <button id="explanation-toggle" class="explanation-toggle">查看解析</button>
    </div>
    <div id="explanation-panel" class="explanation-panel hidden"></div>
  `;

  $("explanation-toggle").onclick=()=>{
    const panel=$("explanation-panel");
    const opening=panel.classList.contains("hidden");
    panel.classList.toggle("hidden",!opening);
    $("explanation-toggle").textContent=opening?"收起解析":"查看解析";

    if(opening){
      panel.innerHTML=explanationHTML(q);
    }
  };

  setTimeout(()=>{
    $("submit-btn").classList.add("hidden");
    $("next-btn").classList.remove("hidden");
    $("next-btn").textContent=
      index===TOTAL-1
        ?"查看測驗結果（Enter）"
        :"下一題（Enter）";
    nextReady=true;
    $("next-btn").focus();
  },isCorrect?650:950);
}

function nextQuestion(){
  if(!nextReady)return;

  index++;

  if(index<TOTAL){
    loadQuestion();
  }else{
    showResult();
  }
}

function rating(score){
  if(score>=90)return{stars:"★★★★★",comment:"太棒了！你已經熟練掌握正負數四則運算。"};
  if(score>=80)return{stars:"★★★★☆",comment:"表現很好，再多練習幾次就更穩定。"};
  if(score>=60)return{stars:"★★★☆☆",comment:"已掌握基本概念，繼續注意運算順序與正負號。"};
  return{stars:"★★☆☆☆",comment:"先從個別模式練習，再挑戰綜合四則運算。"};
}

async function saveCurrentScore(score){
  if(scoreSaved)return;
  scoreSaved=true;

  const status=$("save-status");
  status.textContent="☁️ 正在儲存本次成績……";
  status.style.color="#1d4ed8";

  try{
    const result=await saveGameScore({
      game:GAME_ID,
      mode,
      score,
      correctCount:correct,
      wrongCount:wrong,
      maxCombo:0,
      playTime:finalElapsed
    });

    if(result.success){
      status.textContent="✅ 本次成績已儲存。";
      status.style.color="#15803d";
    }else if(result.reason==="not-logged-in"){
      status.textContent="ℹ️ 尚未登入，因此本次成績沒有儲存。";
      status.style.color="#b45309";
    }else{
      status.textContent="⚠️ 成績暫時無法儲存。";
      status.style.color="#b91c1c";
    }
  }catch(error){
    console.error(error);
    status.textContent="⚠️ 成績暫時無法儲存。";
    status.style.color="#b91c1c";
  }
}

async function showResult(){
  clearInterval(timer);
  $("progress-bar").style.width="100%";

  finalElapsed=Math.floor((Date.now()-startTime)/1000);
  const score=Math.round(correct/TOTAL*100);
  const result=rating(score);

  showOnly("result-screen");

  $("final-score").textContent=`${score} 分`;
  $("final-stars").textContent=result.stars;
  $("final-comment").textContent=result.comment;
  $("final-correct").textContent=correct;
  $("final-wrong").textContent=wrong;
  $("final-time").textContent=
    `${String(Math.floor(finalElapsed/60)).padStart(2,"0")}:${String(finalElapsed%60).padStart(2,"0")}`;

  await saveCurrentScore(score);
}

function showModeSelection(){
  clearInterval(timer);
  showOnly("start-screen");
  $("progress-bar").style.width="0%";
}

$("start-btn").onclick=()=>startGame(false);
$("change-mode-btn").onclick=showModeSelection;
$("result-change-mode-btn").onclick=showModeSelection;
$("reset-btn").onclick=()=>startGame(true);
$("again-btn").onclick=()=>startGame(true);
$("submit-btn").onclick=checkAnswer;
$("next-btn").onclick=nextQuestion;
$("answer-input").addEventListener("input",updatePreview);

document.addEventListener("keydown",event=>{
  if(event.key!=="Enter"||$("quiz-screen").classList.contains("hidden"))return;
  event.preventDefault();

  if(nextReady){
    nextQuestion();
  }else if(!locked){
    checkAnswer();
  }
});
</script>
</body>
</html>
