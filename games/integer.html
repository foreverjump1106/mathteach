<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>正負數大挑戰</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #fff8e1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      padding: 30px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #1565c0;
    }

    .description {
      margin-bottom: 22px;
      color: #555;
      line-height: 1.7;
    }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .status-item {
      padding: 12px 5px;
      background: #eef5ff;
      border-radius: 12px;
      color: #174a7e;
      font-weight: bold;
    }

    .danger-time {
      color: #c62828;
      background: #ffebee;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.06);
      }
    }

    .question {
      min-height: 80px;
      margin: 18px 0;
      font-size: 38px;
      font-weight: bold;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .answer-display {
      width: 100%;
      max-width: 260px;
      min-height: 62px;
      margin: 0 auto;
      padding: 12px 16px;
      border: 3px solid #90caf9;
      border-radius: 12px;
      background: white;
      color: #222;
      font-size: 28px;
      text-align: center;
      line-height: 32px;
      overflow-wrap: anywhere;
    }

    .answer-display:focus {
      border-color: #1565c0;
      outline: none;
    }

    .keypad {
      width: 100%;
      max-width: 330px;
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .keypad button {
      min-height: 52px;
      margin: 0;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: #eef5ff;
      color: #174a7e;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .keypad button:hover,
    .keypad button:active {
      background: #dbeafe;
    }

    .keypad .sign-button {
      background: #fff3e0;
      color: #b45309;
    }

    .keypad .clear-button {
      background: #ffebee;
      color: #b91c1c;
    }

    .submit-button {
      width: 100%;
      max-width: 330px;
      margin-top: 16px;
      padding: 14px 30px;
      border: none;
      border-radius: 12px;
      background: #1565c0;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .submit-button:hover {
      background: #0d47a1;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .feedback {
      min-height: 35px;
      margin-top: 18px;
      font-size: 21px;
      font-weight: bold;
    }

    .correct {
      color: #2e7d32;
    }

    .wrong {
      color: #c62828;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }

    .result {
      display: none;
    }

    .result h2 {
      color: #1565c0;
    }

    .final-score {
      margin: 20px 0;
      color: #f57c00;
      font-size: 44px;
      font-weight: bold;
    }

    .restart-button {
      padding: 13px 30px;
      border: none;
      border-radius: 12px;
      background: #1565c0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .game-container {
        padding: 22px 16px;
      }

      h1 {
        font-size: 28px;
      }

      .question {
        min-height: 65px;
        font-size: 30px;
      }

      .status-item {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="game-container">

    <section id="gameArea">

      <h1>🎮 正負數大挑戰</h1>

      <p class="description">
        在60秒內回答正負數加減法。<br>
        負數以括號表示，請使用下方按鍵輸入答案。
      </p>

      <div class="status-bar">

        <div id="timeBox" class="status-item">
          ⏱️ 時間<br>
          <span id="time">60</span>
        </div>

        <div class="status-item">
          ⭐ 分數<br>
          <span id="score">0</span>
        </div>

        <div class="status-item">
          🔥 連續答對<br>
          <span id="combo">0</span>
        </div>

      </div>

      <div id="question" class="question"></div>

      <div
        id="answerDisplay"
        class="answer-display"
        role="textbox"
        aria-label="目前輸入的答案"
        aria-live="polite"
      >
        請輸入答案
      </div>

      <div class="keypad" aria-label="答案輸入鍵盤">

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>

        <button
          id="plusButton"
          class="sign-button"
          type="button"
          aria-label="正號"
        >
          ＋
        </button>

        <button type="button" data-value="0">0</button>

        <button
          id="minusButton"
          class="sign-button"
          type="button"
          aria-label="負號"
        >
          －
        </button>

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          清除
        </button>

        <button
          id="backspaceButton"
          class="clear-button"
          type="button"
        >
          ⌫ 刪除
        </button>

        <button
          id="submitButton"
          class="submit-button"
          type="button"
        >
          送出
        </button>

      </div>

      <div
        id="feedback"
        class="feedback"
        aria-live="polite"
      ></div>

    </section>

    <section id="resultArea" class="result">

      <h2>🏆 挑戰結束</h2>

      <p>你的本次得分是：</p>

      <div id="finalScore" class="final-score">0</div>

      <p id="resultMessage"></p>

      <button
        id="restartButton"
        class="restart-button"
        type="button"
      >
        再玩一次
      </button>

    </section>

    <a class="back-link" href="../index.html">
      ← 回到遊戲首頁
    </a>

  </main>

  <script>
    const questionElement = document.getElementById("question");
    const answerDisplay = document.getElementById("answerDisplay");
    const submitButton = document.getElementById("submitButton");
    const feedbackElement = document.getElementById("feedback");

    const timeElement = document.getElementById("time");
    const timeBox = document.getElementById("timeBox");
    const scoreElement = document.getElementById("score");
    const comboElement = document.getElementById("combo");

    const gameArea = document.getElementById("gameArea");
    const resultArea = document.getElementById("resultArea");
    const finalScoreElement = document.getElementById("finalScore");
    const resultMessageElement =
      document.getElementById("resultMessage");

    const restartButton =
      document.getElementById("restartButton");

    const plusButton = document.getElementById("plusButton");
    const minusButton = document.getElementById("minusButton");
    const clearButton = document.getElementById("clearButton");
    const backspaceButton =
      document.getElementById("backspaceButton");

    const numberButtons =
      document.querySelectorAll("[data-value]");

    let number1 = 0;
    let number2 = 0;
    let correctAnswer = 0;

    let answerText = "";
    let score = 0;
    let combo = 0;
    let timeLeft = 60;
    let timer = null;
    let gameStarted = false;
    let gameOver = false;
    let acceptingAnswer = true;

    let audioContext = null;

    function randomInteger(min, max) {
      return Math.floor(
        Math.random() * (max - min + 1)
      ) + min;
    }

    /*
      負數統一加上括號：
      -5 顯示為 (-5)
      正數維持 5
    */
    function formatInteger(number) {
      if (number < 0) {
        return `(${number})`;
      }

      return String(number);
    }

    function createQuestion() {
      number1 = randomInteger(-20, 20);
      number2 = randomInteger(-20, 20);

      const operation = Math.random() < 0.5 ? "+" : "-";

      if (operation === "+") {
        correctAnswer = number1 + number2;
      } else {
        correctAnswer = number1 - number2;
      }

      questionElement.textContent =
        `${formatInteger(number1)} ` +
        `${operation} ` +
        `${formatInteger(number2)} = ?`;

      answerText = "";
      updateAnswerDisplay();
      acceptingAnswer = true;
      setKeypadDisabled(false);
    }

    function updateAnswerDisplay() {
      answerDisplay.textContent =
        answerText === "" ? "請輸入答案" : answerText;
    }

    function addDigit(digit) {
      if (!acceptingAnswer || gameOver) {
        return;
      }

      /*
        避免輸入過長，也避免出現 0005。
      */
      if (answerText.length >= 5) {
        return;
      }

      if (
        answerText === "0" ||
        answerText === "+0" ||
        answerText === "-0"
      ) {
        if (digit === "0") {
          return;
        }

        const sign =
          answerText.startsWith("-")
            ? "-"
            : answerText.startsWith("+")
              ? "+"
              : "";

        answerText = sign + digit;
      } else {
        answerText += digit;
      }

      updateAnswerDisplay();
    }

    function setSign(sign) {
      if (!acceptingAnswer || gameOver) {
        return;
      }

      if (answerText.startsWith("-")) {
        answerText = answerText.slice(1);
      } else if (answerText.startsWith("+")) {
        answerText = answerText.slice(1);
      }

      answerText = sign + answerText;
      updateAnswerDisplay();
    }

    function clearAnswer() {
      if (!acceptingAnswer || gameOver) {
        return;
      }

      answerText = "";
      updateAnswerDisplay();
    }

    function removeLastCharacter() {
      if (!acceptingAnswer || gameOver) {
        return;
      }

      answerText = answerText.slice(0, -1);
      updateAnswerDisplay();
    }

    function setKeypadDisabled(disabled) {
      numberButtons.forEach(function (button) {
        button.disabled = disabled;
      });

      plusButton.disabled = disabled;
      minusButton.disabled = disabled;
      clearButton.disabled = disabled;
      backspaceButton.disabled = disabled;
      submitButton.disabled = disabled;
    }

    /*
      手機瀏覽器通常禁止網頁一開啟就自動播放聲音，
      所以在學生第一次按按鈕時建立音訊系統。
    */
    function prepareAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone({
      frequency,
      duration,
      volume = 0.08,
      type = "sine",
      delay = 0
    }) {
      prepareAudio();

      if (!audioContext) {
        return;
      }

      const startTime = audioContext.currentTime + delay;
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(
        frequency,
        startTime
      );

      gainNode.gain.setValueAtTime(0.0001, startTime);

      gainNode.gain.exponentialRampToValueAtTime(
        volume,
        startTime + 0.02
      );

      gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + duration
      );

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.05);
    }

    function playCorrectSound() {
      /*
        柔和的上行和弦。
      */
      playTone({
        frequency: 523.25,
        duration: 0.22,
        volume: 0.07
      });

      playTone({
        frequency: 659.25,
        duration: 0.25,
        volume: 0.06,
        delay: 0.10
      });

      playTone({
        frequency: 783.99,
        duration: 0.28,
        volume: 0.055,
        delay: 0.20
      });
    }

    function playWrongSound() {
      /*
        柔和的下降音，不使用刺耳警報聲。
      */
      playTone({
        frequency: 392,
        duration: 0.22,
        volume: 0.055,
        type: "triangle"
      });

      playTone({
        frequency: 329.63,
        duration: 0.28,
        volume: 0.05,
        type: "triangle",
        delay: 0.14
      });
    }

    function playCountdownSound() {
      /*
        最後10秒短促提示；
        最後3秒音高更高、間隔感更明顯。
      */
      const frequency = timeLeft <= 3 ? 880 : 660;
      const duration = timeLeft <= 3 ? 0.16 : 0.10;
      const volume = timeLeft <= 3 ? 0.09 : 0.06;

      playTone({
        frequency,
        duration,
        volume,
        type: "square"
      });
    }

    function startGame() {
      if (gameStarted || gameOver) {
        return;
      }

      prepareAudio();
      gameStarted = true;

      timer = setInterval(function () {
        timeLeft -= 1;
        timeElement.textContent = timeLeft;

        if (timeLeft <= 10 && timeLeft > 0) {
          timeBox.classList.add("danger-time");
          playCountdownSound();
        }

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function checkAnswer() {
      if (
        gameOver ||
        !acceptingAnswer
      ) {
        return;
      }

      prepareAudio();

      if (
        answerText === "" ||
        answerText === "+" ||
        answerText === "-"
      ) {
        feedbackElement.textContent = "請先輸入完整答案。";
        feedbackElement.className = "feedback wrong";
        return;
      }

      startGame();

      acceptingAnswer = false;
      setKeypadDisabled(true);

      const studentAnswer = Number(answerText);

      if (studentAnswer === correctAnswer) {
        combo += 1;

        let gainedScore = 10;

        if (combo >= 5) {
          gainedScore = 20;
        } else if (combo >= 3) {
          gainedScore = 15;
        }

        score += gainedScore;

        feedbackElement.textContent =
          `答對了！獲得 ${gainedScore} 分`;

        feedbackElement.className = "feedback correct";

        playCorrectSound();
      } else {
        combo = 0;

        feedbackElement.textContent =
          `答錯了，正確答案是 ${correctAnswer}`;

        feedbackElement.className = "feedback wrong";

        playWrongSound();
      }

      scoreElement.textContent = score;
      comboElement.textContent = combo;

      setTimeout(function () {
        if (!gameOver) {
          feedbackElement.textContent = "";
          createQuestion();
        }
      }, 950);
    }

    function endGame() {
      gameOver = true;
      acceptingAnswer = false;

      clearInterval(timer);
      timer = null;

      setKeypadDisabled(true);
      timeElement.textContent = "0";
      timeBox.classList.remove("danger-time");

      gameArea.style.display = "none";
      resultArea.style.display = "block";

      finalScoreElement.textContent = score;

      if (score >= 200) {
        resultMessageElement.textContent =
          "太厲害了！你是正負數高手！";
      } else if (score >= 100) {
        resultMessageElement.textContent =
          "表現很棒，再挑戰一次一定會更高分！";
      } else {
        resultMessageElement.textContent =
          "繼續練習，你會越來越熟練！";
      }
    }

    function restartGame() {
      clearInterval(timer);

      score = 0;
      combo = 0;
      timeLeft = 60;
      gameStarted = false;
      gameOver = false;
      acceptingAnswer = true;

      scoreElement.textContent = "0";
      comboElement.textContent = "0";
      timeElement.textContent = "60";

      feedbackElement.textContent = "";
      timeBox.classList.remove("danger-time");

      gameArea.style.display = "block";
      resultArea.style.display = "none";

      createQuestion();
    }

    numberButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        prepareAudio();
        addDigit(button.dataset.value);
      });
    });

    plusButton.addEventListener("click", function () {
      prepareAudio();
      setSign("+");
    });

    minusButton.addEventListener("click", function () {
      prepareAudio();
      setSign("-");
    });

    clearButton.addEventListener("click", function () {
      prepareAudio();
      clearAnswer();
    });

    backspaceButton.addEventListener("click", function () {
      prepareAudio();
      removeLastCharacter();
    });

    submitButton.addEventListener("click", checkAnswer);
    restartButton.addEventListener("click", restartGame);

    /*
      電腦仍可直接使用實體鍵盤。
    */
    document.addEventListener("keydown", function (event) {
      if (gameOver) {
        return;
      }

      if (/^[0-9]$/.test(event.key)) {
        addDigit(event.key);
        return;
      }

      if (event.key === "-") {
        setSign("-");
        return;
      }

      if (event.key === "+") {
        setSign("+");
        return;
      }

      if (event.key === "Backspace") {
        removeLastCharacter();
        return;
      }

      if (event.key === "Escape") {
        clearAnswer();
        return;
      }

      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    createQuestion();
  </script>

</body>
</html>
