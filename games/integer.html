<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>正負整數大挑戰</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #fff8e1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      padding: 30px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #1565c0;
    }

    .description {
      margin-bottom: 22px;
      color: #555;
      line-height: 1.7;
    }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .status-item {
      padding: 12px 5px;
      background: #eef5ff;
      border-radius: 12px;
      color: #174a7e;
      font-weight: bold;
    }

    .danger-time {
      color: #c62828;
      background: #ffebee;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.06);
      }
    }

    .question {
      min-height: 80px;
      margin: 18px 0;
      font-size: 38px;
      font-weight: bold;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .answer-display {
      width: 100%;
      max-width: 260px;
      min-height: 62px;
      margin: 0 auto;
      padding: 12px 16px;
      border: 3px solid #90caf9;
      border-radius: 12px;
      background: white;
      color: #222;
      font-size: 28px;
      text-align: center;
      line-height: 32px;
      overflow-wrap: anywhere;
    }

    .keypad {
      width: 100%;
      max-width: 330px;
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .keypad button {
      min-height: 52px;
      margin: 0;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: #eef5ff;
      color: #174a7e;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .keypad button:hover,
    .keypad button:active {
      background: #dbeafe;
    }

    .keypad .sign-button {
      background: #fff3e0;
      color: #b45309;
    }

    .keypad .clear-button {
      background: #ffebee;
      color: #b91c1c;
    }

    .keypad .submit-button {
      background: #1565c0;
      color: white;
      font-size: 19px;
    }

    .keypad .submit-button:hover,
    .keypad .submit-button:active {
      background: #0d47a1;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .feedback {
      min-height: 35px;
      margin-top: 18px;
      font-size: 21px;
      font-weight: bold;
    }

    .correct {
      color: #2e7d32;
    }

    .wrong {
      color: #c62828;
    }

    .result {
      display: none;
    }

    .result h2 {
      color: #1565c0;
    }

    .final-score {
      margin: 20px 0;
      color: #f57c00;
      font-size: 44px;
      font-weight: bold;
    }

    #resultMessage {
      color: #444;
      line-height: 1.8;
    }

    #saveStatus {
      min-height: 28px;
      margin: 12px 0;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
    }

    .restart-button {
      padding: 13px 30px;
      border: none;
      border-radius: 12px;
      background: #1565c0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .restart-button:hover,
    .restart-button:active {
      background: #0d47a1;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #1565c0;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .game-container {
        padding: 22px 16px;
      }

      h1 {
        font-size: 28px;
      }

      .question {
        min-height: 65px;
        font-size: 30px;
      }

      .status-item {
        font-size: 14px;
      }

      .answer-display {
        font-size: 25px;
      }

      .keypad button {
        min-height: 50px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="game-container">

    <section id="gameArea">

      <h1>🎮 正負整數大挑戰</h1>

      <p class="description">
        在 60 秒內回答正負整數加減法。<br>
        負數以括號表示，請使用下方按鍵輸入答案。
      </p>

      <div class="status-bar">

        <div id="timeBox" class="status-item">
          ⏱️ 時間<br>
          <span id="time">60</span>
        </div>

        <div class="status-item">
          ⭐ 分數<br>
          <span id="score">0</span>
        </div>

        <div class="status-item">
          🔥 連續答對<br>
          <span id="combo">0</span>
        </div>

      </div>

      <div
        id="question"
        class="question"
        aria-live="polite"
      ></div>

      <div
        id="answerDisplay"
        class="answer-display"
        role="textbox"
        aria-label="目前輸入的答案"
        aria-live="polite"
      >
        請輸入答案
      </div>

      <div
        class="keypad"
        aria-label="答案輸入鍵盤"
      >

        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>

        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
        <button type="button" data-value="6">6</button>

        <button type="button" data-value="7">7</button>
        <button type="button" data-value="8">8</button>
        <button type="button" data-value="9">9</button>

        <button
          id="plusButton"
          class="sign-button"
          type="button"
          aria-label="輸入正號"
        >
          ＋
        </button>

        <button type="button" data-value="0">0</button>

        <button
          id="minusButton"
          class="sign-button"
          type="button"
          aria-label="輸入負號"
        >
          －
        </button>

        <button
          id="clearButton"
          class="clear-button"
          type="button"
        >
          清除
        </button>

        <button
          id="backspaceButton"
          class="clear-button"
          type="button"
          aria-label="刪除最後一個字元"
        >
          ⌫ 刪除
        </button>

        <button
          id="submitButton"
          class="submit-button"
          type="button"
        >
          送出
        </button>

      </div>

      <div
        id="feedback"
        class="feedback"
        aria-live="polite"
      ></div>

    </section>

    <section
      id="resultArea"
      class="result"
      aria-live="polite"
    >

      <h2>🏆 挑戰結束</h2>

      <p>你的本次得分是：</p>

      <div id="finalScore" class="final-score">
        0
      </div>

      <p id="resultMessage"></p>

      <button
        id="restartButton"
        class="restart-button"
        type="button"
      >
        再玩一次
      </button>

    </section>

    <a
      class="back-link"
      href="../index.html"
    >
      ← 回到遊戲首頁
    </a>

  </main>

  <script
    type="module"
    src="../js/integer-game.js"
  ></script>

</body>
</html>
