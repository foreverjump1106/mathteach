<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    遊戲排行榜｜數學遊戲樂園
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --primary:
        #1565c0;

      --primary-dark:
        #0d47a1;

      --primary-light:
        #e3f2fd;

      --border:
        #90caf9;

      --text:
        #1f2937;

      --muted:
        #64748b;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--text);

      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #fff8e1
        );
    }


    button,
    select,
    a {

      font-family: inherit;

      -webkit-tap-highlight-color:
        transparent;
    }


    .container {

      width: 100%;

      max-width:
        980px;

      margin:
        0 auto;
    }


    /*
    ==================================================
    標題
    ==================================================
    */

    .header {

      margin-bottom:
        22px;

      padding:
        28px 20px;

      border-radius:
        24px;

      background:
        white;

      text-align:
        center;

      box-shadow:
        0 12px 30px
        rgba(
          0,
          0,
          0,
          .12
        );
    }


    h1 {

      margin:
        0 0 10px;

      color:
        var(--primary);

      font-size:
        36px;
    }


    .subtitle {

      margin:
        0;

      color:
        #666;

      line-height:
        1.8;
    }


    .ranking-rule {

      margin:
        14px auto 0;

      padding:
        10px 14px;

      width:
        fit-content;

      max-width:
        100%;

      border-radius:
        12px;

      background:
        #f8fafc;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        800;

      line-height:
        1.7;
    }


    .user-box {

      margin-top:
        18px;

      padding:
        12px;

      border-radius:
        12px;

      background:
        #eef5ff;

      color:
        #174a7e;

      font-weight:
        900;
    }


    /*
    ==================================================
    學期
    ==================================================
    */

    .semester-card {

      margin-bottom:
        18px;

      padding:
        18px;

      border-radius:
        20px;

      background:
        white;

      box-shadow:
        0 8px 22px
        rgba(
          15,
          23,
          42,
          .08
        );
    }


    .semester-control {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        10px;

      flex-wrap:
        wrap;
    }


    .semester-control label {

      color:
        #334155;

      font-weight:
        900;
    }


    .semester-select {

      min-width:
        220px;

      min-height:
        46px;

      padding:
        8px 14px;

      border:
        2px solid
        var(--border);

      border-radius:
        12px;

      background:
        white;

      color:
        var(--primary-dark);

      font-size:
        16px;

      font-weight:
        900;

      outline:
        none;
    }


    .semester-select:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 4px
        rgba(
          21,
          101,
          192,
          .10
        );
    }


    /*
    ==================================================
    遊戲篩選
    ==================================================
    */

    .filter-card {

      margin-bottom:
        20px;

      padding:
        18px;

      border-radius:
        20px;

      background:
        white;

      box-shadow:
        0 8px 22px
        rgba(
          15,
          23,
          42,
          .08
        );
    }


    .filter-title {

      margin:
        0 0 14px;

      color:
        #334155;

      text-align:
        center;

      font-size:
        18px;

      font-weight:
        900;
    }


    .filter-box {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap:
        10px;
    }


    .filter-button {

      min-height:
        56px;

      padding:
        10px 12px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        14px;

      background:
        white;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        900;

      line-height:
        1.45;

      cursor:
        pointer;

      transition:
        .15s ease;
    }


    .filter-button:hover {

      transform:
        translateY(
          -2px
        );

      border-color:
        var(--primary);

      color:
        var(--primary);
    }


    .filter-button.active {

      border-color:
        var(--primary);

      background:
        var(--primary);

      color:
        white;

      box-shadow:
        0 5px 12px
        rgba(
          21,
          101,
          192,
          .22
        );
    }


    .filter-button.all-button {

      grid-column:
        1 /
        -1;

      min-height:
        48px;
    }


    /*
    ==================================================
    排行榜主卡
    ==================================================
    */

    .leaderboard-card {

      overflow:
        hidden;

      padding:
        20px;

      border-radius:
        24px;

      background:
        white;

      box-shadow:
        0 12px 30px
        rgba(
          0,
          0,
          0,
          .12
        );
    }


    .loading,
    .empty-message,
    .error-message {

      padding:
        45px 20px;

      text-align:
        center;

      font-size:
        18px;

      line-height:
        1.8;
    }


    .loading {

      color:
        var(--primary);
    }


    .empty-message {

      color:
        #666;
    }


    .error-message {

      color:
        #c62828;
    }


    .leaderboard-list {

      margin: 0;

      padding: 0;

      list-style:
        none;
    }


    /*
    ==================================================
    每一款遊戲
    ==================================================
    */

    .leaderboard-game-section {

      margin:
        0 0 28px;

      padding:
        0;

      list-style:
        none;
    }


    .leaderboard-game-section:last-child {

      margin-bottom:
        0;
    }


    .leaderboard-game-title {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      margin:
        0 0 14px;

      padding:
        13px 16px;

      border-radius:
        14px;

      background:
        #eff6ff;

      color:
        #1d4ed8;

      font-size:
        21px;

      font-weight:
        900;
    }


    .leaderboard-game-icon {

      font-size:
        25px;
    }


    /*
    ==================================================
    模式
    ==================================================
    */

    .leaderboard-mode-tabs {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin:
        0 0 14px;
    }


    .leaderboard-mode-tab {

      min-height:
        42px;

      padding:
        9px 14px;

      border:
        2px solid
        #cbd5e1;

      border-radius:
        12px;

      background:
        white;

      color:
        #475569;

      font-size:
        14px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .leaderboard-mode-tab.active {

      border-color:
        #2563eb;

      background:
        #2563eb;

      color:
        white;
    }


    .leaderboard-mode-content[hidden] {

      display:
        none !important;
    }


    .leaderboard-mode-heading,
    .leaderboard-single-title {

      margin:
        0 0 10px;

      color:
        #334155;

      font-size:
        17px;

      font-weight:
        900;
    }


    /*
    ==================================================
    空排行榜
    ==================================================
    */

    .leaderboard-mode-empty {

      margin:
        8px 0 18px;

      padding:
        25px 15px;

      border:
        2px dashed
        #cbd5e1;

      border-radius:
        14px;

      background:
        #f8fafc;

      color:
        #64748b;

      text-align:
        center;

      font-size:
        15px;

      font-weight:
        800;

      line-height:
        1.7;
    }


    /*
    ==================================================
    排名
    ==================================================
    */

    .leaderboard-ranking-list {

      display:
        grid;

      gap:
        10px;

      margin:
        0;

      padding:
        0;

      list-style:
        none;
    }


    .leaderboard-item {

      display:
        grid;

      grid-template-columns:
        68px 1fr 105px;

      gap:
        12px;

      align-items:
        center;

      padding:
        15px 16px;

      border:
        1px solid
        #e2e8f0;

      border-radius:
        14px;

      background:
        white;
    }


    .leaderboard-item.current-user {

      border:
        2px solid
        #ffb300;

      background:
        #fff8e1;
    }


    .rank {

      text-align:
        center;

      font-size:
        23px;

      font-weight:
        900;
    }


    .player-info {

      min-width:
        0;
    }


    .player-name {

      margin-bottom:
        4px;

      overflow:
        hidden;

      color:
        #1f2937;

      font-size:
        17px;

      font-weight:
        900;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }


    .record-detail {

      color:
        #64748b;

      font-size:
        13px;

      font-weight:
        700;

      line-height:
        1.6;
    }


    .leaderboard-play-duration {

      color:
        #0f766e;

      font-weight:
        900;
    }


    .record-date {

      color:
        #94a3b8;

      font-size:
        12px;
    }


    .score {

      text-align:
        right;

      color:
        #f57c00;

      font-size:
        25px;

      font-weight:
        900;
    }


    .score-label {

      color:
        #888;

      font-size:
        12px;

      font-weight:
        normal;
    }


    /*
    ==================================================
    底部
    ==================================================
    */

    .footer-actions {

      display:
        flex;

      justify-content:
        center;

      gap:
        12px;

      margin-top:
        24px;

      flex-wrap:
        wrap;
    }


    .action-link {

      display:
        inline-block;

      padding:
        12px 22px;

      border-radius:
        12px;

      background:
        var(--primary);

      color:
        white;

      text-decoration:
        none;

      font-weight:
        900;
    }


    .action-link.secondary {

      background:
        #607d8b;
    }


    /*
    ==================================================
    手機
    ==================================================
    */

    @media (
      max-width:
        760px
    ) {

      body {

        padding:
          12px;
      }


      h1 {

        font-size:
          29px;
      }


      .filter-box {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );
      }


      .leaderboard-card {

        padding:
          14px 10px;
      }


      .leaderboard-item {

        grid-template-columns:
          50px 1fr 75px;

        gap:
          8px;

        padding:
          13px 9px;
      }


      .rank {

        font-size:
          20px;
      }


      .player-name {

        font-size:
          15px;
      }


      .score {

        font-size:
          20px;
      }
    }


    @media (
      max-width:
        480px
    ) {

      .semester-control {

        display:
          grid;

        grid-template-columns:
          1fr;
      }


      .semester-control label {

        text-align:
          center;
      }


      .semester-select {

        width:
          100%;

        min-width:
          0;
      }


      .filter-box {

        grid-template-columns:
          1fr 1fr;
      }


      .filter-button {

        min-height:
          54px;

        padding:
          8px;

        font-size:
          13px;
      }


      .leaderboard-game-title {

        font-size:
          18px;
      }


      .leaderboard-mode-tab {

        flex:
          1 1
          calc(
            50% - 8px
          );

        font-size:
          12px;
      }


      .record-date {

        display:
          none;
      }


      .footer-actions {

        display:
          grid;

        grid-template-columns:
          1fr;
      }


      .action-link {

        text-align:
          center;
      }
    }

  </style>

</head>


<body>


  <main class="container">


    <!-- 標題 -->

    <header class="header">

      <h1>
        🏆 遊戲排行榜
      </h1>

      <p class="subtitle">

        查看各學期、各遊戲的高手排行。<br>

        每一個排行榜最多顯示前 20 名。

      </p>


      <div class="ranking-rule">

        固定題數遊戲：
        分數較高優先，同分時完成時間較短者優先。

      </div>


      <div
        id="userStatus"
        class="user-box"
      >

        正在確認登入狀態……

      </div>

    </header>


    <!-- 學期 -->

    <section class="semester-card">

      <div class="semester-control">

        <label for="semesterSelect">

          📚 選擇學期

        </label>


        <select
          id="semesterSelect"
          class="semester-select"
        >

          <option value="grade7-first">
            七年級上學期
          </option>

          <option value="grade7-second">
            七年級下學期
          </option>

          <option value="grade8-first">
            八年級上學期
          </option>

        </select>

      </div>

    </section>


    <!-- 遊戲卡片 -->

    <section class="filter-card">

      <h2
        id="filterTitle"
        class="filter-title"
      >

        七年級上學期排行榜

      </h2>


      <nav
        id="filterBox"
        class="filter-box"
        aria-label="排行榜遊戲篩選"
      ></nav>

    </section>


    <!-- 排行榜 -->

    <section class="leaderboard-card">


      <div
        id="loadingMessage"
        class="loading"
      >

        排行榜載入中……

      </div>


      <div
        id="errorMessage"
        class="error-message"
        hidden
      ></div>


      <div
        id="emptyMessage"
        class="empty-message"
        hidden
      >

        目前還沒有成績紀錄。

      </div>


      <ol
        id="leaderboardList"
        class="leaderboard-list"
      ></ol>


    </section>


    <!-- 底部 -->

    <div class="footer-actions">


      <a
        class="action-link"
        href="index.html"
      >

        🎮 選擇遊戲

      </a>


      <a
        class="action-link secondary"
        href="my-scores.html"
      >

        📊 我的成績

      </a>


      <a
        class="action-link secondary"
        href="index.html"
      >

        ← 回到首頁

      </a>


    </div>


  </main>


  <script
    type="module"
    src="js/leaderboard.js?v=7.0"
  ></script>


</body>

</html>
