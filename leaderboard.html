<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>遊戲排行榜｜數學遊戲樂園</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #e3f2fd,
          #fff8e1
        );
      color: #333;
    }

    button,
    a {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
      padding: 28px 20px;
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow:
        0 12px 30px
        rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      color: #1565c0;
      font-size: 36px;
    }

    .subtitle {
      margin: 0;
      color: #666;
      line-height: 1.7;
    }

    .user-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: #eef5ff;
      color: #174a7e;
      font-weight: bold;
    }

    .filter-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-button {
      min-height: 44px;
      padding: 10px 17px;
      border: 2px solid #1565c0;
      border-radius: 999px;
      background: white;
      color: #1565c0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
    }

    .filter-button:hover {
      transform: translateY(-2px);
    }

    .filter-button.active,
    .filter-button:hover {
      background: #1565c0;
      color: white;
    }

    .leaderboard-card {
      overflow: hidden;
      border-radius: 24px;
      background: white;
      box-shadow:
        0 12px 30px
        rgba(0, 0, 0, 0.12);
    }

    .loading,
    .empty-message,
    .error-message {
      padding: 45px 20px;
      text-align: center;
      font-size: 18px;
      line-height: 1.8;
    }

    .loading {
      color: #1565c0;
    }

    .empty-message {
      color: #666;
    }

    .error-message {
      color: #c62828;
    }

    .leaderboard-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .leaderboard-item {
      display: grid;
      grid-template-columns:
        70px 1fr 120px;
      gap: 12px;
      align-items: center;
      padding: 17px 20px;
      border-bottom:
        1px solid #eeeeee;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-item.current-user {
      background: #fff8e1;
      border-left:
        6px solid #ffb300;
    }

    .rank {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .player-info {
      min-width: 0;
    }

    .player-name {
      margin-bottom: 5px;
      overflow: hidden;
      color: #333;
      font-size: 18px;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-name {
      margin-bottom: 4px;
      color: #1565c0;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .play-time {
      color: #777;
      font-size: 13px;
    }

    .score {
      text-align: right;
      color: #f57c00;
      font-size: 24px;
      font-weight: bold;
    }

    .score-label {
      color: #888;
      font-size: 13px;
      font-weight: normal;
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .action-link {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: #1565c0;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .action-link.secondary {
      background: #607d8b;
    }

    .action-link:hover {
      opacity: 0.9;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 29px;
      }

      .header {
        padding: 24px 16px;
      }

      .filter-box {
        gap: 8px;
      }

      .filter-button {
        padding: 9px 13px;
        font-size: 14px;
      }

      .leaderboard-item {
        grid-template-columns:
          52px 1fr 78px;
        padding: 15px 12px;
      }

      .rank {
        font-size: 21px;
      }

      .player-name {
        font-size: 16px;
      }

      .score {
        font-size: 21px;
      }
    }

    @media (max-width: 480px) {
      .filter-box {
        display: grid;
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .filter-button {
        width: 100%;
        border-radius: 13px;
      }

      .leaderboard-item {
        grid-template-columns:
          44px 1fr 64px;
        gap: 8px;
        padding: 14px 8px;
      }

      .rank {
        font-size: 19px;
      }

      .player-name {
        font-size: 15px;
      }

      .game-name {
        font-size: 12px;
      }

      .play-time {
        display: none;
      }

      .score {
        font-size: 19px;
      }

      .footer-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .action-link {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <h1>🏆 遊戲排行榜</h1>

      <p class="subtitle">
        查看各項數學遊戲的高手成績。<br>
        每個排行榜顯示分數最高的前 20 筆紀錄。
      </p>

      <div
        id="userStatus"
        class="user-box"
      >
        正在確認登入狀態……
      </div>

    </header>

    <nav
      class="filter-box"
      aria-label="排行榜遊戲篩選"
    >

      <button
        class="filter-button active"
        type="button"
        data-game="all"
      >
        全部遊戲
      </button>

      <button
        class="filter-button"
        type="button"
        data-game="integer"
      >
        正負整數
      </button>

      <button
        class="filter-button"
        type="button"
        data-game="compare"
      >
        數的大小比較
      </button>

      <button
        class="filter-button"
        type="button"
        data-game="fraction"
      >
        正負分數加減
      </button>

      <button
        class="filter-button"
        type="button"
        data-game="equation"
      >
        一元一次方程式
      </button>

    </nav>

    <section class="leaderboard-card">

      <div
        id="loadingMessage"
        class="loading"
      >
        排行榜載入中……
      </div>

      <div
        id="errorMessage"
        class="error-message"
        hidden
      ></div>

      <div
        id="emptyMessage"
        class="empty-message"
        hidden
      >
        這個遊戲目前還沒有成績紀錄。
      </div>

      <ol
        id="leaderboardList"
        class="leaderboard-list"
      ></ol>

    </section>

    <div class="footer-actions">

      <a
        class="action-link"
        href="index.html"
      >
        🎮 選擇遊戲
      </a>

      <a
        class="action-link secondary"
        href="my-scores.html"
      >
        📊 我的成績
      </a>

      <a
        class="action-link secondary"
        href="index.html"
      >
        ← 回到首頁
      </a>

    </div>

  </main>

  <script
    type="module"
    src="js/leaderboard.js"
  ></script>

</body>
</html>
