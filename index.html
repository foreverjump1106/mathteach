<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>數學遊戲樂園</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #1976d2;
      --primary-dark: #125ca6;
      --background: #edf4ff;
      --card-background: #ffffff;
      --text: #1f2937;
      --muted: #5f6b7a;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          135deg,
          #edf4ff,
          #f7faff
        );
    }

    a,
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 42px 28px 60px;
    }

    .page-header {
      margin-bottom: 34px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 12px;
      color: #174f8f;
      font-size: 40px;
    }

    .page-header > p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .login-section {
      margin-top: 25px;
    }

    .user-section {
      display: none;
      margin-top: 18px;
    }

    .welcome-text {
      margin: 0 0 14px;
      color: #174f8f;
      font-size: 18px;
      font-weight: bold;
    }

    .login-message {
      min-height: 24px;
      margin: 14px 0 0;
      color: #c62828;
      font-size: 15px;
    }

    .games-section-title {
      margin: 0 0 22px;
      font-size: 27px;
    }

    .games-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .game-card {
      min-height: 280px;
      padding: 32px 26px;
      border-radius: 22px;
      background: var(--card-background);
      box-shadow:
        0 10px 28px rgba(31, 41, 55, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 14px 34px rgba(31, 41, 55, 0.16);
    }

    .game-icon {
      margin-bottom: 12px;
      font-size: 42px;
      line-height: 1;
    }

    .game-card h2 {
      margin: 0 0 13px;
      color: var(--text);
      font-size: 24px;
    }

    .game-card p {
      min-height: 56px;
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .game-button {
      min-width: 132px;
      padding: 13px 24px;
      border: none;
      border-radius: 11px;
      background: var(--primary);
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 5px 0 var(--primary-dark);
      transition:
        transform 0.1s ease,
        box-shadow 0.1s ease,
        background 0.15s ease;
    }

    .game-button:hover {
      background: var(--primary-dark);
    }

    .game-button:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 var(--primary-dark);
    }

    .game-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .logout-button {
      background: #e53935;
      box-shadow:
        0 5px 0 #b71c1c;
    }

    .logout-button:hover {
      background: #c62828;
    }

    .waiting-button {
      background: #7b8794;
      box-shadow:
        0 5px 0 #56616d;
      opacity: 0.72;
      cursor: not-allowed;
    }

    .waiting-button:hover {
      background: #7b8794;
    }

    .page-footer {
      margin-top: 38px;
      color: #748094;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .page-container {
        padding: 28px 15px 45px;
      }

      .page-header {
        margin-bottom: 28px;
      }

      .page-header h1 {
        font-size: 31px;
      }

      .page-header > p {
        font-size: 16px;
      }

      .games-section-title {
        font-size: 23px;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .game-card {
        min-height: 235px;
        padding: 27px 18px;
      }

      .game-card h2 {
        font-size: 22px;
      }

      .game-card p {
        min-height: auto;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page-container">

    <header class="page-header">

      <h1>🎮 數學遊戲樂園</h1>

      <p>
        透過遊戲練習數學觀念，<br>
        一起挑戰更高分！
      </p>

      <div class="login-section">

        <button
          id="loginBtn"
          class="game-button"
          type="button"
        >
          🔐 使用 Google 登入
        </button>

        <div
          id="userSection"
          class="user-section"
        >
          <p
            id="welcomeText"
            class="welcome-text"
          >
          </p>

          <button
            id="logoutBtn"
            class="game-button logout-button"
            type="button"
          >
            登出
          </button>
        </div>

        <p
          id="loginMessage"
          class="login-message"
        >
        </p>

      </div>

    </header>

    <section>

      <h2 class="games-section-title">
        選擇一個遊戲
      </h2>

      <div class="games-grid">

        <article class="game-card">

          <div class="game-icon">🎮</div>

          <h2>正負數大挑戰</h2>

          <p>
            七年級正負數加減法，
            挑戰計算速度與正確率。
          </p>

          <a
            class="game-button"
            href="games/integer.html"
          >
            開始挑戰
          </a>

        </article>

        <article class="game-card">

          <div class="game-icon">⚖️</div>

          <h2>數的大小比較王</h2>

          <p>
            挑戰整數、分數與小數的大小比較，
            選出正確的 ＞、＝或＜。
          </p>

          <a
            class="game-button"
            href="games/compare.html"
          >
            開始挑戰
          </a>

        </article>

        <article class="game-card">

          <div class="game-icon">🧮</div>

          <h2>一元一次方程式</h2>

          <p>
            解方程式闖關，
            練習移項與等量公理。
          </p>

          <button
            class="game-button waiting-button"
            type="button"
            disabled
          >
            敬請期待
          </button>

        </article>

        <article class="game-card">

          <div class="game-icon">📐</div>

          <h2>比例式</h2>

          <p>
            練習比例式判斷與計算，
            建立正確的比例概念。
          </p>

          <button
            class="game-button waiting-button"
            type="button"
            disabled
          >
            敬請期待
          </button>

        </article>

      </div>

    </section>

    <footer class="page-footer">
      數學有解，生活也有解。
    </footer>

  </main>

  <script type="module">
    import {
      login,
      logout
    } from "./js/auth.js";

    import {
      auth
    } from "./js/firebase-config.js";

    import {
      createOrUpdatePlayer
    } from "./js/firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const loginButton =
      document.getElementById("loginBtn");

    const logoutButton =
      document.getElementById("logoutBtn");

    const userSection =
      document.getElementById("userSection");

    const welcomeText =
      document.getElementById("welcomeText");

    const loginMessage =
      document.getElementById("loginMessage");

    loginButton.addEventListener(
      "click",
      async () => {
        loginMessage.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "登入中……";

        try {
          await login();
        } catch (error) {
          console.error("登入失敗：", error);

          loginMessage.textContent =
            "登入沒有完成，請稍後再試一次。";
        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "🔐 使用 Google 登入";
        }
      }
    );

    logoutButton.addEventListener(
      "click",
      async () => {
        loginMessage.textContent = "";
        logoutButton.disabled = true;
        logoutButton.textContent = "登出中……";

        try {
          await logout();
        } catch (error) {
          console.error("登出失敗：", error);

          loginMessage.textContent =
            "登出失敗，請稍後再試一次。";
        } finally {
          logoutButton.disabled = false;
          logoutButton.textContent = "登出";
        }
      }
    );

    onAuthStateChanged(
      auth,
      async (user) => {
        if (user) {
          const userName =
            user.displayName ||
            user.email ||
            "玩家";

          welcomeText.textContent =
            "正在建立玩家資料……";

          loginButton.style.display = "none";
          userSection.style.display = "block";
          loginMessage.textContent = "";

          try {
            await createOrUpdatePlayer(user);

            welcomeText.textContent =
              `👋 歡迎回來，${userName}！`;
          } catch (error) {
            console.error(
              "建立或更新玩家資料失敗：",
              error
            );

            welcomeText.textContent =
              `👋 歡迎回來，${userName}！`;

            loginMessage.textContent =
              "登入成功，但玩家資料暫時無法儲存。";
          }
        } else {
          welcomeText.textContent = "";

          loginButton.style.display = "inline-block";
          userSection.style.display = "none";
          loginMessage.textContent = "";
        }
      }
    );
  </script>

</body>
</html>
