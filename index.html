<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>生活有解．心中有數</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #1976d2;
      --primary-dark: #125ca6;
      --secondary: #f57c00;
      --secondary-dark: #d86600;
      --success: #2e7d32;
      --success-dark: #1b5e20;
      --danger: #e53935;
      --danger-dark: #b71c1c;
      --background: #edf4ff;
      --card-background: #ffffff;
      --text: #1f2937;
      --muted: #5f6b7a;
      --border: #dce7f5;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          135deg,
          #e8f2ff,
          #fff8e8
        );
    }

    a,
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 28px 60px;
    }

    .button {
      display: inline-block;
      min-width: 132px;
      padding: 13px 24px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 5px 0 var(--primary-dark);
      transition:
        transform 0.1s ease,
        box-shadow 0.1s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .button:hover {
      background: var(--primary-dark);
    }

    .button:active {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 var(--primary-dark);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .section {
      margin-top: 36px;
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0;
      color: var(--text);
      font-size: 28px;
    }

    .section-description {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .games-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .game-card {
      position: relative;
      min-height: 225px;
      padding: 26px 22px 22px;
      overflow: hidden;
      border: 2px solid var(--game-border, #dce7f5);
      border-top: 8px solid var(--game-primary, var(--primary));
      border-radius: 22px;
      background:
        linear-gradient(
          180deg,
          var(--game-light, #ffffff) 0%,
          #ffffff 72%
        );
      box-shadow:
        0 10px 28px rgba(31, 41, 55, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 14px 34px rgba(31, 41, 55, 0.16);
    }

    .game-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 10px;
    }

    .game-icon {
      display: flex;
      width: 58px;
      height: 58px;
      margin: 0;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 2px solid var(--game-border, #dce7f5);
      border-radius: 18px;
      background: var(--game-light, #eef5ff);
      color: var(--game-primary, var(--primary));
      font-size: 30px;
      line-height: 1;
      box-shadow:
        0 5px 14px rgba(31, 41, 55, 0.08);
    }

    .game-card h2 {
      margin: 0;
      color: var(--text);
      font-size: 23px;
    }

    .game-card p {
      min-height: 48px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .game-meta {
      display: flex;
      min-height: 31px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 14px;
      flex-wrap: wrap;
    }

    .game-meta-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid var(--game-border, #dce7f5);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--game-primary, var(--primary));
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }

    .game-meta-badge.recommended {
      border-color: #fdba74;
      background: #fff7ed;
      color: #c2410c;
    }

    .game-meta-badge.new {
      border-color: #86efac;
      background: #f0fdf4;
      color: #15803d;
    }

    .game-meta-badge.difficulty {
      letter-spacing: 1px;
    }

    .start-button {
      background: var(--game-primary, var(--primary));
      box-shadow:
        0 5px 0 var(--game-dark, var(--primary-dark));
    }

    .start-button:hover {
      background: var(--game-dark, var(--primary-dark));
    }

    .waiting-button {
      background: #7b8794;
      box-shadow:
        0 5px 0 #56616d;
      opacity: 0.72;
      cursor: not-allowed;
    }

    .waiting-button:hover {
      background: #7b8794;
    }

    .page-footer {
      margin-top: 42px;
      padding: 20px 10px 0;
      color: #748094;
      font-size: 14px;
      text-align: center;
    }

    .semester-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 24px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.78);
      box-shadow:
        0 8px 22px rgba(31,41,55,0.08);
    }

    .semester-control label {
      color: #174f8f;
      font-size: 17px;
      font-weight: 800;
    }

    .semester-select {
      min-width: 230px;
      padding: 12px 44px 12px 16px;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    .semester-select:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 4px rgba(25,118,210,0.14);
    }

    .semester-panel {
      display: none;
    }

    .semester-panel.active {
      display: block;
    }

    .semester-title {
      margin: 0 0 18px;
      color: #174f8f;
      font-size: 24px;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
    }

    .status-soon {
      background: #f1f5f9;
      color: #64748b;
    }

    .dashboard {
      display: grid;
      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(320px, 0.95fr);
      gap: 18px;
      margin-bottom: 22px;
      padding: 20px;
      border-radius: 24px;
      background: rgba(255,255,255,0.92);
      box-shadow:
        0 12px 30px rgba(15,23,42,0.10);
    }

    .dashboard-brand {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .dashboard-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .dashboard-logo {
      font-size: 40px;
      line-height: 1;
    }

    .dashboard-title {
      margin: 0;
      color: #174f8f;
      font-size:
        clamp(28px, 3vw, 38px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .dashboard-subtitle {
      margin: 0 0 14px 52px;
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
    }

    .compact-user-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 2px;
      padding: 12px 14px;
      border: 1px solid #cfe0f7;
      border-radius: 16px;
      background: #f4f8ff;
      color: #174a7e;
      min-height: 68px;
    }

    .compact-user-box .user-photo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      background: white;
      border: 2px solid #dbeafe;
    }

    .compact-user-text {
      min-width: 0;
      line-height: 1.45;
    }

    .compact-user-name {
      color: #174f8f;
      font-weight: 900;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-user-email {
      color: #64748b;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-auth-actions {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .compact-auth-button {
      min-width: 112px;
      padding: 10px 18px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 4px 0 rgba(0,0,0,0.16);
    }

    .compact-login-button {
      background: #1976d2;
    }

    .compact-logout-button {
      background: #ef4444;
    }

    .dashboard-links {
      display: grid;
      grid-template-rows:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .dashboard-link-card {
      display: grid;
      grid-template-columns:
        58px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 82px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .dashboard-link-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 20px rgba(15,23,42,0.08);
    }

    .dashboard-link-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      font-size: 30px;
    }

    .dashboard-link-icon.rank {
      background: #fff3db;
    }

    .dashboard-link-icon.scores {
      background: #eaf7ec;
    }

    .dashboard-link-title {
      margin-bottom: 4px;
      color: #174f8f;
      font-size: 19px;
      font-weight: 900;
    }

    .dashboard-link-text {
      color: #64748b;
      font-size: 14px;
      line-height: 1.55;
    }


    /*
    ==================================================
    公告欄＋最新消息
    ==================================================
    */

    .news-area {
      margin-top: 22px;
    }

    .announcement-board {
      position: relative;
      overflow: hidden;
      padding: 22px 24px;
      border: 2px solid #f7c66a;
      border-radius: 22px;
      background:
        linear-gradient(
          135deg,
          #fff8df,
          #fffdf6
        );
      box-shadow:
        0 10px 26px rgba(120, 72, 0, 0.10);
    }

    .announcement-board::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: #f59e0b;
    }

    .announcement-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .announcement-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: #92400e;
      font-size: 23px;
      font-weight: 900;
    }

    .announcement-date {
      color: #9a6b24;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .announcement-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      margin-bottom: 10px;
      border: 1px solid #fdba74;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-size: 13px;
      font-weight: 900;
    }

    .announcement-title {
      margin: 0 0 8px;
      color: #7c2d12;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.45;
    }

    .announcement-content {
      margin: 0;
      color: #6b4f2b;
      font-size: 16px;
      line-height: 1.8;
    }

    .latest-news-box {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid #dbe7f5;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow:
        0 10px 26px rgba(15, 23, 42, 0.08);
    }

    .latest-news-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .latest-news-title {
      margin: 0;
      color: #174f8f;
      font-size: 22px;
      font-weight: 900;
    }

    .latest-news-subtitle {
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .latest-news-list {
      display: grid;
      gap: 10px;
    }

    .news-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      background: #ffffff;
    }

    .news-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 22px;
    }

    .news-main {
      min-width: 0;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .news-type {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .news-type.new-game {
      background: #ecfdf5;
      color: #047857;
    }

    .news-type.system {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .news-type.game-update {
      background: #f5f3ff;
      color: #6d28d9;
    }

    .news-type.notice {
      background: #fff7ed;
      color: #c2410c;
    }

    .news-item-title {
      color: #1f2937;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.45;
    }

    .news-item-content {
      margin-top: 3px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.55;
    }

    .news-date {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .news-empty {
      padding: 20px;
      color: #64748b;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }


    @media (max-width: 760px) {

      .dashboard {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      .dashboard-subtitle {
        margin-left: 0;
      }

      .dashboard-links {
        grid-template-columns:
          1fr 1fr;

        grid-template-rows:
          none;
      }

      .dashboard-link-card {
        grid-template-columns:
          46px 1fr;

        min-height: 74px;
        padding: 12px;
      }

      .dashboard-link-icon {
        width: 46px;
        height: 46px;
        font-size: 24px;
      }

      .dashboard-link-title {
        font-size: 16px;
      }

      .dashboard-link-text {
        font-size: 12px;
      }

      .page-container {
        padding: 18px 14px 45px;
      }

      .semester-control {
        flex-direction: column;
        align-items: stretch;
      }

      .semester-control label {
        text-align: center;
      }

      .semester-select {
        width: 100%;
        min-width: 0;
      }

      .section-header {
        display: block;
      }

      .section-title {
        font-size: 24px;
      }

      .section-description {
        margin-top: 7px;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .game-card {
        min-height: 190px;
        padding: 20px 16px;
      }

      .game-card h2 {
        font-size: 22px;
      }

      .game-card p {
        min-height: auto;
        font-size: 16px;
      }
    }


      .announcement-board {
        padding: 18px 16px 18px 20px;
      }

      .announcement-top,
      .latest-news-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .announcement-heading,
      .latest-news-title {
        font-size: 20px;
      }

      .announcement-title {
        font-size: 19px;
      }

      .news-item {
        grid-template-columns: 40px 1fr;
      }

      .news-date {
        grid-column: 2;
      }


    @media (max-width: 520px) {

      .dashboard-title-row {
        justify-content: center;
      }

      .dashboard-title {
        font-size: 28px;
      }

      .dashboard-subtitle {
        text-align: center;
      }

      .dashboard-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="page-container">

    <section
      class="dashboard"
      aria-label="網站資訊與快捷功能"
    >

      <div class="dashboard-brand">

        <div class="dashboard-title-row">

          <div class="dashboard-logo">
            🎮
          </div>

          <h1 class="dashboard-title">
            生活有解．心中有數
          </h1>

        </div>

        <p class="dashboard-subtitle">
          一步一題，累積實力；生活有解，心中有數。
        </p>

        <div
          id="compactUserBox"
          class="compact-user-box"
        >

          <div class="compact-user-text">

            <div
              id="compactUserName"
              class="compact-user-name"
            >
              正在確認登入狀態……
            </div>

            <div
              id="compactUserEmail"
              class="compact-user-email"
            ></div>

          </div>

        </div>

        <div class="compact-auth-actions">

          <button
            id="compactLoginButton"
            class="compact-auth-button compact-login-button"
            type="button"
          >
            Google 登入
          </button>

          <button
            id="compactLogoutButton"
            class="compact-auth-button compact-logout-button"
            type="button"
            hidden
          >
            登出
          </button>

        </div>

      </div>

      <div class="dashboard-links">

        <a
          class="dashboard-link-card"
          href="leaderboard.html"
        >

          <div class="dashboard-link-icon rank">
            🏆
          </div>

          <div>

            <div class="dashboard-link-title">
              排行榜
            </div>

            <div class="dashboard-link-text">
              查看各遊戲高手排行，挑戰更高名次。
            </div>

          </div>

        </a>

        <a
          id="myScoresLink"
          class="dashboard-link-card"
          href="my-scores.html"
        >

          <div class="dashboard-link-icon scores">
            📊
          </div>

          <div>

            <div class="dashboard-link-title">
              我的成績
            </div>

            <div class="dashboard-link-text">
              查看最高分、平均分數、答題紀錄與遊玩次數。
            </div>

          </div>

        </a>

      </div>

    </section>


    <section
      class="news-area"
      aria-label="公告欄與最新消息"
    >

      <div
        id="announcementBoard"
        class="announcement-board"
      >

        <div class="announcement-top">

          <h2 class="announcement-heading">
            📢 公告欄
          </h2>

          <div
            id="announcementDate"
            class="announcement-date"
          >
            —
          </div>

        </div>

        <div
          id="announcementBadge"
          class="announcement-badge"
        >
          最新公告
        </div>

        <h3
          id="announcementTitle"
          class="announcement-title"
        >
          公告載入中……
        </h3>

        <p
          id="announcementContent"
          class="announcement-content"
        >
          請稍候。
        </p>

      </div>


      <div class="latest-news-box">

        <div class="latest-news-header">

          <h2 class="latest-news-title">
            📰 最新消息
          </h2>

          <div class="latest-news-subtitle">
            顯示最近 4 則更新
          </div>

        </div>

        <div
          id="latestNewsList"
          class="latest-news-list"
        ></div>

      </div>

    </section>


    <section class="section">

      <div class="section-header">

        <h2 class="section-title">
          🎯 選擇一個遊戲
        </h2>

        <p class="section-description">
          完成遊戲後，登入玩家的成績會自動儲存。
        </p>

      </div>


      <div class="semester-control">

        <label for="semesterSelect">
          請選擇學期
        </label>

        <select
          id="semesterSelect"
          class="semester-select"
        >

          <option value="grade7-first">
            七年級上學期
          </option>

          <option value="grade7-second">
            七年級下學期
          </option>

          <option value="grade8-first">
            八年級上學期
          </option>

        </select>

      </div>


      <div
        id="grade7-first"
        class="semester-panel active"
      >

        <h3 class="semester-title">
          七年級上學期
        </h3>

        <div
          id="grade7FirstGames"
          class="games-grid"
        ></div>

      </div>


      <div
        id="grade7-second"
        class="semester-panel"
      >

        <h3 class="semester-title">
          七年級下學期
        </h3>

        <div
          id="grade7SecondGames"
          class="games-grid"
        ></div>

      </div>


      <div
        id="grade8-first"
        class="semester-panel"
      >

        <h3 class="semester-title">
          八年級上學期
        </h3>

        <div
          id="grade8FirstGames"
          class="games-grid"
        ></div>

      </div>

    </section>


    <footer class="page-footer">
      生活有解．心中有數
    </footer>

  </main>


  <script type="module">

    import {
      login,
      logout
    } from "./js/auth.js";


    import {
      auth
    } from "./js/firebase-config.js";


    import {
      createOrUpdatePlayer
    } from "./js/firestore.js";


    import {
      getGamesBySemester
    } from "./js/game-config.js?v=6.4";


    import {
      getImportantAnnouncement,
      getLatestAnnouncements
    } from "./js/announcements.js?v=1";


    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const compactUserBox =
      document.getElementById(
        "compactUserBox"
      );


    const compactLoginButton =
      document.getElementById(
        "compactLoginButton"
      );


    const compactLogoutButton =
      document.getElementById(
        "compactLogoutButton"
      );


    const myScoresLink =
      document.getElementById(
        "myScoresLink"
      );


    const semesterSelect =
      document.getElementById(
        "semesterSelect"
      );


    const semesterPanels =
      document.querySelectorAll(
        ".semester-panel"
      );


    const grade7FirstGames =
      document.getElementById(
        "grade7FirstGames"
      );


    const grade7SecondGames =
      document.getElementById(
        "grade7SecondGames"
      );


    const grade8FirstGames =
      document.getElementById(
        "grade8FirstGames"
      );


    const announcementBoard =
      document.getElementById(
        "announcementBoard"
      );


    const announcementDate =
      document.getElementById(
        "announcementDate"
      );


    const announcementBadge =
      document.getElementById(
        "announcementBadge"
      );


    const announcementTitle =
      document.getElementById(
        "announcementTitle"
      );


    const announcementContent =
      document.getElementById(
        "announcementContent"
      );


    const latestNewsList =
      document.getElementById(
        "latestNewsList"
      );


    /*
    ==================================================
    公告欄
    ==================================================
    */

    function formatAnnouncementDate(
      dateText
    ) {

      const parts =
        String(
          dateText || ""
        )
          .split("-");


      if (
        parts.length !== 3
      ) {

        return dateText || "";
      }


      return (
        `${parts[0]} / ${parts[1]} / ${parts[2]}`
      );
    }


    function renderAnnouncements() {

      const important =
        getImportantAnnouncement();


      if (
        important
      ) {

        announcementDate.textContent =
          formatAnnouncementDate(
            important.date
          );


        announcementBadge.textContent =
          `${important.icon || "📌"} ${important.typeName || "最新公告"}`;


        announcementTitle.textContent =
          important.title ||
          "最新公告";


        announcementContent.textContent =
          important.content ||
          "";

      } else {

        announcementBoard.hidden =
          true;
      }


      const latest =
        getLatestAnnouncements(
          4
        );


      if (
        !latest.length
      ) {

        latestNewsList.innerHTML = `
          <div class="news-empty">
            目前沒有最新消息。
          </div>
        `;

        return;
      }


      latestNewsList.innerHTML =
        latest
          .map(
            item => `

              <article class="news-item">

                <div class="news-icon">
                  ${item.icon || "📌"}
                </div>

                <div class="news-main">

                  <div class="news-meta">

                    <span
                      class="news-type ${item.type || "notice"}"
                    >
                      ${item.typeName || "網站公告"}
                    </span>

                  </div>

                  <div class="news-item-title">
                    ${item.title || ""}
                  </div>

                  <div class="news-item-content">
                    ${item.content || ""}
                  </div>

                </div>

                <div class="news-date">
                  ${formatAnnouncementDate(
                    item.date
                  )}
                </div>

              </article>
            `
          )
          .join("");
    }


    renderAnnouncements();


    /*
    ==================================================
    依 game-config.js 自動建立遊戲卡片
    ==================================================
    */

    function createGameCard(
      game
    ) {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "game-card";


      const theme =
        game.theme || {};


      card.style.setProperty(
        "--game-primary",
        theme.primary ||
        "#1976D2"
      );


      card.style.setProperty(
        "--game-dark",
        theme.dark ||
        "#125CA6"
      );


      card.style.setProperty(
        "--game-light",
        theme.light ||
        "#E3F2FD"
      );


      card.style.setProperty(
        "--game-border",
        theme.border ||
        "#90CAF9"
      );


      if (
        !game.finished
      ) {

        const badge =
          document.createElement(
            "span"
          );


        badge.className =
          "status-badge status-soon";


        badge.textContent =
          "開發中";


        card.appendChild(
          badge
        );
      }


      const heading =
        document.createElement(
          "div"
        );


      heading.className =
        "game-heading";


      const icon =
        document.createElement(
          "div"
        );


      icon.className =
        "game-icon";


      icon.textContent =
        game.icon ||
        "🎮";


      const title =
        document.createElement(
          "h2"
        );


      title.textContent =
        game.name ||
        "數學遊戲";


      heading.appendChild(
        icon
      );


      heading.appendChild(
        title
      );


      const description =
        document.createElement(
          "p"
        );


      description.textContent =
        game.description ||
        "";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "game-meta";


      const difficulty =
        Math.min(
          3,
          Math.max(
            1,
            Number(
              game.difficulty
            ) || 1
          )
        );


      const difficultyBadge =
        document.createElement(
          "span"
        );


      difficultyBadge.className =
        "game-meta-badge difficulty";


      difficultyBadge.textContent =
        "⭐".repeat(
          difficulty
        );


      difficultyBadge.title =
        `難度 ${difficulty} 星`;


      meta.appendChild(
        difficultyBadge
      );


      if (
        game.recommended
      ) {

        const recommendedBadge =
          document.createElement(
            "span"
          );


        recommendedBadge.className =
          "game-meta-badge recommended";


        recommendedBadge.textContent =
          "🔥 推薦";


        meta.appendChild(
          recommendedBadge
        );
      }


      if (
        game.isNew
      ) {

        const newBadge =
          document.createElement(
            "span"
          );


        newBadge.className =
          "game-meta-badge new";


        newBadge.textContent =
          "🆕 NEW";


        meta.appendChild(
          newBadge
        );
      }


      card.appendChild(
        heading
      );


      card.appendChild(
        description
      );


      card.appendChild(
        meta
      );


      if (
        game.finished
      ) {

        const startLink =
          document.createElement(
            "a"
          );


        startLink.className =
          "button start-button";


        startLink.href =
          game.file;


        startLink.textContent =
          "開始挑戰";


        card.appendChild(
          startLink
        );

      } else {

        const waitingButton =
          document.createElement(
            "button"
          );


        waitingButton.className =
          "button waiting-button";


        waitingButton.type =
          "button";


        waitingButton.disabled =
          true;


        waitingButton.textContent =
          "敬請期待";


        card.appendChild(
          waitingButton
        );
      }


      return card;
    }


    function renderSemesterGames(
      semester,
      container
    ) {

      if (
        !container
      ) {
        return;
      }


      container.innerHTML =
        "";


      const games =
        getGamesBySemester(
          semester
        );


      games.forEach(
        (game) => {

          container.appendChild(
            createGameCard(
              game
            )
          );
        }
      );
    }


    function renderAllGameCards() {

      renderSemesterGames(
        "grade7-first",
        grade7FirstGames
      );


      renderSemesterGames(
        "grade7-second",
        grade7SecondGames
      );


      renderSemesterGames(
        "grade8-first",
        grade8FirstGames
      );
    }


    renderAllGameCards();


    semesterSelect.addEventListener(
      "change",

      () => {

        semesterPanels.forEach(
          (panel) => {

            panel.classList.toggle(
              "active",
              panel.id ===
                semesterSelect.value
            );
          }
        );
      }
    );


    compactLoginButton.addEventListener(
      "click",

      async () => {

        compactLoginButton.disabled =
          true;


        compactLoginButton.textContent =
          "登入中……";


        try {

          await login();

        } catch (error) {

          console.error(
            "登入失敗：",
            error
          );


          alert(
            "登入沒有完成，請稍後再試一次。"
          );

        } finally {

          compactLoginButton.disabled =
            false;


          compactLoginButton.textContent =
            "Google 登入";
        }
      }
    );


    compactLogoutButton.addEventListener(
      "click",

      async () => {

        compactLogoutButton.disabled =
          true;


        compactLogoutButton.textContent =
          "登出中……";


        try {

          await logout();

        } catch (error) {

          console.error(
            "登出失敗：",
            error
          );


          alert(
            "登出失敗，請稍後再試一次。"
          );

        } finally {

          compactLogoutButton.disabled =
            false;


          compactLogoutButton.textContent =
            "登出";
        }
      }
    );


    myScoresLink.addEventListener(
      "click",

      (event) => {

        if (
          !auth.currentUser
        ) {

          event.preventDefault();


          alert(
            "請先登入 Google 帳號，才能查看自己的成績。"
          );
        }
      }
    );


    function renderLoggedOut() {

      compactUserBox.innerHTML = `
        <div class="compact-user-text">

          <div class="compact-user-name">
            尚未登入
          </div>

          <div class="compact-user-email">
            登入後即可儲存成績與查看個人紀錄。
          </div>

        </div>
      `;


      compactLoginButton.hidden =
        false;


      compactLogoutButton.hidden =
        true;
    }


    function renderLoggedIn(
      user
    ) {

      compactUserBox.innerHTML =
        "";


      if (
        user.photoURL
      ) {

        const photo =
          document.createElement(
            "img"
          );


        photo.className =
          "user-photo";


        photo.src =
          user.photoURL;


        photo.alt =
          "玩家頭像";


        compactUserBox.appendChild(
          photo
        );
      }


      const textBox =
        document.createElement(
          "div"
        );


      textBox.className =
        "compact-user-text";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "compact-user-name";


      name.textContent =
        `👋 歡迎回來，${
          user.displayName ||
          user.email ||
          "玩家"
        }！`;


      const email =
        document.createElement(
          "div"
        );


      email.className =
        "compact-user-email";


      email.textContent =
        user.email ||
        "";


      textBox.appendChild(
        name
      );


      textBox.appendChild(
        email
      );


      compactUserBox.appendChild(
        textBox
      );


      compactLoginButton.hidden =
        true;


      compactLogoutButton.hidden =
        false;
    }


    onAuthStateChanged(
      auth,

      async (
        user
      ) => {

        if (
          !user
        ) {

          renderLoggedOut();

          return;
        }


        renderLoggedIn(
          user
        );


        try {

          await createOrUpdatePlayer(
            user
          );

        } catch (error) {

          console.error(
            "玩家資料建立或更新失敗：",
            error
          );
        }
      }
    );

  </script>

</body>
</html>
