<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪子老師數學遊戲室</title>

    <style>
        body{
            margin:0;
            font-family:"Microsoft JhengHei",sans-serif;
            background:#eef5ff;
        }

        header{
            background:#1565c0;
            color:white;
            text-align:center;
            padding:40px;
        }

        h1{
            margin:0;
            font-size:40px;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:auto;
            padding:40px 0;
        }

        .games{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:18px;
            padding:30px;
            text-align:center;
            box-shadow:0 8px 18px rgba(0,0,0,.12);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 24px;
            background:#1565c0;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

        .btn:hover{
            background:#0d47a1;
        }
    </style>

</head>

<body>

<header>

<h1>📚 浪子老師數學遊戲室</h1>

<p>數學有解，生活也有解，歡迎來挑戰。</p>

</header>

<div class="container">

<h2>選擇一個遊戲</h2>

<div class="games">

<div class="card">

<h3>🎮 正負數大挑戰</h3>

<p>七年級 正負數加減法</p>

<a class="btn" href="#">開始挑戰</a>

</div>

<div class="card">

<h3>🧮 一元一次方程式</h3>

<p>解方程式闖關</p>

<a class="btn" href="#">敬請期待</a>

</div>

<div class="card">

<h3>📐 比例式</h3>

<p>比例式配對挑戰</p>

<a class="btn" href="#">敬請期待</a>

</div>

</div>

</div>

</body>
</html>
